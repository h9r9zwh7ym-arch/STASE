<script>
'use strict';

/* =========================================================================
   Constantes
   ========================================================================= */
const APP_VERSION = '2.8.0';
const STORAGE_KEY = 'stase.v1';
const BACKUP_KEY = 'stase.backup';
const SCHEMA_VERSION = 1;
const DAY_MS = 86400000;

/** Déclencheurs : clé stockée → libellé affiché. */
const TRIGGERS = [
  ['ennui', 'Ennui'], ['stress', 'Stress'], ['cafe', 'Café'],
  ['repas', 'Après repas'], ['soiree', 'Soirée'], ['reveil', 'Réveil']
];
const TRIGGER_LABEL = Object.fromEntries(TRIGGERS);

/** Bornes des réglages numériques : évitent une faute de frappe (« 690 » au lieu de « 6,90 »). */
const FIELD_LIMITS = {
  snusBoxPrice: { max: 200, label: 'un prix de boîte' },
  snusPerBox: { max: 500, label: 'un nombre de portions' },
  snusMg: { max: 150, label: 'une force en mg' },
  vapeUnitPrice: { max: 500, label: 'un prix' },
  vapeMlPerUnit: { max: 1000, label: 'une contenance en ml' },
  vapeMgPerMl: { max: 100, label: 'un taux en mg/ml' },
  vapeSessionsPerUnit: { max: 5000, label: 'un nombre de sessions' },
  goalPrice: { max: 100000, label: 'un prix d’objectif' }
};
const INTAKE_TYPES = ['snus', 'vape'];
/** Ancienne vibration navigator.vibrate, désactivée : ignorée sur iPhone (les boutons utilisent un switch invisible). */
const USE_LEGACY_VIBRATE = false;
function legacyVibrate(ms) { if (USE_LEGACY_VIBRATE && navigator.vibrate) navigator.vibrate(ms); }

/* =========================================================================
   Utilitaires
   ========================================================================= */
const Util = {
  /** Échappe un texte avant de l'insérer dans du HTML. */
  esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },
  /** Lit un nombre saisi à la française (« 6,90 »). Renvoie null si invalide ou négatif. */
  parseNum(input) {
    const clean = String(input ?? '').replace(/\s/g, '').replace(',', '.');
    if (clean === '' || !/^\d*\.?\d+$|^\d+\.?$/.test(clean)) return null;
    const n = Number(clean);
    return Number.isFinite(n) && n >= 0 ? n : null;
  },
  /** Affiche un nombre décimal à la française, sans zéros inutiles. */
  formatNum(n, maxDigits = 2) {
    return new Intl.NumberFormat('fr-FR', { maximumFractionDigits: maxDigits }).format(n);
  },
  /** Montant en francs suisses (« 6.90 CHF »). */
  formatMoney(n, digits = 2) {
    return new Intl.NumberFormat('fr-CH', { style: 'currency', currency: 'CHF', minimumFractionDigits: digits, maximumFractionDigits: digits }).format(n);
  },
  uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  },
  clampInt(value, min, max) {
    const n = Math.round(Number(value));
    return Number.isFinite(n) && n >= min && n <= max ? n : null;
  }
};

/* =========================================================================
   Dates — tout est calculé dans le fuseau local de l'appareil.
   Les entrées sont stockées en timestamp (ms depuis 1970, universel) :
   le « jour » d'une prise est recalculé à l'affichage, donc un changement
   de fuseau ou un passage de minuit reste cohérent.
   ========================================================================= */
const Dates = {
  pad(n) { return String(n).padStart(2, '0'); },
  /** Clé de jour local « AAAA-MM-JJ » pour un timestamp. */
  dayKey(ts) {
    const d = new Date(ts);
    return `${d.getFullYear()}-${Dates.pad(d.getMonth() + 1)}-${Dates.pad(d.getDate())}`;
  },
  todayKey() { return Dates.dayKey(Date.now()); },
  /** Minuit local (timestamp) du jour donné par sa clé. */
  keyToStart(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d).getTime();
  },
  /** Ajoute n jours calendaires à une clé (robuste aux changements d'heure). */
  addDays(key, n) {
    const [y, m, d] = key.split('-').map(Number);
    return Dates.dayKey(new Date(y, m - 1, d + n).getTime());
  },
  /** Nombre de jours calendaires entre deux clés (b − a). */
  diffDays(a, b) {
    const toUtc = (k) => { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d); };
    return Math.round((toUtc(b) - toUtc(a)) / DAY_MS);
  },
  /** Liste des clés de jours de a à b inclus. */
  range(a, b) {
    const out = [];
    for (let k = a; Dates.diffDays(k, b) >= 0; k = Dates.addDays(k, 1)) out.push(k);
    return out;
  },
  formatTime(ts) {
    return new Date(ts).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  },
  formatDayLong(ts) {
    const s = new Date(ts).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    return s.charAt(0).toUpperCase() + s.slice(1);
  },
  formatDayShort(ts) {
    return new Date(ts).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
  },
  /** Découpe une durée en jours, heures, minutes, secondes. */
  splitDuration(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    return { d: Math.floor(s / 86400), h: Math.floor((s % 86400) / 3600), m: Math.floor((s % 3600) / 60), s: s % 60 };
  },
  /** Valeur pour <input type="datetime-local"> en heure locale. */
  toInputValue(ts) {
    const d = new Date(ts);
    return `${Dates.dayKey(ts)}T${Dates.pad(d.getHours())}:${Dates.pad(d.getMinutes())}`;
  },
  fromInputValue(value) {
    const ts = new Date(value).getTime();
    return Number.isFinite(ts) ? ts : null;
  }
};

/* =========================================================================
   Store — données en localStorage, versionnées, avec export/import JSON.
   iOS peut purger le stockage d'une web app peu utilisée : l'export
   régulier est la vraie sauvegarde.
   ========================================================================= */
const Store = {
  data: null,
  saveFailed: false,

  defaults() {
    return {
      version: SCHEMA_VERSION,
      settings: {
        phase: 'observation',        // 'observation' | 'arret'
        seenMilestoneH: null,        // dernier repère déjà célébré (h) ; null = inconnu (mise à jour)
        milestoneShownAt: null,      // quand il a été atteint (la carte reste quelques heures)
        quitStart: null,             // timestamp du début de l'arrêt
        baseline: null,              // { snusPerDay, vapePerDay, days } figé au passage en arrêt
        snusBoxPrice: 0,             // CHF par boîte
        snusPerBox: 20,              // portions par boîte
        snusMg: 8,                   // mg de nicotine par portion
        vapeFormat: 'capsule',       // 'capsule' | 'flacon'
        vapeUnitPrice: 0,            // CHF par capsule ou flacon
        vapeMlPerUnit: 0,            // contenance d'une capsule ou d'un flacon (ml)
        vapeMgPerMl: 0,              // taux de nicotine du liquide (mg/ml)
        vapeSessionsPerUnit: 0,      // sessions par capsule ou flacon (si les ml ne sont pas notés)
        reduction: { on: false, startDate: null, weeklyStep: 1, base: null }, // cible = base − pas × semaines
        theme: 'dark',               // 'dark' | 'light'
        askContext: true,            // ouvrir la feuille contexte après « + Snus / + Vape »
        profile: { done: false, uses: null, goals: [], concerns: [], firstUse: null, why: '' }, // questionnaire de départ
        goalName: '',                // objectif d'achat (« Vélo »), rempli par l'argent économisé
        goalPrice: 0,                // son prix en CHF ; 0 = pas d'objectif
        lastExportAt: null,
        backupSnoozeUntil: null      // « Plus tard » sur le rappel de sauvegarde
      },
      intakes: [],   // { id, type, ts, trigger, intensity }
      cravings: [],  // { id, ts, trigger, intensity, resolved, duration }
      checkins: [],  // conservé tel quel pour les anciennes sauvegardes (le check-in a été retiré)
      vapeMl: []     // { date, ml } : millilitres de liquide vapotés ce jour-là
    };
  },

  /** Charge les données ; en cas de JSON corrompu, le garde de côté et repart à vide. */
  load() {
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { raw = null; }
    if (!raw) { Store.data = Store.defaults(); return; }
    try {
      Store.data = Store.normalize(JSON.parse(raw));
    } catch (e) {
      try { localStorage.setItem(STORAGE_KEY + '.corrompu', raw); } catch (_) { /* rien */ }
      Store.data = Store.defaults();
    }
  },

  save() {
    if (App.testMode) return; // ?test ne touche jamais aux vraies données
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Store.data));
      Store.saveFailed = false;
    } catch (e) {
      Store.saveFailed = true;
      UI.toast('Enregistrement impossible : stockage plein ou bloqué.');
    }
  },

  /** Applique une modification, enregistre et redessine l'écran. */
  update(mutator) {
    mutator(Store.data);
    Store.save();
    App.render();
  },

  /** Remet n'importe quel objet au bon format (migration + nettoyage). */
  normalize(obj) {
    const base = Store.defaults();
    if (!obj || typeof obj !== 'object') return base;
    // On ne recopie que les clés connues : un fichier importé ne peut rien injecter d'autre.
    const src = obj.settings && typeof obj.settings === 'object' ? obj.settings : {};
    const s = {};
    Object.keys(base.settings).forEach((k) => { s[k] = Object.prototype.hasOwnProperty.call(src, k) ? src[k] : base.settings[k]; });
    const redSrc = src.reduction && typeof src.reduction === 'object' ? src.reduction : {};
    s.reduction = {};
    Object.keys(base.settings.reduction).forEach((k) => { s.reduction[k] = Object.prototype.hasOwnProperty.call(redSrc, k) ? redSrc[k] : base.settings.reduction[k]; });
    if (!['observation', 'arret'].includes(s.phase)) s.phase = 'observation';
    if (!['dark', 'light'].includes(s.theme)) s.theme = 'dark';
    const now = Date.now();
    s.lastExportAt = Store.tsOrNull(s.lastExportAt, now + DAY_MS);              // pas d'export « dans le futur »
    s.backupSnoozeUntil = Store.tsOrNull(s.backupSnoozeUntil, now + 8 * DAY_MS); // « Plus tard » = 7 jours au plus
    s.milestoneShownAt = Store.tsOrNull(s.milestoneShownAt, now + DAY_MS);
    if (!['capsule', 'flacon'].includes(s.vapeFormat)) s.vapeFormat = 'capsule';
    s.askContext = s.askContext !== false;
    s.goalName = typeof s.goalName === 'string' ? s.goalName.trim().slice(0, 40) : '';
    s.seenMilestoneH = s.seenMilestoneH !== null && Number.isFinite(Number(s.seenMilestoneH)) && s.seenMilestoneH >= 0 ? Number(s.seenMilestoneH) : null;

    s.quitStart = Store.tsOrNull(s.quitStart, Date.now() + DAY_MS);
    if (s.phase === 'arret' && s.quitStart === null) s.phase = 'observation';
    s.baseline = Store.cleanBaseline(s.baseline);
    s.profile = Store.cleanProfile(src.profile);
    const red = s.reduction;
    red.on = red.on === true;
    red.weeklyStep = [0.5, 1, 2].includes(Number(red.weeklyStep)) ? Number(red.weeklyStep) : 1;
    red.base = red.base !== null && Number.isFinite(Number(red.base)) ? Number(red.base) : null;
    red.startDate = /^\d{4}-\d{2}-\d{2}$/.test(red.startDate) ? red.startDate : null;
    if (red.on && (red.base === null || !red.startDate)) red.on = false;
    // Les bornes de FIELD_LIMITS s'appliquent à la saisie ; ici, on n'écarte que l'invalide.
    Object.keys(FIELD_LIMITS).forEach((k) => {
      const n = Number(s[k]);
      s[k] = Number.isFinite(n) && n >= 0 ? n : base.settings[k];
    });
    return {
      version: SCHEMA_VERSION,
      settings: s,
      intakes: Store.cleanList(obj.intakes, Store.cleanIntake),
      cravings: Store.cleanList(obj.cravings, Store.cleanCraving),
      checkins: Store.cleanCheckins(obj.checkins),
      vapeMl: Store.cleanVapeMl(obj.vapeMl)
    };
  },

  /** Horodatage valide (nombre positif, pas au-delà de `max`), sinon null. */
  tsOrNull(v, max = Infinity) {
    if (v === null || v === undefined || v === '' || typeof v === 'boolean') return null;
    const n = Number(v);
    return Number.isFinite(n) && n > 0 && n <= max ? n : null;
  },

  cleanProfile(p) {
    const out = { done: false, uses: null, goals: [], concerns: [], firstUse: null, why: '' };
    if (!p || typeof p !== 'object') return out;
    out.done = p.done === true;
    out.uses = ['snus', 'vape', 'both'].includes(p.uses) ? p.uses : null;
    out.goals = Array.isArray(p.goals) ? [...new Set(p.goals.filter((g) => GOAL_KEYS.includes(g)))] : [];
    out.concerns = Array.isArray(p.concerns) ? [...new Set(p.concerns.filter((c) => CONCERN_BY_KEY[c]))] : [];
    out.firstUse = FIRST_USE.some(([k]) => k === p.firstUse) ? p.firstUse : null;
    out.why = typeof p.why === 'string' ? p.why.trim().slice(0, 140) : '';
    return out;
  },

  cleanBaseline(b) {
    if (!b || typeof b !== 'object') return null;
    const n = (v) => (v !== null && Number.isFinite(Number(v)) && Number(v) >= 0 ? Number(v) : null);
    const snus = n(b.snusPerDay), vape = n(b.vapePerDay);
    if (snus === null || vape === null) return null;
    return { snusPerDay: snus, vapePerDay: vape, vapeMlPerDay: n(b.vapeMlPerDay), days: Math.round(n(b.days) || 0) };
  },

  /** Nettoie une liste d'entrées horodatées ; un id en double (import) garde la dernière. */
  cleanList(list, cleaner) {
    if (!Array.isArray(list)) return [];
    const byId = new Map();
    list.map(cleaner).filter(Boolean).forEach((x) => byId.set(x.id, x));
    return [...byId.values()].sort((a, b) => a.ts - b.ts);
  },

  /** Millilitres de vape : un relevé par jour, entre 0 et 100 ml. */
  cleanVapeMl(list) {
    if (!Array.isArray(list)) return [];
    const byDate = {};
    list.forEach((x) => {
      const ml = Number(x && x.ml);
      if (!x || !/^\d{4}-\d{2}-\d{2}$/.test(x.date) || !Number.isFinite(ml) || ml < 0 || ml > Vape.MAX_ML) return;
      byDate[x.date] = { date: x.date, ml: Math.round(ml * 10) / 10 };
    });
    return Object.values(byDate).sort((a, b) => a.date.localeCompare(b.date));
  },

  cleanIntake(x) {
    if (!x || !INTAKE_TYPES.includes(x.type) || !Number.isFinite(Number(x.ts))) return null;
    return {
      id: String(x.id || Util.uid()).slice(0, 64),
      type: x.type,
      ts: Number(x.ts),
      trigger: TRIGGER_LABEL[x.trigger] ? x.trigger : null,
      intensity: Util.clampInt(x.intensity, 1, 5)
    };
  },

  cleanCraving(x) {
    if (!x || !Number.isFinite(Number(x.ts))) return null;
    return {
      id: String(x.id || Util.uid()).slice(0, 64),
      ts: Number(x.ts),
      trigger: TRIGGER_LABEL[x.trigger] ? x.trigger : null,
      intensity: Util.clampInt(x.intensity, 1, 5),
      resolved: x.resolved !== false,
      duration: Number.isFinite(Number(x.duration)) && x.duration > 0 ? Math.round(Number(x.duration)) : null
    };
  },

  /** Un check-in par jour : le plus récent l'emporte. */
  cleanCheckins(list) {
    if (!Array.isArray(list)) return [];
    const byDate = {};
    list.forEach((x) => {
      if (!x || !/^\d{4}-\d{2}-\d{2}$/.test(x.date)) return;
      const hr = Util.clampInt(x.hr, 25, 220);
      byDate[x.date] = {
        date: x.date,
        sleep: Util.clampInt(x.sleep, 1, 5),
        energy: Util.clampInt(x.energy, 1, 5),
        mood: Util.clampInt(x.mood, 1, 5),
        anxiety: Util.clampInt(x.anxiety, 1, 5),
        hr: hr
      };
    });
    return Object.values(byDate).sort((a, b) => a.date.localeCompare(b.date));
  },

  /** Texte JSON de sauvegarde. */
  exportJson() {
    return JSON.stringify({ app: 'STASE', appVersion: APP_VERSION, exportedAt: new Date().toISOString(), ...Store.data }, null, 2);
  },

  /** Valide un fichier importé. Renvoie { ok, data } ou { ok:false, error }. */
  parseImport(text) {
    let obj;
    try { obj = JSON.parse(text); } catch (e) { return { ok: false, error: 'Ce fichier n’est pas un JSON lisible.' }; }
    if (!obj || typeof obj !== 'object' || (!Array.isArray(obj.intakes) && !obj.settings)) {
      return { ok: false, error: 'Ce fichier ne ressemble pas à une sauvegarde STASE.' };
    }
    return { ok: true, data: Store.normalize(obj) };
  },

  /** Remplace les données ; l'état précédent est gardé pour annulation. */
  replaceAll(data) {
    try { localStorage.setItem(BACKUP_KEY, JSON.stringify(Store.data)); } catch (e) { /* rien */ }
    Store.data = data;
    Store.save();
  },

  restoreBackup() {
    try {
      const raw = localStorage.getItem(BACKUP_KEY);
      if (!raw) return false;
      Store.data = Store.normalize(JSON.parse(raw));
      Store.save();
      return true;
    } catch (e) { return false; }
  }
};

/* =========================================================================
   Calc — fonctions pures (sans DOM), testées dans ?test
   ========================================================================= */
const Calc = {
  /** Entrées dont le jour local correspond à la clé. */
  onDay(list, key) {
    return list.filter((x) => Dates.dayKey(x.ts) === key);
  },

  /** Compte snus / vape / total d'une liste de prises. */
  countByType(list) {
    const snus = list.filter((x) => x.type === 'snus').length;
    return { snus, vape: list.length - snus, total: list.length };
  },

  /** Comptes par jour, de fromKey à toKey inclus (jours sans prise = 0). */
  dailyCounts(intakes, fromKey, toKey) {
    const byDay = {};
    intakes.forEach((x) => {
      const k = Dates.dayKey(x.ts);
      byDay[k] = byDay[k] || [];
      byDay[k].push(x);
    });
    return Dates.range(fromKey, toKey).map((key) => ({ key, ...Calc.countByType(byDay[key] || []) }));
  },

  /**
   * Moyenne quotidienne sur les n jours complets précédant `todayKey`
   * (aujourd'hui exclu, car incomplet). Si l'historique est plus court,
   * on part du jour de la première prise. Renvoie null sans jour complet.
   */
  avgPerDay(intakes, todayKey, n = 7) {
    if (!intakes.length) return null;
    const first = Dates.dayKey(intakes[0].ts);
    let from = Dates.addDays(todayKey, -n);
    if (Dates.diffDays(from, first) > 0) from = first;
    const to = Dates.addDays(todayKey, -1);
    if (Dates.diffDays(from, to) < 0) return null;
    const days = Calc.dailyCounts(intakes, from, to);
    const sum = (k) => days.reduce((acc, d) => acc + d[k], 0) / days.length;
    return { total: sum('total'), snus: sum('snus'), vape: sum('vape'), days: days.length };
  }
};

/** Moyenne des valeurs numériques (null si aucune). */
Calc.mean = function (values) {
  const v = values.filter((x) => Number.isFinite(x));
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
};

/* ---- Calc : objectif d'achat ---- */
/**
 * Progression de l'objectif d'achat avec l'argent économisé.
 * null si aucun objectif (nom vide ou prix nul) ; money null = économies inconnues.
 */
Calc.goal = function (settings, money) {
  const name = settings.goalName, price = Number(settings.goalPrice);
  if (!name || !(price > 0)) return null;
  const saved = Math.max(0, money || 0);
  const ratio = Math.min(1, saved / price);
  return { name, price, saved, ratio, pct: Math.floor(ratio * 100), done: saved >= price, left: Math.max(0, price - saved) };
};

/* ---- Calc : raisons d'arrêter (écran « J'ai une envie ») ---- */
/**
 * Ce qui motive, pour tenir pendant une envie : ta phrase à toi, tes progrès,
 * tes motivations et les bénéfices liés à tes points de santé. Toujours au moins un.
 */
Calc.reasons = function (data, now = Date.now()) {
  const s = data.settings, p = s.profile, out = [];
  if (p.why) out.push({ title: 'Ta raison', text: p.why });
  const cur = s.phase === 'arret' && s.quitStart ? Calc.streaks(data.intakes, s.quitStart, now).current : 0;
  if (s.phase === 'arret' && s.quitStart) {
    const d = Dates.splitDuration(cur);
    out.push({ title: 'Déjà', text: `${d.d ? `${d.d} j ${d.h} h` : `${d.h} h ${d.m} min`} sans nicotine. Ne laisse pas une envie de quelques minutes effacer ça.` });
    const av = Calc.avoided(data.intakes, s, now, data.vapeMl);
    const g = Calc.goal(s, av.money);
    if (av.money) out.push({ title: 'Ton argent', text: `${Util.formatMoney(av.money)} déjà économisés depuis l’arrêt.${g ? (g.done ? ` De quoi t’offrir : ${g.name}.` : ` Déjà ${g.pct} % de ton objectif : ${g.name}.`) : ''}` });
    const tr = data.cravings.filter((c) => c.resolved && c.ts >= s.quitStart).length;
    if (tr) out.push({ title: 'Tu sais faire', text: `${tr} envie${tr > 1 ? 's' : ''} déjà traversée${tr > 1 ? 's' : ''}. Celle-ci passera aussi.` });
  } else {
    const tr = data.cravings.filter((c) => c.resolved).length;
    if (tr) out.push({ title: 'Tu sais faire', text: `${tr} envie${tr > 1 ? 's' : ''} déjà traversée${tr > 1 ? 's' : ''} sans prise.` });
  }
  const goalText = {
    argent: () => { const y = Calc.yearlyCost(s, data.intakes, data.vapeMl); return y ? `Environ ${Util.formatMoney(y, 0)} par an qui resteront dans ta poche.` : 'Chaque prise évitée, c’est de l’argent qui reste dans ta poche.'; },
    liberte: () => 'Ne plus devoir en avoir sur toi, ni prévoir la prochaine.',
    sante: () => 'Ton cœur et tes vaisseaux ne sont plus sollicités plusieurs fois par jour.',
    sport: () => 'Un cœur plus calme au repos et une énergie plus stable.',
    proches: () => 'Pour celles et ceux qui comptent pour toi.'
  };
  const goalTitle = { argent: 'Ton argent', liberte: 'Liberté', sante: 'Santé', sport: 'Sport et énergie', proches: 'Tes proches' };
  p.goals.forEach((g) => { if (!(g === 'argent' && out.some((r) => r.title === 'Ton argent'))) out.push({ title: goalTitle[g], text: goalText[g]() }); });
  p.concerns.forEach((k) => { const c = CONCERN_BY_KEY[k]; if (c) out.push({ title: c.title, text: c.text.split(/(?<=\.)\s/).slice(-1)[0] }); });
  // Le message du jour s'ajoute à la série (selon l'étape de l'arrêt, ou l'observation).
  const stage = s.phase === 'arret' && s.quitStart ? Calc.stage(cur) : 'observe';
  out.push({ title: 'À garder en tête', text: Messages.forDay(Dates.dayKey(now), stage, p.concerns) });
  return out;
};

/* ---- Calc : rappel de sauvegarde ---- */
/**
 * Rappel d'export : données présentes, et soit jamais exportées alors que la
 * première prise a plus de 7 jours, soit dernier export il y a plus de 14 jours.
 */
Calc.backupDue = function (data, now = Date.now()) {
  const s = data.settings;
  if (!data.intakes.length) return false;
  if (s.backupSnoozeUntil && now < s.backupSnoozeUntil) return false;
  if (!s.lastExportAt) return now - data.intakes[0].ts > 7 * DAY_MS;
  return now - s.lastExportAt > 14 * DAY_MS;
};

/* ---- Calc : constats automatiques ---- */
const WEEKDAYS = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];
const TRIGGER_PHRASE = { ennui: 'l’ennui', stress: 'le stress', cafe: 'le café', repas: 'l’après-repas', soiree: 'la soirée', reveil: 'le réveil' };

Object.assign(Calc, {
  /** Créneau de `width` heures le plus chargé (sans passer minuit). */
  peakWindow(list, width = 3) {
    if (!list.length) return null;
    const hist = Calc.hourHistogram(list);
    let best = null;
    for (let h = 0; h + width <= 24; h++) {
      const n = hist.slice(h, h + width).reduce((a, b) => a + b, 0);
      if (!best || n > best.n) best = { from: h, to: h + width, n };
    }
    return { ...best, share: best.n / list.length };
  },

  /** Déclencheur noté le plus fréquent, et sa part sur l'ensemble. */
  topTrigger(list) {
    const rows = Calc.triggerShare(list).filter((r) => r.key !== 'none');
    return rows.length ? { key: rows[0].key, share: rows[0].count / list.length } : null;
  },

  /** Jour de la semaine le plus chargé (moyenne par occurrence de ce jour). */
  busiestWeekday(intakes, fromKey, toKey) {
    const days = Calc.dailyCounts(intakes, fromKey, toKey);
    const sums = new Array(7).fill(0), seen = new Array(7).fill(0);
    days.forEach((d) => { const w = (new Date(Dates.keyToStart(d.key)).getDay() + 6) % 7; sums[w] += d.total; seen[w] += 1; });
    const overall = days.reduce((a, d) => a + d.total, 0) / days.length;
    let best = null;
    sums.forEach((s, w) => { if (seen[w] >= 2) { const avg = s / seen[w]; if (!best || avg > best.avg) best = { dow: w, avg }; } });
    return best && overall > 0 ? { ...best, overall, ratio: best.avg / overall } : null;
  },

  /**
   * Constats en phrases simples, seulement quand les données suffisent.
   * Observation : heures, déclencheur, jour de la semaine, tendance.
   * Arrêt : heures et déclencheur des envies, baisse des envies, envies traversées.
   * Au plus 3, jamais culpabilisants.
   */
  insights(data, todayKey = Dates.todayKey()) {
    const s = data.settings, out = [];
    const pct = (x) => Math.round(x * 100);
    if (s.phase === 'arret') {
      const cr = data.cravings.filter((c) => c.ts >= s.quitStart);
      if (cr.length < 5) return out;
      const peak = Calc.peakWindow(cr);
      if (peak.share >= 0.3) out.push(`Tes envies arrivent surtout entre ${peak.from} h et ${peak.to} h : c’est le moment à préparer.`);
      const top = Calc.topTrigger(cr);
      if (top && top.share >= 0.2) out.push(`Déclencheur le plus fréquent de tes envies : ${TRIGGER_PHRASE[top.key]}.`);
      const startKey = Dates.dayKey(s.quitStart);
      const span = Dates.diffDays(startKey, todayKey);
      if (span >= 6) {
        const per = (from, to) => cr.filter((c) => { const k = Dates.dayKey(c.ts); return k >= from && k <= to; }).length / 3;
        const first = per(startKey, Dates.addDays(startKey, 2));
        const last = per(Dates.addDays(todayKey, -3), Dates.addDays(todayKey, -1));
        if (first > 0 && last < first * 0.8) out.push(`Tes envies ont baissé de ${pct(1 - last / first)} % depuis les premiers jours.`);
      }
      const traversed = cr.filter((c) => c.resolved).length;
      if (out.length < 3 && traversed) out.push(`${traversed} envie${traversed > 1 ? 's' : ''} sur ${cr.length} traversée${traversed > 1 ? 's' : ''} sans prise.`);
      return out.slice(0, 3);
    }
    if (!data.intakes.length) return out;
    const first = Dates.dayKey(data.intakes[0].ts);
    let from = Dates.addDays(todayKey, -28);
    if (from < first) from = first;
    const to = Dates.addDays(todayKey, -1);
    const span = Dates.diffDays(from, to) + 1;
    const list = Calc.between(data.intakes, from, to);
    if (span < 5 || list.length < 15) return out;
    const peak = Calc.peakWindow(list);
    if (peak.share >= 0.25) out.push(`${pct(peak.share)} % de tes prises tombent entre ${peak.from} h et ${peak.to} h.`);
    const top = Calc.topTrigger(list);
    if (top && top.share >= 0.15) out.push(`Déclencheur le plus fréquent : ${TRIGGER_PHRASE[top.key]}, environ 1 prise sur ${Math.max(2, Math.round(1 / top.share))}.`);
    if (span >= 14) {
      const wd = Calc.busiestWeekday(data.intakes, from, to);
      if (wd && wd.ratio >= 1.2) out.push(`Le ${WEEKDAYS[wd.dow]} est ton jour le plus chargé : ${Util.formatNum(wd.avg, 1)} prises en moyenne, contre ${Util.formatNum(wd.overall, 1)}.`);
      const avg = (a, b) => Calc.between(data.intakes, a, b).length / 7;
      const last = avg(Dates.addDays(todayKey, -7), to), prev = avg(Dates.addDays(todayKey, -14), Dates.addDays(todayKey, -8));
      if (prev > 0 && Math.abs(last - prev) / prev >= 0.1) {
        out.push(last < prev
          ? `En baisse : ${pct(1 - last / prev)} % de prises en moins que la semaine d’avant.`
          : `${pct(last / prev - 1)} % de prises en plus que la semaine d’avant. Un simple repère, rien de plus.`);
      }
    }
    return out.slice(0, 3);
  },

  /** Cases du calendrier d'un mois (« AAAA-MM »), lundi en premier. */
  monthCells(data, month, todayKey = Dates.todayKey()) {
    const [y, m] = month.split('-').map(Number);
    const firstKey = `${month}-01`;
    const nDays = new Date(y, m, 0).getDate();
    const lead = (new Date(y, m - 1, 1).getDay() + 6) % 7;
    const counts = {};
    data.intakes.forEach((x) => { const k = Dates.dayKey(x.ts); if (k.startsWith(month)) counts[k] = (counts[k] || 0) + 1; });
    const s = data.settings;
    const quitKey = s.phase === 'arret' ? Dates.dayKey(s.quitStart) : null;
    const vals = Object.values(counts);
    const max = Math.max(1, ...vals), min = vals.length ? Math.min(...vals) : 0;
    // 4 niveaux répartis entre le jour le plus léger et le plus chargé du mois.
    const level = (n) => (n === 0 ? 0 : max === min ? 2 : 1 + Math.round(((n - min) / (max - min)) * 3));
    const cells = [];
    for (let i = 0; i < lead; i++) cells.push(null);
    for (let d = 1; d <= nDays; d++) {
      const key = Dates.addDays(firstKey, d - 1);
      const n = counts[key] || 0;
      let state;
      if (key > todayKey) state = 'future';
      else if (quitKey && key >= quitKey) state = n ? 'used' : (key === todayKey ? 'today' : 'clean');
      else if (!data.intakes.length || key < Dates.dayKey(data.intakes[0].ts)) state = 'none';
      else state = 'level' + level(n);
      cells.push({ key, day: d, n, state, today: key === todayKey });
    }
    return cells;
  }
});

/* ---- Calc : statistiques ---- */
Object.assign(Calc, {
  /** Nombre de prises par heure locale (0 à 23). */
  hourHistogram(list) {
    const hours = new Array(24).fill(0);
    list.forEach((x) => { hours[new Date(x.ts).getHours()] += 1; });
    return hours;
  },

  /** Les n heures les plus chargées, dans l'ordre de la journée. */
  topHours(hist, n = 2) {
    return hist.map((v, h) => ({ v, h })).filter((x) => x.v > 0)
      .sort((a, b) => b.v - a.v || a.h - b.h).slice(0, n).map((x) => x.h).sort((a, b) => a - b);
  },

  /** Part de chaque déclencheur (« Sans contexte » à la fin). */
  triggerShare(list) {
    if (!list.length) return [];
    const counts = {};
    list.forEach((x) => { const k = x.trigger || 'none'; counts[k] = (counts[k] || 0) + 1; });
    const rows = TRIGGERS.filter(([k]) => counts[k]).map(([k, label]) => ({ key: k, label, count: counts[k] }))
      .sort((a, b) => b.count - a.count);
    if (counts.none) rows.push({ key: 'none', label: 'Sans contexte', count: counts.none });
    return rows.map((r) => ({ ...r, pct: (r.count / list.length) * 100 }));
  },

  /**
   * Coût d'une prise : une portion de snus, une session de vape.
   * null quand le prix ou le contenu n'est pas renseigné (évite « 0 CHF » trompeur).
   */
  unitCosts(s) {
    const per = (price, qty) => (price > 0 && qty > 0 ? price / qty : null);
    return {
      snus: per(s.snusBoxPrice, s.snusPerBox),          // une portion
      vape: per(s.vapeUnitPrice, s.vapeSessionsPerUnit), // une session
      vapeMl: per(s.vapeUnitPrice, s.vapeMlPerUnit)      // un ml de liquide
    };
  },

  /** Millilitres notés, par jour. */
  mlByDay(vapeMl) { return Object.fromEntries(vapeMl.map((x) => [x.date, x.ml])); },

  /**
   * Dépense sur une période. Pour la vape, les ml notés ce jour-là priment
   * (ml × prix du ml) ; sinon on compte les sessions. `missing` liste ce qui
   * n'a pas de prix exploitable.
   */
  spendRange(intakes, vapeMl, settings, fromKey, toKey) {
    const cost = Calc.unitCosts(settings);
    const ml = Calc.mlByDay(vapeMl);
    const missing = new Set();
    let snus = 0, vape = 0;
    Calc.dailyCounts(intakes, fromKey, toKey).forEach((d) => {
      if (d.snus) { if (cost.snus === null) missing.add('snus'); else snus += d.snus * cost.snus; }
      if (ml[d.key] !== undefined && cost.vapeMl !== null) vape += ml[d.key] * cost.vapeMl;
      else if (d.vape) { if (cost.vape === null) missing.add('vape'); else vape += d.vape * cost.vape; }
    });
    return { snus, vape, total: snus + vape, missing: [...missing] };
  },

  /** Moyenne des ml notés entre deux jours (null sans relevé). */
  mlAverage(vapeMl, fromKey, toKey) {
    const v = vapeMl.filter((x) => x.date >= fromKey && x.date <= toKey).map((x) => x.ml);
    return v.length ? { ml: Calc.mean(v), days: v.length } : null;
  },

  /** Dépense pour une liste de prises ; `missing` liste les types sans prix. */
  spend(list, settings) {
    const cost = Calc.unitCosts(settings);
    const c = Calc.countByType(list);
    const missing = ['snus', 'vape'].filter((t) => c[t] > 0 && cost[t] === null);
    const part = (t) => (cost[t] === null ? 0 : c[t] * cost[t]);
    return { snus: part('snus'), vape: part('vape'), total: part('snus') + part('vape'), missing };
  },

  /** Lundi de la semaine de la clé donnée. */
  weekStart(key) {
    const dow = (new Date(Dates.keyToStart(key)).getDay() + 6) % 7; // lundi = 0
    return Dates.addDays(key, -dow);
  },
  monthStart(key) { return key.slice(0, 8) + '01'; },

  /** Prises dont le jour local est entre deux clés incluses. */
  between(list, fromKey, toKey) {
    return list.filter((x) => { const k = Dates.dayKey(x.ts); return k >= fromKey && k <= toKey; });
  },

  /** Nicotine contenue dans les portions de snus (pas la quantité absorbée). */
  snusMg(snusCount, settings) { return snusCount * (settings.snusMg || 0); }
});

/* =========================================================================
   Charts — graphes SVG maison (viewBox fixe, largeur fluide)
   ========================================================================= */
const Charts = {
  W: 342,

  /**
   * Barres verticales. items : [{ v, label, hi }]
   * options : height, avg (ligne pointillée), gap, tone ('data' | 'warm')
   */
  bars(items, opts = {}) {
    const W = Charts.W, H = opts.height || 150, labelH = 20, chartH = H - labelH;
    const n = items.length;
    const gap = opts.gap ?? (n > 14 ? 3 : 12);
    const bw = (W - gap * (n - 1)) / n;
    const top = Math.max(1, opts.avg || 0, ...items.map((i) => i.v)) * 1.12;
    const y = (v) => chartH - (v / top) * chartH;
    const tone = opts.tone || 'data';
    const rects = items.map((it, i) => {
      const x = i * (bw + gap);
      const h = it.v > 0 ? Math.max(3, chartH - y(it.v)) : 2;
      const cls = it.v > 0 ? `c-${tone}${it.hi ? '-hi' : ''}` : 'c-empty';
      const r = Math.min(6, bw / 2);
      return `<rect class="${cls}" x="${x.toFixed(1)}" y="${(chartH - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${r.toFixed(1)}"/>
        ${it.label ? `<text class="c-label${it.hi ? ' c-label-hi' : ''}" x="${(x + bw / 2).toFixed(1)}" y="${H - 4}" text-anchor="middle">${Util.esc(it.label)}</text>` : ''}`;
    }).join('');
    const avg = opts.avg ? `<line class="c-avg" x1="0" x2="${W}" y1="${y(opts.avg).toFixed(1)}" y2="${y(opts.avg).toFixed(1)}"/>` : '';
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${Util.esc(opts.aria || '')}">${rects}${avg}</svg>`;
  },

  /** Barres horizontales (déclencheurs). rows : [{ label, pct, muted }] */
  hbars(rows) {
    const W = Charts.W, rowH = 34, labelW = 104, pctW = 44, trackW = W - labelW - pctW - 8;
    const max = Math.max(...rows.map((r) => r.pct), 1);
    const body = rows.map((r, i) => {
      const yy = i * rowH;
      const w = Math.max(4, (r.pct / max) * trackW);
      return `<text class="c-row-label" x="0" y="${yy + 21}">${Util.esc(r.label)}</text>
        <rect class="c-track" x="${labelW}" y="${yy + 12}" width="${trackW}" height="8" rx="4"/>
        <rect class="${r.muted ? 'c-data-muted' : 'c-data'}" x="${labelW}" y="${yy + 12}" width="${w.toFixed(1)}" height="8" rx="4"/>
        <text class="c-row-pct" x="${W}" y="${yy + 21}" text-anchor="end">${Math.round(r.pct)} %</text>`;
    }).join('');
    const aria = rows.map((r) => `${r.label} ${Math.round(r.pct)} %`).join(', ');
    return `<svg class="chart chart--h" viewBox="0 0 ${W} ${rows.length * rowH}" role="img" aria-label="${Util.esc(aria)}">${body}</svg>`;
  }
};

/* ---- Charts : jours et courbe ---- */
Object.assign(Charts, {
  /** Grille de jours (7 par ligne). items : [{ label, state: 'clean'|'used'|'today'|'ok'|'ko' }] */
  days(items, aria) {
    const W = Charts.W, cols = 7, gap = 8, cell = (W - gap * (cols - 1)) / cols;
    const rows = Math.ceil(items.length / cols);
    const body = items.map((it, i) => {
      const x = (i % cols) * (cell + gap), y = Math.floor(i / cols) * (cell + gap);
      return `<rect class="c-day c-day--${it.state}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${cell.toFixed(1)}" height="${cell.toFixed(1)}" rx="10"/>
        <text class="c-day-label c-day-label--${it.state}" x="${(x + cell / 2).toFixed(1)}" y="${(y + cell / 2 + 4).toFixed(1)}" text-anchor="middle">${Util.esc(it.label)}</text>`;
    }).join('');
    return `<svg class="chart" viewBox="0 0 ${W} ${rows * cell + (rows - 1) * gap}" role="img" aria-label="${Util.esc(aria)}">${body}</svg>`;
  },

  /** Garde au plus n points (le dernier toujours inclus) : la courbe n'a pas plus de pixels. */
  sample(values, n) {
    if (values.length <= n) return values;
    const step = (values.length - 1) / (n - 1);
    return Array.from({ length: n }, (_, i) => values[Math.round(i * step)]);
  },

  /** Courbe cumulée avec aire, point final mis en avant. */
  line(values, aria) {
    const W = Charts.W, H = 120, pad = 8;
    const max = Math.max(...values, 0.01);
    const n = values.length;
    const x = (i) => (n === 1 ? W / 2 : pad + (i * (W - 2 * pad)) / (n - 1));
    const y = (v) => H - pad - (v / max) * (H - 2 * pad);
    const pts = values.map((v, i) => `${x(i).toFixed(1)} ${y(v).toFixed(1)}`);
    const area = `M${x(0).toFixed(1)} ${H} L${pts.join(' L')} L${x(n - 1).toFixed(1)} ${H} Z`;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${Util.esc(aria)}">
      <path class="c-area" d="${area}"/><path class="c-line" pathLength="1" d="M${pts.join(' L')}"/>
      <circle class="c-dot" cx="${x(n - 1).toFixed(1)}" cy="${y(values[n - 1]).toFixed(1)}" r="5"/></svg>`;
  }
});

/* =========================================================================
   Craving — minuteur de 10 minutes de « J'ai une envie »
   Le temps est recalculé depuis l'heure de début : il reste juste même si
   l'iPhone met l'app en veille.
   ========================================================================= */
const Craving = {
  DURATION: 10 * 60000,
  CIRC: 867.08, // 2π × 138 (rayon du cercle)
  current: null,

  KEY: 'stase.envie',

  state() {
    if (!Craving.current) {
      Craving.current = { start: Date.now(), pausedAt: null, pausedMs: 0, step: 'timer', trigger: null, intensity: null, duration: 0 };
      Craving.persist();
    }
    return Craving.current;
  },

  /**
   * iOS recharge souvent une web app restée en arrière-plan : l'envie en cours
   * est gardée pour reprendre le minuteur là où il en était.
   */
  persist() {
    if (App.testMode) return;
    try {
      if (Craving.current) localStorage.setItem(Craving.KEY, JSON.stringify(Craving.current));
      else localStorage.removeItem(Craving.KEY);
    } catch (e) { /* stockage indisponible : le minuteur reste en mémoire */ }
  },

  /** Envie en cours retrouvée au lancement (moins de 2 h). */
  restore(now = Date.now()) {
    try {
      const c = JSON.parse(localStorage.getItem(Craving.KEY) || 'null');
      if (c && Number.isFinite(c.start) && now - c.start < 2 * 3600000 && ['timer', 'log'].includes(c.step)) {
        Craving.current = { start: c.start, pausedAt: Number.isFinite(c.pausedAt) ? c.pausedAt : null, pausedMs: Number(c.pausedMs) || 0,
          step: c.step, trigger: TRIGGER_LABEL[c.trigger] ? c.trigger : null, intensity: Util.clampInt(c.intensity, 1, 5), duration: Number(c.duration) || 0 };
        return true;
      }
    } catch (e) { /* données illisibles : on repart sans envie en cours */ }
    Craving.clear();
    return false;
  },

  clear() { Craving.current = null; Craving.persist(); },

  elapsed(c, now = Date.now()) {
    const end = c.pausedAt || now;
    return Math.min(Craving.DURATION, Math.max(0, end - c.start - c.pausedMs));
  },

  /** Textes et tracé du cercle pour un temps écoulé (cycle 4 s inspire / 6 s expire). */
  view(el, c) {
    const left = Math.ceil((Craving.DURATION - el) / 1000);
    const inhale = (el / 1000) % 10 < 4;
    return {
      dash: (Craving.CIRC * (1 - el / Craving.DURATION)).toFixed(1),
      phase: c && c.pausedAt ? 'En pause' : inhale ? 'Inspire' : 'Expire',
      hint: c && c.pausedAt ? 'Reprends quand tu veux' : inhale ? '4 secondes' : '6 secondes',
      left: `${Dates.pad(Math.floor(left / 60))}:${Dates.pad(left % 60)}`
    };
  },

  togglePause() {
    const c = Craving.state(), now = Date.now();
    if (c.pausedAt) { c.pausedMs += now - c.pausedAt; c.pausedAt = null; } else { c.pausedAt = now; }
    Craving.persist();
  },

  finish() {
    const c = Craving.state();
    c.duration = Craving.elapsed(c);
    c.step = 'log';
    Craving.persist();
  },

  /** Enregistre l'envie ; resolved = traversée sans prise. */
  save(resolved, withContext = true) {
    const c = Craving.state();
    Store.data.cravings.push({
      id: Util.uid(), ts: c.start, resolved,
      trigger: withContext ? c.trigger : null, intensity: withContext ? c.intensity : null,
      duration: c.duration || Craving.elapsed(c)
    });
    Store.data.cravings.sort((a, b) => a.ts - b.ts);
    Store.save();
    const saved = { trigger: c.trigger, intensity: c.intensity };
    Craving.clear();
    return saved;
  }
};

/* =========================================================================
   Demo — jeu de données fictif, reproductible (graine fixe)
   ========================================================================= */
const Demo = {
  /** Générateur pseudo-aléatoire déterministe (mulberry32). */
  rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  },

  /** Heures typiques et déclencheur associé. */
  SLOTS: [
    { h: 7, w: 3, trig: 'reveil' }, { h: 9, w: 4, trig: 'cafe' }, { h: 10, w: 2, trig: 'ennui' },
    { h: 13, w: 4, trig: 'repas' }, { h: 15, w: 2, trig: 'stress' }, { h: 16, w: 4, trig: 'stress' },
    { h: 17, w: 2, trig: 'ennui' }, { h: 20, w: 3, trig: 'repas' }, { h: 21, w: 3, trig: 'soiree' }, { h: 23, w: 1, trig: 'soiree' }
  ],

  pickSlot(rand) {
    const total = Demo.SLOTS.reduce((a, s) => a + s.w, 0);
    let r = rand() * total;
    return Demo.SLOTS.find((s) => (r -= s.w) < 0) || Demo.SLOTS[0];
  },

  /** 21 jours d'observation se terminant maintenant (utilisé par les tests). */
  generate(now = Date.now(), seed = 42) {
    const rand = Demo.rng(seed);
    const data = Store.defaults();
    Object.assign(data.settings, {
      snusBoxPrice: 7.9, snusPerBox: 20, snusMg: 8,
      vapeFormat: 'capsule', vapeUnitPrice: 5.5, vapeMlPerUnit: 2, vapeMgPerMl: 20, vapeSessionsPerUnit: 8,
      profile: { done: true, uses: 'both', goals: ['argent', 'liberte', 'sante'], concerns: ['tension', 'sommeil', 'stress'], firstUse: 'lt30' },
      theme: Store.data ? Store.data.settings.theme : 'dark'
    });
    const today = Dates.dayKey(now);
    for (let back = 20; back >= 0; back--) {
      const key = Dates.addDays(today, -back);
      const start = Dates.keyToStart(key);
      const count = 6 + Math.floor(rand() * 5);
      for (let i = 0; i < count; i++) {
        const slot = Demo.pickSlot(rand);
        const ts = start + slot.h * 3600000 + Math.floor(rand() * 3600000);
        if (ts > now) continue;
        const withContext = rand() > 0.15;
        data.intakes.push({
          id: `demo-${back}-${i}`, type: rand() < 0.45 ? 'snus' : 'vape', ts,
          trigger: withContext ? slot.trig : null,
          intensity: withContext ? 1 + Math.floor(rand() * 5) : null
        });
      }
      // ml de vape notés la plupart des jours passés (≈ 0,25 ml par session).
      const vapeCount = data.intakes.filter((x) => x.type === 'vape' && Dates.dayKey(x.ts) === key).length;
      if (back >= 1 && rand() > 0.2) data.vapeMl.push({ date: key, ml: Math.round(vapeCount * (0.2 + rand() * 0.1) * 10) / 10 });
    }
    return Store.normalize(data);
  },

  /**
   * Scénario « arrêt en cours » : 3 semaines d'observation, arrêt il y a
   * 6 jours, une prise il y a 3 j 14 h, envies de moins en moins nombreuses.
   */
  generateQuit(now = Date.now(), seed = 42) {
    const quitStart = now - 6 * DAY_MS;
    const data = Demo.generate(quitStart - 60000, seed);
    const rand = Demo.rng(seed + 1);
    data.settings.phase = 'arret';
    data.settings.quitStart = quitStart;
    data.settings.baseline = Calc.baseline(data.intakes, quitStart, data.vapeMl);
    data.settings.seenMilestoneH = 24; // la démo montre la célébration du repère « 3 jours »
    const relapseTs = now - (3 * 86400 + 14 * 3600 + 22 * 60) * 1000;
    data.intakes.push({ id: 'demo-reprise', type: 'vape', ts: relapseTs, trigger: 'soiree', intensity: 4 });
    [5, 4, 4, 2, 2, 1, 1].forEach((count, day) => {
      for (let i = 0; i < count; i++) {
        const ts = quitStart + day * DAY_MS + (2 + rand() * 20) * 3600000;
        if (ts > now) continue;
        const slot = Demo.pickSlot(rand);
        data.cravings.push({ id: `demo-envie-${day}-${i}`, ts, trigger: slot.trig, intensity: Math.max(1, 4 - Math.floor(day / 2) - Math.floor(rand() * 2)), resolved: true, duration: (3 + Math.floor(rand() * 7)) * 60000 });
      }
    });
    data.cravings.push({ id: 'demo-envie-reprise', ts: relapseTs - 8 * 60000, trigger: 'soiree', intensity: 4, resolved: false, duration: 6 * 60000 });
    return Store.normalize(data);
  }
};

/* ---- Calc : phase arrêt et réduction progressive ---- */
Object.assign(Calc, {
  /**
   * Référence : moyenne quotidienne réelle de l'observation, sur les jours
   * complets avant le jour de l'arrêt. null sans jour complet.
   */
  baseline(intakes, quitTs, vapeMl = []) {
    if (!intakes.length) return null;
    const first = Dates.dayKey(intakes[0].ts);
    const last = Dates.addDays(Dates.dayKey(quitTs), -1);
    if (Dates.diffDays(first, last) < 0) return null;
    const days = Calc.dailyCounts(intakes.filter((x) => x.ts < quitTs), first, last);
    const sum = (k) => days.reduce((a, d) => a + d[k], 0);
    const ml = Calc.mlAverage(vapeMl, first, last);
    return { snusPerDay: sum('snus') / days.length, vapePerDay: sum('vape') / days.length, vapeMlPerDay: ml ? ml.ml : null, days: days.length };
  },

  /** Prises faites depuis le début de l'arrêt. */
  quitIntakes(intakes, quitStart) { return intakes.filter((x) => x.ts >= quitStart); },

  /** Enchaînements sans nicotine (ms) : celui en cours et le meilleur. */
  streaks(intakes, quitStart, now) {
    const points = [quitStart, ...Calc.quitIntakes(intakes, quitStart).map((x) => x.ts).filter((t) => t <= now), now];
    let best = 0;
    for (let i = 1; i < points.length; i++) best = Math.max(best, points[i] - points[i - 1]);
    return { current: now - points[points.length - 2], best, lastTs: points[points.length - 2] };
  },

  /**
   * Jours sans nicotine au total : jours locaux, du jour de l'arrêt à hier,
   * sans aucune prise. Une prise ne remet pas ce total à zéro.
   */
  cleanDays(intakes, quitStart, now) {
    const from = Dates.dayKey(quitStart), to = Dates.addDays(Dates.dayKey(now), -1);
    if (Dates.diffDays(from, to) < 0) return 0;
    const used = new Set(Calc.quitIntakes(intakes, quitStart).map((x) => Dates.dayKey(x.ts)));
    return Dates.range(from, to).filter((k) => !used.has(k)).length;
  },

  /**
   * Doses évitées et argent économisé depuis l'arrêt, par rapport à la
   * référence : (doses attendues − doses prises), jamais négatif.
   * Un prix non renseigné donne money:null pour ce type.
   */
  avoided(intakes, settings, now, vapeMl = []) {
    const base = Calc.trackedBaseline(settings), start = settings.quitStart;
    const cost = Calc.unitCosts(settings);
    const days = Math.max(0, now - start) / DAY_MS;
    const taken = Calc.countByType(Calc.quitIntakes(intakes, start).filter((x) => x.ts <= now));
    const one = (type) => {
      const expected = base ? base[type + 'PerDay'] * days : 0;
      const avoided = Math.max(0, Math.floor(expected - taken[type] + 1e-9));
      return { expected, taken: taken[type], avoided, money: cost[type] === null ? null : avoided * cost[type] };
    };
    const snus = one('snus'), vape = one('vape');
    // Vape en ml : référence en ml/jour moins les ml repris depuis l'arrêt.
    vape.ml = null;
    if (base && base.vapeMlPerDay) {
      const takenMl = Calc.mlTakenSinceQuit(intakes, vapeMl, base, start, now);
      vape.ml = Math.max(0, Math.floor((base.vapeMlPerDay * days - takenMl) * 10 + 1e-9) / 10);
      if (cost.vapeMl !== null) vape.money = vape.ml * cost.vapeMl;
    }
    if (vape.ml !== null && settings.vapeMlPerUnit > 0) vape.units = vape.ml / settings.vapeMlPerUnit;
    else vape.units = settings.vapeSessionsPerUnit > 0 ? vape.avoided / settings.vapeSessionsPerUnit : null;
    const missing = [['snus', snus], ['vape', vape]].filter(([, x]) => x.money === null && (x.avoided > 0 || x.ml > 0)).map(([t]) => t);
    const money = snus.money === null && vape.money === null ? null : (snus.money || 0) + (vape.money || 0);
    // Nicotine évitée (teneur) : portions × mg + ml × mg/ml quand c'est connu.
    const mg = snus.avoided * (settings.snusMg || 0) + (vape.ml || 0) * (settings.vapeMgPerMl || 0);
    return { snus, vape, money, missing, days, nicotineMg: mg > 0 ? mg : null };
  },

  /**
   * Ml de vape repris depuis l'arrêt, jour par jour : les ml notés ce jour-là
   * s'ils existent, sinon sessions × ml par session de la référence.
   * Le jour de l'arrêt compte toujours en sessions (après l'heure de l'arrêt),
   * car les ml notés ce jour-là incluent ce qui a été vapoté avant.
   */
  mlTakenSinceQuit(intakes, vapeMl, base, start, now) {
    const mlPerSession = base.vapePerDay > 0 ? base.vapeMlPerDay / base.vapePerDay : 0;
    const startKey = Dates.dayKey(start), endKey = Dates.dayKey(now - 1);
    if (endKey < startKey) return 0;
    // Parcourt seulement les jours qui ont des données (pas toute la période) : rapide sur une longue série.
    const inRange = (k) => k >= startKey && k <= endKey;
    const ml = {};
    vapeMl.forEach((x) => { if (inRange(x.date) && x.date !== startKey) ml[x.date] = x.ml; });
    const sessions = {};
    intakes.forEach((x) => {
      if (x.type !== 'vape' || x.ts < start || x.ts >= now) return;
      const k = Dates.dayKey(x.ts);
      if (ml[k] === undefined) sessions[k] = (sessions[k] || 0) + 1;
    });
    const fromMl = Object.values(ml).reduce((a, v) => a + v, 0);
    const fromSessions = Object.values(sessions).reduce((a, n) => a + n, 0) * mlPerSession;
    return fromMl + fromSessions;
  },

  /** Économies cumulées à la fin de chaque jour depuis l'arrêt (aujourd'hui : maintenant). */
  savingsSeries(intakes, settings, now, vapeMl = []) {
    const startKey = Dates.dayKey(settings.quitStart);
    const keys = Dates.range(startKey, Dates.dayKey(now));
    // Pré-filtrage : seules les prises et les ml depuis l'arrêt comptent (rapide sur un long historique).
    const q = Calc.quitIntakes(intakes, settings.quitStart);
    const ml = vapeMl.filter((x) => x.date >= startKey);
    return keys.map((key) => {
      const end = Math.min(now, Dates.keyToStart(Dates.addDays(key, 1)));
      const a = Calc.avoided(q, settings, end, ml);
      return { key, value: a.money || 0 };
    });
  },

  /** Cible quotidienne de la réduction progressive pour un jour (null si inactive). */
  reductionTarget(red, key) {
    if (!red || !red.on || red.base === null || !red.startDate) return null;
    const diff = Dates.diffDays(red.startDate, key);
    if (diff < 0) return null;
    return Math.max(0, Math.round(red.base - red.weeklyStep * Math.floor(diff / 7)));
  },

  /** Respect de la cible sur les n derniers jours complets depuis le début de la réduction. */
  reductionDays(intakes, red, todayKey, n = 7) {
    if (!red || !red.on || !red.startDate) return [];
    let from = Dates.addDays(todayKey, -n);
    if (Dates.diffDays(from, red.startDate) > 0) from = red.startDate;
    const to = Dates.addDays(todayKey, -1);
    if (Dates.diffDays(from, to) < 0) return [];
    return Calc.dailyCounts(intakes, from, to).map((d) => {
      const target = Calc.reductionTarget(red, d.key);
      return { key: d.key, total: d.total, target, ok: d.total <= target };
    });
  },

  /** Étape de l'arrêt selon l'enchaînement en cours (choisit les messages). */
  stage(currentMs) {
    const h = currentMs / 3600000;
    if (h < 24) return 'start';
    if (h < 72) return 'peak';
    if (h < 24 * 30) return 'weeks';
    return 'long';
  }
});

/** Prochain jalon et progression (0–1) pour un enchaînement donné. */
Calc.nextMilestone = function (currentMs, list = MILESTONES) {
  const h = currentMs / 3600000;
  const idx = list.findIndex((m) => m.h > h);
  if (idx === -1) return null;
  const prevH = idx === 0 ? 0 : list[idx - 1].h;
  return { ...list[idx], index: idx, progress: Math.min(1, Math.max(0, (h - prevH) / (list[idx].h - prevH))), remainingMs: list[idx].h * 3600000 - currentMs };
};

/**
 * Jalons pertinents : celui des gencives n'apparaît que pour qui prenait du snus
 * (d'après la référence, sinon d'après l'historique). Sans aucune info, on le garde.
 */
Calc.visibleMilestones = function (settings, intakes) {
  return Calc.forUsage(MILESTONES.map((m) => (m.tag === 'snus' ? { ...m, only: 'snus' } : m)), Calc.usage(settings, intakes));
};

/**
 * Repère atteint depuis la dernière visite (à célébrer une fois), ou null.
 * Après une prise, les repères repartent : le « déjà vu » redescend avec eux.
 */
Calc.newMilestone = function (currentMs, list, seenH) {
  const last = Calc.lastPassed(currentMs, list);
  // seenH inconnu (données d'avant la 2.0) : rien n'est célébré après coup.
  if (!last || seenH === null || last.h <= seenH) return null;
  return last;
};

/** Mois « AAAA-MM » décalé de n mois. */
Calc.shiftMonth = function (month, n) {
  const [y, m] = month.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  return `${d.getFullYear()}-${Dates.pad(d.getMonth() + 1)}`;
};

/** Dernier repère atteint pour un enchaînement donné (ou null). */
Calc.lastPassed = function (currentMs, list) {
  const h = currentMs / 3600000;
  const passed = list.filter((m) => m.h <= h);
  return passed.length ? passed[passed.length - 1] : null;
};

/** Ce que la personne prend : 'snus', 'vape' ou 'both' (référence, historique, puis questionnaire). */
Calc.usage = function (settings, intakes) {
  // Le choix fait dans Réglages (ou au questionnaire) l'emporte ; sinon, on le déduit.
  const chosen = settings.profile && settings.profile.uses;
  if (chosen === 'snus' || chosen === 'vape' || chosen === 'both') return chosen;
  const b = settings.baseline;
  if (b) return b.snusPerDay > 0 && b.vapePerDay > 0 ? 'both' : b.snusPerDay > 0 ? 'snus' : b.vapePerDay > 0 ? 'vape' : 'both';
  if (intakes.length) {
    const snus = intakes.some((x) => x.type === 'snus'), vape = intakes.some((x) => x.type === 'vape');
    return snus && vape ? 'both' : snus ? 'snus' : 'vape';
  }
  return 'both';
};

/**
 * Référence limitée aux produits choisis dans Réglages : si l'on ne suit que le snus,
 * l'ancienne référence vape ne compte plus dans les économies (et inversement).
 */
Calc.trackedBaseline = function (settings) {
  const b = settings.baseline;
  const uses = settings.profile && settings.profile.uses;
  if (!b || (uses !== 'snus' && uses !== 'vape')) return b || null;
  return uses === 'snus' ? { ...b, vapePerDay: 0, vapeMlPerDay: null } : { ...b, snusPerDay: 0 };
};

/** Ce produit fait-il partie de la consommation suivie ? */
Calc.tracks = function (type, settings = Store.data.settings, intakes = Store.data.intakes) {
  const u = Calc.usage(settings, intakes);
  return u === 'both' || u === type;
};
/** Type proposé par défaut pour une nouvelle prise. */
Calc.defaultType = function (settings = Store.data.settings, intakes = Store.data.intakes) {
  return Calc.usage(settings, intakes) === 'vape' ? 'vape' : 'snus';
};

/** Éléments propres au snus ou à la vape, filtrés selon l'usage. */
Calc.forUsage = function (list, usage) {
  return list.filter((x) => !x.only || usage === 'both' || usage === x.only);
};

/** Progression (0–1) de la récupération d'un système. */
Calc.systemProgress = function (currentMs, sys) {
  return Math.max(0, Math.min(1, currentMs / 3600000 / sys.h));
};

/** Étape de l'arrêt pour la carte « En ce moment ». */
Calc.stageInfo = function (currentMs) {
  const h = currentMs / 3600000;
  return STAGES.find((st) => h < st.upTo);
};

/** État de chaque jalon : passé, prochain, à venir. */
Calc.milestoneStates = function (currentMs, list) {
  const h = currentMs / 3600000;
  let nextFound = false;
  return list.map((m) => {
    if (m.h <= h) return { ...m, state: 'done' };
    if (!nextFound) { nextFound = true; return { ...m, state: 'next' }; }
    return { ...m, state: 'future' };
  });
};

/* ---- Calc : profil et bénéfices ---- */
Object.assign(Calc, {
  /** Points de santé proposés selon ce que la personne prend. */
  concernsFor(uses) {
    return CONCERNS.filter((c) => !c.only || !uses || uses === 'both' || uses === c.only);
  },

  /** Repère concerné par le profil ? */
  isForMe(milestone, concerns) {
    return (milestone.for || []).some((k) => concerns.includes(k));
  },

  /**
   * Coût annuel : au rythme de la référence (avant l'arrêt) si elle existe,
   * sinon des 30 derniers jours. Vape : ml × prix du ml quand c'est possible,
   * sinon sessions × prix de la session. null sans prix exploitable.
   */
  yearlyCost(settings, intakes, vapeMl = [], todayKey = Dates.todayKey()) {
    const cost = Calc.unitCosts(settings);
    let rate = Calc.trackedBaseline(settings);
    if (!rate) {
      const a = Calc.avgPerDay(intakes, todayKey, 30);
      const m = Calc.mlAverage(vapeMl, Dates.addDays(todayKey, -30), Dates.addDays(todayKey, -1));
      if (!a && !m) return null;
      rate = { snusPerDay: a ? a.snus : 0, vapePerDay: a ? a.vape : 0, vapeMlPerDay: m ? m.ml : null };
    }
    const vapeMlDay = rate.vapeMlPerDay !== null && rate.vapeMlPerDay !== undefined && cost.vapeMl !== null ? rate.vapeMlPerDay * cost.vapeMl : null;
    const vapeSessDay = rate.vapePerDay > 0 && cost.vape !== null ? rate.vapePerDay * cost.vape : null;
    const snusDay = rate.snusPerDay > 0 && cost.snus !== null ? rate.snusPerDay * cost.snus : null;
    const vapeDay = vapeMlDay !== null ? vapeMlDay : vapeSessDay;
    if (snusDay === null && vapeDay === null) return null;
    return ((snusDay || 0) + (vapeDay || 0)) * 365;
  },

  /** Prises par jour de référence (ou moyenne récente), pour « Ne plus dépendre ». */
  dailyRate(settings, intakes) {
    const b = Calc.trackedBaseline(settings);
    if (b) return b.snusPerDay + b.vapePerDay;
    const a = Calc.avgPerDay(intakes, Dates.todayKey(), 30);
    return a ? a.total : null;
  }
});

/* =========================================================================
   Intakes — ajout, modification, suppression des prises
   ========================================================================= */
const Intakes = {
  /** Marge tolérée dans le futur (horloge légèrement décalée). */
  FUTURE_TOLERANCE: 5 * 60000,

  find(id) { return Store.data.intakes.find((x) => x.id === id) || null; },

  isValidTs(ts) { return Number.isFinite(ts) && ts <= Date.now() + Intakes.FUTURE_TOLERANCE; },

  sort() { Store.data.intakes.sort((a, b) => a.ts - b.ts); },

  /** Crée une prise et renvoie son id. */
  add(type, ts, trigger = null, intensity = null) {
    const entry = { id: Util.uid(), type, ts, trigger, intensity };
    Store.data.intakes.push(entry);
    Intakes.sort();
    Store.save();
    return entry.id;
  },

  /** Modifie une prise existante (type, heure, contexte). */
  edit(id, patch) {
    const entry = Intakes.find(id);
    if (!entry) return false;
    Object.assign(entry, patch);
    Intakes.sort();
    Store.save();
    return true;
  },

  remove(id) {
    const before = Store.data.intakes.length;
    Store.data.intakes = Store.data.intakes.filter((x) => x.id !== id);
    Store.save();
    return Store.data.intakes.length < before;
  }
};

/* =========================================================================
   Anim — animations d'arrivée sur un écran (désactivées si l'iPhone
   demande de réduire les animations)
   ========================================================================= */
const Anim = {
  reduced() { return window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; },

  /** Apparition échelonnée des blocs de l'écran + compteurs qui défilent. */
  enter(view) {
    const screen = view.querySelector('.screen');
    if (!screen || Anim.reduced()) return;
    [...screen.children].forEach((el, i) => el.style.setProperty('--i', Math.min(i, 6)));
    screen.classList.add('is-entering');
    screen.querySelectorAll('[data-countup]').forEach(Anim.countUp);
  },

  /** Petit rebond (compteur après un ajout). */
  bump(el) {
    if (!el || Anim.reduced()) return;
    el.classList.remove('bump');
    void el.offsetWidth; // relance l'animation
    el.classList.add('bump');
  },

  /** Petit « pop » sur l'option qu'on vient de choisir (puce, échelle, segment). */
  pickPop() {
    const p = App.lastPick;
    App.lastPick = null;
    if (!p || !p.value || Anim.reduced()) return;
    const sel = `[data-action="${p.action}"][data-value="${CSS.escape(p.value)}"]${p.key ? `[data-key="${CSS.escape(p.key)}"]` : ''}`;
    const el = document.querySelector(sel);
    if (el && el.getAttribute('aria-pressed') === 'true') { el.classList.remove('pick-pop'); void el.offsetWidth; el.classList.add('pick-pop'); }
  },

  /** Éclat de petits points autour d'un élément (envie traversée, repère atteint…). */
  burst(el, count = 12) {
    if (!el || Anim.reduced()) return;
    const host = document.createElement('span');
    host.className = 'burst';
    host.setAttribute('aria-hidden', 'true');
    for (let i = 0; i < count; i++) {
      const dot = document.createElement('i');
      const angle = (i / count) * 360 + Math.random() * 20;
      dot.style.setProperty('--a', `${angle}deg`);
      dot.style.setProperty('--d', `${38 + Math.random() * 26}px`);
      dot.style.setProperty('--c', i % 3 === 0 ? 'var(--warm)' : 'var(--mint)');
      host.appendChild(dot);
    }
    el.style.position = el.style.position || 'relative';
    el.appendChild(host);
    setTimeout(() => host.remove(), 1000);
  },

  /** Petit texte qui monte et s'efface (« +1 » au-dessus du compteur). */
  floatText(el, text) {
    if (!el || Anim.reduced()) return;
    const f = document.createElement('span');
    f.className = 'float-text';
    f.textContent = text;
    f.setAttribute('aria-hidden', 'true');
    el.parentElement.style.position = 'relative';
    el.parentElement.appendChild(f);
    setTimeout(() => f.remove(), 900);
  },

  /** Changement doux du contenu d'une carte. */
  swap(el) {
    if (Anim.reduced()) return;
    el.classList.remove('reason--in'); void el.offsetWidth; el.classList.add('reason--in');
  },

  /** Onglet qui rebondit quand on y arrive. */
  tabPop(name) {
    if (Anim.reduced()) return;
    const t = document.querySelector(`.tab[data-tab="${name}"]`);
    if (!t) return;
    t.classList.remove('tab--pop'); void t.offsetWidth; t.classList.add('tab--pop');
  },

  /** Écran d'ouverture : le S se dessine, le nom apparaît (moins d'une seconde, touche pour passer). */
  /** Montant qui défile de 0 à sa valeur (affichage final identique). */
  countUp(el) {
    const to = Number(el.dataset.countup);
    if (!Number.isFinite(to) || to <= 0) return;
    const final = el.textContent;
    const t0 = performance.now(), dur = 700;
    const step = (t) => {
      if (!el.isConnected) return;
      const k = Math.min(1, (t - t0) / dur);
      const eased = 1 - Math.pow(1 - k, 3);
      el.textContent = k < 1 ? Util.formatMoney(to * eased) : final;
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
};

/* =========================================================================
   Vape — relevé des millilitres du jour
   ========================================================================= */
const Vape = {
  MAX_ML: 100,

  /** Lit une saisie de ml : null = vide, NaN = invalide, sinon arrondi au dixième. */
  parse(raw) {
    const t = String(raw ?? '').trim();
    if (t === '') return null;
    const n = Util.parseNum(t);
    return n === null || n > Vape.MAX_ML ? NaN : Math.round(n * 10) / 10;
  },

  /** Enregistre (ou retire si null) les ml d'un jour ; refuse une valeur hors bornes. */
  setMl(dateKey, ml) {
    if (Number.isNaN(ml) || (ml !== null && (ml < 0 || ml > Vape.MAX_ML))) {
      UI.toast(`Millilitres : un nombre entre 0 et ${Vape.MAX_ML}, ou laisse vide.`);
      App.render();
      return;
    }
    Store.update((d) => {
      d.vapeMl = Store.cleanVapeMl(d.vapeMl.filter((x) => x.date !== dateKey).concat(ml === null ? [] : [{ date: dateKey, ml }]));
    });
  }
};

/* =========================================================================
   UI — feuille du bas, toast, thème
   ========================================================================= */
const UI = {
  toastTimer: null,

  /** Petit message en bas ; action facultative (ex. « Annuler »). */
  toast(text, actionLabel, onAction, duration = 4000) {
    const el = document.getElementById('toast');
    const btn = document.getElementById('toast-action');
    document.getElementById('toast-text').textContent = text;
    btn.hidden = !actionLabel;
    btn.textContent = actionLabel || '';
    btn.onclick = () => { UI.hideToast(); if (onAction) onAction(); };
    el.classList.add('is-visible');
    clearTimeout(UI.toastTimer);
    UI.toastTimer = setTimeout(UI.hideToast, duration);
  },
  hideToast() { document.getElementById('toast').classList.remove('is-visible'); },

  /** Ouvre une feuille du bas avec le HTML donné. */
  openSheet(html, label) {
    const root = document.getElementById('sheet-root');
    root.innerHTML = `<div class="scrim" data-action="close-sheet"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-label="${Util.esc(label || '')}">
        <div class="sheet__grabber"></div><div class="inner">${html}</div></div>`;
    UI.lastFocus = document.activeElement;
    requestAnimationFrame(() => {
      document.body.classList.add('sheet-open');
      const first = root.querySelector('.inner button, .inner input, .inner a');
      if (first) first.focus({ preventScroll: true });
    });
  },
  /** Remplace le contenu de la feuille ouverte sans l'animer. */
  updateSheet(html) {
    const inner = document.querySelector('#sheet-root .inner');
    if (inner) inner.innerHTML = html;
  },
  closeSheet() {
    const wasOpen = document.body.classList.contains('sheet-open');
    document.body.classList.remove('sheet-open');
    if (wasOpen && UI.lastFocus && document.contains(UI.lastFocus)) UI.lastFocus.focus({ preventScroll: true });
    setTimeout(() => {
      if (!document.body.classList.contains('sheet-open')) document.getElementById('sheet-root').innerHTML = '';
    }, 260);
    UI.sheetState = null;
  },

  applyTheme() {
    const theme = Store.data.settings.theme;
    document.documentElement.dataset.theme = theme;
    document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'light' ? '#F3F5F9' : '#0B1220');
  }
};

/* =========================================================================

const Screens = {
  aujourdhui() {
    return Store.data.settings.phase === 'arret' ? Screens.todayQuit() : Screens.todayObservation();
  },

  /** Aujourd'hui — phase observation : compteur, relevé en un tap, liste du jour. */

    const today = Dates.todayKey();
    const key = App.viewDay || today;
    const isToday = key === today;

    return `<div class="screen screen--today">
      <div class="ambient" aria-hidden="true"></div>
      <header class="header"><span class="wordmark">STASE</span><span class="pill">Observation</span></header>

      <section class="stack" style="gap:6px">
        ${Screens.dayNav(key, isToday)}
        ${isToday ? Screens.cellStage(c.total) : `<div class="counter">
          <span class="big-number">${c.total}</span>
          <span class="muted">${c.total > 1 ? 'prises' : 'prise'} ce jour-là</span>
        </div>`}
        ${(() => {
          const both = Calc.usage(Store.data.settings, Store.data.intakes) === 'both' || (c.snus && c.vape);
          const parts = (both ? [`${c.snus} snus`, `${c.vape} vape`] : [])
            .concat(avg ? [`moyenne ${avg.days < 7 ? `${avg.days} j` : '7 j'} : ${Util.formatNum(avg.total, 1)}`] : []);
          return parts.length ? `<p class="small muted">${parts.join(' <span class="faint">·</span> ')}</p>` : '';
        })()}
        ${Screens.targetLine(key, c.total, isToday)}
        ${Screens.weekStrip(key, false)}
      </section>

      ${Screens.mlRow(key, isToday)}

      <section class="stack" style="gap:0">
        <div class="row" style="padding-bottom:8px">
          <h2 style="font-size:15px">${isToday ? 'Prises du jour' : 'Prises de ce jour'}</h2>
          ${list.length ? '<span class="small faint">Touche pour modifier</span>' : ''}
        </div>
        ${list.length ? list.slice().reverse().map(Screens.intakeRow).join('') : Screens.todayEmpty(isToday)}
        <button type="button" class="link" data-action="new-intake" style="align-self:center">${isToday ? 'Ajouter une prise oubliée' : 'Ajouter une prise ce jour-là'}</button>

      ${isToday ? Screens.whyCard() : ''}

  },

  /**
   * La cellule : elle porte le nombre de prises du jour et grossit avec lui.
   * Les boutons sont juste dessous ; une prise ajoutée part du bouton en goutte
   * et se fond dans la cellule (moteur Cell, plus bas).
   */
  cellStage(total) {
    const types = ['snus', 'vape'].filter((t) => Calc.tracks(t));
    return `<section class="cellwrap no-enter" data-total="${total}" style="--n:${types.length}">
      <div class="goo-btns btn-skins" aria-hidden="true">${types.map((t) => `<div class="goo-btn" data-stype="${t}"></div>`).join('')}</div>
      <div class="goo-layer" aria-hidden="true">
        <div class="cell" style="--size:${Cell.size(total)}px"><div class="cell__body"></div></div>
        <div class="goo-btns">${types.map((t) => `<div class="goo-btn" data-gtype="${t}"></div>`).join('')}</div>
      </div>
      <div class="cell__text"><span class="cell__num">${total}</span><span class="cell__label">${total > 1 ? 'prises' : 'prise'} aujourd’hui</span></div>
      <div class="cell-btns">${Screens.logButtons(true)}</div>
    </section>`;
  },

  /** Boutons de relevé : un seul, plus large, si un seul produit est suivi. */
  logButtons(bare = false) {
    const types = ['snus', 'vape'].filter((t) => Calc.tracks(t));

  /** Aujourd'hui (observation) : un bénéfice du profil, différent chaque jour. */
