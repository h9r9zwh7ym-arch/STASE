      <span class="entry__time num">${Dates.formatTime(x.ts)}</span>
      <span class="entry__kind"><span class="marker marker--${x.type}"></span>${x.type === 'snus' ? 'Snus' : 'Vape'}</span>
      <span class="entry__ctx ${x.trigger ? '' : 'faint'}">${label}</span>
      <span class="dots" aria-label="${x.intensity ? `Intensité ${x.intensity} sur 5` : 'Intensité non notée'}">${dots}</span>
    </button>`;
  },

  todayEmpty(isToday) {
    return `<div class="card card--empty">
      <strong>${isToday ? 'Rien de noté aujourd’hui.' : 'Rien de noté ce jour-là.'}</strong>
      <span class="muted small">${isToday
        ? 'Touche « + Snus » ou « + Vape » au moment d’une prise. L’heure est notée toute seule, le reste est facultatif.'
        : 'Si tu as oublié une prise, ajoute-la ci-dessous avec son heure.'}</span>
    </div>`;
  },

  placeholder(title, step) {
    return `<div class="screen">
      <h1 class="title">${title}</h1>
      <div class="card card--empty"><span class="muted small">Cet écran arrive à l'étape ${step}.</span></div>
    </div>`;
  },

  stats() {
    return Store.data.settings.phase === 'arret' ? Screens.statsQuit() : Screens.statsObservation();
  },

  /** Stats — phase observation. */
  statsObservation() {
    const intakes = Store.data.intakes;
    if (!intakes.length) return Screens.statsEmpty();
    const n = App.statsRange;
    const today = Dates.todayKey();
    const from = Dates.addDays(today, -(n - 1));
    const inRange = Calc.between(intakes, from, today);
    const avg = Calc.avgPerDay(intakes, today, n);
    const daysKnown = Dates.diffDays(Dates.dayKey(intakes[0].ts), today);
    return `<div class="screen">
      <header class="header">
        <h1 class="title">Stats</h1>
        <div class="segmented" role="group" aria-label="Période" style="width:132px">
          <button type="button" data-action="stats-range" data-value="7" aria-pressed="${n === 7}">7 j</button>
          <button type="button" data-action="stats-range" data-value="30" aria-pressed="${n === 30}">30 j</button>
        </div>
      </header>
      ${Screens.statsReduction(intakes, today)}
      ${daysKnown < 3 ? `<p class="small muted">Encore ${3 - daysKnown} jour${3 - daysKnown > 1 ? 's' : ''} de relevés pour des moyennes parlantes.</p>` : ''}
      ${Screens.statsDaily(intakes, from, today, n, avg)}
      ${Screens.statsHours(inRange)}
      ${Screens.statsTriggers(inRange)}
      ${Screens.correlationCard()}
      ${Screens.statsSpend(intakes, today)}
      ${Screens.statsNicotine(avg, inRange)}
    </div>`;
  },

  /** Suivi de la réduction progressive. */
  statsReduction(intakes, today) {
    const red = Store.data.settings.reduction;
    if (!red.on) return '';
    const days = Calc.reductionDays(intakes, red, today, 7);
    const ok = days.filter((d) => d.ok).length;
    const now = Calc.reductionTarget(red, today), next = Calc.reductionTarget(red, Dates.addDays(today, 7));
    return `<section class="card card--featured" style="gap:12px">
      <span class="label" style="color:var(--mint)">Réduction progressive</span>
      ${days.length
        ? `<span class="value" style="font-size:24px">Cible respectée ${ok} jour${ok > 1 ? 's' : ''} sur ${days.length}</span>
           ${Charts.days(days.map((d) => ({ label: `${d.total}/${d.target}`, state: d.ok ? 'ok' : 'ko' })), 'Respect de la cible, jour par jour')}`
        : '<span class="small muted">Le suivi commence demain : aujourd’hui n’est pas terminé.</span>'}
      <p class="small muted">Cible actuelle : ${now} par jour${next !== now ? ` · la semaine prochaine : ${next}` : ''}. Les jours au-dessus ne sont qu'un repère.</p>
    </section>`;
  },

  /** Stats — phase arrêt : jours sans nicotine, envies, économies. */
  statsQuit() {
    const st = Store.data.settings, now = Date.now(), today = Dates.todayKey();
    const startKey = Dates.dayKey(st.quitStart);
    const allKeys = Dates.range(startKey, today);
    const keys = allKeys.slice(-28);
    const used = {};
    Calc.quitIntakes(Store.data.intakes, st.quitStart).forEach((x) => { const k = Dates.dayKey(x.ts); used[k] = (used[k] || 0) + 1; });
    const clean = Calc.cleanDays(Store.data.intakes, st.quitStart, now);
    const dayItems = keys.map((k) => ({ label: String(Number(k.slice(8))), state: used[k] ? 'used' : k === today ? 'today' : 'clean' }));
    const cravings = Store.data.cravings.filter((c) => c.ts >= st.quitStart);
    const cKeys = allKeys.slice(-14);
    const perDay = cKeys.map((k) => ({ v: cravings.filter((c) => Dates.dayKey(c.ts) === k).length, label: k === today ? 'Auj.' : String(Number(k.slice(8))), hi: k === today }));
    const traversed = cravings.filter((c) => c.resolved).length;
    const avgInt = Calc.mean(cravings.map((c) => c.intensity));
    const avgDur = Calc.mean(cravings.map((c) => c.duration));
    const series = Calc.savingsSeries(Store.data.intakes, st, now);
    const av = Calc.avoided(Store.data.intakes, st, now);
    const dayN = allKeys.length;
    return `<div class="screen">
      <header class="header"><h1 class="title">Stats</h1><span class="pill pill--mint">Arrêt · jour ${dayN}</span></header>

      <section class="card" style="gap:14px">
        <div class="stack" style="gap:4px"><span class="small muted">Jours sans nicotine</span>
          <span class="value">${clean} <span class="small muted" style="font-family:var(--font-text);font-weight:500">jour${clean > 1 ? 's' : ''} complet${clean > 1 ? 's' : ''} sur ${Math.max(0, dayN - 1)}</span></span></div>
        ${Charts.days(dayItems, 'Jours depuis l’arrêt : sans nicotine ou avec prise')}
        <p class="tiny faint">Menthe : jour sans nicotine. Gris : jour avec une prise. Le total ne repart jamais à zéro.</p>
      </section>

      <section class="card" style="gap:14px">
        <div class="row" style="align-items:flex-end">
          <div class="stack" style="gap:4px"><span class="small muted">Envies par jour</span>
            <span class="value">${cravings.length}</span></div>
          ${avgInt !== null ? `<span class="small muted">intensité moy. ${Util.formatNum(avgInt, 1)}</span>` : ''}
        </div>
        ${cravings.length ? Charts.bars(perDay, { height: 130, tone: 'warm', aria: 'Envies par jour depuis l’arrêt' }) : '<p class="small faint">Aucune envie notée. Le bouton « J’ai une envie » les enregistre.</p>'}
      </section>

      <section class="card" style="gap:14px">
        <div class="row" style="align-items:flex-end">
          <div class="stack" style="gap:4px"><span class="small muted">Économies cumulées</span>
            <span class="value value--mint">${av.money === null ? '—' : Util.formatMoney(av.money)}</span></div>
          ${av.money !== null && av.days >= 1 ? `<span class="small muted">≈ ${Util.formatMoney((av.money / av.days) * 30, 0)} par mois</span>` : ''}
        </div>
        ${av.money !== null ? Charts.line(series.map((p) => p.value), 'Économies cumulées depuis l’arrêt') : '<p class="small muted">Renseigne les prix dans <a class="link--mint" href="#/reglages">Réglages</a> pour voir tes économies.</p>'}
      </section>

      <div class="grid-2">
        <div class="card" style="padding:18px;gap:6px"><span class="small muted">Envies traversées</span><span class="value" style="font-size:28px">${traversed}</span></div>
        <div class="card" style="padding:18px;gap:6px"><span class="small muted">Durée moyenne</span><span class="value" style="font-size:28px">${avgDur !== null ? `${Math.max(1, Math.round(avgDur / 60000))} min` : '—'}</span></div>
      </div>
      ${Screens.correlationCard()}
    </div>`;
  },

  statsDaily(intakes, from, today, n, avg) {
    const days = Calc.dailyCounts(intakes, from, today);
    const items = days.map((d, i) => {
      const isToday = d.key === today;
      let label = '';
      if (n === 7) label = isToday ? 'Auj.' : new Date(Dates.keyToStart(d.key)).toLocaleDateString('fr-FR', { weekday: 'narrow' });
      else if ((n - 1 - i) % 7 === 0) label = isToday ? 'Auj.' : String(Number(d.key.slice(8)));
      return { v: d.total, label, hi: isToday };
    });
    const prev = Calc.avgPerDay(intakes, Dates.addDays(today, -n), n);
    const firstKey = Dates.dayKey(intakes[0].ts);
    const comparable = avg && prev && Dates.diffDays(firstKey, Dates.addDays(today, -2 * n)) >= 0;
    const delta = comparable ? avg.total - prev.total : null;
    return `<section class="card" style="gap:16px">
      <div class="row" style="align-items:flex-end">
        <div class="stack" style="gap:4px">
          <span class="small muted">Prises par jour</span>
          <span class="value">${avg ? Util.formatNum(avg.total, 1) : '—'} <span class="small muted" style="font-family:var(--font-text);font-weight:500">${avg ? `moyenne ${avg.days} j` : 'pas encore de jour complet'}</span></span>
        </div>
        ${delta !== null ? `<span class="small muted">${delta > 0 ? '+' : delta < 0 ? '−' : '±'}${Util.formatNum(Math.abs(delta), 1)} vs ${n} j précédents</span>` : ''}
      </div>
      ${Charts.bars(items, { avg: avg ? avg.total : null, aria: `Prises par jour sur ${n} jours` })}
      ${avg ? `<p class="tiny faint">${Util.formatNum(avg.snus, 1)} snus et ${Util.formatNum(avg.vape, 1)} vape par jour en moyenne. La ligne pointillée montre la moyenne ; aujourd'hui (en clair) n'est pas fini.</p>` : ''}
    </section>`;
  },

  statsHours(list) {
    const hist = Calc.hourHistogram(list);
    const peaks = Calc.topHours(hist, 2);
    const items = hist.map((v, h) => ({ v, label: [0, 6, 12, 18, 23].includes(h) ? `${h} h` : '' }));
    return `<section class="card" style="gap:14px">
      <div class="row"><span class="small muted">Répartition par heure</span>
        ${peaks.length ? `<span class="small">Pic : ${peaks.map((h) => `${h} h`).join(' et ')}</span>` : ''}</div>
      ${Charts.bars(items, { height: 110, gap: 3, aria: 'Prises par heure de la journée' })}
    </section>`;
  },

  statsTriggers(list) {
    const rows = Calc.triggerShare(list).map((r) => ({ label: r.label, pct: r.pct, muted: r.key === 'none' }));
    return `<section class="card" style="gap:14px">
      <span class="small muted">Par déclencheur</span>
      ${rows.length ? Charts.hbars(rows) : '<p class="small faint">Aucune prise sur la période.</p>'}
    </section>`;
  },

  statsSpend(intakes, today) {
    const s = Store.data.settings;
    const week = Calc.spend(Calc.between(intakes, Calc.weekStart(today), today), s);
    const month = Calc.spend(Calc.between(intakes, Calc.monthStart(today), today), s);
    const avg30 = Calc.avgPerDay(intakes, today, 30);
    const cost = Calc.unitCosts(s);
    const yearly = avg30 && (cost.snus !== null || cost.vape !== null)
      ? ((avg30.snus * (cost.snus || 0)) + (avg30.vape * (cost.vape || 0))) * 365 : null;
    const missing = [...new Set([...week.missing, ...month.missing])];
    const tile = (title, sp, sub) => `<div class="card" style="padding:18px;gap:6px">
        <span class="small muted">${title}</span>
        <span class="value" style="font-size:28px">${sp.total > 0 || !sp.missing.length ? Util.formatMoney(sp.total) : '—'}</span>
        <span class="tiny faint">${sub}</span></div>`;
    return `<section class="stack" style="gap:12px">
      <div class="grid-2">
        ${tile('Cette semaine', week, `snus ${Util.formatNum(week.snus)} € · vape ${Util.formatNum(week.vape)} €`)}
        ${tile('Ce mois', month, yearly !== null ? `≈ ${Util.formatMoney(yearly, 0)} sur un an` : 'depuis le 1er')}
      </div>
      ${missing.length ? `<p class="small muted">Prix ${missing.map((t) => (t === 'snus' ? 'du snus' : 'de la vape')).join(' et ')} non renseigné : ces prises ne sont pas comptées.
        <a class="link link--mint" href="#/reglages" style="min-height:44px">Renseigner</a></p>` : ''}
    </section>`;
  },

  statsNicotine(avg, list) {
    const s = Store.data.settings;
    if (!(s.snusMg > 0)) return '';
    const snusInRange = list.filter((x) => x.type === 'snus').length;
    if (!snusInRange && !(avg && avg.snus > 0)) return '';
    return `<section class="card" style="gap:6px">
      <span class="small muted">Nicotine du snus (estimation)</span>
      <span class="value">${avg ? `≈ ${Util.formatNum(Calc.snusMg(avg.snus, s), 0)} mg` : '—'} <span class="small muted" style="font-family:var(--font-text);font-weight:500">par jour</span></span>
      <p class="tiny faint">Portions × ${Util.formatNum(s.snusMg)} mg. C'est la teneur des portions : le corps n'en absorbe qu'une partie. La vape n'est pas estimée, trop variable d'une bouffée à l'autre.</p>
    </section>`;
  },

  statsEmpty() {
    const ghost = [40, 60, 50, 75, 55, 45, 30].map((h, i) => ({ v: h, hi: i === 6 }));
    return `<div class="screen">
      <header class="header"><h1 class="title">Stats</h1></header>
      <section class="card card--empty" style="gap:18px">
        <div class="ghost-chart">${Charts.bars(ghost, { height: 120, aria: 'Exemple de graphe' })}</div>
        <div class="stack" style="gap:8px">
          <strong>Les graphes se dessinent avec le temps.</strong>
          <span class="small muted">Après 3 jours de relevés, tu verras tes moyennes, tes heures et tes déclencheurs. Pas besoin d'être précis : un tap par prise suffit.</span>
        </div>
      </section>
      <section class="card">
        <span class="small muted">Pour estimer tes dépenses</span>
        <span>Indique le prix d'une boîte de snus et d'une capsule de vape.</span>
        <a class="link link--mint" href="#/reglages" style="align-self:flex-start">Ouvrir les réglages</a>
      </section>
      <button type="button" class="btn btn--dashed" data-action="demo-ask">Essayer avec des données de démo</button>
    </div>`;
  },
  /* ---- Questionnaire de départ ---- */
  bienvenue() {
    if (!App.quiz) App.quiz = Quiz.fromProfile(Store.data.settings.profile, 0);
    const q = App.quiz;
    const step = Quiz.STEPS[q.step];
    if (step === 'intro') return Screens.quizIntro();
    const progress = Math.min(1, q.step / (Quiz.STEPS.length - 2));
    return `<div class="screen" style="min-height:calc(100dvh - var(--safe-top) - var(--safe-bottom) - 60px)">
      <header class="header">
        <button type="button" class="icon-btn icon-btn--ghost" data-action="quiz-back" aria-label="Question précédente">${Icon.prev}</button>
        <div class="progress" style="flex:1;margin:0 12px" role="progressbar" aria-valuenow="${Math.round(progress * 100)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${progress * 100}%"></span></div>
        ${step === 'summary' ? '<span style="width:48px"></span>' : '<button type="button" class="link" data-action="quiz-skip">Passer</button>'}
      </header>
      ${Screens['quiz_' + step](q.a)}
    </div>`;
  },

  quizIntro() {
    return `<div class="screen" style="min-height:calc(100dvh - var(--safe-top) - var(--safe-bottom) - 60px)">
      <header class="header"><span class="wordmark">STASE</span></header>
      <section class="stack" style="gap:14px;padding-top:24px">
        <h1 class="title title--soft">Observer, puis arrêter. À ton rythme.</h1>
        <p class="muted">Quatre questions, une minute. STASE s'en sert pour te montrer les bénéfices de l'arrêt qui te concernent vraiment.</p>
        <p class="small faint">Tes réponses restent sur ce téléphone. Tu pourras les changer dans les Réglages.</p>
      </section>
      <div class="stack" style="gap:6px;margin-top:auto">
        <button type="button" class="btn btn--primary btn--block" data-action="quiz-next">Commencer</button>
        <button type="button" class="link" data-action="quiz-later" style="align-self:center">Plus tard</button>
      </div>
    </div>`;
  },

  /** Bouton d'option du questionnaire (choix simple ou multiple). */
  option(q, value, label, selected, sub) {
    return `<button type="button" class="option" data-action="quiz-pick" data-q="${q}" data-value="${value}" aria-pressed="${selected}">
      <span class="stack" style="gap:2px"><span>${Util.esc(label)}</span>${sub ? `<span class="tiny faint">${Util.esc(sub)}</span>` : ''}</span>
      <span class="option__check">${selected ? Icon.check : ''}</span></button>`;
  },

  quizQuestion(title, sub, options, canContinue = true) {
    return `<section class="stack" style="gap:8px"><h1 class="title" style="font-size:26px">${title}</h1>${sub ? `<p class="small muted">${sub}</p>` : ''}</section>
      <div class="stack" style="gap:8px">${options}</div>
      <button type="button" class="btn btn--primary btn--block" data-action="quiz-next" style="margin-top:auto" ${canContinue ? '' : 'disabled'}>Continuer</button>`;
  },

  quiz_uses(a) {
    return Screens.quizQuestion('Qu’est-ce que tu prends ?', '',
      [['snus', 'Du snus'], ['vape', 'De la vape'], ['both', 'Les deux']].map(([v, l]) => Screens.option('uses', v, l, a.uses === v)).join(''), !!a.uses);
  },

  quiz_goals(a) {
    return Screens.quizQuestion('Qu’est-ce qui compte le plus pour toi ?', 'Choisis tout ce qui te parle.',
      GOALS.map((g) => Screens.option('goals', g.key, g.label, a.goals.includes(g.key))).join(''));
  },

  quiz_concerns(a) {
    return Screens.quizQuestion('Est-ce que l’un de ces points te concerne ?',
      'Facultatif. STASE s’en sert seulement pour adapter les bénéfices affichés. Ce n’est pas un bilan médical.',
      Calc.concernsFor(a.uses).map((c) => Screens.option('concerns', c.key, c.label, a.concerns.includes(c.key))).join(''));
  },

  quiz_firstUse(a) {
    return Screens.quizQuestion('Après le réveil, ta première prise arrive…', 'Un bon indicateur de la force de l’habitude.',
      FIRST_USE.map(([v, l]) => Screens.option('firstUse', v, l, a.firstUse === v)).join(''), !!a.firstUse);
  },

  quiz_summary(a) {
    const profile = { ...a, done: true };
    const cards = Screens.benefitCards(profile);
    return `<section class="stack" style="gap:8px"><h1 class="title" style="font-size:26px">Ce que l'arrêt peut t'apporter</h1>
        <p class="small muted">Des tendances générales, adaptées à tes réponses. Tu les retrouveras dans l'onglet Corps.</p></section>
      ${Screens.firstUseInsight(a.firstUse)}
      ${cards || '<div class="card card--outline"><p class="small">Arrêter la nicotine, c’est moins de stimulant pour le cœur, un sommeil et une humeur souvent plus stables après quelques semaines, et de l’argent qui reste dans ta poche.</p></div>'}
      <button type="button" class="btn btn--primary btn--block" data-action="quiz-finish">C'est parti</button>`;
  },

  firstUseInsight(firstUse) {
    const text = {
      lt5: 'Ta première prise arrive très vite après le réveil : c’est souvent le signe d’une dépendance marquée, pas d’un manque de volonté. Le matin sera le moment à préparer (eau fraîche, douche, sortir prendre l’air), et le minuteur « J’ai une envie » est là pour ça.',
      lt30: 'Ta première prise arrive vite après le réveil : le matin est un moment clé. Prépare un petit rituel de remplacement (eau fraîche, douche, quelques pas dehors).',
      lt60: 'Ta première prise vient dans l’heure : le matin compte, mais tu as de la marge pour t’organiser.',
      gt60: 'Ta première prise vient tard dans la matinée : la dépendance du matin semble modérée, c’est un bon point de départ.'
    }[firstUse];
    return text ? `<section class="card card--outline" style="gap:6px"><span class="label">Ton matin</span><p class="small" style="line-height:1.55">${text}</p></section>` : '';
  },

  /** Cartes de bénéfices : points de santé cochés, puis motivations. */
  /** compact = repliable (Corps) ; sinon texte complet (récapitulatif du questionnaire). */
  benefitCards(profile, compact = false) {
    const st = Store.data.settings;
    const concerns = profile.concerns.map((k) => CONCERN_BY_KEY[k]).filter(Boolean);
    Screens.compactCards = compact;
    const cards = concerns.map((c) => Screens.benefitCard(c.title, c.text, Screens.trackLine(c.track, st), c.note))
      .concat(profile.goals.map((g) => Screens.goalCard(g, st)));
    Screens.compactCards = false;
    return cards.join('');
  },

  benefitCard(title, text, extra = '', note = '') {
    if (Screens.compactCards) {
      const parts = text.split(/(?<=\.)\s/);
      const lead = parts.shift();
      const rest = parts.join(' ');
      if (!rest && !note) {
        return `<article class="card benefit"><span class="label" style="color:var(--mint)">${Util.esc(title)}</span>
          <p style="font-size:15px;line-height:1.55">${Util.esc(lead)}</p>${extra}</article>`;
      }
      return `<details class="card benefit">
        <summary><span class="label" style="color:var(--mint)">${Util.esc(title)}</span>
          <span style="font-size:15px;line-height:1.55">${Util.esc(lead)}</span>
          <span class="benefit__more small">Lire la suite</span>
          ${extra}</summary>
        ${rest ? `<p style="font-size:15px;line-height:1.55">${Util.esc(rest)}</p>` : ''}
        ${note ? `<p class="tiny faint">${Util.esc(note)}</p>` : ''}
      </details>`;
    }
    return `<article class="card benefit">
      <span class="label" style="color:var(--mint)">${Util.esc(title)}</span>
      <p style="font-size:15px;line-height:1.55">${Util.esc(text)}</p>
      ${extra}
      ${note ? `<p class="tiny faint">${Util.esc(note)}</p>` : ''}
    </article>`;
  },

  goalCard(key, st) {
    const intakes = Store.data.intakes;
    if (key === 'argent') {
      const y = Calc.yearlyCost(st, intakes);
      return Screens.benefitCard('Ton argent', y !== null
        ? `Au rythme ${st.phase === 'arret' ? 'd’avant l’arrêt' : 'actuel'}, la nicotine coûte environ ${Util.formatMoney(y, 0)} par an.${st.phase === 'arret' ? ' Le compteur « Économisé » le montre jour après jour.' : ''}`
        : 'Renseigne le prix du snus et de la vape dans les Réglages pour voir combien ça représente sur un an.');
    }
    if (key === 'liberte') {
      const r = Calc.dailyRate(st, intakes);
      const lead = r ? `Environ ${Util.formatNum(r, 0)} prises par jour, soit une toutes les ${Util.formatNum(16 / Math.max(r, 1), 1)} h de journée. ` : '';
      return Screens.benefitCard('Liberté', `${lead}Sans nicotine : plus besoin d’en avoir sur soi, de prévoir la prochaine, ni de s’éclipser.`);
    }
    const text = {
      sante: 'La nicotine est un stimulant qui sollicite le cœur et les vaisseaux plusieurs fois par jour. L’arrêter retire cette charge répétée, et c’est utile à tout âge.',
      sport: 'Un cœur qui ne s’emballe plus au repos, et côté vape un souffle souvent plus libre. Beaucoup retrouvent une énergie plus stable après les premières semaines.',
      proches: 'Plus de pauses à part, plus de portions ou de vapoteuse qui traînent. Et un exemple qui compte pour celles et ceux qui t’entourent.'
    }[key];
    const title = { sante: 'Santé', sport: 'Sport et énergie', proches: 'Tes proches' }[key];
    return text ? Screens.benefitCard(title, text) : '';
  },

  /** Ligne « ce que STASE mesure pour toi » sous un bénéfice. */
  trackLine(track, st) {
    if (!track) return '';
    const meta = {
      hr: { name: 'Ta fréquence cardiaque au repos', ask: 'ta fréquence cardiaque', better: 'down', fmt: (v) => `${Math.round(v)} bpm`, eps: 2 },
      sleep: { name: 'Ton sommeil', ask: 'ton sommeil', better: 'up', fmt: (v) => `${Util.formatNum(v, 1)}/5`, eps: 0.3 },
      anxiety: { name: 'Ton anxiété', ask: 'ton anxiété', better: 'down', fmt: (v) => `${Util.formatNum(v, 1)}/5`, eps: 0.3 },
      energy: { name: 'Ton énergie', ask: 'ton énergie', better: 'up', fmt: (v) => `${Util.formatNum(v, 1)}/5`, eps: 0.3 }
    }[track];
    const t = Calc.metricTrend(Store.data.checkins, track, st.phase === 'arret' ? st.quitStart : null);
    if (t && 'before' in t) {
      const diff = t.after - t.before;
      const good = Math.abs(diff) >= meta.eps && (meta.better === 'up' ? diff > 0 : diff < 0);
      return `<p class="trend${good ? ' is-good' : ''}">${meta.name} : ${meta.fmt(t.before)} avant → ${meta.fmt(t.after)} depuis l'arrêt</p>`;
    }
    if (t) {
      return `<p class="trend">${meta.name} en ce moment : ${meta.fmt(t.current)} en moyenne sur ${t.n} soirs. STASE comparera avant et après l'arrêt.</p>`;
    }
    return `<p class="trend"><a class="link--mint" href="#/checkin">Note ${meta.ask} au check-in du soir</a> : l'évolution s'affichera ici.</p>`;
  },

  /** Section « Pour toi » (Corps) ou invitation au questionnaire. */
  forYou(title) {
    const pr = Store.data.settings.profile;
    const cards = pr.done ? Screens.benefitCards(pr, true) : '';
    if (cards) return `<section class="stack" style="gap:12px"><h2 class="label">${title}</h2>${cards}
      <a class="link" href="#/bienvenue" data-action="quiz-start" style="align-self:center">Modifier mes réponses</a></section>`;
    return `<a class="card card--outline" href="#/bienvenue" data-action="quiz-start" style="text-decoration:none;color:inherit;gap:6px">
      <strong>Personnalise tes bénéfices</strong>
      <span class="small muted">Quatre questions (tension, stress, sommeil…) pour voir ce que l'arrêt peut t'apporter, à toi.</span></a>`;
  },

  /** Corps — frise verticale des jalons. */
  corps() {
    const st = Store.data.settings;
    const list = Calc.visibleMilestones(st, Store.data.intakes);
    if (st.phase !== 'arret') return Screens.corpsObservation(list);
    const streak = Calc.streaks(Store.data.intakes, st.quitStart, Date.now());
    const states = Calc.milestoneStates(streak.current, list);
    const next = Calc.nextMilestone(streak.current, list);
    const hadIntake = streak.lastTs > st.quitStart;
    return `<div class="screen">
      <header class="stack" style="gap:6px"><h1 class="title">Corps</h1>
        <span class="small muted">Ce qui change depuis ta ${hadIntake ? 'dernière prise' : 'dernière prise, au début de l’arrêt'}, il y a ${Screens.durationShort(streak.current)}.</span></header>
      ${next ? `<section class="card card--featured" style="gap:12px">
        <span class="label" style="color:var(--mint)">Prochain repère</span>
        <div class="row" style="align-items:baseline"><span class="value">${next.title}</span><span class="small muted">dans ${Screens.durationShort(next.remainingMs)}</span></div>
        <p style="font-size:15px;line-height:1.5">${Util.esc(next.text)}</p>
        <div class="progress"><span style="width:${(next.progress * 100).toFixed(1)}%"></span></div>
      </section>` : `<section class="card card--featured" style="gap:8px">
        <span class="label" style="color:var(--mint)">Tous les repères sont passés</span>
        <p style="font-size:15px;line-height:1.5">Il n'y a plus d'étape à attendre : la suite, c'est ta vie sans nicotine.</p>
      </section>`}
      ${Screens.forYou('Pour toi')}
      <h2 class="label">Repères</h2>
      ${Screens.timeline(states)}
      ${hadIntake ? '<p class="small muted">Les repères repartent de ta dernière prise, mais ton total de jours sans nicotine reste dans Stats.</p>' : ''}
      <p class="tiny faint">Repères généraux pour le snus et la vape, variables d'une personne à l'autre. Ce n'est pas un avis médical : en cas de doute, parles-en à un professionnel de santé.</p>
    </div>`;
  },

  /** Frise : nœud + trait à gauche, texte à droite. */
  timeline(states) {
    return `<ol class="timeline" aria-label="Repères">${states.map((m, i) => {
      const last = i === states.length - 1;
      const lineOn = !last && states[i + 1].state === 'done';
      const tag = m.state === 'done' ? 'atteint' : m.state === 'next' ? 'en cours' : '';
      const forMe = Calc.isForMe(m, Store.data.settings.profile.concerns);
      return `<li class="tl tl--${m.state}">
        <div class="tl__rail"><span class="tl__node">${m.state === 'done' ? Icon.check : ''}</span>${last ? '' : `<span class="tl__line${lineOn ? ' is-on' : ''}"></span>`}</div>
        <div class="tl__body">
          <span class="tl__title">${m.title}${tag ? ` <span class="tl__tag">${tag}</span>` : ''}${m.tag === 'snus' ? ' <span class="tl__tag">snus</span>' : ''}${forMe ? ' <span class="tl__tag tl__tag--me">pour toi</span>' : ''}</span>
          <span class="tl__text">${Util.esc(m.text)}</span>
        </div>
      </li>`;
    }).join('')}</ol>`;
  },

  /** Corps en phase observation : aperçu grisé et invitation, sans pression. */
  corpsObservation(list) {
    return `<div class="screen">
      <header class="stack" style="gap:6px"><h1 class="title">Corps</h1>
        <span class="small muted">La frise démarre le jour où tu passes en mode arrêt.</span></header>
      <section class="card card--empty" style="gap:12px">
        <strong>Rien ne presse.</strong>
        <span class="small muted">Observer d'abord aide à connaître tes moments. Quand tu seras prêt, tu verras ici ce qui change, heure après heure, puis semaine après semaine.</span>
        <button type="button" class="btn btn--surface" data-action="phase-ask" data-value="arret" style="align-self:flex-start">Passer en mode arrêt</button>
      </section>
      ${Screens.forYou('Ce que l’arrêt peut t’apporter')}
      <h2 class="label">Repères après l'arrêt</h2>
      ${Screens.timeline(list.map((m) => ({ ...m, state: 'future' })))}
      <p class="tiny faint">Repères généraux pour le snus et la vape, variables d'une personne à l'autre. Ce n'est pas un avis médical : en cas de doute, parles-en à un professionnel de santé.</p>
    </div>`;
  },
  /** Check-in du soir : 4 échelles + FC facultative, puis récapitulatif. */
  checkin() {
    const day = Calc.checkinDayFor(Date.now());
    const isToday = day === Dates.todayKey();
    const existing = Store.data.checkins.find((c) => c.date === day);
    const editing = App.checkinDraft && App.checkinDraft.date === day;
    const title = isToday ? 'Ce soir' : 'Hier soir';
    const sub = isToday ? 'Quatre touches, vingt secondes.' : `Check-in du ${Dates.formatDayLong(Dates.keyToStart(day)).toLowerCase()}.`;
    return `<div class="screen">
      <header class="stack" style="gap:6px"><h1 class="title">${title}</h1><span class="small muted">${Util.esc(sub)}</span></header>
      ${existing && !editing ? Screens.checkinDone(existing) : Screens.checkinForm(day, existing)}
      ${Screens.correlationCard()}
    </div>`;
  },

  checkinForm(day, existing) {
    if (!App.checkinDraft || App.checkinDraft.date !== day) {
      App.checkinDraft = existing ? { ...existing, hr: existing.hr ?? '' } : { date: day, sleep: null, energy: null, mood: null, anxiety: null, hr: '' };
    }
    const d = App.checkinDraft;
    const complete = CHECKIN_METRICS.every((m) => d[m.key]);
    return `${CHECKIN_METRICS.map((m) => `
      <div class="stack" role="group" aria-label="${m.label}" style="gap:8px">
        <div class="row" style="align-items:baseline"><span style="font-size:15px;font-weight:700">${m.label}</span>
          <span class="tiny faint">${m.lo} → ${m.hi}</span></div>
        <div class="grid-5">${[1, 2, 3, 4, 5].map((n) =>
          `<button type="button" class="scale-btn" style="height:48px" data-action="ci-pick" data-key="${m.key}" data-value="${n}"
            aria-pressed="${d[m.key] === n}" aria-label="${m.label} ${n} sur 5">${n}</button>`).join('')}</div>
      </div>`).join('')}
      <label class="stack" style="gap:8px">
        <span style="font-size:15px;font-weight:700">Fréquence cardiaque au repos <span class="faint" style="font-weight:500">· ${Store.data.settings.profile.concerns.some((c) => c === 'tension' || c === 'palpitations') ? 'utile pour suivre ton cœur' : 'facultatif'}</span></span>
        <span class="field__box" style="width:100%"><input type="text" inputmode="numeric" data-ci="hr" placeholder="—"
          value="${Util.esc(d.hr ?? '')}" style="text-align:left" autocomplete="off"><span class="field__unit">bpm</span></span>
      </label>
      <button type="button" class="btn btn--primary btn--block" data-action="ci-submit" ${complete ? '' : 'disabled'}>Valider</button>`;
  },

  checkinDone(c) {
    const items = CHECKIN_METRICS.map((m) => `<span>${m.label} <strong class="num">${c[m.key]}</strong></span>`).join('<span class="faint">·</span>');
    return `<section class="card" style="gap:10px;padding:24px 22px">
      <span class="done-mark">${Icon.check}</span>
      <span class="value" style="font-size:22px;font-weight:600">Noté. Bonne soirée.</span>
      <p class="small muted" style="display:flex;flex-wrap:wrap;gap:6px">${items}${c.hr ? `<span class="faint">·</span><span>FC <strong class="num">${c.hr}</strong> bpm</span>` : ''}</p>
      <button type="button" class="link link--mint" data-action="ci-edit" style="align-self:flex-start">Modifier</button>
    </section>`;
  },

  /** Carte de corrélation (Check-in et Stats). */
  correlationCard() {
    const r = Calc.correlation(Store.data.intakes, Store.data.checkins);
    const head = '<span class="small muted">Ton corps et ta consommation</span>';
    if (!r.enough) {
      const left = CORRELATION_MIN_DAYS - r.days;
      return `<section class="card card--outline" style="gap:8px">${head}
        <p class="small">Pas encore assez de données : ${r.days} jour${r.days > 1 ? 's' : ''} avec check-in sur ${CORRELATION_MIN_DAYS}.
        Encore ${left} soir${left > 1 ? 's' : ''} et STASE pourra comparer ton sommeil, ton humeur et ton anxiété selon tes jours plus ou moins chargés.</p>
      </section>`;
    }
    if (r.flat) {
      return `<section class="card card--outline" style="gap:8px">${head}
        <p class="small">Ta consommation est la même presque tous les jours sur la période : impossible de comparer pour l'instant.</p></section>`;
    }
    const fmt = (v) => (v === null ? '—' : Util.formatNum(v, 1));
    return `<section class="card" style="gap:14px">${head}
      <div class="corr">
        <span></span><span class="tiny faint">Jours légers<br>≈ ${fmt(r.low.intakes)} prises</span><span class="tiny faint">Jours chargés<br>≈ ${fmt(r.high.intakes)} prises</span>
        ${r.metrics.map((m) => `<span>${m.label}<br><span class="tiny faint">${Calc.describeDiff(m)}</span></span>
          <span class="num">${fmt(m.low)}</span><span class="num">${fmt(m.high)}</span>`).join('')}
      </div>
      <p class="tiny faint">Moyennes sur 5, à partir de ${r.days} jours (${r.low.days} légers, ${r.high.days} chargés). C'est une tendance, pas une preuve : le lien peut aller dans les deux sens, une mauvaise nuit peut aussi donner plus envie.</p>
    </section>`;
  },

  reglages() {
    const s = Store.data.settings;
    const n = Store.data.intakes.length;
    const unit = s.vapeFormat === 'flacon' ? 'flacon' : 'capsule';
    return `<div class="screen">
      <h1 class="title">Réglages</h1>

      <section class="stack">
        <h2 class="label">Apparence</h2>
        ${Screens.segmented('theme', [['dark', 'Sombre'], ['light', 'Clair']], s.theme, 'Thème')}
      </section>

      ${Screens.modeSection(s)}

      <section class="stack">
        <h2 class="label">Profil</h2>
        <div class="group"><div class="field">
          <span class="field__label"><span>Questionnaire</span><span class="tiny faint">${Screens.profileSummary(s.profile)}</span></span>
          <a class="link link--mint" href="#/bienvenue" data-action="quiz-start">${s.profile.done ? 'Refaire' : 'Répondre'}</a>
        </div></div>
      </section>

      <section class="stack">
        <h2 class="label">Relevé</h2>
        <div class="group">
          ${Screens.toggle('askContext', 'Demander le contexte', 'Après « + Snus » ou « + Vape », ouvrir le choix du déclencheur', s.askContext)}
        </div>
      </section>

      <section class="stack">
        <h2 class="label">Snus</h2>
        <div class="group">
          ${Screens.field('snusBoxPrice', 'Prix d’une boîte', s.snusBoxPrice, '€', 'decimal')}
          ${Screens.field('snusPerBox', 'Portions par boîte', s.snusPerBox, '', 'numeric')}
          ${Screens.field('snusMg', 'Force par portion', s.snusMg, 'mg', 'decimal')}
        </div>
      </section>

      <section class="stack">
        <h2 class="label">Vape</h2>
        ${Screens.segmented('vapeFormat', [['capsule', 'Capsule'], ['flacon', 'Flacon']], s.vapeFormat, 'Format')}
        <div class="group">
          ${Screens.field('vapeUnitPrice', `Prix d’${unit === 'flacon' ? 'un flacon' : 'une capsule'}`, s.vapeUnitPrice, '€', 'decimal')}
          ${Screens.field('vapeSessionsPerUnit', `Sessions par ${unit}`, s.vapeSessionsPerUnit, '', 'numeric', 'Une session = une prise notée « + Vape »')}
        </div>
      </section>

      <section class="stack">
        <h2 class="label">Données</h2>
        <div class="grid-2">
          <button type="button" class="btn btn--surface" data-action="export">Exporter</button>
          <button type="button" class="btn btn--surface" data-action="import">Importer</button>
        </div>
        <button type="button" class="btn btn--dashed" data-action="demo-ask">Charger des données de démo</button>
        <p class="tiny faint">${Screens.backupHint(s.lastExportAt, n)}</p>
        <p class="tiny faint">Tout reste sur ce téléphone. iOS peut effacer les données d'une web app peu utilisée : exporte de temps en temps.</p>
      </section>

      <p class="tiny faint" style="text-align:center">STASE ${APP_VERSION}</p>
    </div>`;
  },

  profileSummary(p) {
    if (!p.done) return 'Pas encore rempli';
    const uses = { snus: 'Snus', vape: 'Vape', both: 'Snus et vape' }[p.uses] || 'Usage non précisé';
    const parts = [uses];
    if (p.goals.length) parts.push(`${p.goals.length} motivation${p.goals.length > 1 ? 's' : ''}`);
    if (p.concerns.length) parts.push(`${p.concerns.length} point${p.concerns.length > 1 ? 's' : ''} suivi${p.concerns.length > 1 ? 's' : ''}`);
    return parts.join(' · ');
  },

  /** Réglages > Mode : observation / arrêt, référence, réduction progressive. */
  modeSection(s) {
    const arret = s.phase === 'arret';
    const b = s.baseline;
    const red = s.reduction;
    const target = Calc.reductionTarget(red, Dates.todayKey());
    return `<section class="stack">
      <h2 class="label">Mode</h2>
      <div class="segmented" role="group" aria-label="Mode">
        <button type="button" data-action="phase-ask" data-value="observation" aria-pressed="${!arret}">Observation</button>
        <button type="button" data-action="phase-ask" data-value="arret" aria-pressed="${arret}">Arrêt</button>
      </div>
      <p class="small muted">${arret
        ? 'Le compteur part de ta dernière prise. Les stats montrent tes jours sans nicotine, tes envies et tes économies.'
        : 'Tu notes sans objectif. Passe en arrêt quand tu te sens prêt : ta moyenne réelle servira de référence.'}</p>
      ${arret ? `<div class="group">
        <div class="field"><span class="field__label">Début de l'arrêt</span><span class="muted small">${Util.esc(Dates.formatDayShort(s.quitStart))}, ${Dates.formatTime(s.quitStart)}</span></div>
        <div class="field"><span class="field__label"><span>Référence</span><span class="tiny faint">${b ? `${Util.formatNum(b.snusPerDay, 1)} snus · ${Util.formatNum(b.vapePerDay, 1)} vape par jour${b.days ? ` (${b.days} j d'observation)` : ''}` : 'non renseignée'}</span></span>
          <button type="button" class="link link--mint" data-action="baseline-edit">Modifier</button></div>
      </div>` : `<div class="group">
        ${Screens.toggleRow('reduction-toggle', 'Réduction progressive', 'Baisser doucement avant d’arrêter', red.on)}
        ${red.on ? `<div class="field"><span class="field__label"><span>Baisse par semaine</span><span class="tiny faint">Cible du jour : ${target} (départ ${Util.formatNum(red.base, 1)})</span></span>
          <div class="segmented" style="width:168px" role="group" aria-label="Baisse par semaine">${[[0.5, '0,5'], [1, '1'], [2, '2']].map(([v, l]) =>
            `<button type="button" data-action="reduction-step" data-value="${v}" aria-pressed="${red.weeklyStep === v}">${l}</button>`).join('')}</div></div>` : ''}
      </div>`}
    </section>`;
  },

  /** Ligne avec interrupteur relié à une action. */
  toggleRow(action, label, hint, on) {
    return `<div class="field">
      <span class="field__label"><span>${Util.esc(label)}</span>${hint ? `<span class="tiny faint">${Util.esc(hint)}</span>` : ''}</span>
      <button type="button" class="switch" role="switch" aria-checked="${!!on}" aria-label="${Util.esc(label)}" data-action="${action}"></button>
    </div>`;
  },

  backupHint(lastExportAt, count) {
    if (!lastExportAt) return count ? 'Aucune sauvegarde exportée pour l’instant.' : 'Rien à sauvegarder pour l’instant.';
    return `Dernier export : ${Util.esc(Dates.formatDayLong(lastExportAt))}.`;
  },

  /** Champ numérique de réglage (virgule acceptée). */
  field(key, label, value, unit, mode, hint) {
    const shown = value === null || value === undefined ? '' : Util.formatNum(value);
    return `<label class="field">
      <span class="field__label">${Util.esc(label)}${hint ? `<span class="tiny faint">${Util.esc(hint)}</span>` : ''}</span>
      <span class="field__box"><input type="text" inputmode="${mode}" data-setting="${key}" value="${Util.esc(shown)}" autocomplete="off">
      ${unit ? `<span class="field__unit">${unit}</span>` : ''}</span>
    </label>`;
  },

  /** Ligne avec interrupteur lié à un réglage booléen. */
  toggle(key, label, hint, on) {
    return `<div class="field">
      <span class="field__label"><span>${Util.esc(label)}</span>${hint ? `<span class="tiny faint">${Util.esc(hint)}</span>` : ''}</span>
      <button type="button" class="switch" role="switch" aria-checked="${!!on}" aria-label="${Util.esc(label)}" data-action="toggle-setting" data-key="${key}"></button>
    </div>`;
  },

  /** Contrôle segmenté lié à un réglage. */
  segmented(key, options, current, label, action = 'set-setting') {
    return `<div class="segmented" role="group" aria-label="${Util.esc(label)}">${options.map(([value, text]) =>
      `<button type="button" data-action="${action}" data-key="${key}" data-value="${value}" aria-pressed="${value === current}">${text}</button>`
    ).join('')}</div>`;
  }
};

/* =========================================================================
   Feuille « prise » — trois modes :
   - context : juste après « + Snus / + Vape » (la prise est déjà enregistrée)
   - edit    : modifier ou supprimer une prise existante
   - new     : ajouter une prise oubliée, avec son heure
   L'état en cours d'édition vit dans UI.sheetState jusqu'à « Enregistrer ».
   ========================================================================= */
const IntakeSheet = {
  open(state) {
    UI.sheetState = state;
    UI.openSheet(IntakeSheet.html(state), 'Prise');
  },
  refresh() { UI.updateSheet(IntakeSheet.html(UI.sheetState)); },

  /** Ouvre la feuille d'une prise existante. */
  openFor(id, mode) {
    const x = Intakes.find(id);
    if (!x) return;
    IntakeSheet.open({ mode, id, type: x.type, ts: x.ts, trigger: x.trigger, intensity: x.intensity, confirmDelete: false });
  },

  html(st) {
    if (st.confirmDelete) return IntakeSheet.confirmHtml(st);
    const title = {
      context: `Prise de ${Dates.formatTime(st.ts)} · ${st.type === 'snus' ? 'Snus' : 'Vape'}`,
      edit: 'Modifier la prise',
      new: 'Ajouter une prise'
    }[st.mode];
    return `
      <div class="stack" style="gap:6px">
        <h2 class="title" style="font-size:22px">${title}</h2>
        ${st.mode === 'context' ? '<p class="small muted">Facultatif. Ça aide à repérer tes moments.</p>' : ''}
      </div>
      ${st.mode === 'context' ? '' : IntakeSheet.whenHtml(st)}
      ${IntakeSheet.triggersHtml(st.trigger)}
      ${IntakeSheet.intensityHtml(st.intensity)}
      ${IntakeSheet.buttonsHtml(st)}`;
  },

  whenHtml(st) {
    return `${Screens.segmented('', [['snus', 'Snus'], ['vape', 'Vape']], st.type, 'Type', 'sheet-type')}
      <label class="stack">
        <span class="label">Date et heure</span>
        <span class="field__box" style="width:100%"><input type="datetime-local" data-sheet="ts"
          value="${Dates.toInputValue(st.ts)}" max="${Dates.toInputValue(Date.now())}" style="text-align:left"></span>
      </label>`;
  },

  triggersHtml(current) {
    return `<div class="stack">
      <span class="label">Déclencheur</span>
      <div class="grid-3">${TRIGGERS.map(([k, label]) =>
        `<button type="button" class="chip" data-action="sheet-trigger" data-value="${k}" aria-pressed="${current === k}">${label}</button>`).join('')}</div>
    </div>`;
  },

  intensityHtml(current) {
    return `<div class="stack">
      <span class="label">Intensité de l'envie</span>
      <div class="grid-5 scale--warm">${[1, 2, 3, 4, 5].map((n) =>
        `<button type="button" class="scale-btn" data-action="sheet-intensity" data-value="${n}" aria-pressed="${current === n}" aria-label="Intensité ${n} sur 5">${n}</button>`).join('')}</div>
      <div class="row tiny faint"><span>légère</span><span>forte</span></div>
    </div>`;
  },

  buttonsHtml(st) {
    if (st.mode === 'context') {
      return `<div class="grid-2">
          <button type="button" class="btn" data-action="close-sheet">Plus tard</button>
          <button type="button" class="btn btn--primary" data-action="sheet-save">Enregistrer</button>
        </div>
        <button type="button" class="link" data-action="sheet-undo" style="align-self:center;margin-top:-12px">Annuler cette prise</button>`;
    }
    if (st.mode === 'edit') {
      return `<div class="grid-2">
          <button type="button" class="btn" data-action="sheet-ask-delete">Supprimer</button>
          <button type="button" class="btn btn--primary" data-action="sheet-save">Enregistrer</button>
        </div>`;
    }
    return `<div class="grid-2">
        <button type="button" class="btn" data-action="close-sheet">Fermer</button>
        <button type="button" class="btn btn--primary" data-action="sheet-save">Ajouter</button>
      </div>`;
  },

  confirmHtml(st) {
    return `<h2 class="title" style="font-size:22px">Supprimer cette prise ?</h2>
      <p class="muted small">${st.type === 'snus' ? 'Snus' : 'Vape'} du ${Util.esc(Dates.formatDayShort(st.ts))} à ${Dates.formatTime(st.ts)}.</p>
      <div class="grid-2">
        <button type="button" class="btn" data-action="sheet-cancel-delete">Garder</button>
        <button type="button" class="btn btn--surface" data-action="sheet-delete">Supprimer</button>
      </div>`;
  },

  /** Enregistre l'état de la feuille dans les données. */
  save() {
    const st = UI.sheetState;
    if (!st) return;
    if (!Intakes.isValidTs(st.ts)) { UI.toast('Cette heure est dans le futur.'); return; }
    if (st.mode === 'new') {
      Intakes.add(st.type, st.ts, st.trigger, st.intensity);
      App.viewDay = Dates.dayKey(st.ts) === Dates.todayKey() ? null : Dates.dayKey(st.ts);
      UI.toast(`Prise ajoutée : ${Dates.formatDayShort(st.ts)}, ${Dates.formatTime(st.ts)}.`);
    } else {
      Intakes.edit(st.id, { type: st.type, ts: st.ts, trigger: st.trigger, intensity: st.intensity });
      if (st.mode === 'edit') UI.toast('Prise modifiée.');
    }
    UI.closeSheet();
    App.render();
  }
};

/* =========================================================================
   Quiz — questionnaire de départ (réponses gardées en mémoire jusqu'à la fin)
   ========================================================================= */
const Quiz = {
  STEPS: ['intro', 'uses', 'goals', 'concerns', 'firstUse', 'summary'],
  MULTI: ['goals', 'concerns'],

  fromProfile(p, step) {
    return { step, a: { uses: p.uses, goals: [...p.goals], concerns: [...p.concerns], firstUse: p.firstUse } };
  },

  pick(q, value) {
    const a = App.quiz.a;
    if (Quiz.MULTI.includes(q)) {
      a[q] = a[q].includes(value) ? a[q].filter((v) => v !== value) : a[q].concat(value);
    } else {
      a[q] = value;
      // Les points propres au snus ou à la vape suivent le choix d'usage.
      if (q === 'uses') a.concerns = a.concerns.filter((k) => Calc.concernsFor(value).some((c) => c.key === k));
    }
  },

  finish(saveAnswers = true) {
    const a = App.quiz ? App.quiz.a : {};
    Store.update((d) => {
      d.settings.profile = Store.cleanProfile(saveAnswers ? { ...a, done: true } : { ...d.settings.profile, done: true });
    });
    App.quiz = null;
    const back = App.quizReturn || '#/aujourdhui';
    App.quizReturn = null;
    location.hash = back;
  }
};

/* =========================================================================
   Feuilles de changement de mode et de référence
   ========================================================================= */
const PhaseSheet = {
  /** Champs « référence » (prises par jour), pré-remplis. */
  baselineFields(snus, vape) {
    const f = (key, label, v) => `<label class="field" style="padding:0"><span class="field__label">${label}</span>
      <span class="field__box"><input type="text" inputmode="decimal" data-sheet="${key}" value="${v === null ? '' : Util.formatNum(v, 1)}" autocomplete="off">
      <span class="field__unit">/ jour</span></span></label>`;
    return `<div class="group">${f('base-snus', 'Snus', snus)}${f('base-vape', 'Vape (sessions)', vape)}</div>`;
  },

  /** Lit les deux champs de référence ; null si invalide. */
  readBaseline() {
    const snus = Util.parseNum(document.querySelector('[data-sheet="base-snus"]').value);
    const vape = Util.parseNum(document.querySelector('[data-sheet="base-vape"]').value);
    if (snus === null || vape === null) { UI.toast('Indique un nombre par jour pour le snus et la vape (0 si tu n’en prends pas).'); return null; }
    if (snus + vape === 0) { UI.toast('La référence ne peut pas être nulle pour les deux.'); return null; }
    return { snusPerDay: snus, vapePerDay: vape };
  },

  openQuit() {
    const now = Date.now();
    const intakes = Store.data.intakes;
    const last = intakes.length ? intakes[intakes.length - 1].ts : null;
    const b = Calc.baseline(intakes, now);
    UI.sheetState = { kind: 'quit', from: last && now - last < 3 * DAY_MS ? 'last' : 'now', last, days: b ? b.days : 0 };
    UI.openSheet(PhaseSheet.quitHtml(b ? b.snusPerDay : null, b ? b.vapePerDay : null), 'Passer en mode arrêt');
  },

  quitHtml(snus, vape) {
    const st = UI.sheetState;
    const lastLabel = st.last ? `${Dates.dayKey(st.last) === Dates.todayKey() ? 'aujourd’hui' : Dates.formatDayShort(st.last)} à ${Dates.formatTime(st.last)}` : '';
    return `<h2 class="title" style="font-size:22px">Passer en mode arrêt</h2>
      ${st.last && Date.now() - st.last < 3 * DAY_MS ? `<div class="stack"><span class="label">Le compteur part de</span>
        <div class="segmented" role="group" aria-label="Début">
          <button type="button" data-action="quit-from" data-value="last" aria-pressed="${st.from === 'last'}">Dernière prise</button>
          <button type="button" data-action="quit-from" data-value="now" aria-pressed="${st.from === 'now'}">Maintenant</button>
        </div><span class="small faint">${st.from === 'last' ? `Ta dernière prise : ${lastLabel}.` : 'À partir de cet instant.'}</span></div>` : ''}
      <div class="stack"><span class="label">Ta référence</span>
        <span class="small muted">${st.days
          ? `Ta moyenne réelle sur ${st.days} jour${st.days > 1 ? 's' : ''} d'observation. Elle sert à calculer doses évitées et économies.`
          : 'Pas encore de jour complet d’observation : indique ta consommation habituelle.'}</span>
        ${PhaseSheet.baselineFields(snus, vape)}</div>
      <div class="grid-2">
        <button type="button" class="btn" data-action="close-sheet">Pas encore</button>
        <button type="button" class="btn btn--primary" data-action="quit-confirm">Commencer</button>
      </div>`;
  },

  openObservation() {
    UI.sheetState = { kind: 'obs' };
    UI.openSheet(`<h2 class="title" style="font-size:22px">Revenir en observation ?</h2>
      <p class="muted small">Toutes tes données restent. Le compteur d'arrêt s'arrête ; tu pourras repasser en arrêt quand tu voudras, avec une nouvelle référence.</p>
      <div class="grid-2"><button type="button" class="btn" data-action="close-sheet">Rester en arrêt</button>
        <button type="button" class="btn btn--primary" data-action="obs-confirm">Revenir</button></div>`, 'Revenir en observation');
  },

  openBaseline() {
    const b = Store.data.settings.baseline;
    const real = Calc.baseline(Store.data.intakes, Store.data.settings.quitStart);
    UI.sheetState = { kind: 'baseline' };
    UI.openSheet(`<h2 class="title" style="font-size:22px">Référence</h2>
      <p class="muted small">Prises par jour avant l'arrêt.${real ? ` Moyenne réelle mesurée : ${Util.formatNum(real.snusPerDay, 1)} snus et ${Util.formatNum(real.vapePerDay, 1)} vape (${real.days} j).` : ''}</p>
      ${PhaseSheet.baselineFields(b ? b.snusPerDay : null, b ? b.vapePerDay : null)}
      ${real ? '<button type="button" class="link link--mint" data-action="baseline-real" style="align-self:flex-start">Reprendre la moyenne mesurée</button>' : ''}
      <div class="grid-2"><button type="button" class="btn" data-action="close-sheet">Annuler</button>
        <button type="button" class="btn btn--primary" data-action="baseline-save">Enregistrer</button></div>`, 'Référence');
  }
};

/* =========================================================================
   Actions — reliées aux éléments via data-action
   ========================================================================= */
const Actions = {
  'close-sheet'() { UI.closeSheet(); },

  /* ---- Relevé ---- */
  'add-intake'(el) {
    const type = el.dataset.type;
    const id = Intakes.add(type, Date.now());
    App.render();
    if (Store.data.settings.askContext) {
      IntakeSheet.openFor(id, 'context');
    } else {
      UI.toast(`${type === 'snus' ? 'Snus' : 'Vape'} noté à ${Dates.formatTime(Date.now())}.`, 'Annuler', () => {
        Intakes.remove(id); App.render(); UI.toast('Prise annulée.');
      }, 6000);
    }
  },
  'open-intake'(el) { IntakeSheet.openFor(el.dataset.id, 'edit'); },
  'new-intake'() {
    const today = Dates.todayKey();
    // Pour un jour passé, on propose midi ce jour-là ; sinon maintenant.
    const ts = App.viewDay && App.viewDay !== today ? Dates.keyToStart(App.viewDay) + 12 * 3600000 : Date.now();
    IntakeSheet.open({ mode: 'new', id: null, type: 'snus', ts, trigger: null, intensity: null, confirmDelete: false });
  },
  'sheet-type'(el) { UI.sheetState.type = el.dataset.value; IntakeSheet.refresh(); },
  'sheet-trigger'(el) {
    const st = UI.sheetState;
    st.trigger = st.trigger === el.dataset.value ? null : el.dataset.value;
    IntakeSheet.refresh();
  },
  'sheet-intensity'(el) {
    const st = UI.sheetState;
    const n = Number(el.dataset.value);
    st.intensity = st.intensity === n ? null : n;
    IntakeSheet.refresh();
  },
  'sheet-save'() { IntakeSheet.save(); },
  'sheet-undo'() {
    Intakes.remove(UI.sheetState.id);
    UI.closeSheet();
    App.render();
    UI.toast('Prise annulée.');
  },
  'sheet-ask-delete'() { UI.sheetState.confirmDelete = true; IntakeSheet.refresh(); },
  'sheet-cancel-delete'() { UI.sheetState.confirmDelete = false; IntakeSheet.refresh(); },
  'sheet-delete'() {
    const removed = Intakes.find(UI.sheetState.id);
    Intakes.remove(UI.sheetState.id);
    UI.closeSheet();
    App.render();
    UI.toast('Prise supprimée.', 'Annuler', () => {
      Store.data.intakes.push(removed); Intakes.sort(); Store.save(); App.render();
    }, 6000);
  },

  /* ---- Navigation entre les jours ---- */
  'day-prev'() { App.viewDay = Dates.addDays(App.viewDay || Dates.todayKey(), -1); App.render(); },
  'day-next'() {
    const next = Dates.addDays(App.viewDay || Dates.todayKey(), 1);
    App.viewDay = Dates.diffDays(next, Dates.todayKey()) <= 0 ? null : next;
    App.render();
  },
  'toggle-setting'(el) {
    const key = el.dataset.key;
    Store.update((d) => { d.settings[key] = !d.settings[key]; });
  },

  'set-setting'(el) {
    Store.update((d) => { d.settings[el.dataset.key] = el.dataset.value; });
    if (el.dataset.key === 'theme') UI.applyTheme();
  },

  export() { Backup.exportFile(); },
  import() { document.getElementById('import-input').click(); },
  'confirm-import'() { Backup.applyPending(); },

  /* ---- Stats ---- */
  'stats-range'(el) { App.statsRange = Number(el.dataset.value); App.render(); },

  /* ---- Questionnaire ---- */
  'quiz-start'() {
    const from = App.route();
    App.quizReturn = from === 'bienvenue' ? '#/aujourdhui' : `#/${from}`;
    App.quiz = Quiz.fromProfile(Store.data.settings.profile, 1);
    if (location.hash === '#/bienvenue') App.render(); else location.hash = '#/bienvenue';
  },
  'quiz-next'() {
    App.quiz.step = Math.min(Quiz.STEPS.length - 1, App.quiz.step + 1);
    App.render();
    document.getElementById('view').scrollTop = 0;
  },
  'quiz-back'() {
    if (App.quiz.step <= 1) { Quiz.finish(false); return; }
    App.quiz.step -= 1;
    App.render();
  },
  'quiz-skip'() { Actions['quiz-next'](); },
  'quiz-pick'(el) { Quiz.pick(el.dataset.q, el.dataset.value); App.render(); },
  'quiz-later'() { Quiz.finish(false); },
  'quiz-finish'() { Quiz.finish(true); UI.toast('C’est noté. Tes bénéfices sont dans l’onglet Corps.'); },

  /* ---- Mode arrêt ---- */
  'phase-ask'(el) {
    const want = el.dataset.value, cur = Store.data.settings.phase;
    if (want === cur) return;
    if (want === 'arret') PhaseSheet.openQuit(); else PhaseSheet.openObservation();
  },
  'quit-from'(el) {
    const snus = document.querySelector('[data-sheet="base-snus"]').value;
    const vape = document.querySelector('[data-sheet="base-vape"]').value;
    UI.sheetState.from = el.dataset.value;
    UI.updateSheet(PhaseSheet.quitHtml(Util.parseNum(snus), Util.parseNum(vape)));
  },
  'quit-confirm'() {
    const base = PhaseSheet.readBaseline();
    if (!base) return;
    const st = UI.sheetState;
    const quitStart = st.from === 'last' && st.last ? st.last + 1 : Date.now();
    UI.closeSheet();
    Store.update((d) => {
      d.settings.phase = 'arret';
      d.settings.quitStart = quitStart;
      d.settings.baseline = { ...base, days: st.days };
      d.settings.reduction.on = false;
    });
    location.hash = '#/aujourdhui';
    UI.toast('C’est parti. Une journée à la fois.');
  },
  'obs-confirm'() {
    UI.closeSheet();
    Store.update((d) => { d.settings.phase = 'observation'; d.settings.quitStart = null; });
    UI.toast('Retour en observation. Tes données sont intactes.');
  },
  'baseline-edit'() { PhaseSheet.openBaseline(); },
  'baseline-real'() {
    const real = Calc.baseline(Store.data.intakes, Store.data.settings.quitStart);
    document.querySelector('[data-sheet="base-snus"]').value = Util.formatNum(real.snusPerDay, 1);
    document.querySelector('[data-sheet="base-vape"]').value = Util.formatNum(real.vapePerDay, 1);
  },
  'baseline-save'() {
    const base = PhaseSheet.readBaseline();
    if (!base) return;
    UI.closeSheet();
    Store.update((d) => { d.settings.baseline = { ...base, days: d.settings.baseline ? d.settings.baseline.days : 0 }; });
  },

  /* ---- Réduction progressive ---- */
  'reduction-toggle'() {
    const red = Store.data.settings.reduction;
    if (red.on) { Store.update((d) => { d.settings.reduction.on = false; }); return; }
    const avg = Calc.avgPerDay(Store.data.intakes, Dates.todayKey(), 7);
    if (!avg) { UI.toast('Il faut au moins un jour complet d’observation pour fixer le point de départ.'); return; }
    Store.update((d) => {
      Object.assign(d.settings.reduction, { on: true, startDate: Dates.todayKey(), base: Math.round(avg.total * 10) / 10 });
    });
  },
  'reduction-step'(el) { Store.update((d) => { d.settings.reduction.weeklyStep = Number(el.dataset.value); }); },

  /* ---- Après une prise en phase arrêt ---- */
  'relapse-type'(el) { App.relapseDraft.type = el.dataset.value; App.render(); },
  'relapse-trigger'(el) {
    const d = App.relapseDraft;
    d.trigger = d.trigger === el.dataset.value ? null : el.dataset.value;
    App.render();
  },
  'relapse-save'() {
    const d = App.relapseDraft;
    Intakes.add(d.type, Date.now(), d.trigger, d.intensity || null);
    App.relapseDraft = null;
    location.hash = '#/aujourdhui';
    UI.toast('Noté. Le compteur repart, ton total reste.');
  },
  'relapse-observation'() {
    const d = App.relapseDraft;
    Intakes.add(d.type, Date.now(), d.trigger, d.intensity || null);
    App.relapseDraft = null;
    Store.data.settings.phase = 'observation';
    Store.data.settings.quitStart = null;
    Store.save();
    location.hash = '#/aujourdhui';
    UI.toast('Noté. Retour en observation, sans pression.');
  },

  /* ---- J'ai une envie ---- */
  'craving-close'() { Craving.current = null; location.hash = '#/aujourdhui'; },
  'craving-pause'() { Craving.togglePause(); App.render(); },
  'craving-done'() { Craving.finish(); App.render(); },
  'craving-trigger'(el) {
    const c = Craving.state();
    c.trigger = c.trigger === el.dataset.value ? null : el.dataset.value;
    App.render();
  },
  'craving-intensity'(el) {
    const c = Craving.state(), n = Number(el.dataset.value);
    c.intensity = c.intensity === n ? null : n;
    App.render();
  },
  'craving-save'() { Craving.save(true); location.hash = '#/aujourdhui'; UI.toast('Envie notée. Bien joué.'); },
  'craving-skip'() { Craving.save(true, false); location.hash = '#/aujourdhui'; },
  'craving-gave-in'() {
    const ctx = Craving.save(false);
    if (Store.data.settings.phase === 'arret') {
      App.relapseDraft = { type: 'snus', trigger: ctx.trigger, intensity: ctx.intensity };
      location.hash = '#/reprendre';
    } else {
      App.afterRoute = () => IntakeSheet.open({ mode: 'new', id: null, type: 'snus', ts: Date.now(), trigger: ctx.trigger, intensity: ctx.intensity, confirmDelete: false });
      location.hash = '#/aujourdhui';
    }
  },

  /* ---- Check-in ---- */
  'ci-pick'(el) {
    App.checkinDraft[el.dataset.key] = Number(el.dataset.value);
    App.render();
  },
  'ci-submit'() {
    const d = App.checkinDraft;
    const input = document.querySelector('[data-ci="hr"]');
    const raw = input ? input.value.trim() : String(d.hr ?? '');
    const hr = raw === '' ? null : Util.clampInt(Util.parseNum(raw), 25, 220);
    if (raw !== '' && hr === null) { UI.toast('Fréquence attendue entre 25 et 220 bpm, ou laisse vide.'); return; }
    const entry = { date: d.date, sleep: d.sleep, energy: d.energy, mood: d.mood, anxiety: d.anxiety, hr };
    App.checkinDraft = null;
    Store.update((data) => {
      data.checkins = data.checkins.filter((c) => c.date !== entry.date).concat(entry).sort((a, b) => a.date.localeCompare(b.date));
    });
  },
  'ci-edit'() {
    const day = Calc.checkinDayFor(Date.now());
    const c = Store.data.checkins.find((x) => x.date === day);
    App.checkinDraft = { ...c, hr: c.hr ?? '' };
    App.render();
  },

  /* ---- Démo ---- */
  'demo-ask'() {
    UI.openSheet(`
      <h2 class="title" style="font-size:22px">Charger des données de démo ?</h2>
      <p class="muted small">Données fictives avec prix et check-ins. Tes données actuelles (${Store.data.intakes.length} prise(s)) seront remplacées ; tu pourras annuler juste après. Pense à exporter avant si tu veux les garder.</p>
      <div class="stack">
        <button type="button" class="btn btn--primary btn--block" data-action="demo-load" data-kind="observation">Observation · 3 semaines</button>
        <button type="button" class="btn btn--block" data-action="demo-load" data-kind="arret">Arrêt en cours · jour 7</button>
        <button type="button" class="link" data-action="close-sheet" style="align-self:center">Annuler</button>
      </div>`, 'Données de démo');
  },
  'demo-load'(el) {
    const seed = Math.floor(Math.random() * 1e9);
    Backup.pending = el.dataset.kind === 'arret' ? Demo.generateQuit(Date.now(), seed) : Demo.generate(Date.now(), seed);
    Backup.applyPending('Données de démo chargées.');
  }
};

/* =========================================================================
   Sauvegarde — export (partage iOS ou téléchargement) et import
   ========================================================================= */
const Backup = {
  pending: null,

  async exportFile() {
    const name = `stase-${Dates.todayKey()}.json`;
    const blob = new Blob([Store.exportJson()], { type: 'application/json' });
    const file = typeof File === 'function' ? new File([blob], name, { type: 'application/json' }) : null;
    try {
      // Sur iPhone, la feuille de partage permet « Enregistrer dans Fichiers ».
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Sauvegarde STASE' });
      } else {
        Backup.download(blob, name);
      }
      Store.update((d) => { d.settings.lastExportAt = Date.now(); });
      UI.toast('Sauvegarde exportée.');
    } catch (e) {
      if (e && e.name === 'AbortError') return; // partage annulé
      Backup.download(blob, name);
    }
  },

  download(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  },

  /** Lecture du fichier choisi, puis demande de confirmation. */
  readFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      const res = Store.parseImport(String(reader.result));
      if (!res.ok) { UI.toast(res.error); return; }
      Backup.pending = res.data;
      UI.openSheet(`
        <h2 class="title" style="font-size:22px">Remplacer les données ?</h2>
        <p class="muted small">Ce fichier contient ${res.data.intakes.length} prise(s), ${res.data.cravings.length} envie(s) et ${res.data.checkins.length} check-in(s).
        Tes données actuelles (${Store.data.intakes.length} prise(s)) seront remplacées. Tu pourras annuler juste après.</p>
        <div class="grid-2">
          <button type="button" class="btn" data-action="close-sheet">Garder</button>
          <button type="button" class="btn btn--primary" data-action="confirm-import">Remplacer</button>
        </div>`, 'Importer une sauvegarde');
    };
    reader.onerror = () => UI.toast('Lecture du fichier impossible.');
    reader.readAsText(file);
  },

  applyPending(message = 'Données importées.') {
    if (!Backup.pending) return;
    Store.replaceAll(Backup.pending);
    Backup.pending = null;
    App.checkinDraft = null;
    App.viewDay = null;
    UI.closeSheet();
    UI.applyTheme();
    App.render();
    UI.toast(message, 'Annuler', () => {
      if (Store.restoreBackup()) { App.checkinDraft = null; UI.applyTheme(); App.render(); UI.toast('Import annulé.'); }
    }, 8000);
  }
};

/* =========================================================================
   App — routage par #hash et rendu
   ========================================================================= */
const App = {
  routes: ['aujourdhui', 'stats', 'corps', 'checkin', 'reglages', 'envie', 'reprendre', 'bienvenue'],
  testMode: false,
  /** Check-in en cours de saisie (non enregistré). */
  checkinDraft: null,
  /** Période des stats : 7 ou 30 jours. */
  statsRange: 7,
  /** Jour affiché sur « Aujourd'hui » (null = aujourd'hui). */
  viewDay: null,
  /** Dernier jour local vu : sert à détecter minuit ou un changement de fuseau. */
  lastDayKey: null,
  /** Écrans sans barre d'onglets ni bouton flottant. */
  focused: ['envie', 'reprendre', 'bienvenue'],
  /** Questionnaire en cours, et écran où revenir à la fin. */
  quiz: null,
  quizReturn: null,
  /** Action à lancer après le prochain changement d'écran. */
  afterRoute: null,
  /** Brouillon de l'écran « Reprendre ». */
  relapseDraft: null,

  route() {
    const name = location.hash.replace(/^#\/?/, '');
    return App.routes.includes(name) ? name : 'aujourdhui';
  },

  /**
   * Mise à jour chaque seconde des valeurs « en direct » sans redessiner
   * l'écran (évite de casser l'animation de respiration ou un champ en cours).
   */
  tick() {
    const name = App.route();
    const set = (key, text) => { const el = document.querySelector(`[data-live="${key}"]`); if (el && el.textContent !== text) el.textContent = text; };
    if (name === 'aujourdhui' && Store.data.settings.phase === 'arret') {
      const cur = Calc.streaks(Store.data.intakes, Store.data.settings.quitStart, Date.now()).current;
      set('since-big', Screens.sinceBig(cur));
      set('since-small', Screens.sinceSmall(cur));
    }
    if (name === 'envie' && Craving.current && Craving.current.step === 'timer') {
      const c = Craving.current, el = Craving.elapsed(c), v = Craving.view(el, c);
      if (el >= Craving.DURATION) { Craving.finish(); App.render(); return; }
      set('craving-phase', v.phase); set('craving-hint', v.hint); set('craving-left', v.left);
      const ring = document.querySelector('[data-live="craving-ring"]');
      if (ring) ring.setAttribute('stroke-dashoffset', v.dash);
    }
  },

  /** Redessine si le jour local a changé (minuit, fuseau, retour dans l'app). */
  checkDayChange() {
    const key = Dates.todayKey();
    if (key === App.lastDayKey) return;
    App.lastDayKey = key;
    App.viewDay = null;
    if (!UI.sheetState) App.render();
  },

  render() {
    const view = document.getElementById('view');
    // Valide d'abord un champ en cours de saisie : son « change » (au blur)
    // déclencherait sinon un rendu imbriqué pendant le remplacement du HTML.
    const active = document.activeElement;
    if (active && view.contains(active)) active.blur();
    App.lastDayKey = Dates.todayKey();
    const name = App.route();
    view.innerHTML = Screens[name]();
    document.body.classList.toggle('no-chrome', App.focused.includes(name));
    document.querySelectorAll('.tab').forEach((t) => {
      if (t.dataset.tab === name) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
    });
  },

  onClick(e) {
    const el = e.target.closest('[data-action]');
    if (!el || !Actions[el.dataset.action]) return;
    e.preventDefault();
    Actions[el.dataset.action](el);
  },

  /** Saisie d'un réglage numérique : validée à la sortie du champ. */
  onChange(e) {
    const input = e.target;
    if (input.id === 'import-input') {
      if (input.files[0]) Backup.readFile(input.files[0]);
      input.value = '';
      return;
    }
    if (input.dataset.ci === 'hr' && App.checkinDraft) { App.checkinDraft.hr = input.value.trim(); return; }
    if (input.dataset.sheet === 'ts' && UI.sheetState) {
      const ts = Dates.fromInputValue(input.value);
      if (ts !== null) UI.sheetState.ts = ts;
      return;
    }
    const key = input.dataset.setting;
    if (!key) return;
    const n = Util.parseNum(input.value);
    if (n === null) {
      input.parentElement.classList.add('is-invalid');
      UI.toast('Nombre attendu, par exemple 6,90.');
      return;
    }
    Store.update((d) => { d.settings[key] = n; });
  },

  boot() {
    Store.load();
    UI.applyTheme();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    document.addEventListener('click', App.onClick);
    document.addEventListener('change', App.onChange);
    window.addEventListener('hashchange', () => {
      App.viewDay = null;
      if (App.route() !== 'envie' && Craving.current && Craving.current.step === 'log') Craving.current = null;
      if (App.route() !== 'reprendre') App.relapseDraft = null;
      if (App.route() !== 'bienvenue') App.quiz = null;
      UI.closeSheet();
      App.render();
      document.getElementById('view').scrollTop = 0;
      if (App.afterRoute) { const fn = App.afterRoute; App.afterRoute = null; fn(); }
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) App.checkDayChange(); });
    setInterval(App.checkDayChange, 30000);
    setInterval(App.tick, 1000);
    if (new URLSearchParams(location.search).has('test')) { App.testMode = true; Tests.run(); return; }
    // Premier lancement : questionnaire de départ (une seule fois, passable).
    const s = Store.data.settings;
    if (!s.profile.done && !Store.data.intakes.length && !location.hash) history.replaceState(null, '', '#/bienvenue');
    App.render();
  }
};

/* =========================================================================
   Tests — ouvrir index.html?test
   ========================================================================= */
const Tests = {
  cases: [],
  add(name, fn) { Tests.cases.push([name, fn]); },
  eq(actual, expected, msg) {
    const a = JSON.stringify(actual), b = JSON.stringify(expected);
    if (a !== b) throw new Error(`${msg || ''} attendu ${b}, obtenu ${a}`);
  },
  near(actual, expected, msg, eps = 0.01) {
    if (Math.abs(actual - expected) > eps) throw new Error(`${msg || ''} attendu ≈${expected}, obtenu ${actual}`);
  },

  run() {
    const results = Tests.cases.map(([name, fn]) => {
      try { fn(); return { name, ok: true }; } catch (e) { return { name, ok: false, err: e.message }; }
    });
    const ko = results.filter((r) => !r.ok).length;
    document.body.classList.add('no-chrome');
    document.getElementById('view').innerHTML = `<div class="screen">
      <h1 class="title" id="test-summary">${ko ? `${ko} échec(s)` : 'Tous les tests passent'} · ${results.length} tests</h1>
      <p class="small faint">Fuseau : ${Util.esc(Intl.DateTimeFormat().resolvedOptions().timeZone)}</p>
      <div>${results.map((r) => `<div class="test-row"><span class="${r.ok ? 'test-ok' : 'test-ko'}">${r.ok ? 'OK' : 'KO'}</span>
        <span>${Util.esc(r.name)}${r.ok ? '' : `<br><span class="small faint">${Util.esc(r.err)}</span>`}</span></div>`).join('')}</div>
    </div>`;
    console.log(results);
  }
};

  Tests.eq(states.filter((m) => m.state === 'next').length, 1);
  Tests.eq(Calc.milestoneStates(0, MILESTONES)[0].state, 'next');
  Tests.eq(Calc.milestoneStates(400 * DAY_MS, MILESTONES).every((m) => m.state === 'done'), true);
});
Tests.add('jalons : formulés comme des tendances, sans promesse', () => {
  const all = MILESTONES.map((m) => m.text).join(' ').toLowerCase();
  ['garanti', 'à coup sûr', 'définitivement', 'disparaît complètement', 'cigarette', 'monoxyde', 'goudron'].forEach((w) => Tests.eq(all.includes(w), false, w));
  Tests.eq(MILESTONES.filter((m) => /souvent|en général/.test(m.text)).length >= 5, true);
});

/* ---- Questionnaire et bénéfices personnalisés ---- */
Tests.add('profil : nettoyage des réponses', () => {
  const p = Store.cleanProfile({ done: true, uses: 'both', goals: ['argent', 'argent', 'inconnu'], concerns: ['tension', 'rien'], firstUse: 'lt5' });
  Tests.eq(p, { done: true, uses: 'both', goals: ['argent'], concerns: ['tension'], firstUse: 'lt5' });
  Tests.eq(Store.cleanProfile(null).done, false);
  Tests.eq(Store.normalize({}).settings.profile.concerns, []);
});
Tests.add('points proposés selon l’usage (gencives = snus, souffle = vape)', () => {
  const keys = (u) => Calc.concernsFor(u).map((c) => c.key);
  Tests.eq(keys('vape').includes('gencives'), false);
  Tests.eq(keys('vape').includes('souffle'), true);
  Tests.eq(keys('snus').includes('souffle'), false);
  Tests.eq(keys('both').includes('gencives') && keys('both').includes('souffle'), true);
});
Tests.add('changer d’usage retire les points qui ne s’appliquent plus', () => {
  const saved = App.quiz;
  App.quiz = { step: 1, a: { uses: 'both', goals: [], concerns: ['gencives', 'stress'], firstUse: null } };
  Quiz.pick('uses', 'vape');
  Tests.eq(App.quiz.a.concerns, ['stress']);
  Quiz.pick('goals', 'argent'); Quiz.pick('goals', 'sante'); Quiz.pick('goals', 'argent');
  Tests.eq(App.quiz.a.goals, ['sante']);
  App.quiz = saved;
});
Tests.add('repères « pour toi » selon les points cochés', () => {
  const oneHour = MILESTONES.find((m) => m.h === 1);
  Tests.eq(Calc.isForMe(oneHour, ['tension']), true);
  Tests.eq(Calc.isForMe(oneHour, ['sommeil']), false);
  Tests.eq(MILESTONES.filter((m) => Calc.isForMe(m, ['sommeil'])).length >= 1, true);
});
Tests.add('évolution d’une mesure avant / depuis l’arrêt', () => {
  const quit = new Date(2026, 9, 10, 9).getTime();
  const ci = (d, sleep, hr) => ({ date: Dates.dayKey(new Date(2026, 9, d, 21).getTime()), sleep, hr });
  const list = [ci(5, 2, 72), ci(6, 2, 70), ci(7, 3, 71), ci(10, 3, 66), ci(11, 4, 65), ci(12, 4, 64)];
  const t = Calc.metricTrend(list, 'sleep', quit);
  Tests.near(t.before, 7 / 3); Tests.near(t.after, 11 / 3);
  Tests.near(Calc.metricTrend(list, 'hr', quit).after, 65);
  Tests.eq(Calc.metricTrend(list.slice(0, 4), 'sleep', quit), null);
  Tests.near(Calc.metricTrend(list, 'sleep', null).current, 3);
});
Tests.add('coût annuel : référence, sinon moyenne récente ; null sans prix', () => {
  const s = Object.assign(Store.defaults().settings, { snusBoxPrice: 6.9, snusPerBox: 20, vapeUnitPrice: 3.5, vapeSessionsPerUnit: 40, baseline: { snusPerDay: 4, vapePerDay: 5, days: 10 } });
  Tests.near(Calc.yearlyCost(s, []), (4 * 0.345 + 5 * 0.0875) * 365);
  s.snusBoxPrice = 0; s.vapeUnitPrice = 0;
  Tests.eq(Calc.yearlyCost(s, []), null);
});
Tests.add('textes de bénéfices : prudents, sans promesse', () => {
  const all = CONCERNS.map((c) => c.text + ' ' + (c.note || '')).join(' ').toLowerCase();
  ['garanti', 'à coup sûr', 'guérit', 'définitivement', 'échec'].forEach((w) => Tests.eq(all.includes(w), false, w));
  Tests.eq(CONCERNS.every((c) => c.text.length < 330), true);
  const personal = Object.values(Messages.personal).flat().join(' ').toLowerCase();
  ['échec', 'rechute', 'craqu', 'honte', 'faute'].forEach((w) => Tests.eq(personal.includes(w), false, w));
});
