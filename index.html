<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<!-- iPhone : pleine largeur, contenu sous l'encoche (géré par les safe areas). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<!-- Ajout à l'écran d'accueil : ouverture en plein écran, sans barre Safari. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STASE">
<meta name="application-name" content="STASE">
<meta name="theme-color" content="#0B1220">
<meta name="color-scheme" content="dark light">
<!-- Sécurité : aucune ressource externe, aucun envoi de données ; seul le script de la page s'exécute. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>STASE</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="preload" href="fonts/manrope.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'%3E%3Cdefs%3E%3ClinearGradient id='s' x1='0' y1='240' x2='0' y2='784' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0.1' stop-color='%23F2B36B'/%3E%3Cstop offset='0.9' stop-color='%235EE6C4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='1024' height='1024' rx='228' fill='%23111A2E'/%3E%3Cpath d='M664 256 H512 A128 128 0 0 0 512 512 A128 128 0 0 1 512 768 H360' fill='none' stroke='url(%23s)' stroke-width='120' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<!-- Polices à côté de la page (variables 400–700, jeu latin), gardées hors ligne par le service worker.
     Manrope et Space Grotesk, licence SIL Open Font License 1.1. -->
<style>
@font-face { font-family: 'Manrope'; font-style: normal; font-weight: 400 700; font-display: block;
  src: url(fonts/manrope.woff2) format('woff2'); }
@font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 400 700; font-display: block;
  src: url(fonts/space-grotesk.woff2) format('woff2'); }
</style>

<style>
/* =========================================================================
   1. Jetons de design (maquettes STASE) — sombre par défaut, clair en option
   ========================================================================= */
:root {
  --bg: #0B1220;
  --surface: #131C2F;
  --surface-2: #1B263D;
  --line: #26324B;
  --line-2: #3A4766;
  --text: #EAF0F8;
  --text-2: #A7B3C8;
  --text-3: #8693AD;
  --mint: #5EE6C4;
  --on-mint: #062A22;
  --mint-dim: rgba(94, 230, 196, 0.12);
  --mint-line: rgba(94, 230, 196, 0.35);
  --warm: #F2B36B;
  --on-warm: #2A1704;
  --warm-soft: rgba(242, 179, 107, 0.55);
  --data: #5B6F99;
  --data-hi: #C9D3E3;
  --scrim: rgba(4, 8, 16, 0.62);
  --sheet: #151F34;
  --bar: rgba(13, 20, 35, 0.94);
  --shadow: 0 10px 28px rgba(0, 0, 0, 0.45);

  --font-num: 'Space Grotesk', ui-rounded, -apple-system, system-ui, sans-serif;
  --font-text: 'Manrope', -apple-system, system-ui, sans-serif;

  --r-sm: 14px;
  --r-md: 18px;
  --r-lg: 24px;
  --gutter: 24px;
  --tabbar-h: 56px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  /* Sous la barre d'onglets : la barre d'accueil d'iOS n'a pas besoin de toute la marge de sécurité. */
  --bar-pad: max(calc(var(--safe-bottom) - 16px), 6px);
}
:root[data-theme="light"] {
  --bg: #F3F5F9;
  --surface: #FFFFFF;
  --surface-2: #E8ECF3;
  --line: #D6DCE7;
  --line-2: #B9C2D3;
  --text: #0D1525;
  --text-2: #46526B;
  --text-3: #5D6981;
  --mint: #0E7F69;
  --on-mint: #FFFFFF;
  --mint-dim: rgba(14, 127, 105, 0.10);
  --mint-line: rgba(14, 127, 105, 0.35);
  --warm: #A3560F;
  --on-warm: #FFFFFF;
  --warm-soft: rgba(163, 86, 15, 0.45);
  --data: #7A879F;
  --data-hi: #2B3550;
  --scrim: rgba(13, 21, 37, 0.36);
  --sheet: #FFFFFF;
  --bar: rgba(255, 255, 255, 0.94);
  --shadow: 0 10px 24px rgba(13, 21, 37, 0.12);
}

/* =========================================================================
   2. Base
   ========================================================================= */
* { box-sizing: border-box; }
/* La page elle-même ne défile jamais : seul #view défile. Ainsi le rebond d'iOS
   n'entraîne plus la barre d'onglets ni le bouton flottant. */
html, body { margin: 0; height: 100%; background: var(--bg); position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; }
body {
  color: var(--text);
  font-family: var(--font-text);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
/* Pas de zoom au double tap ; les champs restent ≥ 16 px pour éviter le zoom au focus d'iOS. */
button, a, input, label, select { touch-action: manipulation; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
h1, h2, h3, p { margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* =========================================================================
   3. Coquille de l'app : vue défilante, barre d'onglets, bouton flottant
   ========================================================================= */
#view {
  position: fixed;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  touch-action: pan-y pinch-zoom;
  -webkit-overflow-scrolling: touch;
  padding: calc(var(--safe-top) + 20px) var(--gutter) calc(var(--tabbar-h) + 2px + var(--bar-pad) + 96px);
}
.tabbar, .fab, .scrim { touch-action: none; }
.sheet { overscroll-behavior: contain; touch-action: pan-y pinch-zoom; }
body.no-chrome #view { padding-bottom: calc(var(--safe-bottom) + 32px); }
.screen { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.screen--today { position: relative; }
.screen--today > :not(.ambient) { position: relative; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  padding: 2px 4px var(--bar-pad);
  background: var(--bar);
  border-top: 1px solid var(--line);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
}
.tab {
  min-height: var(--tabbar-h);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--text-3); text-decoration: none; font-size: 11px; font-weight: 600;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--mint); }
body.no-chrome .tabbar, body.no-chrome .fab, body.no-fab .fab { display: none; }
body.no-fab:not(.no-chrome) #view { padding-bottom: calc(var(--tabbar-h) + 2px + var(--bar-pad) + 28px); }
body.no-fab:not(.no-chrome) .toast { bottom: calc(var(--tabbar-h) + 2px + var(--bar-pad) + 16px); }

.fab {
  position: fixed; left: 50%; z-index: 21;
  bottom: calc(var(--tabbar-h) + 2px + var(--bar-pad) + 18px);
  transform: translateX(-50%);
  height: 52px; padding: 0 22px; border-radius: 26px;
  display: flex; align-items: center; gap: 10px; white-space: nowrap;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--warm); box-shadow: var(--shadow);
  text-decoration: none; font-size: 15px; font-weight: 600;
}
.fab svg { width: 20px; height: 20px; color: var(--warm); }

/* =========================================================================
   4. Typographie et éléments de texte
   ========================================================================= */
.wordmark { font-family: var(--font-num); font-size: 15px; font-weight: 600; letter-spacing: 0.42em; }
.label { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); }
.title { font-family: var(--font-num); font-size: 30px; font-weight: 600; line-height: 1.15; }
.title--soft { font-weight: 500; font-size: 32px; }
.big-number { font-family: var(--font-num); font-size: 120px; font-weight: 500; line-height: 0.95; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.value { font-family: var(--font-num); font-size: 30px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.value--mint { color: var(--mint); }
/* Montants : « 1 234.50 CHF » doit tenir dans une demi-carte, même sur iPhone SE. */
.value--money { font-size: clamp(16px, 5.4vw, 28px); white-space: nowrap; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

.header { display: flex; justify-content: space-between; align-items: center; min-height: 32px; }
.pill {
  font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
}
.pill--mint { color: var(--mint); background: var(--mint-dim); border-color: transparent; }

/* =========================================================================
   5. Composants
   ========================================================================= */
.card { background: var(--surface); border-radius: var(--r-lg); padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.card--outline { background: transparent; border: 1px solid var(--line); }
.card--empty { background: transparent; border: 1px dashed var(--line); padding: 24px; }
.card--featured { border: 1px solid var(--mint-line); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid-5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

.btn {
  min-height: 56px; padding: 0 20px; border-radius: var(--r-md);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 16px; font-weight: 600; text-decoration: none;
  border: 1px solid var(--line); background: transparent; color: var(--text);
}
.btn--primary { background: var(--mint); color: var(--on-mint); border-color: var(--mint); font-weight: 700; }
.btn--surface { background: var(--surface); }
.btn--dashed { border-style: dashed; border-color: var(--line-2); color: var(--text-2); }
.btn--block { width: 100%; }
.btn:disabled { background: var(--surface-2); border-color: var(--surface-2); color: var(--text-3); }
.link {
  min-height: 48px; display: inline-flex; align-items: center; justify-content: center;
  background: none; border: 0; padding: 0 4px; color: var(--text-2);
  font-size: 14px; text-decoration: underline; text-underline-offset: 3px;
}
.link--mint { color: var(--mint); text-decoration: none; font-weight: 600; font-size: 15px; }
.icon-btn {
  width: 48px; height: 48px; border-radius: 24px; border: 0;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--surface); color: var(--text-2);
}
.icon-btn svg { width: 20px; height: 20px; }

/* Puces de déclencheur : sélection neutre (inversée) */
.chip {
  min-height: 48px; border-radius: var(--r-sm); padding: 0 8px;
  background: var(--surface); color: var(--text-2); border: 1px solid var(--line);
  font-size: 14px; font-weight: 600;
}
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
/* Échelle 1–5 : neutre par défaut, ambre pour l'intensité d'envie */
.scale-btn {
  height: 52px; border-radius: var(--r-sm);
  background: var(--surface); color: var(--text-2); border: 1px solid var(--line);
  font-family: var(--font-num); font-size: 18px; font-weight: 600;
}
.scale-btn[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.scale--warm .scale-btn[aria-pressed="true"] { background: var(--warm); color: var(--on-warm); border-color: var(--warm); }

.segmented { display: grid; grid-auto-columns: minmax(0, 1fr); grid-auto-flow: column; background: var(--surface); border-radius: 16px; padding: 4px; }
.segmented label { display: flex; align-items: center; justify-content: center; }
.segmented :is(button, label) { min-height: 48px; border: 0; border-radius: 12px; background: transparent; color: var(--text-2); font-size: 15px; font-weight: 600; }
.segmented :is(button, label)[aria-pressed="true"] { background: var(--line); color: var(--text); }
:root[data-theme="light"] .segmented :is(button, label)[aria-pressed="true"] { background: var(--surface-2); }

.group { background: var(--surface); border-radius: 20px; padding: 0 16px; }
.group > * + * { border-top: 1px solid var(--line); }
.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; padding: 8px 0; }
.field__label { display: flex; flex-direction: column; gap: 2px; font-size: 15px; }
.field__box {
  flex: none; width: 128px; height: 48px; border-radius: 12px; padding: 0 12px;
  display: flex; align-items: center; gap: 6px;
  background: var(--surface-2); border: 1px solid transparent;
}
.field__box:focus-within { border-color: var(--mint); }
.field__box.is-invalid { border-color: var(--warm); }
.field__box input {
  width: 100%; min-width: 0; border: 0; outline: none; background: transparent;
  text-align: right; font-family: var(--font-num); font-size: 16px; /* 16 px : pas de zoom iOS */
}
.field__unit { font-size: 14px; color: var(--text-3); white-space: nowrap; }

/* Boutons « haptiques » : un <label> avec un switch invisible ; iOS vibre quand le doigt touche le switch. */
.hap-btn { cursor: pointer; -webkit-user-select: none; user-select: none; }
.hap { position: absolute; top: 0; left: 0; width: 1px; height: 1px; margin: 0; opacity: 0; }
.switch { flex: none; width: 52px; height: 32px; border-radius: 16px; border: 0; padding: 3px; background: var(--line); display: flex; }
.switch::after { content: ''; width: 26px; height: 26px; border-radius: 13px; background: var(--text-2); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--mint); }
.switch[aria-checked="true"]::after { background: var(--on-mint); transform: translateX(20px); }

.progress { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.progress > span { display: block; height: 100%; border-radius: 3px; background: var(--mint); }

/* Aujourd'hui : navigation jour, compteur, boutons de relevé, lignes */
.day-nav { display: flex; align-items: center; gap: 4px; }
.day-nav .icon-btn { flex: none; width: 44px; }
.day-nav .label { flex: 1; text-align: center; }
.icon-btn--ghost { background: transparent; color: var(--text-3); }
.icon-btn:disabled { opacity: 0.3; }
.counter { display: flex; align-items: baseline; gap: 14px; }
.counter .muted { font-size: 17px; }
.log-btn {
  height: 96px; border-radius: var(--r-lg);
  background: var(--surface); border: 1px solid var(--line); color: var(--text);
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-family: var(--font-num); font-size: 22px; font-weight: 600;
  transition: transform .08s, background .15s;
}
.log-btn:active { transform: scale(0.97); background: var(--surface-2); }
.log-btn--solo { width: 100%; height: 104px; font-size: 26px; }
.entry {
  width: 100%; min-height: 60px; padding: 0 2px; display: flex; align-items: center; gap: 14px;
  background: transparent; border: 0; border-bottom: 1px solid var(--line); text-align: left;
}
.entry__time { width: 52px; font-size: 17px; font-weight: 500; }
.entry__kind { width: 68px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
.entry__ctx { flex: 1; font-size: 14px; color: var(--text-2); }
.entry__ctx.faint { color: var(--text-3); }
.marker { width: 8px; height: 8px; background: var(--text-2); }
.marker--snus { border-radius: 2px; }
.marker--vape { border-radius: 4px; }
.dots { display: flex; gap: 4px; }
.dots span { width: 6px; height: 6px; border-radius: 3px; background: var(--line); }
.dots span.on { background: var(--warm); }
input[type="time"] { width: 100%; border: 0; outline: none; background: transparent; font-family: var(--font-num); font-size: 16px; min-height: 44px; text-align: right; }
input[type="datetime-local"] { width: 100%; border: 0; outline: none; background: transparent; font-family: var(--font-num); font-size: 16px; min-height: 44px; }

.done-mark { width: 40px; height: 40px; border-radius: 20px; background: var(--mint-dim); color: var(--mint); display: flex; align-items: center; justify-content: center; }
.corr { display: grid; grid-template-columns: minmax(0, 1fr) 84px 84px; gap: 12px 8px; align-items: center; font-size: 15px; }
.corr .num { font-size: 18px; font-weight: 600; text-align: center; }
.corr > .tiny { text-align: center; }

/* J'ai une envie : cercle de respiration */
.breath { position: relative; width: min(290px, 74vw, 32dvh); aspect-ratio: 1; margin-top: 4px; }
.breath svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.breath__track { fill: none; stroke: var(--surface-2); stroke-width: 5; }
.breath__ring { fill: none; stroke: var(--mint); stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.breath__disc {
  position: absolute; inset: 12%; border-radius: 50%;
  background: var(--mint-dim); border: 1px solid var(--mint-line);
  animation: breathe 10s ease-in-out infinite;
}
@keyframes breathe { 0% { transform: scale(0.55); } 40% { transform: scale(1); } 100% { transform: scale(0.55); } }
.breath__text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.breath__phase { font-family: var(--font-num); font-size: 26px; font-weight: 500; }
@media (prefers-reduced-motion: reduce) { .breath__disc { transform: scale(0.8); } }

/* Questionnaire et bénéfices */
.option {
  width: 100%; min-height: 60px; padding: 10px 16px; border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left;
  background: var(--surface); border: 1px solid var(--line); color: var(--text); font-size: 16px; font-weight: 600;
}
.option[aria-pressed="true"] { border-color: var(--mint); background: var(--mint-dim); }
.option__check { flex: none; width: 26px; height: 26px; border-radius: 13px; border: 2px solid var(--line-2); display: flex; align-items: center; justify-content: center; color: var(--on-mint); }
.option[aria-pressed="true"] .option__check { background: var(--mint); border-color: var(--mint); }
.option__check svg { width: 15px; height: 15px; }
.benefit { gap: 8px; }
details.benefit summary { list-style: none; cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
details.benefit summary::-webkit-details-marker { display: none; }
.benefit__more { color: var(--text-3); font-weight: 600; }
.benefit__more::after { content: ' ›'; }
details.benefit[open] .benefit__more { display: none; }
.trend { font-size: 14px; color: var(--text-2); border-top: 1px solid var(--line); padding-top: 10px; margin-top: 2px; }
.trend.is-good { color: var(--mint); font-weight: 600; }
.tl__tag--me { color: var(--mint) !important; }

/* Corps : anneau, étape du moment, systèmes, effets */
.corps { gap: 28px; }
.sec-title { font-family: var(--font-num); font-size: 20px; font-weight: 600; line-height: 1.2; color: var(--text); }
.sec-sub { font-size: 14px; color: var(--text-3); }
.body-text { font-size: 15px; line-height: 1.55; color: var(--text-2); }
.now__stage { font-family: var(--font-num); font-size: 22px; font-weight: 600; color: var(--mint); line-height: 1.2; }
.now__group { display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.now__head { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); }
.bf-list { padding: 4px 20px; gap: 0; }
.bf { border-top: 1px solid var(--line); }
.bf:first-child { border-top: 0; }
.bf summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) 20px; column-gap: 12px; row-gap: 4px; padding: 16px 0; }
.bf summary::-webkit-details-marker { display: none; }
.bf__title { font-size: 16px; font-weight: 700; color: var(--text); }
.bf__lead { grid-column: 1; font-size: 15px; line-height: 1.5; color: var(--text-2); }
.bf__chev { grid-column: 2; grid-row: 1 / span 2; align-self: center; width: 8px; height: 8px; border-right: 2px solid var(--text-3); border-bottom: 2px solid var(--text-3); transform: rotate(45deg); transition: transform .2s; justify-self: center; }
.bf[open] .bf__chev { transform: rotate(-135deg); }
.bf__more { display: flex; flex-direction: column; gap: 8px; padding: 0 32px 16px 0; font-size: 15px; line-height: 1.55; color: var(--text-2); }
.hero { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 18px; align-items: center; }
.hero__ring { position: relative; width: 104px; height: 104px; }
.hero__ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.hero__track { fill: none; stroke: var(--surface-2); stroke-width: 8; }
.hero__arc { fill: none; stroke: var(--mint); stroke-width: 8; stroke-linecap: round; }
.is-entering .hero__arc { animation: heroArc 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.15s both; }
@keyframes heroArc { from { stroke-dashoffset: 263.9; } }
.hero__center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.hero__center b { font-family: var(--font-num); font-size: 30px; line-height: 1; }
.hero__center span { font-size: 12px; color: var(--text-3); }
.stage { gap: 16px; align-items: start; }
.stage__item { font-size: 15px; line-height: 1.5; color: var(--text-2); padding-left: 14px; position: relative; }
.stage__item::before { content: ''; position: absolute; left: 0; top: 0.55em; width: 6px; height: 6px; border-radius: 3px; background: var(--line-2); }
.stage__item--help::before { background: var(--mint); }
@media (max-width: 360px) { .stage { grid-template-columns: minmax(0, 1fr); } .hero { grid-template-columns: 92px minmax(0, 1fr); } .hero__ring { width: 92px; height: 92px; } }
.sys { display: flex; flex-direction: column; gap: 6px; }
.sys__title { font-size: 16px; font-weight: 700; }
.sys__text { font-size: 14px; line-height: 1.5; color: var(--text-2); }
.sys + .sys { padding-top: 14px; border-top: 1px solid var(--line); }
.sys__done { color: var(--mint); font-weight: 600; }
.effects { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.5; color: var(--text-2); }
.tl__more summary { list-style: none; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--mint); min-height: 32px; display: inline-flex; align-items: center; }
.tl__more summary::-webkit-details-marker { display: none; }
.tl__more summary::after { content: ' ›'; }
.tl__more[open] summary::after { content: ' ‹'; }
.tl__more p { margin: 2px 0 0; font-size: 15px; line-height: 1.5; color: var(--text-2); }

/* Frise Corps */
.timeline { list-style: none; margin: 0; padding: 0; }
.tl { display: grid; grid-template-columns: 24px minmax(0, 1fr); column-gap: 16px; }
.tl__rail { display: flex; flex-direction: column; align-items: center; }
.tl__node {
  flex: none; width: 24px; height: 24px; border-radius: 12px; box-sizing: border-box;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); border: 2px solid var(--line-2); color: var(--on-mint);
}
.tl__node svg { width: 14px; height: 14px; stroke-width: 3; }
.tl--done .tl__node { background: var(--mint); border: 0; }
.tl--next .tl__node { border: 3px solid var(--mint); box-shadow: 0 0 0 6px var(--mint-dim); }
.tl__line { flex: 1; width: 2px; min-height: 20px; background: var(--line); }
.tl__line.is-on { background: var(--mint); }
.tl__body { padding: 1px 0 26px; display: flex; flex-direction: column; gap: 4px; }
.tl__title { font-family: var(--font-num); font-size: 17px; font-weight: 600; }
.tl__tag { font-family: var(--font-text); font-size: 12px; font-weight: 600; color: var(--text-3); margin-left: 4px; }
.tl--next .tl__tag { color: var(--mint); }
.tl__text { font-size: 15px; line-height: 1.5; color: var(--text-2); }
.tl--future .tl__title, .tl--future .tl__text { color: var(--text-3); }

/* J'ai une envie : boutons toujours atteignables, même sur petit écran */
.envie-actions { align-self: stretch; margin-top: auto; position: sticky; bottom: 0; z-index: 2;
  padding: 12px 0 calc(var(--safe-bottom) + 4px); background: linear-gradient(to bottom, transparent, var(--bg) 35%); }
.envie-actions .btn:not(.btn--primary) { background: var(--bg); }
.envie-actions .btn { white-space: nowrap; padding: 0 12px; }

/* J'ai une envie : tes raisons */
.reason { align-self: stretch; border: 1px solid var(--line); border-radius: 20px; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; min-height: 104px; }
.reason p { margin: 0; font-size: 15px; line-height: 1.5; }
.reason__dots { display: flex; gap: 5px; margin-top: auto; }
.reason__dots i { width: 5px; height: 5px; border-radius: 3px; background: var(--line-2); transition: background .3s, width .3s; }
.reason__dots i.on { background: var(--mint); width: 14px; }
.reason--in { animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }

/* Constats */
.insight { margin: 0; font-size: 15px; line-height: 1.5; padding-left: 16px; position: relative; }
.insight::before { content: ''; position: absolute; left: 0; top: 0.6em; width: 6px; height: 6px; border-radius: 3px; background: var(--mint); }

/* Calendrier du mois */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
@media (max-width: 360px) { .cal { gap: 3px; } .cal__day i { display: none; } }
.cal__head { text-align: center; font-size: 11px; font-weight: 700; color: var(--text-3); padding-bottom: 2px; }
.cal__day { aspect-ratio: 1; min-width: 0; border: 0; border-radius: 10px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  background: var(--surface-2); color: var(--text-2); font-family: var(--font-num); font-size: 13px; font-weight: 600; }
.cal__day i { font-style: normal; font-size: 10px; opacity: 0.85; }
.cal--future { background: transparent; color: var(--text-3); opacity: 0.5; }
.cal--none { background: transparent; border: 1px dashed var(--line); }
.cal--level1 { background: color-mix(in srgb, var(--data) 30%, var(--surface-2)); color: var(--text); }
.cal--level2 { background: color-mix(in srgb, var(--data) 55%, var(--surface-2)); color: var(--text); }
.cal--level3 { background: color-mix(in srgb, var(--data) 80%, var(--surface-2)); color: var(--text); }
.cal--level4 { background: var(--data); color: #fff; box-shadow: inset 0 0 0 1.5px var(--data-hi); }
.cal--clean { background: var(--mint); color: var(--on-mint); }
.cal--used { background: var(--line); color: var(--text-2); }
.cal--today { background: transparent; border: 1.5px dashed var(--mint); color: var(--mint); }
.cal--is-today { box-shadow: inset 0 0 0 2px var(--text); }
.is-entering .cal__day { animation: pop 0.35s cubic-bezier(0.3, 1.4, 0.5, 1) both; animation-delay: 0.15s; }

/* Aide : questions dépliables */
.faq { background: var(--surface); border-radius: 18px; }
.faq summary { list-style: none; cursor: pointer; min-height: 56px; padding: 14px 44px 14px 18px; position: relative; font-weight: 700; font-size: 15px; display: flex; align-items: center; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: ''; position: absolute; right: 20px; top: 50%; width: 8px; height: 8px; border-right: 2px solid var(--text-3); border-bottom: 2px solid var(--text-3); transform: translateY(-70%) rotate(45deg); transition: transform .2s; }
.faq[open] summary::after { transform: translateY(-30%) rotate(-135deg); }
.faq__body { padding: 0 18px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 15px; line-height: 1.55; color: var(--text-2); }
.faq__body strong { color: var(--text); }
.fold__body { gap: 14px; padding-top: 4px; }
.field--text { flex-direction: column; align-items: stretch; gap: 0; padding-top: 12px; }
.field__mini { font-size: 13px; color: var(--text-3); }
.field--text input { width: 100%; min-height: 40px; border: 0; background: transparent; font-family: var(--font-text); font-size: 16px; text-align: left; padding: 0; outline: none; }
.field--text input::placeholder { color: var(--text-3); }
.fold summary { min-height: 64px; padding: 16px 48px 16px 20px; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; }
.fold { border-radius: var(--r-lg); }
.fold .faq__body { padding: 0 20px 20px; }

/* Stepper ml */
.stepper { display: flex; align-items: center; gap: 2px; flex: none; }
.stepper .icon-btn { font-size: 22px; font-weight: 600; color: var(--text-2); }
.ml-row__title { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stepper__box { width: 76px; height: 44px; border-radius: 12px; background: var(--surface-2); display: flex; align-items: center; gap: 4px; padding: 0 10px; }
.stepper__box input { width: 100%; min-width: 0; border: 0; outline: none; background: transparent; text-align: right; font-family: var(--font-num); font-size: 16px; }
.stepper__box:focus-within { box-shadow: 0 0 0 1px var(--mint); }

/* Graphes SVG */
.chart { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--font-text); }
.c-data { fill: var(--data); }
.c-data-hi { fill: var(--data-hi); }
.c-data-muted { fill: var(--line-2); }
.c-warm { fill: var(--warm-soft); }
.c-warm-hi { fill: var(--warm); }
.c-mint { fill: var(--mint); }
.c-empty { fill: var(--line); }
.c-track { fill: var(--surface-2); }
.c-avg { stroke: var(--text-3); stroke-width: 1; stroke-dasharray: 4 4; }
.c-label { font-size: 11px; fill: var(--text-3); }
.c-label-hi { fill: var(--text); }
.c-row-label { font-size: 13px; fill: var(--text); }
.c-row-pct { font-size: 13px; fill: var(--text-2); font-family: var(--font-num) !important; }
.c-day { fill: var(--surface-2); }
.c-day--clean, .c-day--ok { fill: var(--mint); }
.c-day--today { fill: transparent; stroke: var(--mint); stroke-dasharray: 4 3; }
.c-day--used, .c-day--ko { fill: var(--line); }
.c-day-label { font-size: 12px; font-family: var(--font-num) !important; fill: var(--text-2); font-weight: 600; }
.c-day-label--clean, .c-day-label--ok { fill: var(--on-mint); }
.c-line { fill: none; stroke: var(--mint); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.c-area { fill: var(--mint-dim); }
.c-dot { fill: var(--bg); stroke: var(--mint); stroke-width: 2.5; }
.ghost-chart rect { fill: transparent; stroke: var(--line); stroke-dasharray: 4 3; }
.ghost-chart rect.c-data-hi { fill: var(--data); stroke: none; }

/* =========================================================================
   6. Feuille du bas, toast
   ========================================================================= */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); opacity: 0; transition: opacity .15s; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
  max-height: calc(100dvh - var(--safe-top) - 24px); overflow-y: auto;
  background: var(--sheet); border-top: 1px solid var(--line); border-radius: 28px 28px 0 0;
  padding: 12px var(--gutter) calc(var(--safe-bottom) + 28px);
  display: flex; flex-direction: column; gap: 22px;
  transform: translateY(100%); transition: transform .2s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.sheet__grabber { align-self: center; width: 40px; height: 4px; border-radius: 2px; background: var(--line); }
.sheet-open .scrim { opacity: 1; }
.sheet-open .sheet { transform: none; }
.sheet .inner { max-width: 480px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.toast {
  position: fixed; left: 50%; z-index: 50;
  bottom: calc(var(--tabbar-h) + 2px + var(--bar-pad) + 84px);
  transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
  width: min(calc(100% - 32px), 440px); min-height: 52px; padding: 4px 8px 4px 18px; border-radius: 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--text); color: var(--bg); font-size: 15px; font-weight: 600;
  box-shadow: var(--shadow); transition: opacity .2s, transform .2s;
}
.toast.is-visible { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { min-height: 44px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

/* =========================================================================
   Animations — discrètes, une seule fois à l'arrivée sur un écran
   ========================================================================= */
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes growY { from { transform: scaleY(0); } }
@keyframes growX { from { transform: scaleX(0); } }
@keyframes pop { from { opacity: 0; transform: scale(0.6); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes bump { 40% { transform: scale(1.09); } }
.is-entering > * { animation: rise 0.26s cubic-bezier(0.2, 0.8, 0.2, 1) both; animation-delay: calc(var(--i, 0) * 22ms); }
/* Le relevé ne doit jamais attendre une animation. */
.is-entering > .no-enter { animation: none; }
.is-entering .chart rect { transform-box: fill-box; }
.is-entering .chart rect.c-data, .is-entering .chart rect.c-data-hi, .is-entering .chart rect.c-warm,
.is-entering .chart rect.c-warm-hi, .is-entering .chart rect.c-empty {
  transform-origin: 50% 100%; animation: growY 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.15s both;
}
.is-entering .chart--h rect.c-data, .is-entering .chart--h rect.c-data-muted { transform-origin: 0 50%; animation: growX 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 0.15s both; }
.is-entering .chart rect.c-day { transform-origin: 50% 50%; animation: pop 0.4s cubic-bezier(0.3, 1.4, 0.5, 1) 0.15s both; }
.is-entering .c-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1s ease-out 0.2s forwards; }
.is-entering .c-area, .is-entering .c-dot { animation: fadeIn 0.6s ease-out 0.8s both; }
.is-entering .progress > span { transform-origin: 0 50%; animation: growX 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s both; }
.is-entering .tl--done .tl__node, .is-entering .tl--next .tl__node { animation: pop 0.45s cubic-bezier(0.3, 1.4, 0.5, 1) 0.25s both; }
.is-entering .done-mark { animation: pop 0.5s cubic-bezier(0.3, 1.5, 0.5, 1) 0.1s both; }
.bump { display: inline-block; animation: bump 0.45s cubic-bezier(0.3, 1.6, 0.5, 1); }
.btn, .chip, .scale-btn, .option, .icon-btn, .entry, .segmented :is(button, label), .fab, .tab svg { transition: transform 0.12s ease, background-color 0.15s, color 0.15s, border-color 0.15s; }
.btn:active, .chip:active, .scale-btn:active, .option:active, .icon-btn:active, .segmented :is(button, label):active { transform: scale(0.96); }
.entry:active { background: var(--surface); }
.fab:active { transform: translateX(-50%) scale(0.96); }
.tab:active svg { transform: scale(0.9); }

/* Aujourd'hui : la cellule (au repos, seule la membrane se déforme ; le reste suit la physique de Cell) */
.cellwrap { position: relative; height: 372px; margin-top: 4px; }
.goo-layer { position: absolute; inset: 0; pointer-events: none; }
.goo-layer.is-gooey { filter: url(#goo); }
.cell { position: absolute; left: 50%; top: 122px; width: var(--size); height: var(--size); margin: calc(var(--size) / -2) 0 0 calc(var(--size) / -2); transform-origin: 50% 70%; }
.cell__body { position: absolute; inset: 0; background: radial-gradient(circle at 36% 30%, #C9F5E8 0%, #A6EAD6 40%, #8EDDC6 100%);
  border-radius: 56% 44% 53% 47% / 48% 57% 43% 52%; animation: cellMorph 14s ease-in-out infinite, cellBreathe 6s ease-in-out infinite; }
@keyframes cellMorph { 0%, 100% { border-radius: 56% 44% 53% 47% / 48% 57% 43% 52%; } 25% { border-radius: 48% 52% 46% 54% / 55% 47% 53% 45%; } 50% { border-radius: 53% 47% 57% 43% / 45% 54% 46% 55%; } 75% { border-radius: 46% 54% 50% 50% / 52% 44% 56% 48%; } }
@keyframes cellBreathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.022); } }
.cell__text { position: absolute; left: 50%; top: 122px; width: 220px; margin-left: -110px; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; color: #0F2A23; pointer-events: none; }
.cell__num { display: inline-block; font-family: var(--font-num); font-size: 80px; font-weight: 600; line-height: 0.92; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.cell__label { font-size: 13px; font-weight: 700; color: #24584A; }
.goo-btns, .cell-btns { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 12px; }
.goo-layer .goo-btn { visibility: hidden; }
.goo-layer .goo-btn.is-active { visibility: visible; }
.goo-btn { height: 104px; border-radius: 32px; background: linear-gradient(180deg, #B2EEDC 0%, #9FE8D2 60%, #92E0C9 100%); transform-origin: 50% 100%; }
.cell-btns .log-btn { height: 104px; border-radius: 32px; border-color: transparent; background: transparent; color: #0F2A23; transform-origin: 50% 100%; transition: none; }
.cell-btns .log-btn:active { background: transparent; transform: none; }
.cell-drop { position: absolute; left: 0; top: 0; border-radius: 50%; background: #ABECD9; will-change: transform; }
@media (prefers-reduced-motion: reduce) { .cell__body { animation: none; } }

/* Aujourd'hui : halo d'ambiance, semaine, point « en direct » */
.ambient { position: absolute; left: 0; right: 0; top: -160px; height: 460px; overflow: hidden; pointer-events: none; }
.ambient::before { content: ''; position: absolute; inset: 0 -15%;
  background: radial-gradient(closest-side at 35% 50%, var(--glow-a), transparent), radial-gradient(closest-side at 70% 40%, var(--glow-b), transparent);
  animation: drift 16s ease-in-out infinite alternate; will-change: transform; }
.ambient--quit { --glow-b: var(--glow-a); }
:root { --glow-a: rgba(94, 230, 196, 0.10); --glow-b: rgba(242, 179, 107, 0.08); }
:root[data-theme="light"] { --glow-a: rgba(14, 127, 105, 0.08); --glow-b: rgba(163, 86, 15, 0.06); }
@keyframes drift { from { transform: translate3d(-5%, 0, 0) scale(1); } to { transform: translate3d(5%, 24px, 0) scale(1.08); } }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; margin-top: 14px; max-width: 320px; }
.week__col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.week__bar { width: 100%; max-width: 20px; height: calc(4px + var(--h) * 34px); border-radius: 5px; background: var(--surface-2); transform-origin: 50% 100%; }
.week__bar.has { background: var(--data); }
.is-today .week__bar.has { background: var(--mint); }
.is-sel .week__bar.has { background: var(--data-hi); }
.week__d { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; }
.is-today .week__d { color: var(--mint); }
.week__dot { width: 22px; height: 22px; border-radius: 11px; border: 2px solid var(--line-2); display: flex; align-items: center; justify-content: center; color: var(--on-mint); }
.week__dot svg { width: 12px; height: 12px; stroke-width: 3.2; }
.week__dot.is-clean { background: var(--mint); border-color: var(--mint); }
.week__dot.is-now { border-color: var(--mint); border-style: dashed; }
.week__dot.is-before { border-color: var(--line); border-style: dotted; }
.week__dot.is-taken { border-color: var(--warm-soft); }
.is-entering .week__bar { animation: growY 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; animation-delay: calc(0.2s + var(--j) * 55ms); }
.is-entering .week__dot { animation: pop 0.45s cubic-bezier(0.3, 1.5, 0.5, 1) both; animation-delay: calc(0.2s + var(--j) * 60ms); }
.live-dot { position: relative; display: inline-block; width: 8px; height: 8px; border-radius: 4px; background: var(--mint); margin-right: 8px; vertical-align: 1px; }
.live-dot::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: var(--mint); animation: livePulse 2.4s ease-out infinite; }
@keyframes livePulse { from { transform: scale(1); opacity: 0.6; } to { transform: scale(2.8); opacity: 0; } }
.log-btn { background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.045), transparent 60%); position: relative; overflow: hidden; }
.log-btn svg { transition: transform 0.25s cubic-bezier(0.3, 1.6, 0.5, 1); }
.log-btn:active svg { transform: rotate(90deg) scale(1.1); }
.goal .progress > span { position: relative; overflow: hidden; }
.goal .progress > span::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent); transform: translateX(-100%); animation: sheen 2.2s ease-in-out 1.1s 2; }
@keyframes sheen { to { transform: translateX(100%); } }

/* Animations « sympa » : choix, éclats, +1, onglets, ouverture */
@keyframes pickPop { 0% { transform: scale(0.92); } 55% { transform: scale(1.06); } 100% { transform: scale(1); } }
.pick-pop { animation: pickPop 0.32s cubic-bezier(0.3, 1.5, 0.5, 1); }
.burst { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
.burst i { position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; border-radius: 3px; background: var(--c); opacity: 0;
  animation: burst 0.8s cubic-bezier(0.2, 0.8, 0.3, 1) forwards; }
@keyframes burst {
  0% { opacity: 1; transform: rotate(var(--a)) translateX(0) scale(1); }
  100% { opacity: 0; transform: rotate(var(--a)) translateX(var(--d)) scale(0.4); }
}
.float-text { position: absolute; left: 70px; top: 6px; font-family: var(--font-num); font-weight: 700; font-size: 22px; color: var(--mint); pointer-events: none;
  animation: floatUp 0.9s ease-out forwards; }
