  /** Rappel discret d'exporter (iOS peut effacer les données). */
  backupCard() {
    if (!Calc.backupDue(Store.data)) return '';
    const last = Store.data.settings.lastExportAt;
    const text = last
      ? `Ta dernière sauvegarde date de ${Math.floor((Date.now() - last) / DAY_MS)} jours.`
      : 'Tu n\u2019as encore jamais exporté tes données.';
    return `<section class="card card--outline" style="gap:10px">
      <span class="label">Sauvegarde</span>
      <span class="small">${text} iOS peut effacer les données d'une web app : un export te protège.</span>
      <div class="grid-2"><button type="button" class="btn" data-action="backup-snooze">Plus tard</button>
        <button type="button" class="btn btn--primary" data-action="export">Exporter</button></div>
    </section>`;
  },

  /** Ligne « cible du jour » de la réduction progressive. */
  targetLine(key, total, isToday) {
    const target = Calc.reductionTarget(Store.data.settings.reduction, key);
    if (target === null) return '';
    let status;
    if (total < target) status = isToday ? `encore ${target - total} avant la cible` : 'cible respectée';
    else if (total === target) status = isToday ? 'cible atteinte' : 'cible respectée';
    else status = 'au-dessus de la cible, ce n’est qu’un repère';
    const ok = total <= target;
    return `<p class="small"><span class="pill ${ok ? 'pill--mint' : ''}" style="padding:4px 10px">Cible ${target}</span>
      <span class="${ok ? 'muted' : 'faint'}" style="margin-left:6px">${status}</span></p>`;
  },

  /** Aujourd'hui — phase arrêt : temps écoulé en direct, économies, doses évitées. */
  todayQuit() {
    const st = Store.data.settings, now = Date.now();
    const streak = Calc.streaks(Store.data.intakes, st.quitStart, now);
    const av = Calc.avoided(Store.data.intakes, st, now, Store.data.vapeMl);
    const dayN = Dates.diffDays(Dates.dayKey(st.quitStart), Dates.todayKey()) + 1;
    const visible = Calc.visibleMilestones(st, Store.data.intakes);
    const next = Calc.nextMilestone(streak.current, visible);
    // Repère tout juste atteint, ou atteint il y a moins de 6 h : la carte reste affichée.
    const recent = st.milestoneShownAt && now - st.milestoneShownAt < 6 * 3600000
      ? visible.filter((m) => m.h <= streak.current / 3600000 && m.h === st.seenMilestoneH)[0] : null;
    const fresh = Calc.newMilestone(streak.current, visible, st.seenMilestoneH) || recent || null;
    const traversed = Store.data.cravings.filter((c) => c.resolved && c.ts >= st.quitStart).length;
    const money = av.money === null ? '—' : Util.formatMoney(av.money);
    const units = av.vape.units !== null && av.vape.avoided > 0 ? ` · ≈ ${Util.formatNum(av.vape.units, 1)} ${st.vapeFormat === 'flacon' ? 'flacon' : 'capsule'}${av.vape.units >= 2 ? 's' : ''}` : '';
    return `<div class="screen screen--today">
      <div class="ambient ambient--quit" aria-hidden="true"></div>
      <header class="header"><span class="wordmark">STASE</span><span class="pill pill--mint">Arrêt · jour ${dayN}</span></header>

      ${fresh ? `<section class="card card--featured milestone-new" style="gap:8px">
        <div class="row" style="justify-content:flex-start;gap:12px"><span class="done-mark">${Icon.check}</span>
          <span class="stack" style="gap:2px"><span class="label" style="color:var(--mint)">Nouveau repère atteint</span><span class="value" style="font-size:22px">${Util.esc(fresh.title)}</span></span></div>
        <p class="small muted">${Util.esc(fresh.text)}</p>
      </section>` : ''}

      <section class="stack" style="gap:6px">
        <span class="label"><span class="live-dot" aria-hidden="true"></span>Sans nicotine depuis</span>
        <span class="big-number" style="font-size:72px;line-height:1" data-live="since-big">${Screens.sinceBig(streak.current)}</span>
        <span class="num muted" style="font-size:22px" data-live="since-small">${Screens.sinceSmall(streak.current)}</span>
        ${Screens.weekStrip(Dates.todayKey(), true)}
      </section>

      ${next ? `<a class="stack" href="#/corps" style="gap:10px;text-decoration:none;color:inherit">
        <div class="row small"><span class="muted">Prochain repère : ${next.title}</span><span class="num" style="color:var(--mint);font-weight:600">${Math.floor(next.progress * 100)} %</span></div>
        <div class="progress"><span style="width:${(next.progress * 100).toFixed(1)}%"></span></div>
      </a>` : ''}

      <div class="grid-2">
        <div class="card" style="padding:18px;gap:6px"><span class="small muted">Économisé</span><span class="value value--mint value--money" ${av.money !== null ? `data-countup="${av.money}"` : ''}>${money}</span>
          ${av.missing.length ? '<a class="tiny faint" href="#/reglages">prix à renseigner</a>' : ''}</div>
        <div class="card" style="padding:18px;gap:6px"><span class="small muted">Meilleur enchaînement</span><span class="value">${Screens.durationShort(streak.best)}</span></div>
        ${Calc.tracks('snus') ? `<div class="card" style="padding:18px;gap:6px${Calc.tracks('vape') ? '' : ';grid-column:span 2'}"><span class="small muted">Snus évités</span><span class="value">${av.snus.avoided}</span><span class="tiny faint">portion${av.snus.avoided > 1 ? 's' : ''}</span></div>` : ''}
        ${Calc.tracks('vape') ? `<div class="card" style="padding:18px;gap:6px${Calc.tracks('snus') ? '' : ';grid-column:span 2'}"><span class="small muted">Vape évitée</span>
          ${av.vape.ml !== null
            ? `<span class="value">${Util.formatNum(av.vape.ml, 1)} <span style="font-size:18px">ml</span></span><span class="tiny faint">${av.vape.avoided} session${av.vape.avoided > 1 ? 's' : ''}${units}</span>`
            : `<span class="value">${av.vape.avoided}</span><span class="tiny faint">session${av.vape.avoided > 1 ? 's' : ''}${units}</span>`}</div>` : ''}
      </div>
      ${Screens.goalProgress(st, av.money)}
      ${av.nicotineMg ? `<p class="small muted" style="margin-top:-8px">≈ <span class="num" style="color:var(--text)">${Util.formatNum(av.nicotineMg, 0)} mg</span> de nicotine évités.</p>` : ''}
      ${st.baseline ? '' : '<p class="small muted">Pas de référence : indique ta consommation habituelle dans <a class="link--mint" href="#/reglages">Réglages</a> pour calculer économies et doses évitées.</p>'}

      <section class="card card--outline" style="gap:8px">
        <span class="label">Message du jour</span>
        <p style="font-size:16px;line-height:1.5">${Util.esc(Messages.forDay(Dates.todayKey(), Calc.stage(streak.current), st.profile.concerns))}</p>
        ${traversed ? `<span class="small faint">${traversed} envie${traversed > 1 ? 's' : ''} traversée${traversed > 1 ? 's' : ''} depuis le début.</span>` : ''}
      </section>

      ${Screens.backupCard()}
      <div class="row" style="justify-content:center;gap:20px">
        <a class="link" href="#/reprendre">Noter une prise</a>
        <a class="link" href="#/historique">Historique</a>
      </div>
    </div>`;
  },

  /** Carte « Objectif » : l'argent économisé remplit l'achat choisi dans Réglages. */
  goalProgress(st, money) {
    const g = Calc.goal(st, money);
    if (!g) return '';
    return `<a class="card goal${g.done ? ' card--featured goal--done' : ''}" href="#/reglages" style="gap:10px;text-decoration:none;color:inherit">
      <div class="row" style="align-items:baseline"><span class="small"><span class="muted">Objectif · </span><strong>${Util.esc(g.name)}</strong></span>
        <span class="num" style="color:var(--mint);font-weight:600">${!g.pct && g.saved > 0 ? '< 1' : g.pct} %</span></div>
      <div class="progress"><span style="width:${(g.ratio * 100).toFixed(1)}%"></span></div>
      <span class="tiny faint">${g.done
        ? `Objectif atteint : ${Util.formatMoney(g.price)} économisés. Tu peux te l’offrir.`
        : `${Util.formatMoney(g.saved)} sur ${Util.formatMoney(g.price)} · encore ${Util.formatMoney(g.left)}`}</span>
    </a>`;
  },

  sinceBig(ms) { const d = Dates.splitDuration(ms); return d.d ? `${d.d} j ${d.h} h` : `${d.h} h`; },
  sinceSmall(ms) { const d = Dates.splitDuration(ms); return `${Dates.pad(d.m)} min ${Dates.pad(d.s)} s`; },
  durationShort(ms) {
    const d = Dates.splitDuration(ms);
    if (d.d) return `${d.d} j${d.h ? ` ${d.h} h` : ''}`;
    if (d.h) return `${d.h} h`;
    return `${d.m} min`;
  },

  /** Après une prise en phase arrêt : rien n'est effacé, on note et on repart. */
  reprendre() {
    const st = Store.data.settings;
    if (st.phase !== 'arret') return Screens.todayObservation();
    const now = Date.now();
    const clean = Calc.cleanDays(Store.data.intakes, st.quitStart, now);
    const best = Calc.streaks(Store.data.intakes, st.quitStart, now).best;
    const d = App.relapseDraft || (App.relapseDraft = { type: Calc.defaultType(), trigger: null });
    return `<div class="screen">
      <header class="header"><span class="wordmark">STASE</span>
        <a class="icon-btn" href="#/aujourdhui" aria-label="Fermer sans rien noter">${Icon.close}</a></header>
      <section class="stack" style="gap:14px;padding-top:8px">
        <h1 class="title title--soft">Une prise n'efface pas le chemin parcouru.</h1>
        <p class="muted">La plupart des gens arrêtent après plusieurs essais. Ce que tu as appris reste acquis. On note, et on repart.</p>
      </section>
      <div class="grid-2">
        <div class="card" style="padding:18px;gap:6px"><span class="small muted">Jours sans nicotine, au total</span><span class="value value--mint" style="font-size:40px">${clean}</span></div>
        <div class="card" style="padding:18px;gap:6px"><span class="small muted">Meilleur enchaînement</span><span class="value" style="font-size:40px">${Screens.durationShort(best)}</span></div>
      </div>
      <section class="stack">
        ${Calc.usage(Store.data.settings, Store.data.intakes) === 'both' ? `<span class="label">Ce que tu as pris</span>
        ${Screens.segmented('', [['snus', 'Snus'], ['vape', 'Vape']], d.type, 'Type', 'relapse-type')}` : ''}
      </section>
      <section class="stack">
        <span class="label">Le contexte, si tu veux</span>
        <div class="grid-3">${TRIGGERS.map(([k, label]) =>
          `<button type="button" class="chip" data-action="relapse-trigger" data-value="${k}" aria-pressed="${d.trigger === k}">${label}</button>`).join('')}</div>
      </section>
      <div class="stack" style="gap:8px">
        <button type="button" class="btn btn--primary btn--block" data-action="relapse-save">Reprendre</button>
        <button type="button" class="link" data-action="relapse-observation" style="align-self:center">Noter et repasser en observation pour l'instant</button>
      </div>
    </div>`;
  },

  /** « J'ai une envie » : minuteur de 10 min + respiration, puis mini-relevé. */
  envie() {
    const c = Craving.state();
    return c.step === 'log' ? Screens.envieLog(c) : Screens.envieTimer(c);
  },

  envieTimer(c) {
    const el = Craving.elapsed(c);
    const v = Craving.view(el, c);
    return `<div class="screen" style="align-items:center;min-height:calc(100dvh - var(--safe-top) - var(--safe-bottom) - 60px)">
      <header class="header" style="align-self:stretch"><span class="label" style="color:var(--warm)">Envie en cours</span>
        <button type="button" class="icon-btn" data-action="craving-close" aria-label="Fermer">${Icon.close}</button></header>
      <section class="stack" style="align-self:stretch;gap:8px">
        <h1 class="title title--soft">Ça va passer.</h1>
        <p class="muted small">Suis le cercle. Une envie dure rarement plus de dix minutes.</p>
      </section>
      <div class="breath" aria-hidden="true" style="animation-delay:-${(el / 1000) % 10}s;animation-play-state:${c.pausedAt ? 'paused' : 'running'}">
        <svg viewBox="0 0 290 290"><circle cx="145" cy="145" r="138" class="breath__track"/>
          <circle cx="145" cy="145" r="138" class="breath__ring" stroke-dasharray="${Craving.CIRC}" stroke-dashoffset="${v.dash}" data-live="craving-ring"/></svg>
        <div class="breath__disc" style="animation-delay:-${(el / 1000) % 10}s;animation-play-state:${c.pausedAt ? 'paused' : 'running'}"></div>
        <div class="breath__text"><span class="breath__phase" data-live="craving-phase">${v.phase}</span><span class="small muted" data-live="craving-hint">${v.hint}</span></div>
      </div>
      <div class="stack" style="align-items:center;gap:2px">
        <span class="num" style="font-size:48px;font-weight:500" data-live="craving-left">${v.left}</span>
        <span class="small faint">restantes</span>
      </div>
      ${Screens.reasonCard(el)}
      <div class="grid-2 envie-actions">
        <button type="button" class="btn" data-action="craving-pause">${c.pausedAt ? 'Reprendre' : 'Pause'}</button>
        <label class="btn btn--primary hap-btn" role="button" tabindex="0" data-hap="craving-done"><input type="checkbox" switch class="hap" tabindex="-1" aria-hidden="true">C'est passé</label>
      </div>
    </div>`;
  },

  /** Carte « tes raisons » : change toutes les 10 s, au rythme d'une respiration. */
  reasonCard(el) {
    const list = Calc.reasons(Store.data);
    const idx = Math.floor(el / 10000) % list.length;
    const r = list[idx];
    return `<section class="reason" aria-live="polite" data-idx="${idx}" data-count="${list.length}">
      <span class="label" style="color:var(--mint)" data-live="reason-title">${Util.esc(r.title)}</span>
      <p data-live="reason-text">${Util.esc(r.text)}</p>
      ${list.length > 1 ? `<span class="reason__dots" aria-hidden="true">${list.map((_, i) => `<i class="${i === Math.floor(el / 10000) % list.length ? 'on' : ''}"></i>`).join('')}</span>` : ''}
    </section>`;
  },

  envieLog(c) {
    const dur = Dates.splitDuration(c.duration);
    const st = Store.data.settings;
    const since = st.phase === 'arret' ? st.quitStart : 0;
    const nth = Store.data.cravings.filter((x) => x.resolved && x.ts >= since).length + 1;
    return `<div class="screen">
      <section class="stack" style="gap:12px">
        <span class="done-mark" style="width:48px;height:48px;border-radius:24px">${Icon.check}</span>
        <h1 class="title title--soft">Elle est passée.</h1>
        <p class="muted">${dur.m} min ${Dates.pad(dur.s)} s. Ce sera ta ${nth}<sup>${nth === 1 ? 're' : 'e'}</sup> envie traversée${st.phase === 'arret' ? ' depuis l’arrêt' : ''}.</p>
      </section>
      ${IntakeSheet.triggersHtml(c.trigger).replace(/sheet-trigger/g, 'craving-trigger')}
      ${IntakeSheet.intensityHtml(c.intensity).replace(/sheet-intensity/g, 'craving-intensity').replace('Intensité de l\'envie', 'Intensité au plus fort')}
      <section class="card card--outline"><p style="font-size:16px;line-height:1.5">Chaque envie traversée sans céder affaiblit un peu l'automatisme. Celle-ci compte.</p>
        ${Store.data.settings.profile.why ? `<p class="small muted">Et souviens-toi : ${Util.esc(Store.data.settings.profile.why)}</p>` : ''}</section>
      <div class="stack" style="gap:6px">
        <button type="button" class="btn btn--primary btn--block" data-action="craving-save">Enregistrer</button>
        <div class="row" style="justify-content:center;gap:16px">
          <button type="button" class="link" data-action="craving-skip">Passer</button>
          <button type="button" class="link" data-action="craving-gave-in">J'ai fini par prendre</button>
        </div>
      </div>
    </div>`;
  },

  /** Vape : millilitres de liquide du jour, avec la nicotine correspondante. */
  mlRow(key, isToday) {
    const st = Store.data.settings;
    if (!Calc.tracks('vape')) return '';
    const entry = Store.data.vapeMl.find((x) => x.date === key);
    const ml = entry ? entry.ml : null;
    const mg = ml !== null && st.vapeMgPerMl > 0 ? ml * st.vapeMgPerMl : null;
    const hint = ml === null
      ? ''
      : mg !== null ? `≈ ${Util.formatNum(mg, 0)} mg de nicotine (${Util.formatNum(st.vapeMgPerMl)} mg/ml)`
        : '<a class="link--mint" href="#/reglages">Indique le taux de nicotine</a> pour estimer les mg.';
    return `<section class="card ml-row" style="padding:12px 12px 12px 16px;gap:4px">
      <div class="row">
        <span class="ml-row__title">Vape ${isToday ? 'du jour' : 'ce jour-là'}</span>
        <span class="stepper">
          <button type="button" class="icon-btn icon-btn--ghost" data-action="ml-step" data-delta="-0.1" aria-label="Moins 0,1 ml">−</button>
          <label class="stepper__box"><input type="text" inputmode="decimal" data-ml="${key}" value="${ml === null ? '' : Util.formatNum(ml, 1)}" placeholder="0" aria-label="Millilitres vapotés" autocomplete="off"><span class="field__unit">ml</span></label>
          <button type="button" class="icon-btn icon-btn--ghost" data-action="ml-step" data-delta="0.1" aria-label="Plus 0,1 ml">+</button>
        </span>
      </div>
      ${hint ? `<span class="tiny faint">${hint}</span>` : ''}
    </section>`;
  },

  /** Navigation entre les jours (pour corriger un jour passé). */
  dayNav(key, isToday) {
    const label = (isToday ? 'Aujourd’hui · ' : '') + Dates.formatDayLong(Dates.keyToStart(key));
    return `<div class="day-nav">
      <button type="button" class="icon-btn icon-btn--ghost" data-action="day-prev" aria-label="Jour précédent">${Icon.prev}</button>
      <span class="label">${Util.esc(label)}</span>
      <button type="button" class="icon-btn icon-btn--ghost" data-action="day-next" aria-label="Jour suivant" ${isToday ? 'disabled' : ''}>${Icon.next}</button>
    </div>`;
  },

  intakeRow(x) {
    const label = x.trigger ? TRIGGER_LABEL[x.trigger] : 'Sans contexte';
    const dots = [1, 2, 3, 4, 5].map((i) => `<span class="${x.intensity && i <= x.intensity ? 'on' : ''}"></span>`).join('');
    return `<button type="button" class="entry" data-action="open-intake" data-id="${Util.esc(x.id)}"
        aria-label="Modifier la prise de ${Dates.formatTime(x.ts)}">
      <span class="entry__time num">${Dates.formatTime(x.ts)}</span>
      <span class="entry__kind"><span class="marker marker--${x.type}"></span>${x.type === 'snus' ? 'Snus' : 'Vape'}</span>
      <span class="entry__ctx ${x.trigger ? '' : 'faint'}">${label}</span>
      <span class="dots" aria-label="${x.intensity ? `Intensité ${x.intensity} sur 5` : 'Intensité non notée'}">${dots}</span>
    </button>`;
  },

  /**
   * Les 7 derniers jours en un coup d'œil : barres (observation, prises par jour)
   * ou pastilles (arrêt : jour sans prise depuis l'arrêt).
   */
  weekStrip(endKey, quit) {
    const st = Store.data.settings, today = Dates.todayKey();
    const fmt = new Intl.DateTimeFormat('fr-FR', { weekday: 'narrow' });
    const quitKey = quit && st.quitStart ? Dates.dayKey(st.quitStart) : null;
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const k = Dates.addDays(endKey, -i);
      days.push({ k, n: Calc.onDay(Store.data.intakes, k).filter((x) => !quit || x.ts >= st.quitStart).length });
    }
    const max = Math.max(1, ...days.map((d) => d.n));
    const cols = days.map((d, j) => {
      const cls = d.k === today ? ' is-today' : d.k === endKey ? ' is-sel' : '';
      const letter = `<span class="week__d">${fmt.format(Dates.keyToStart(d.k))}</span>`;
      if (!quit) return `<span class="week__col${cls}" style="--j:${j}"><span class="week__bar${d.n ? ' has' : ''}" style="--h:${(d.n / max).toFixed(2)}"></span>${letter}</span>`;
      const state = d.k < quitKey ? 'is-before' : d.n ? 'is-taken' : d.k === today ? 'is-now' : 'is-clean';
      return `<span class="week__col${cls}" style="--j:${j}"><span class="week__dot ${state}">${state === 'is-clean' ? Icon.check : ''}</span>${letter}</span>`;
    }).join('');
    const label = quit
      ? `${days.filter((d) => d.k >= quitKey && d.k < today && !d.n).length} jours sans prise sur les 7 derniers`
      : `Prises des 7 derniers jours : ${days.map((d) => d.n).join(', ')}`;
    return `<div class="week${quit ? ' week--quit' : ''}" role="img" aria-label="${label}">${cols}</div>`;
  },

  todayEmpty(isToday) {
    return `<div class="card card--empty">
      <strong>${isToday ? 'Rien de noté aujourd’hui.' : 'Rien de noté ce jour-là.'}</strong>
    </div>`;
  },

  stats() {
    return Store.data.settings.phase === 'arret' ? Screens.statsQuit() : Screens.statsObservation();
  },

  /** Constats automatiques (3 au plus). */
  insightsCard() {
    const list = Calc.insights(Store.data);
    if (!list.length) return '';
    return `<section class="card card--featured insights" style="gap:10px">
      <span class="row"><span class="label" style="color:var(--mint)">Constats</span><span class="tiny faint">${Store.data.settings.phase === 'arret' ? 'depuis l’arrêt' : '4 dernières semaines'}</span></span>
      ${list.map((t) => `<p class="insight">${Util.esc(t)}</p>`).join('')}
    </section>`;
  },

  /** Calendrier du mois : un coup d'œil sur chaque jour ; toucher un jour l'ouvre. */
  calendarCard() {
    const today = Dates.todayKey();
    const month = App.calMonth || today.slice(0, 7);
    const cells = Calc.monthCells(Store.data, month, today);
    const [y, m] = month.split('-').map(Number);
    const title = new Date(y, m - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
    const isCurrent = month === today.slice(0, 7);
    const arret = Store.data.settings.phase === 'arret';
    const label = (c) => {
      const date = Dates.formatDayLong(Dates.keyToStart(c.key));
      if (c.state === 'future') return date;
      if (c.state === 'clean') return `${date} : sans nicotine`;
      if (c.state === 'today') return `${date} : en cours, sans nicotine`;
      return `${date} : ${c.n} prise${c.n > 1 ? 's' : ''}`;
    };
    return `<section class="card" style="gap:12px">
      <div class="row">
        <button type="button" class="icon-btn icon-btn--ghost" data-action="cal-prev" aria-label="Mois précédent">${Icon.prev}</button>
        <span style="font-weight:700;text-transform:capitalize">${Util.esc(title)}</span>
        <button type="button" class="icon-btn icon-btn--ghost" data-action="cal-next" aria-label="Mois suivant" ${isCurrent ? 'disabled' : ''}>${Icon.next}</button>
      </div>
      <div class="cal" role="grid">
        ${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map((d) => `<span class="cal__head" aria-hidden="true">${d}</span>`).join('')}
        ${cells.map((c) => c === null ? '<span></span>' : `<button type="button" class="cal__day cal--${c.state}${c.today ? ' cal--is-today' : ''}"
          ${c.state === 'future' ? 'disabled' : `data-action="cal-open" data-value="${c.key}"`} aria-label="${Util.esc(label(c))}">
          <span>${c.day}</span>${!arret && c.n ? `<i>${c.n}</i>` : ''}</button>`).join('')}
      </div>
    </section>`;
  },

  /** Stats — phase observation. */
  statsObservation() {
    const intakes = Store.data.intakes;
    if (!intakes.length) return Screens.statsEmpty();
    const n = App.statsRange;
    const today = Dates.todayKey();
    const from = Dates.addDays(today, -(n - 1));
    const inRange = Calc.between(intakes, from, today);
    const avg = Calc.avgPerDay(intakes, today, n);
    const daysKnown = Dates.diffDays(Dates.dayKey(intakes[0].ts), today);
    return `<div class="screen">
      <header class="header">
        <h1 class="title">Stats</h1>
        <div class="segmented" role="group" aria-label="Période" style="width:132px">
          <button type="button" data-action="stats-range" data-value="7" aria-pressed="${n === 7}">7 j</button>
          <button type="button" data-action="stats-range" data-value="30" aria-pressed="${n === 30}">30 j</button>
        </div>
      </header>
      ${Screens.insightsCard()}
      ${Screens.statsReduction(intakes, today)}
      ${Screens.statsDaily(intakes, from, today, n, avg)}
      ${Screens.calendarCard()}
      ${Screens.statsHours(inRange)}
      ${Screens.statsTriggers(inRange)}
      ${Screens.snusTotals(intakes.filter((x) => x.type === 'snus').length, false)}
      ${Screens.statsSpend(intakes, today)}
      ${Screens.statsNicotine(avg)}
    </div>`;
  },

  /** Suivi de la réduction progressive. */
  statsReduction(intakes, today) {
    const red = Store.data.settings.reduction;
    if (!red.on) return '';
    const days = Calc.reductionDays(intakes, red, today, 7);
    const ok = days.filter((d) => d.ok).length;
    const now = Calc.reductionTarget(red, today), next = Calc.reductionTarget(red, Dates.addDays(today, 7));
    return `<section class="card card--featured" style="gap:12px">
      <span class="label" style="color:var(--mint)">Réduction progressive</span>
      ${days.length
        ? `<span class="value" style="font-size:24px">Cible respectée ${ok} jour${ok > 1 ? 's' : ''} sur ${days.length}</span>
           ${Charts.days(days.map((d) => ({ label: `${d.total}/${d.target}`, state: d.ok ? 'ok' : 'ko' })), 'Respect de la cible, jour par jour')}`
        : '<span class="small muted">Le suivi commence demain : aujourd’hui n’est pas terminé.</span>'}
      <p class="small muted">Cible actuelle : ${now} par jour${next !== now ? ` · la semaine prochaine : ${next}` : ''}.</p>
    </section>`;
  },

  /** Stats — phase arrêt : jours sans nicotine, envies, économies. */
  statsQuit() {
    const st = Store.data.settings, now = Date.now(), today = Dates.todayKey();
    const startKey = Dates.dayKey(st.quitStart);
    const allKeys = Dates.range(startKey, today);
    const clean = Calc.cleanDays(Store.data.intakes, st.quitStart, now);
    const cravings = Store.data.cravings.filter((c) => c.ts >= st.quitStart);
    const cKeys = allKeys.slice(-14);
    const perDay = cKeys.map((k) => ({ v: cravings.filter((c) => Dates.dayKey(c.ts) === k).length, label: k === today ? 'Auj.' : String(Number(k.slice(8))), hi: k === today }));
    const traversed = cravings.filter((c) => c.resolved).length;
    const avgInt = Calc.mean(cravings.map((c) => c.intensity));
    const avgDur = Calc.mean(cravings.map((c) => c.duration));
    const series = Calc.savingsSeries(Store.data.intakes, st, now, Store.data.vapeMl);
    const av = Calc.avoided(Store.data.intakes, st, now, Store.data.vapeMl);
    const dayN = allKeys.length;
    return `<div class="screen">
      <header class="header"><h1 class="title">Stats</h1><span class="pill pill--mint">Arrêt · jour ${dayN}</span></header>

      ${Screens.insightsCard()}

      <section class="stack" style="gap:4px;padding:0 4px">
        <span class="small muted">Jours sans nicotine</span>
        <span class="value">${clean} <span class="small muted" style="font-family:var(--font-text);font-weight:500">jour${clean > 1 ? 's' : ''} complet${clean > 1 ? 's' : ''} sur ${Math.max(0, dayN - 1)}</span></span>
      </section>
      ${Screens.calendarCard()}

      <section class="card" style="gap:14px">
        <div class="row" style="align-items:flex-end">
          <div class="stack" style="gap:4px"><span class="small muted">Envies par jour</span>
            <span class="value">${cravings.length}</span></div>
          ${avgInt !== null ? `<span class="small muted">intensité moy. ${Util.formatNum(avgInt, 1)}</span>` : ''}
        </div>
        ${cravings.length ? Charts.bars(perDay, { height: 130, tone: 'warm', aria: 'Envies par jour depuis l’arrêt' }) : '<p class="small faint">Aucune envie notée.</p>'}
      </section>

      <section class="card" style="gap:14px">
        <div class="row" style="align-items:flex-end">
          <div class="stack" style="gap:4px"><span class="small muted">Économies cumulées</span>
            <span class="value value--mint">${av.money === null ? '—' : Util.formatMoney(av.money)}</span></div>
          ${av.money !== null && av.days >= 1 ? `<span class="small muted">≈ ${Util.formatMoney((av.money / av.days) * 30, 0)} par mois</span>` : ''}
        </div>
        ${av.money !== null ? Charts.line(Charts.sample(series.map((p) => p.value), 120), 'Économies cumulées depuis l’arrêt') : '<a class="small link--mint" href="#/reglages">Prix à renseigner</a>'}
      </section>

      ${Screens.snusTotals(av.snus.avoided, true)}
      <div class="grid-2">
        <div class="card" style="padding:18px;gap:6px"><span class="small muted">Envies traversées</span><span class="value" style="font-size:28px">${traversed}</span></div>
        <div class="card" style="padding:18px;gap:6px"><span class="small muted">Durée moyenne</span><span class="value" style="font-size:28px">${avgDur !== null ? `${Math.max(1, Math.round(avgDur / 60000))} min` : '—'}</span></div>
      </div>
    </div>`;
  },

  /** Snus au total (ou évités, en arrêt) et le nombre de boîtes que ça représente. */
  snusTotals(n, quit) {
    if (!Calc.tracks('snus')) return '';
    const per = Store.data.settings.snusPerBox;
    const boxes = per > 0 ? n / per : null;
    return `<div class="grid-2">
        <div class="card" style="padding:18px;gap:6px"><span class="small muted">${quit ? 'Snus évités' : 'Snus au total'}</span><span class="value" style="font-size:28px">${Util.formatNum(n, 0)}</span></div>
        <div class="card" style="padding:18px;gap:6px"><span class="small muted">${quit ? 'Boîtes évitées' : 'Boîtes'}</span><span class="value" style="font-size:28px">${boxes === null ? '—' : Util.formatNum(boxes, 1)}</span></div>
      </div>`;
  },

  statsDaily(intakes, from, today, n, avg) {
    const days = Calc.dailyCounts(intakes, from, today);
    const items = days.map((d, i) => {
      const isToday = d.key === today;
      let label = '';
      if (n === 7) label = isToday ? 'Auj.' : new Date(Dates.keyToStart(d.key)).toLocaleDateString('fr-FR', { weekday: 'narrow' });
      else if ((n - 1 - i) % 7 === 0) label = isToday ? 'Auj.' : String(Number(d.key.slice(8)));
      return { v: d.total, label, hi: isToday };
    });
    const prev = Calc.avgPerDay(intakes, Dates.addDays(today, -n), n);
    const firstKey = Dates.dayKey(intakes[0].ts);
    const comparable = avg && prev && Dates.diffDays(firstKey, Dates.addDays(today, -2 * n)) >= 0;
    const delta = comparable ? avg.total - prev.total : null;
    return `<section class="card" style="gap:16px">
      <div class="row" style="align-items:flex-end">
        <div class="stack" style="gap:4px">
          <span class="small muted">Prises par jour</span>
          <span class="value">${avg ? Util.formatNum(avg.total, 1) : '—'} <span class="small muted" style="font-family:var(--font-text);font-weight:500">${avg ? `moyenne ${avg.days} j` : 'pas encore de jour complet'}</span></span>
        </div>
        ${delta !== null ? `<span class="small muted">${delta > 0 ? '+' : delta < 0 ? '−' : '±'}${Util.formatNum(Math.abs(delta), 1)} vs ${n} j précédents</span>` : ''}
      </div>
      ${Charts.bars(items, { avg: avg ? avg.total : null, aria: `Prises par jour sur ${n} jours` })}
    </section>`;
  },

  statsHours(list) {
    const hist = Calc.hourHistogram(list);
    const peaks = Calc.topHours(hist, 2);
    const items = hist.map((v, h) => ({ v, label: [0, 6, 12, 18, 23].includes(h) ? `${h} h` : '' }));
    return `<section class="card" style="gap:14px">
      <div class="row"><span class="small muted">Répartition par heure</span>
        ${peaks.length ? `<span class="small">Pic : ${peaks.map((h) => `${h} h`).join(' et ')}</span>` : ''}</div>
      ${Charts.bars(items, { height: 110, gap: 3, aria: 'Prises par heure de la journée' })}
    </section>`;
  },

  statsTriggers(list) {
    const rows = Calc.triggerShare(list).map((r) => ({ label: r.label, pct: r.pct, muted: r.key === 'none' }));
    return `<section class="card" style="gap:14px">
      <span class="small muted">Par déclencheur</span>
      ${rows.length ? Charts.hbars(rows) : '<p class="small faint">Aucune prise sur la période.</p>'}
    </section>`;
  },

  statsSpend(intakes, today) {
    const s = Store.data.settings;
    const week = Calc.spendRange(intakes, Store.data.vapeMl, s, Calc.weekStart(today), today);
    const month = Calc.spendRange(intakes, Store.data.vapeMl, s, Calc.monthStart(today), today);
    const yearly = Calc.yearlyCost(s, intakes, Store.data.vapeMl, today);
    const missing = [...new Set([...week.missing, ...month.missing])].filter((t) => Calc.tracks(t, s, intakes));
    const tile = (title, sp, sub) => `<div class="card" style="padding:18px;gap:6px">
        <span class="small muted">${title}</span>
        <span class="value value--money">${sp.total > 0 || !sp.missing.length ? Util.formatMoney(sp.total) : '—'}</span>
        <span class="tiny faint">${sub}</span></div>`;
    return `<section class="stack" style="gap:12px">
      <div class="grid-2">
        ${tile('Cette semaine', week, Calc.usage(s, intakes) === 'both' ? `snus ${Util.formatMoney(week.snus)} · vape ${Util.formatMoney(week.vape)}` : 'depuis lundi')}
        ${tile('Ce mois', month, yearly !== null ? `≈ ${Util.formatMoney(yearly, 0)} sur un an` : 'depuis le 1er')}
      </div>
      ${missing.length ? `<a class="small link--mint" href="#/reglages">Prix ${missing.map((t) => (t === 'snus' ? 'du snus' : 'de la vape')).join(' et ')} à renseigner</a>` : ''}
    </section>`;
  },

  /** Nicotine estimée : snus (portions × mg) et vape (ml × mg/ml). */
  statsNicotine(avg) {
    const s = Store.data.settings;
    const today = Dates.todayKey();
    const mlAvg = Calc.mlAverage(Store.data.vapeMl, Dates.addDays(today, -App.statsRange), Dates.addDays(today, -1));
    const snusMg = Calc.tracks('snus') && s.snusMg > 0 && avg && avg.snus > 0 ? Calc.snusMg(avg.snus, s) : null;
    const mlOk = Calc.tracks('vape') ? mlAvg : null;
    const vapeMg = mlOk && s.vapeMgPerMl > 0 ? mlOk.ml * s.vapeMgPerMl : null;
    if (snusMg === null && !mlOk) return '';
    const total = (snusMg || 0) + (vapeMg || 0);
    const row = (label, value, sub) => `<div class="row"><span>${label}<br><span class="tiny faint">${sub}</span></span><span class="num" style="font-size:18px;font-weight:600">${value}</span></div>`;
    return `<section class="card" style="gap:12px">
      <span class="small muted">Nicotine par jour (estimation)</span>
      <span class="value">${total > 0 ? `≈ ${Util.formatNum(total, 0)} mg` : '—'}</span>
      ${snusMg !== null ? row('Snus', `${Util.formatNum(snusMg, 0)} mg`, `${Util.formatNum(avg.snus, 1)} portions × ${Util.formatNum(s.snusMg)} mg`) : ''}
      ${mlOk ? row('Vape', vapeMg !== null ? `${Util.formatNum(vapeMg, 0)} mg` : '—', `${Util.formatNum(mlOk.ml, 1)} ml/jour${vapeMg !== null ? ` × ${Util.formatNum(s.vapeMgPerMl)} mg/ml` : ' · taux à renseigner'} · ${mlOk.days} j notés`) : ''}
    </section>`;
  },

  statsEmpty() {
    const ghost = [40, 60, 50, 75, 55, 45, 30].map((h, i) => ({ v: h, hi: i === 6 }));
    return `<div class="screen">
      <header class="header"><h1 class="title">Stats</h1></header>
      <section class="card card--empty" style="gap:18px">
        <div class="ghost-chart">${Charts.bars(ghost, { height: 120, aria: 'Exemple de graphe' })}</div>
        <div class="stack" style="gap:8px">
          <strong>Les graphes se dessinent avec le temps.</strong>
          <span class="small muted">Après 3 jours de relevés, tu verras tes moyennes, tes heures et tes déclencheurs. Pas besoin d'être précis : un tap par prise suffit.</span>
        </div>
      </section>
      <section class="card">
        <span class="small muted">Pour estimer tes dépenses</span>
        <span>Indique le prix d'une boîte de snus et d'une capsule de vape.</span>
        <a class="link link--mint" href="#/reglages" style="align-self:flex-start">Ouvrir les réglages</a>
      </section>
    </div>`;
  },
  /* ---- Questionnaire de départ ---- */
  bienvenue() {
    if (!App.quiz) App.quiz = Quiz.fromProfile(Store.data.settings.profile, 0);
    const q = App.quiz;
    const step = Quiz.STEPS[q.step];
    if (step === 'intro') return Screens.quizIntro();
    const progress = Math.min(1, q.step / (Quiz.STEPS.length - 2));
    return `<div class="screen" style="min-height:calc(100dvh - var(--safe-top) - var(--safe-bottom) - 60px)">
      <header class="header">
        <button type="button" class="icon-btn icon-btn--ghost" data-action="quiz-back" aria-label="Question précédente">${Icon.prev}</button>
        <div class="progress" style="flex:1;margin:0 12px" role="progressbar" aria-valuenow="${Math.round(progress * 100)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${progress * 100}%"></span></div>
        ${step === 'summary' ? '<span style="width:48px"></span>' : '<button type="button" class="link" data-action="quiz-skip">Passer</button>'}
      </header>
      ${Screens['quiz_' + step](q.a)}
    </div>`;
  },

  quizIntro() {
    return `<div class="screen" style="min-height:calc(100dvh - var(--safe-top) - var(--safe-bottom) - 60px)">
      <header class="header"><span class="wordmark">STASE</span></header>
      <section class="stack" style="gap:14px;padding-top:24px">
        <h1 class="title title--soft">Observer, puis arrêter. À ton rythme.</h1>
        <p class="muted">Quatre questions, une minute. STASE s'en sert pour te montrer les bénéfices de l'arrêt qui te concernent vraiment.</p>
        <p class="small faint">Tes réponses restent sur ce téléphone. Tu pourras les changer dans les Réglages.</p>
      </section>
      <div class="stack" style="gap:6px;margin-top:auto">
        <button type="button" class="btn btn--primary btn--block" data-action="quiz-next">Commencer</button>
        <button type="button" class="link" data-action="quiz-later" style="align-self:center">Plus tard</button>
      </div>
    </div>`;
  },

  /** Bouton d'option du questionnaire (choix simple ou multiple). */
  option(q, value, label, selected, sub) {
    return `<button type="button" class="option" data-action="quiz-pick" data-q="${q}" data-value="${value}" aria-pressed="${selected}">
      <span class="stack" style="gap:2px"><span>${Util.esc(label)}</span>${sub ? `<span class="tiny faint">${Util.esc(sub)}</span>` : ''}</span>
      <span class="option__check">${selected ? Icon.check : ''}</span></button>`;
  },

  quizQuestion(title, sub, options, canContinue = true) {
    return `<section class="stack" style="gap:8px"><h1 class="title" style="font-size:26px">${title}</h1>${sub ? `<p class="small muted">${sub}</p>` : ''}</section>
      <div class="stack" style="gap:8px">${options}</div>
      <button type="button" class="btn btn--primary btn--block" data-action="quiz-next" style="margin-top:auto" ${canContinue ? '' : 'disabled'}>Continuer</button>`;
  },

  quiz_uses(a) {
    return Screens.quizQuestion('Qu’est-ce que tu prends ?', '',
      [['snus', 'Du snus'], ['vape', 'De la vape'], ['both', 'Les deux']].map(([v, l]) => Screens.option('uses', v, l, a.uses === v)).join(''), !!a.uses);
  },

  quiz_goals(a) {
    return Screens.quizQuestion('Qu’est-ce qui compte le plus pour toi ?', 'Choisis tout ce qui te parle.',
      GOALS.map((g) => Screens.option('goals', g.key, g.label, a.goals.includes(g.key))).join('') + `
      <label class="stack" style="gap:8px;margin-top:8px"><span class="small muted">En une phrase, ta raison à toi (facultatif)</span>
        <span class="field__box" style="width:100%;height:auto;min-height:52px"><input type="text" data-quiz="why" maxlength="140" value="${Util.esc(a.why || '')}" placeholder="Pour ma fille, pour respirer, pour être libre…" style="text-align:left;font-family:var(--font-text)" autocomplete="off"></span></label>`);
  },

  quiz_concerns(a) {
    return Screens.quizQuestion('Est-ce que l’un de ces points te concerne ?',
      'Facultatif. STASE s’en sert seulement pour adapter les bénéfices affichés. Ce n’est pas un bilan médical.',
      Calc.concernsFor(a.uses).map((c) => Screens.option('concerns', c.key, c.label, a.concerns.includes(c.key))).join(''));
  },

  quiz_firstUse(a) {
    return Screens.quizQuestion('Après le réveil, ta première prise arrive…', 'Un bon indicateur de la force de l’habitude.',
      FIRST_USE.map(([v, l]) => Screens.option('firstUse', v, l, a.firstUse === v)).join(''), !!a.firstUse);
  },

  quiz_summary(a) {
    const profile = { ...a, done: true };
    const cards = Screens.benefitCards(profile);
    return `<section class="stack" style="gap:8px"><h1 class="title" style="font-size:26px">Ce que l'arrêt peut t'apporter</h1>
        <p class="small muted">Des tendances générales, adaptées à tes réponses. Tu les retrouveras dans l'onglet Corps.</p></section>
      ${Screens.firstUseInsight(a.firstUse)}
      ${cards || '<div class="card card--outline"><p class="small">Arrêter la nicotine, c’est moins de stimulant pour le cœur, un sommeil et une humeur souvent plus stables après quelques semaines, et de l’argent qui reste dans ta poche.</p></div>'}
      <button type="button" class="btn btn--primary btn--block" data-action="quiz-finish">C'est parti</button>`;
  },

  firstUseInsight(firstUse) {
    const text = {
      lt5: 'Ta première prise arrive très vite après le réveil : c’est souvent le signe d’une dépendance marquée, pas d’un manque de volonté. Le matin sera le moment à préparer (eau fraîche, douche, sortir prendre l’air), et le minuteur « J’ai une envie » est là pour ça.',
      lt30: 'Ta première prise arrive vite après le réveil : le matin est un moment clé. Prépare un petit rituel de remplacement (eau fraîche, douche, quelques pas dehors).',
      lt60: 'Ta première prise vient dans l’heure : le matin compte, mais tu as de la marge pour t’organiser.',
      gt60: 'Ta première prise vient tard dans la matinée : la dépendance du matin semble modérée, c’est un bon point de départ.'
    }[firstUse];
    return text ? `<section class="card card--outline" style="gap:6px"><span class="label">Ton matin</span><p class="small" style="line-height:1.55">${text}</p></section>` : '';
  },

  /** Cartes de bénéfices : points de santé cochés, puis motivations. */
  /** compact = repliable (Corps) ; sinon texte complet (récapitulatif du questionnaire). */
  benefitCards(profile, compact = false) {
    const st = Store.data.settings;
    const concerns = profile.concerns.map((k) => CONCERN_BY_KEY[k]).filter(Boolean);
    Screens.compactCards = compact;
    const cards = concerns.map((c) => Screens.benefitCard(c.title, c.text, '', c.note))
      .concat(profile.goals.map((g) => Screens.goalCard(g, st)));
    Screens.compactCards = false;
    return cards.join('');
  },

  benefitCard(title, text, extra = '', note = '') {
    if (Screens.compactCards) {
      // Corps : une ligne par bénéfice (titre + première phrase), la suite au toucher
      const parts = text.split(/(?<=\.)\s/);
      const lead = parts.shift();
      const rest = parts.join(' ');
      if (!rest && !note) {
        return `<div class="bf"><div class="bf__static" style="display:flex;flex-direction:column;gap:4px;padding:16px 0"><span class="bf__title">${Util.esc(title)}</span><span class="bf__lead">${Util.esc(lead)}</span>${extra}</div></div>`;
      }
      return `<details class="bf">
        <summary><span class="bf__title">${Util.esc(title)}</span><span class="bf__chev" aria-hidden="true"></span>
          <span class="bf__lead">${Util.esc(lead)}</span>${extra}</summary>
        <div class="bf__more">${rest ? `<p>${Util.esc(rest)}</p>` : ''}${note ? `<p class="small faint">${Util.esc(note)}</p>` : ''}</div>
      </details>`;
    }
    return `<article class="card benefit">
      <span class="label" style="color:var(--mint)">${Util.esc(title)}</span>
      <p style="font-size:15px;line-height:1.55">${Util.esc(text)}</p>
      ${extra}
      ${note ? `<p class="tiny faint">${Util.esc(note)}</p>` : ''}
    </article>`;
  },

  goalCard(key, st) {
    const intakes = Store.data.intakes;
    if (key === 'argent') {
      const y = Calc.yearlyCost(st, intakes, Store.data.vapeMl);
      return Screens.benefitCard('Ton argent', y !== null
        ? `Au rythme ${st.phase === 'arret' ? 'd’avant l’arrêt' : 'actuel'}, la nicotine coûte environ ${Util.formatMoney(y, 0)} par an.${st.phase === 'arret' ? ' Le compteur « Économisé » le montre jour après jour.' : ''}`
        : 'Renseigne le prix du snus et de la vape dans les Réglages pour voir combien ça représente sur un an.');
    }
    if (key === 'liberte') {
      const r = Calc.dailyRate(st, intakes);
      const lead = r ? `Environ ${Util.formatNum(r, 0)} prises par jour, soit une toutes les ${Util.formatNum(16 / Math.max(r, 1), 1)} h de journée. ` : '';
      return Screens.benefitCard('Liberté', `${lead}Sans nicotine : plus besoin d’en avoir sur soi, de prévoir la prochaine, ni de s’éclipser.`);
    }
    const text = {
      sante: 'La nicotine est un stimulant qui sollicite le cœur et les vaisseaux plusieurs fois par jour. L’arrêter retire cette charge répétée, et c’est utile à tout âge.',
      sport: 'Un cœur qui ne s’emballe plus au repos, et côté vape un souffle souvent plus libre. Beaucoup retrouvent une énergie plus stable après les premières semaines.',
      proches: 'Plus de pauses à part, plus de portions ou de vapoteuse qui traînent. Et un exemple qui compte pour celles et ceux qui t’entourent.'
    }[key];
    const title = { sante: 'Santé', sport: 'Sport et énergie', proches: 'Tes proches' }[key];
    return text ? Screens.benefitCard(title, text) : '';
  },

  /** Section « Pour toi » (Corps) ou invitation au questionnaire. */
  forYou(title) {
    const pr = Store.data.settings.profile;
    const cards = pr.done ? Screens.benefitCards(pr, true) : '';
    if (cards) return `<section class="stack" style="gap:12px"><div class="stack" style="gap:2px"><h2 class="sec-title">${title}</h2></div>
      <div class="card bf-list">${cards}</div></section>`;
    return `<a class="card card--outline" href="#/bienvenue" data-action="quiz-start" style="text-decoration:none;color:inherit;gap:6px">
      <strong>Personnalise tes bénéfices</strong>
      <span class="small muted">Quatre questions (tension, stress, sommeil…) pour voir ce que l'arrêt peut t'apporter, à toi.</span></a>`;
  },

  /** Corps — en arrêt : progression, étape du moment, récupération, bénéfices, repères. */
  corps() {
    const st = Store.data.settings;
    const list = Calc.visibleMilestones(st, Store.data.intakes);
    if (st.phase !== 'arret') return Screens.corpsObservation(list);
    const streak = Calc.streaks(Store.data.intakes, st.quitStart, Date.now());
    const states = Calc.milestoneStates(streak.current, list);
    const next = Calc.nextMilestone(streak.current, list);
    const hadIntake = streak.lastTs > st.quitStart;
    const stage = Calc.stageInfo(streak.current);
    const done = states.filter((m) => m.state === 'done').length;
    return `<div class="screen corps">
      <h1 class="title">Corps</h1>
      ${Screens.corpsHero(next, streak.current)}
      <section class="card" style="gap:14px">
        <div class="stack" style="gap:2px"><h2 class="sec-sub">En ce moment</h2><span class="now__stage">${Util.esc(stage.title)}</span></div>
        <div class="now__group"><span class="now__head">C’est normal</span>${stage.normal.map((t) => `<span class="stage__item">${Util.esc(t)}</span>`).join('')}</div>
        <div class="now__group"><span class="now__head">Ce qui aide</span>${stage.helps.map((t) => `<span class="stage__item stage__item--help">${Util.esc(t)}</span>`).join('')}</div>
      </section>
      ${Screens.systemsCard(streak.current, true)}
      ${Screens.fold('Repères', Screens.timeline(states), `${done} sur ${states.length} atteint${done > 1 ? 's' : ''}`)}
      ${Screens.forYou('Pour toi')}
      ${hadIntake ? '<p class="tiny faint">Les repères comptent depuis ta dernière prise.</p>' : ''}
      ${Screens.corpsNote()}
    </div>`;
  },

  /** Anneau de progression vers le prochain repère. */
  corpsHero(next, currentMs) {
    const C = 2 * Math.PI * 42;
    const pct = next ? next.progress : 1;
    const d = Dates.splitDuration(currentMs);
    const center = d.d ? `<b>${d.d}</b><span>jour${d.d > 1 ? 's' : ''}</span>` : `<b>${d.h}</b><span>heure${d.h > 1 ? 's' : ''}</span>`;
    return `<section class="card card--featured hero">
      <div class="hero__ring" role="img" aria-label="${next ? `${Math.floor(pct * 100)} % jusqu’au repère ${Util.esc(next.title)}` : 'Tous les repères atteints'}">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" class="hero__track"/>
          <circle cx="50" cy="50" r="42" class="hero__arc" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - pct)).toFixed(1)}"/></svg>
        <span class="hero__center">${center}</span>
      </div>
      <div class="stack" style="gap:6px;min-width:0">
        ${next ? `<span class="label" style="color:var(--mint)">Prochain repère</span>
          <span class="value" style="font-size:24px">${Util.esc(next.title)}</span>
          <span class="small muted">dans ${Screens.durationShort(next.remainingMs)}</span>
          <p class="body-text" style="color:var(--text)">${Util.esc(next.text)}</p>`
        : `<span class="label" style="color:var(--mint)">Tous les repères sont passés</span>
          <p class="body-text" style="color:var(--text)">Il n'y a plus d'étape à attendre : la suite, c'est ta vie sans nicotine.</p>`}
      </div>
    </section>`;
  },

  /** « Ton corps récupère » : un système par ligne, avec sa progression (ou ce qui t'attend). */
  systemsCard(currentMs, started) {
    const list = Calc.forUsage(SYSTEMS, Calc.usage(Store.data.settings, Store.data.intakes));
    const done = started ? list.filter((sys) => Calc.systemProgress(currentMs, sys) >= 1).length : 0;
    const sub = started ? `${list.length} systèmes · ${done} presque rétabli${done > 1 ? 's' : ''}` : `${list.length} systèmes, du cœur au sommeil`;
    return Screens.fold(started ? 'Ton corps récupère' : 'Ce qui récupère après l’arrêt', Screens.systemsBody(currentMs, started), sub);
  },

  /** Bloc repliable de Corps (fermé par défaut : la page reste courte). */
  fold(title, body, sub = '') {
    return `<details class="faq fold"><summary><span class="sec-title">${title}</span>${sub ? `<span class="sec-sub">${sub}</span>` : ''}</summary><div class="faq__body fold__body">${body}</div></details>`;
  },

  systemsBody(currentMs, started) {
    const usage = Calc.usage(Store.data.settings, Store.data.intakes);
    const rows = Calc.forUsage(SYSTEMS, usage).map((sys) => {
      const p = started ? Calc.systemProgress(currentMs, sys) : 0;
      const when = sys.h < 48 ? `${sys.h} h` : sys.h < 24 * 60 ? `${Math.round(sys.h / 24)} jours` : `${Math.round(sys.h / 24 / 30)} mois`;
      const status = !started ? `en général sous ${when}` : p >= 1 ? 'l’essentiel est fait' : `${Math.floor(p * 100)} %`;
      return `<div class="sys">
        <div class="row" style="align-items:baseline"><span class="sys__title">${Util.esc(sys.title)}</span><span class="small ${p >= 1 ? 'sys__done' : 'faint'}">${status}</span></div>
        <div class="progress"><span style="width:${(p * 100).toFixed(1)}%"></span></div>
        <span class="sys__text">${Util.esc(started ? sys.after : `${sys.before} Après l’arrêt : ${sys.after.charAt(0).toLowerCase()}${sys.after.slice(1)}`)}</span>
      </div>`;
    }).join('');
    return rows;
  },

  corpsNote() {
    return '<p class="tiny faint">Durées indicatives, variables d’une personne à l’autre. Pas un avis médical.</p>';
  },

  /** Frise : nœud + trait à gauche, texte à droite, détail dépliable. */
  timeline(states) {
    return `<ol class="timeline" aria-label="Repères">${states.map((m, i) => {
      const last = i === states.length - 1;
      const lineOn = !last && states[i + 1].state === 'done';
      const tag = m.state === 'done' ? 'atteint' : m.state === 'next' ? 'en cours' : '';
      const forMe = Calc.isForMe(m, Store.data.settings.profile.concerns);
      return `<li class="tl tl--${m.state}">
        <div class="tl__rail"><span class="tl__node">${m.state === 'done' ? Icon.check : ''}</span>${last ? '' : `<span class="tl__line${lineOn ? ' is-on' : ''}"></span>`}</div>
        <div class="tl__body">
          <span class="tl__title">${Util.esc(m.title)}${tag ? ` <span class="tl__tag">${tag}</span>` : ''}${m.tag === 'snus' ? ' <span class="tl__tag">snus</span>' : ''}${forMe ? ' <span class="tl__tag tl__tag--me">pour toi</span>' : ''}</span>
          <span class="tl__text">${Util.esc(m.text)}</span>
          ${m.more ? `<details class="tl__more"><summary>En savoir plus</summary><p>${Util.esc(m.more)}</p></details>` : ''}
        </div>
      </li>`;
    }).join('')}</ol>`;
  },

  /** Corps en observation : ce que fait la nicotine aujourd'hui, puis ce qui t'attend. */
  corpsObservation(list) {
    const st = Store.data.settings;
    const usage = Calc.usage(st, Store.data.intakes);
    const rate = Calc.dailyRate(st, Store.data.intakes);
    const avg = Calc.avgPerDay(Store.data.intakes, Dates.todayKey(), 7);
    const mlAvg = Calc.mlAverage(Store.data.vapeMl, Dates.addDays(Dates.todayKey(), -7), Dates.addDays(Dates.todayKey(), -1));
    const mg = (avg && st.snusMg > 0 ? avg.snus * st.snusMg : 0) + (mlAvg && st.vapeMgPerMl > 0 ? mlAvg.ml * st.vapeMgPerMl : 0);
    const intro = rate
      ? `Environ ${Util.formatNum(rate, 0)} prises par jour${mg ? ` (≈ ${Util.formatNum(mg, 0)} mg)` : ''}. À chaque prise :`
      : 'À chaque prise :';
    return `<div class="screen corps">
      <h1 class="title">Corps</h1>
      <section class="card" style="gap:12px">
        <h2 class="sec-title">La nicotine dans ton corps</h2>
        <p class="body-text" style="color:var(--text)">${Util.esc(intro)}</p>
        <ul class="effects">${Calc.forUsage(NICOTINE_EFFECTS, usage).slice(0, 4).map((e) => `<li>${Util.esc(e.text)}</li>`).join('')}</ul>
        <p class="body-text" style="color:var(--mint)">La plupart s’inversent après l’arrêt.</p>
      </section>
      ${Screens.systemsCard(0, false)}
      ${Screens.fold('Repères après l’arrêt', Screens.timeline(list.map((m) => ({ ...m, state: 'future' }))), `${list.length} étapes, de la 1re heure à 1 an`)}
      ${Screens.forYou('Pour toi')}
      <label class="btn btn--surface hap-btn" role="button" tabindex="0" data-hap="phase-ask" data-value="arret"><input type="checkbox" switch class="hap" tabindex="-1" aria-hidden="true">Passer en mode arrêt</label>
      ${Screens.corpsNote()}
    </div>`;
  },
  reglages() {
    const s = Store.data.settings;
    const n = Store.data.intakes.length;
    const unit = s.vapeFormat === 'flacon' ? 'flacon' : 'capsule';
    const snusOn = Calc.tracks('snus'), vapeOn = Calc.tracks('vape');
    const missing = (snusOn && !(s.snusBoxPrice > 0)) || (vapeOn && !(s.vapeUnitPrice > 0));
    const prices = [snusOn ? `snus ${s.snusBoxPrice > 0 ? Util.formatMoney(s.snusBoxPrice) : '—'}` : '', vapeOn ? `vape ${s.vapeUnitPrice > 0 ? Util.formatMoney(s.vapeUnitPrice) : '—'}` : ''].filter(Boolean).join(' · ');
    const title = snusOn && vapeOn ? 'Snus et vape' : snusOn ? 'Snus' : 'Vape';
    return `<div class="screen">
      <h1 class="title">Réglages</h1>

      ${Screens.modeSection(s)}

      <section class="stack">
        <h2 class="label">Je consomme</h2>
        ${Screens.segmented('uses', [['snus', 'Snus'], ['vape', 'Vape'], ['both', 'Les deux']], Calc.usage(s, Store.data.intakes), 'Ce que tu consommes', 'set-uses')}
      </section>

      <section class="stack">
        <h2 class="label">Motivation</h2>
        <div class="group">
          <label class="field field--text"><span class="field__mini">Ta raison d’arrêter</span>
            <input type="text" data-profile="why" maxlength="140" value="${Util.esc(s.profile.why)}" placeholder="En une phrase" autocomplete="off"></label>
          <label class="field field--text"><span class="field__mini">Objectif d’achat</span>
            <input type="text" data-goal="name" maxlength="40" value="${Util.esc(s.goalName)}" placeholder="Un vélo, un week-end…" autocomplete="off"></label>
          ${Screens.field('goalPrice', 'Prix de l’objectif', s.goalPrice, 'CHF', 'decimal')}
          <div class="field"><span class="field__label">Questionnaire</span>
            <a class="link link--mint" href="#/bienvenue" data-action="quiz-start">${s.profile.done ? 'Refaire' : 'Répondre'}</a></div>
        </div>
      </section>

      <section class="stack">
        <h2 class="label">Prix et dosage</h2>
        <details class="faq fold"${missing ? ' open' : ''}>
          <summary><span style="font-weight:700">${title}</span><span class="sec-sub"${missing ? ' style="color:var(--warm)"' : ''}>${missing ? 'Prix à renseigner' : Util.esc(prices)}</span></summary>
          <div class="faq__body fold__body" style="gap:0">
            ${snusOn ? `${vapeOn ? '<span class="label" style="padding:4px 0 0">Snus</span>' : ''}
            ${Screens.field('snusBoxPrice', 'Prix d’une boîte', s.snusBoxPrice, 'CHF', 'decimal')}
            ${Screens.field('snusPerBox', 'Portions par boîte', s.snusPerBox, '', 'numeric')}
            ${Screens.field('snusMg', 'Force par portion', s.snusMg, 'mg', 'decimal')}` : ''}
            ${vapeOn ? `${snusOn ? '<span class="label" style="padding:16px 0 10px">Vape</span>' : '<span style="height:6px"></span>'}
            ${Screens.segmented('vapeFormat', [['capsule', 'Capsule'], ['flacon', 'Flacon']], s.vapeFormat, 'Format')}
            ${Screens.field('vapeUnitPrice', `Prix d’${unit === 'flacon' ? 'un flacon' : 'une capsule'}`, s.vapeUnitPrice, 'CHF', 'decimal')}
            ${Screens.field('vapeMlPerUnit', 'Contenance', s.vapeMlPerUnit, 'ml', 'decimal')}
            ${Screens.field('vapeMgPerMl', 'Taux de nicotine', s.vapeMgPerMl, 'mg/ml', 'decimal')}
            ${Screens.field('vapeSessionsPerUnit', `Sessions par ${unit}`, s.vapeSessionsPerUnit, '', 'numeric')}` : ''}
          </div>
        </details>
      </section>

      <section class="stack">
        <h2 class="label">Préférences</h2>
        ${Screens.segmented('theme', [['dark', 'Sombre'], ['light', 'Clair']], s.theme, 'Thème')}
        <div class="group">
          ${Screens.toggle('askContext', 'Noter le déclencheur', '', s.askContext)}
        </div>
      </section>

      <section class="stack">
        <h2 class="label">Données</h2>
        <div class="grid-2">
          <button type="button" class="btn btn--surface" data-action="export">Exporter</button>
          <button type="button" class="btn btn--surface" data-action="import">Importer</button>
        </div>
        <a class="btn btn--surface" href="#/historique">Historique des prises</a>
        <p class="tiny faint" style="text-align:center">${Screens.backupHint(s.lastExportAt, n)}</p>
      </section>

      <div class="stack" style="align-items:center;gap:4px">
        <a class="link link--mint" href="#/aide">Aide</a>
        <button type="button" class="link" data-action="update-check">Rechercher une mise à jour</button>
        <button type="button" class="link" data-action="wipe-ask">Effacer toutes les données</button>
        <p class="tiny faint">STASE ${APP_VERSION}</p>
      </div>
    </div>`;
  },

  profileSummary(p) {
    if (!p.done) return 'Pas encore rempli';
    const uses = { snus: 'Snus', vape: 'Vape', both: 'Snus et vape' }[p.uses] || 'Usage non précisé';
    const parts = [uses];
    if (p.goals.length) parts.push(`${p.goals.length} motivation${p.goals.length > 1 ? 's' : ''}`);
    if (p.concerns.length) parts.push(`${p.concerns.length} point${p.concerns.length > 1 ? 's' : ''} suivi${p.concerns.length > 1 ? 's' : ''}`);
    return parts.join(' · ');
  },

  /** Réglages > Mode : observation / arrêt, référence, réduction progressive. */
  modeSection(s) {
    const arret = s.phase === 'arret';
    const b = s.baseline;
    const red = s.reduction;
    const target = Calc.reductionTarget(red, Dates.todayKey());
    return `<section class="stack">
      <h2 class="label">Mode</h2>
      <div class="segmented" role="group" aria-label="Mode">
        <label class="hap-btn" role="button" tabindex="0" data-hap="phase-ask" data-value="observation" aria-pressed="${!arret}"><input type="checkbox" switch class="hap" tabindex="-1" aria-hidden="true">Observation</label>
        <label class="hap-btn" role="button" tabindex="0" data-hap="phase-ask" data-value="arret" aria-pressed="${arret}"><input type="checkbox" switch class="hap" tabindex="-1" aria-hidden="true">Arrêt</label>
      </div>
      ${arret ? `<div class="group">
        <div class="field"><span class="field__label">Début de l'arrêt</span><span class="muted small">${Util.esc(Dates.formatDayShort(s.quitStart))}, ${Dates.formatTime(s.quitStart)}</span></div>
        <div class="field"><span class="field__label"><span>Référence</span><span class="tiny faint">${b ? `${Util.formatNum(b.snusPerDay, 1)} snus · ${Util.formatNum(b.vapePerDay, 1)} vape${b.vapeMlPerDay !== null ? ` (${Util.formatNum(b.vapeMlPerDay, 1)} ml)` : ''} par jour${b.days ? ` · ${b.days} j d'observation` : ''}` : 'non renseignée'}</span></span>
          <button type="button" class="link link--mint" data-action="baseline-edit">Modifier</button></div>
      </div>` : `<div class="group">
        ${Screens.toggleRow('reduction-toggle', 'Réduction progressive', '', red.on)}
        ${red.on ? `<div class="field"><span class="field__label"><span>Baisse par semaine</span><span class="tiny faint">Cible du jour : ${target}</span></span>
          <div class="segmented" style="width:168px" role="group" aria-label="Baisse par semaine">${[[0.5, '0,5'], [1, '1'], [2, '2']].map(([v, l]) =>
            `<button type="button" data-action="reduction-step" data-value="${v}" aria-pressed="${red.weeklyStep === v}">${l}</button>`).join('')}</div></div>` : ''}
      </div>`}
    </section>`;
  },

  /** Ligne avec interrupteur relié à une action. */
  toggleRow(action, label, hint, on) {
    return `<div class="field">
      <span class="field__label"><span>${Util.esc(label)}</span>${hint ? `<span class="tiny faint">${Util.esc(hint)}</span>` : ''}</span>
      <label class="switch hap-btn" role="switch" tabindex="0" aria-checked="${!!on}" aria-label="${Util.esc(label)}" data-hap="${action}"><input type="checkbox" switch class="hap" tabindex="-1" aria-hidden="true"></label>
    </div>`;
  },

  backupHint(lastExportAt, count) {
    if (!lastExportAt) return count ? 'Aucune sauvegarde exportée pour l’instant.' : 'Rien à sauvegarder pour l’instant.';
    return `Dernier export : ${Util.esc(Dates.formatDayLong(lastExportAt))}.`;
  },

  /** Champ numérique de réglage (virgule acceptée). */
  field(key, label, value, unit, mode, hint) {
    const shown = value === null || value === undefined ? '' : Util.formatNum(value);
    return `<label class="field">
      <span class="field__label">${Util.esc(label)}${hint ? `<span class="tiny faint">${Util.esc(hint)}</span>` : ''}</span>
      <span class="field__box"><input type="text" inputmode="${mode}" data-setting="${key}" value="${Util.esc(shown)}" autocomplete="off">
      ${unit ? `<span class="field__unit">${unit}</span>` : ''}</span>
    </label>`;
  },

  /** Ligne avec interrupteur lié à un réglage booléen. */
  toggle(key, label, hint, on) {
    return `<div class="field">
      <span class="field__label"><span>${Util.esc(label)}</span>${hint ? `<span class="tiny faint">${Util.esc(hint)}</span>` : ''}</span>
      <label class="switch hap-btn" role="switch" tabindex="0" aria-checked="${!!on}" aria-label="${Util.esc(label)}" data-hap="toggle-setting" data-key="${key}"><input type="checkbox" switch class="hap" tabindex="-1" aria-hidden="true"></label>
    </div>`;
  },

  /** Contrôle segmenté lié à un réglage. */
  segmented(key, options, current, label, action = 'set-setting') {
    return `<div class="segmented" role="group" aria-label="${Util.esc(label)}">${options.map(([value, text]) =>
      `<button type="button" data-action="${action}" data-key="${key}" data-value="${value}" aria-pressed="${value === current}">${text}</button>`
    ).join('')}</div>`;
  }
};

/* =========================================================================
   Feuille « prise » — trois modes :
   - context : juste après « + Snus / + Vape » (la prise est déjà enregistrée)
   - edit    : modifier ou supprimer une prise existante
   - new     : ajouter une prise oubliée, avec son heure
   L'état en cours d'édition vit dans UI.sheetState jusqu'à « Enregistrer ».
   ========================================================================= */
const IntakeSheet = {
  open(state) {
    UI.sheetState = state;
    UI.openSheet(IntakeSheet.html(state), 'Prise');
  },
  refresh() { UI.updateSheet(IntakeSheet.html(UI.sheetState)); Anim.pickPop(); },

  /** Ouvre la feuille d'une prise existante. */
  openFor(id, mode) {
    const x = Intakes.find(id);
    if (!x) return;
    IntakeSheet.open({ mode, id, type: x.type, ts: x.ts, trigger: x.trigger, intensity: x.intensity, confirmDelete: false });
  },

  html(st) {
    if (st.confirmDelete) return IntakeSheet.confirmHtml(st);
    const title = {
      context: `Prise de ${Dates.formatTime(st.ts)} · ${st.type === 'snus' ? 'Snus' : 'Vape'}`,
      edit: 'Modifier la prise',
      new: 'Ajouter une prise'
    }[st.mode];
    return `
      <div class="stack" style="gap:6px">
        <h2 class="title" style="font-size:22px">${title}</h2>
        ${st.mode === 'context' ? '<p class="small muted">Facultatif. Ça aide à repérer tes moments.</p>' : ''}
      </div>
      ${st.mode === 'context' ? '' : IntakeSheet.whenHtml(st)}
      ${IntakeSheet.triggersHtml(st.trigger)}
      ${IntakeSheet.intensityHtml(st.intensity)}
      ${IntakeSheet.buttonsHtml(st)}`;
  },

  whenHtml(st) {
    // Le choix du type n'apparaît que si les deux produits sont suivis (ou pour corriger une prise de l'autre type).
    const showType = Calc.usage(Store.data.settings, Store.data.intakes) === 'both' || st.type !== Calc.defaultType();
    return `${showType ? Screens.segmented('', [['snus', 'Snus'], ['vape', 'Vape']], st.type, 'Type', 'sheet-type') : ''}
      <label class="stack">
        <span class="label">Date et heure</span>
        <span class="field__box" style="width:100%"><input type="datetime-local" data-sheet="ts"
          value="${Dates.toInputValue(st.ts)}" max="${Dates.toInputValue(Date.now())}" style="text-align:left"></span>
      </label>`;
  },

  triggersHtml(current) {
    return `<div class="stack">
      <span class="label">Déclencheur</span>
      <div class="grid-3">${TRIGGERS.map(([k, label]) =>
        `<button type="button" class="chip" data-action="sheet-trigger" data-value="${k}" aria-pressed="${current === k}">${label}</button>`).join('')}</div>
    </div>`;
  },

  intensityHtml(current) {
    return `<div class="stack">
      <span class="label">Intensité de l'envie</span>
      <div class="grid-5 scale--warm">${[1, 2, 3, 4, 5].map((n) =>
        `<button type="button" class="scale-btn" data-action="sheet-intensity" data-value="${n}" aria-pressed="${current === n}" aria-label="Intensité ${n} sur 5">${n}</button>`).join('')}</div>
      <div class="row tiny faint"><span>légère</span><span>forte</span></div>
    </div>`;
  },

  buttonsHtml(st) {
    if (st.mode === 'context') {
      return `<div class="grid-2">
          <button type="button" class="btn" data-action="close-sheet">Plus tard</button>
          <button type="button" class="btn btn--primary" data-action="sheet-save">Enregistrer</button>
        </div>
        <button type="button" class="link" data-action="sheet-undo" style="align-self:center;margin-top:-12px">Annuler cette prise</button>`;
    }
    if (st.mode === 'edit') {
      return `<div class="grid-2">
          <button type="button" class="btn" data-action="sheet-ask-delete">Supprimer</button>
          <button type="button" class="btn btn--primary" data-action="sheet-save">Enregistrer</button>
        </div>`;
    }
    return `<div class="grid-2">
        <button type="button" class="btn" data-action="close-sheet">Fermer</button>
        <button type="button" class="btn btn--primary" data-action="sheet-save">Ajouter</button>
      </div>`;
  },

  confirmHtml(st) {
    return `<h2 class="title" style="font-size:22px">Supprimer cette prise ?</h2>
      <p class="muted small">${st.type === 'snus' ? 'Snus' : 'Vape'} du ${Util.esc(Dates.formatDayShort(st.ts))} à ${Dates.formatTime(st.ts)}.</p>
      <div class="grid-2">
        <button type="button" class="btn" data-action="sheet-cancel-delete">Garder</button>
        <button type="button" class="btn btn--surface" data-action="sheet-delete">Supprimer</button>
      </div>`;
  },

  /** Enregistre l'état de la feuille dans les données. */
  save() {
    const st = UI.sheetState;
    if (!st) return;
    if (!Intakes.isValidTs(st.ts)) { UI.toast('Cette heure est dans le futur.'); return; }
    if (st.mode === 'new') {
      Intakes.add(st.type, st.ts, st.trigger, st.intensity);
      if (App.route() === 'aujourdhui') App.viewDay = Dates.dayKey(st.ts) === Dates.todayKey() ? null : Dates.dayKey(st.ts);
      UI.toast(`Prise ajoutée : ${Dates.formatDayShort(st.ts)}, ${Dates.formatTime(st.ts)}.`);
    } else {
      Intakes.edit(st.id, { type: st.type, ts: st.ts, trigger: st.trigger, intensity: st.intensity });
      if (st.mode === 'edit') UI.toast('Prise modifiée.');
    }
    UI.closeSheet();
    App.render();
  }
};

/* =========================================================================
   Quiz — questionnaire de départ (réponses gardées en mémoire jusqu'à la fin)
   ========================================================================= */
const Quiz = {
  STEPS: ['intro', 'uses', 'goals', 'concerns', 'firstUse', 'summary'],
  MULTI: ['goals', 'concerns'],

  fromProfile(p, step) {
    return { step, a: { uses: p.uses, goals: [...p.goals], concerns: [...p.concerns], firstUse: p.firstUse, why: p.why || '' } };
  },

  pick(q, value) {
    const a = App.quiz.a;
    if (Quiz.MULTI.includes(q)) {
      a[q] = a[q].includes(value) ? a[q].filter((v) => v !== value) : a[q].concat(value);
    } else {
      a[q] = value;
      // Les points propres au snus ou à la vape suivent le choix d'usage.
      if (q === 'uses') a.concerns = a.concerns.filter((k) => Calc.concernsFor(value).some((c) => c.key === k));
    }
  },

  finish(saveAnswers = true) {
    const a = App.quiz ? App.quiz.a : {};
    Store.update((d) => {
      d.settings.profile = Store.cleanProfile(saveAnswers ? { ...a, done: true } : { ...d.settings.profile, done: true });
    });
    App.quiz = null;
    const back = App.quizReturn || '#/aujourdhui';
    App.quizReturn = null;
    App.go(back);
  }
};

/* =========================================================================
   Feuilles de changement de mode et de référence
   ========================================================================= */
const PhaseSheet = {
  /** Champs « référence » (prises par jour), pré-remplis. */
  baselineFields(snus, vape, ml = null) {
    const f = (key, label, v) => `<label class="field" style="padding:0"><span class="field__label">${label}</span>
      <span class="field__box"><input type="text" inputmode="decimal" data-sheet="${key}" value="${v === null ? '' : Util.formatNum(v, 1)}" autocomplete="off">
      <span class="field__unit">/ jour</span></span></label>`;
    // Les champs du produit non suivi restent dans la page (lus à l'enregistrement), mais cachés.
    const hide = (on, html) => (on ? html : html.replace('<label class="field"', '<label hidden class="field"'));
    return `<div class="group">${hide(Calc.tracks('snus'), f('base-snus', 'Snus', snus))}${hide(Calc.tracks('vape'), f('base-vape', 'Vape (sessions)', vape))}${hide(Calc.tracks('vape'), f('base-ml', 'Vape (ml, facultatif)', ml))}</div>`;
  },

  /** Lit les deux champs de référence ; null si invalide. */
  readBaseline() {
    const snus = Util.parseNum(document.querySelector('[data-sheet="base-snus"]').value);
    const vape = Util.parseNum(document.querySelector('[data-sheet="base-vape"]').value);
    const ml = Vape.parse(document.querySelector('[data-sheet="base-ml"]').value);
    if (Number.isNaN(ml)) { UI.toast(`Millilitres par jour : un nombre entre 0 et ${Vape.MAX_ML}, ou laisse vide.`); return null; }
    if (snus === null || vape === null) { UI.toast('Indique un nombre par jour pour le snus et la vape (0 si tu n’en prends pas).'); return null; }
    if (snus + vape === 0) { UI.toast('La référence ne peut pas être nulle pour les deux.'); return null; }
    return { snusPerDay: snus, vapePerDay: vape, vapeMlPerDay: ml };
  },

  openQuit() {
    const now = Date.now();
    const intakes = Store.data.intakes;
    const last = intakes.length ? intakes[intakes.length - 1].ts : null;
    const b = Calc.baseline(intakes, now, Store.data.vapeMl);
    UI.sheetState = { kind: 'quit', from: last && now - last < 3 * DAY_MS ? 'last' : 'now', last, days: b ? b.days : 0 };
    UI.openSheet(PhaseSheet.quitHtml(b ? b.snusPerDay : null, b ? b.vapePerDay : null, b ? b.vapeMlPerDay : null), 'Passer en mode arrêt');
  },

  quitHtml(snus, vape, ml = null) {
    const st = UI.sheetState;
    const lastLabel = st.last ? `${Dates.dayKey(st.last) === Dates.todayKey() ? 'aujourd’hui' : Dates.formatDayShort(st.last)} à ${Dates.formatTime(st.last)}` : '';
    return `<h2 class="title" style="font-size:22px">Passer en mode arrêt</h2>
      ${st.last && Date.now() - st.last < 3 * DAY_MS ? `<div class="stack"><span class="label">Le compteur part de</span>
        <div class="segmented" role="group" aria-label="Début">
          <button type="button" data-action="quit-from" data-value="last" aria-pressed="${st.from === 'last'}">Dernière prise</button>
          <button type="button" data-action="quit-from" data-value="now" aria-pressed="${st.from === 'now'}">Maintenant</button>
        </div><span class="small faint">${st.from === 'last' ? `Ta dernière prise : ${lastLabel}.` : 'À partir de cet instant.'}</span></div>` : ''}
      <div class="stack"><span class="label">Ta référence</span>
        <span class="small muted">${st.days
          ? `Ta moyenne réelle sur ${st.days} jour${st.days > 1 ? 's' : ''} d'observation. Elle sert à calculer doses évitées et économies.`
          : 'Pas encore de jour complet d’observation : indique ta consommation habituelle.'}</span>
        ${PhaseSheet.baselineFields(snus, vape, ml)}</div>
      <div class="grid-2">
        <button type="button" class="btn" data-action="close-sheet">Pas encore</button>
        <label class="btn btn--primary hap-btn" role="button" tabindex="0" data-hap="quit-confirm"><input type="checkbox" switch class="hap" tabindex="-1" aria-hidden="true">Commencer</label>
      </div>`;
  },

  openObservation() {
    UI.sheetState = { kind: 'obs' };
    UI.openSheet(`<h2 class="title" style="font-size:22px">Revenir en observation ?</h2>
      <p class="muted small">Toutes tes données restent. Le compteur d'arrêt s'arrête ; tu pourras repasser en arrêt quand tu voudras, avec une nouvelle référence.</p>
      <div class="grid-2"><button type="button" class="btn" data-action="close-sheet">Rester en arrêt</button>
        <button type="button" class="btn btn--primary" data-action="obs-confirm">Revenir</button></div>`, 'Revenir en observation');
  },

  openBaseline() {
    const b = Store.data.settings.baseline;
    const real = Calc.baseline(Store.data.intakes, Store.data.settings.quitStart, Store.data.vapeMl);
    UI.sheetState = { kind: 'baseline' };
    UI.openSheet(`<h2 class="title" style="font-size:22px">Référence</h2>
      <p class="muted small">Prises par jour avant l'arrêt.${real ? ` Moyenne réelle mesurée : ${Util.formatNum(real.snusPerDay, 1)} snus et ${Util.formatNum(real.vapePerDay, 1)} vape (${real.days} j).` : ''}</p>
      ${PhaseSheet.baselineFields(b ? b.snusPerDay : null, b ? b.vapePerDay : null, b ? b.vapeMlPerDay : null)}
      ${real ? '<button type="button" class="link link--mint" data-action="baseline-real" style="align-self:flex-start">Reprendre la moyenne mesurée</button>' : ''}
      <div class="grid-2"><button type="button" class="btn" data-action="close-sheet">Annuler</button>
        <button type="button" class="btn btn--primary" data-action="baseline-save">Enregistrer</button></div>`, 'Référence');
  }
};

   Actions — reliées aux éléments via data-action

const Actions = {

  },
  'toggle-setting'(el) {

    Store.update((d) => { d.settings[key] = !d.settings[key]; });
  },

  go(el) { App.go(el.dataset.value); },
  'set-uses'(el) {
    if (!['snus', 'vape', 'both'].includes(el.dataset.value)) return;
    Store.update((d) => { d.settings.profile.uses = el.dataset.value; });
  },
  'set-setting'(el) {
    Store.update((d) => { d.settings[el.dataset.key] = el.dataset.value; });
    if (el.dataset.key === 'theme') UI.applyTheme();
  },

  export() { Backup.exportFile(); },
  'backup-snooze'() { Store.update((d) => { d.settings.backupSnoozeUntil = Date.now() + 7 * DAY_MS; }); },
  /* ---- Vape : ml du jour ---- */
  'ml-step'(el) {
    const input = el.parentElement.querySelector('[data-ml]');
    const cur = Vape.parse(input.value);
    const delta = Number(el.dataset.delta);
    // « − » sur un champ vide ne crée pas un relevé à 0 ml (qui remplacerait les sessions du jour).
    if ((cur === null || Number.isNaN(cur)) && delta < 0) return;
    const next = Math.round(((cur || 0) + delta) * 10) / 10;
    Vape.setMl(input.dataset.ml, Math.min(Vape.MAX_ML, Math.max(0, next)));
  },
  'cal-prev'() { const m = App.calMonth || Dates.todayKey().slice(0, 7); App.calMonth = Calc.shiftMonth(m, -1); App.render(); },
  'cal-next'() { const m = App.calMonth || Dates.todayKey().slice(0, 7); const n = Calc.shiftMonth(m, 1); App.calMonth = n > Dates.todayKey().slice(0, 7) ? null : n; App.render(); },
  'cal-open'(el) {
    const key = el.dataset.value;
    if (Store.data.settings.phase === 'arret') {

    } else {
      App.afterRoute = () => { App.viewDay = key === Dates.todayKey() ? null : key; App.render(); };
      App.go('#/aujourdhui');

  'history-more'() { App.historyDays += 30; App.render(); },
  'wipe-ask'() {
    UI.openSheet(`<h2 class="title" style="font-size:22px">Effacer toutes les données ?</h2>

      <div class="grid-2"><button type="button" class="btn" data-action="close-sheet">Garder</button>

  'confirm-import'() { Backup.applyPending(); },
