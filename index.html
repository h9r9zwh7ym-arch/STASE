<style>
/* =========================================================================
   1. Jetons de design (maquettes STASE) — sombre par défaut, clair en option
   ========================================================================= */
:root {
  --bg: #0B1220;
  --surface: #131C2F;
  --surface-2: #1B263D;
  --line: #26324B;
  --line-2: #3A4766;
  --text: #EAF0F8;
  --text-2: #A7B3C8;
  --text-3: #8693AD;
  --mint: #5EE6C4;
  --on-mint: #062A22;
  --mint-dim: rgba(94, 230, 196, 0.12);
  --mint-line: rgba(94, 230, 196, 0.35);
  --warm: #F2B36B;
  --on-warm: #2A1704;
  --warm-soft: rgba(242, 179, 107, 0.55);
  --data: #5B6F99;
  --data-hi: #C9D3E3;
  --scrim: rgba(4, 8, 16, 0.62);
  --sheet: #151F34;
  --bar: rgba(13, 20, 35, 0.94);
  --shadow: 0 10px 28px rgba(0, 0, 0, 0.45);

  --font-num: 'Space Grotesk', ui-rounded, -apple-system, system-ui, sans-serif;
  --font-text: 'Manrope', -apple-system, system-ui, sans-serif;

  --r-sm: 14px;
  --r-md: 18px;
  --r-lg: 24px;
  --gutter: 24px;
  --tabbar-h: 62px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
:root[data-theme="light"] {
  --bg: #F3F5F9;
  --surface: #FFFFFF;
  --surface-2: #E8ECF3;
  --line: #D6DCE7;
  --line-2: #B9C2D3;
  --text: #0D1525;
  --text-2: #46526B;
  --text-3: #5D6981;
  --mint: #0E7F69;
  --on-mint: #FFFFFF;
  --mint-dim: rgba(14, 127, 105, 0.10);
  --mint-line: rgba(14, 127, 105, 0.35);
  --warm: #A3560F;
  --on-warm: #FFFFFF;
  --warm-soft: rgba(163, 86, 15, 0.45);
  --data: #7A879F;
  --data-hi: #2B3550;
  --scrim: rgba(13, 21, 37, 0.36);
  --sheet: #FFFFFF;
  --bar: rgba(255, 255, 255, 0.94);
  --shadow: 0 10px 24px rgba(13, 21, 37, 0.12);
}

/* =========================================================================
   2. Base
   ========================================================================= */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); }
body {
  color: var(--text);
  font-family: var(--font-text);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
/* Pas de zoom au double tap ; les champs restent ≥ 16 px pour éviter le zoom au focus d'iOS. */
button, a, input, label, select { touch-action: manipulation; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* =========================================================================
   3. Coquille de l'app : vue défilante, barre d'onglets, bouton flottant
   ========================================================================= */
#view {
  position: fixed;
  inset: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: calc(var(--safe-top) + 20px) var(--gutter) calc(var(--tabbar-h) + var(--safe-bottom) + 96px);
}
body.no-chrome #view { padding-bottom: calc(var(--safe-bottom) + 32px); }
.screen { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  padding: 4px 4px var(--safe-bottom);
  background: var(--bar);
  border-top: 1px solid var(--line);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
}
.tab {
  min-height: var(--tabbar-h);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--text-3); text-decoration: none; font-size: 11px; font-weight: 600;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--mint); }
body.no-chrome .tabbar, body.no-chrome .fab { display: none; }

.fab {
  position: fixed; left: 50%; z-index: 21;
  bottom: calc(var(--tabbar-h) + var(--safe-bottom) + 18px);
  transform: translateX(-50%);
  height: 52px; padding: 0 22px; border-radius: 26px;
  display: flex; align-items: center; gap: 10px; white-space: nowrap;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--warm); box-shadow: var(--shadow);
  text-decoration: none; font-size: 15px; font-weight: 600;
}
.fab svg { width: 20px; height: 20px; color: var(--warm); }

/* =========================================================================
   4. Typographie et éléments de texte
   ========================================================================= */
.wordmark { font-family: var(--font-num); font-size: 15px; font-weight: 600; letter-spacing: 0.42em; }
.label { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); }
.title { font-family: var(--font-num); font-size: 30px; font-weight: 600; line-height: 1.15; }
.title--soft { font-weight: 500; font-size: 32px; }
.big-number { font-family: var(--font-num); font-size: 120px; font-weight: 500; line-height: 0.95; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.value { font-family: var(--font-num); font-size: 30px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.value--mint { color: var(--mint); }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

.header { display: flex; justify-content: space-between; align-items: center; min-height: 32px; }
.pill {
  font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
}
.pill--mint { color: var(--mint); background: var(--mint-dim); border-color: transparent; }

/* =========================================================================
   5. Composants
   ========================================================================= */
.card { background: var(--surface); border-radius: var(--r-lg); padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.card--outline { background: transparent; border: 1px solid var(--line); }
.card--empty { background: transparent; border: 1px dashed var(--line); padding: 24px; }
.card--featured { border: 1px solid var(--mint-line); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid-5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

.btn {
  min-height: 56px; padding: 0 20px; border-radius: var(--r-md);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 16px; font-weight: 600; text-decoration: none;
  border: 1px solid var(--line); background: transparent; color: var(--text);
}
.btn--primary { background: var(--mint); color: var(--on-mint); border-color: var(--mint); font-weight: 700; }
.btn--surface { background: var(--surface); }
.btn--dashed { border-style: dashed; border-color: var(--line-2); color: var(--text-2); }
.btn--block { width: 100%; }
.btn:disabled { background: var(--surface-2); border-color: var(--surface-2); color: var(--text-3); }
.link {
  min-height: 48px; display: inline-flex; align-items: center; justify-content: center;
  background: none; border: 0; padding: 0 4px; color: var(--text-2);
  font-size: 14px; text-decoration: underline; text-underline-offset: 3px;
}
.link--mint { color: var(--mint); text-decoration: none; font-weight: 600; font-size: 15px; }
.icon-btn {
  width: 48px; height: 48px; border-radius: 24px; border: 0;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--surface); color: var(--text-2);
}
.icon-btn svg { width: 20px; height: 20px; }

/* Puces de déclencheur : sélection neutre (inversée) */
.chip {
  min-height: 48px; border-radius: var(--r-sm); padding: 0 8px;
  background: var(--surface); color: var(--text-2); border: 1px solid var(--line);
  font-size: 14px; font-weight: 600;
}
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
/* Échelle 1–5 : neutre par défaut, ambre pour l'intensité d'envie */
.scale-btn {
  height: 52px; border-radius: var(--r-sm);
  background: var(--surface); color: var(--text-2); border: 1px solid var(--line);
  font-family: var(--font-num); font-size: 18px; font-weight: 600;
}
.scale-btn[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.scale--warm .scale-btn[aria-pressed="true"] { background: var(--warm); color: var(--on-warm); border-color: var(--warm); }

.segmented { display: grid; grid-auto-columns: minmax(0, 1fr); grid-auto-flow: column; background: var(--surface); border-radius: 16px; padding: 4px; }
.segmented button { min-height: 48px; border: 0; border-radius: 12px; background: transparent; color: var(--text-2); font-size: 15px; font-weight: 600; }
.segmented button[aria-pressed="true"] { background: var(--line); color: var(--text); }
:root[data-theme="light"] .segmented button[aria-pressed="true"] { background: var(--surface-2); }

.group { background: var(--surface); border-radius: 20px; padding: 0 16px; }
.group > * + * { border-top: 1px solid var(--line); }
.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; padding: 8px 0; }
.field__label { display: flex; flex-direction: column; gap: 2px; font-size: 15px; }
.field__box {
  flex: none; width: 128px; height: 48px; border-radius: 12px; padding: 0 12px;
  display: flex; align-items: center; gap: 6px;
  background: var(--surface-2); border: 1px solid transparent;
}
.field__box:focus-within { border-color: var(--mint); }
.field__box.is-invalid { border-color: var(--warm); }
.field__box input {
  width: 100%; min-width: 0; border: 0; outline: none; background: transparent;
  text-align: right; font-family: var(--font-num); font-size: 16px; /* 16 px : pas de zoom iOS */
}
.field__unit { font-size: 14px; color: var(--text-3); white-space: nowrap; }

.switch { flex: none; width: 52px; height: 32px; border-radius: 16px; border: 0; padding: 3px; background: var(--line); display: flex; }
.switch::after { content: ''; width: 26px; height: 26px; border-radius: 13px; background: var(--text-2); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--mint); }
.switch[aria-checked="true"]::after { background: var(--on-mint); transform: translateX(20px); }

.progress { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.progress > span { display: block; height: 100%; border-radius: 3px; background: var(--mint); }

/* Aujourd'hui : navigation jour, compteur, boutons de relevé, lignes */
.day-nav { display: flex; align-items: center; gap: 4px; margin: 0 -12px; }
.day-nav .label { flex: 1; text-align: center; }
.icon-btn--ghost { background: transparent; color: var(--text-3); }
.icon-btn:disabled { opacity: 0.3; }
.counter { display: flex; align-items: baseline; gap: 14px; }
.counter .muted { font-size: 17px; }
.log-btn {
  height: 96px; border-radius: var(--r-lg);
  background: var(--surface); border: 1px solid var(--line); color: var(--text);
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-family: var(--font-num); font-size: 22px; font-weight: 600;
  transition: transform .08s, background .15s;
}
.log-btn:active { transform: scale(0.97); background: var(--surface-2); }
.entry {
  width: 100%; min-height: 60px; padding: 0 2px; display: flex; align-items: center; gap: 14px;
  background: transparent; border: 0; border-bottom: 1px solid var(--line); text-align: left;
}
.entry__time { width: 52px; font-size: 17px; font-weight: 500; }
.entry__kind { width: 68px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
.entry__ctx { flex: 1; font-size: 14px; color: var(--text-2); }
.entry__ctx.faint { color: var(--text-3); }
.marker { width: 8px; height: 8px; background: var(--text-2); }
.marker--snus { border-radius: 2px; }
.marker--vape { border-radius: 4px; }
.dots { display: flex; gap: 4px; }
.dots span { width: 6px; height: 6px; border-radius: 3px; background: var(--line); }
.dots span.on { background: var(--warm); }
input[type="datetime-local"] { width: 100%; border: 0; outline: none; background: transparent; font-family: var(--font-num); font-size: 16px; min-height: 44px; }

/* =========================================================================
   6. Feuille du bas, toast
   ========================================================================= */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); opacity: 0; transition: opacity .2s; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
  max-height: calc(100dvh - var(--safe-top) - 24px); overflow-y: auto;
  background: var(--sheet); border-top: 1px solid var(--line); border-radius: 28px 28px 0 0;
  padding: 12px var(--gutter) calc(var(--safe-bottom) + 28px);
  display: flex; flex-direction: column; gap: 22px;
  transform: translateY(100%); transition: transform .25s ease-out;
}
.sheet__grabber { align-self: center; width: 40px; height: 4px; border-radius: 2px; background: var(--line); }
.sheet-open .scrim { opacity: 1; }
.sheet-open .sheet { transform: none; }
.sheet .inner { max-width: 480px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.toast {
  position: fixed; left: 50%; z-index: 50;
  bottom: calc(var(--tabbar-h) + var(--safe-bottom) + 84px);
  transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
  width: min(calc(100% - 32px), 440px); min-height: 52px; padding: 4px 8px 4px 18px; border-radius: 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--text); color: var(--bg); font-size: 15px; font-weight: 600;
  box-shadow: var(--shadow); transition: opacity .2s, transform .2s;
}
.toast.is-visible { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { min-height: 44px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* =========================================================================
   7. Mode test (?test)
   ========================================================================= */
.test-row { display: flex; gap: 10px; font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.test-ok { color: var(--mint); }
.test-ko { color: var(--warm); }
</style>
</head>

<script>
'use strict';

/* =========================================================================
   Constantes
   ========================================================================= */
const APP_VERSION = '0.1.0';
const STORAGE_KEY = 'stase.v1';
const BACKUP_KEY = 'stase.backup';
const SCHEMA_VERSION = 1;
const DAY_MS = 86400000;

/** Déclencheurs : clé stockée → libellé affiché. */
const TRIGGERS = [
  ['ennui', 'Ennui'], ['stress', 'Stress'], ['cafe', 'Café'],
  ['repas', 'Après repas'], ['soiree', 'Soirée'], ['reveil', 'Réveil']
];
const TRIGGER_LABEL = Object.fromEntries(TRIGGERS);
const INTAKE_TYPES = ['snus', 'vape'];

/* =========================================================================
   Utilitaires
   ========================================================================= */
const Util = {
  /** Échappe un texte avant de l'insérer dans du HTML. */
  esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },
  /** Lit un nombre saisi à la française (« 6,90 »). Renvoie null si invalide ou négatif. */
  parseNum(input) {
    const clean = String(input ?? '').replace(/\s/g, '').replace(',', '.');
    if (clean === '' || !/^\d*\.?\d+$|^\d+\.?$/.test(clean)) return null;
    const n = Number(clean);
    return Number.isFinite(n) && n >= 0 ? n : null;
  },
  /** Affiche un nombre décimal à la française, sans zéros inutiles. */
  formatNum(n, maxDigits = 2) {
    return new Intl.NumberFormat('fr-FR', { maximumFractionDigits: maxDigits }).format(n);
  },
  formatMoney(n) {
    return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(n);
  },
  uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  },
  clampInt(value, min, max) {
    const n = Math.round(Number(value));
    return Number.isFinite(n) && n >= min && n <= max ? n : null;
  }
};

/* =========================================================================
   Dates — tout est calculé dans le fuseau local de l'appareil.
   Les entrées sont stockées en timestamp (ms depuis 1970, universel) :
   le « jour » d'une prise est recalculé à l'affichage, donc un changement
   de fuseau ou un passage de minuit reste cohérent.
   ========================================================================= */
const Dates = {
  pad(n) { return String(n).padStart(2, '0'); },
  /** Clé de jour local « AAAA-MM-JJ » pour un timestamp. */
  dayKey(ts) {
    const d = new Date(ts);
    return `${d.getFullYear()}-${Dates.pad(d.getMonth() + 1)}-${Dates.pad(d.getDate())}`;
  },
  todayKey() { return Dates.dayKey(Date.now()); },
  /** Minuit local (timestamp) du jour donné par sa clé. */
  keyToStart(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d).getTime();
  },
  /** Ajoute n jours calendaires à une clé (robuste aux changements d'heure). */
  addDays(key, n) {
    const [y, m, d] = key.split('-').map(Number);
    return Dates.dayKey(new Date(y, m - 1, d + n).getTime());
  },
  /** Nombre de jours calendaires entre deux clés (b − a). */
  diffDays(a, b) {
    const toUtc = (k) => { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d); };
    return Math.round((toUtc(b) - toUtc(a)) / DAY_MS);
  },
  /** Liste des clés de jours de a à b inclus. */
  range(a, b) {
    const out = [];
    for (let k = a; Dates.diffDays(k, b) >= 0; k = Dates.addDays(k, 1)) out.push(k);
    return out;
  },
  formatTime(ts) {
    return new Date(ts).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  },
  formatDayLong(ts) {
    const s = new Date(ts).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    return s.charAt(0).toUpperCase() + s.slice(1);
  },
  formatDayShort(ts) {
    return new Date(ts).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
  },
  /** Découpe une durée en jours, heures, minutes, secondes. */
  splitDuration(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    return { d: Math.floor(s / 86400), h: Math.floor((s % 86400) / 3600), m: Math.floor((s % 3600) / 60), s: s % 60 };
  },
  /** Valeur pour <input type="datetime-local"> en heure locale. */
  toInputValue(ts) {
    const d = new Date(ts);
    return `${Dates.dayKey(ts)}T${Dates.pad(d.getHours())}:${Dates.pad(d.getMinutes())}`;
  },
  fromInputValue(value) {
    const ts = new Date(value).getTime();
    return Number.isFinite(ts) ? ts : null;
  }
};

/* =========================================================================
   Store — données en localStorage, versionnées, avec export/import JSON.
   iOS peut purger le stockage d'une web app peu utilisée : l'export
   régulier est la vraie sauvegarde.
   ========================================================================= */
const Store = {
  data: null,
  saveFailed: false,

  defaults() {
    return {
      version: SCHEMA_VERSION,
      settings: {
        phase: 'observation',        // 'observation' | 'arret'
        quitStart: null,             // timestamp du début de l'arrêt
        baseline: null,              // { snusPerDay, vapePerDay, days } figé au passage en arrêt
        snusBoxPrice: 0,             // € par boîte
        snusPerBox: 20,              // portions par boîte
        snusMg: 8,                   // mg de nicotine par portion
        vapeFormat: 'capsule',       // 'capsule' | 'flacon'
        vapeUnitPrice: 0,            // € par capsule ou flacon
        vapeSessionsPerUnit: 0,      // sessions de vape par capsule ou flacon
        reduction: { on: false, startDate: null, weeklyStep: 1 },
        theme: 'dark',               // 'dark' | 'light'
        askContext: true,            // ouvrir la feuille contexte après « + Snus / + Vape »
        lastExportAt: null
      },
      intakes: [],   // { id, type, ts, trigger, intensity }
      cravings: [],  // { id, ts, trigger, intensity, resolved }
      checkins: []   // { date, sleep, energy, mood, anxiety, hr }
    };
  },

  /** Charge les données ; en cas de JSON corrompu, le garde de côté et repart à vide. */
  load() {
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { raw = null; }
    if (!raw) { Store.data = Store.defaults(); return; }
    try {
      Store.data = Store.normalize(JSON.parse(raw));
    } catch (e) {
      try { localStorage.setItem(STORAGE_KEY + '.corrompu', raw); } catch (_) { /* rien */ }
      Store.data = Store.defaults();
    }
  },

  save() {
    if (App.testMode) return; // ?test ne touche jamais aux vraies données
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Store.data));
      Store.saveFailed = false;
    } catch (e) {
      Store.saveFailed = true;
      UI.toast('Enregistrement impossible : stockage plein ou bloqué.');
    }
  },

  /** Applique une modification, enregistre et redessine l'écran. */
  update(mutator) {
    mutator(Store.data);
    Store.save();
    App.render();
  },

  /** Remet n'importe quel objet au bon format (migration + nettoyage). */
  normalize(obj) {
    const base = Store.defaults();
    if (!obj || typeof obj !== 'object') return base;
    const s = Object.assign({}, base.settings, obj.settings || {});
    s.reduction = Object.assign({}, base.settings.reduction, (obj.settings || {}).reduction || {});
    if (!['observation', 'arret'].includes(s.phase)) s.phase = 'observation';
    if (!['dark', 'light'].includes(s.theme)) s.theme = 'dark';
    if (!['capsule', 'flacon'].includes(s.vapeFormat)) s.vapeFormat = 'capsule';
    s.askContext = s.askContext !== false;
    ['snusBoxPrice', 'snusPerBox', 'snusMg', 'vapeUnitPrice', 'vapeSessionsPerUnit'].forEach((k) => {
      const n = Number(s[k]);
      s[k] = Number.isFinite(n) && n >= 0 ? n : base.settings[k];
    });
    return {
      version: SCHEMA_VERSION,
      settings: s,
      intakes: Store.cleanList(obj.intakes, Store.cleanIntake),
      cravings: Store.cleanList(obj.cravings, Store.cleanCraving),
      checkins: Store.cleanCheckins(obj.checkins)
    };
  },

  cleanList(list, cleaner) {
    if (!Array.isArray(list)) return [];
    return list.map(cleaner).filter(Boolean).sort((a, b) => a.ts - b.ts);
  },

  cleanIntake(x) {
    if (!x || !INTAKE_TYPES.includes(x.type) || !Number.isFinite(Number(x.ts))) return null;
    return {
      id: String(x.id || Util.uid()),
      type: x.type,
      ts: Number(x.ts),
      trigger: TRIGGER_LABEL[x.trigger] ? x.trigger : null,
      intensity: Util.clampInt(x.intensity, 1, 5)
    };
  },

  cleanCraving(x) {
    if (!x || !Number.isFinite(Number(x.ts))) return null;
    return {
      id: String(x.id || Util.uid()),
      ts: Number(x.ts),
      trigger: TRIGGER_LABEL[x.trigger] ? x.trigger : null,
      intensity: Util.clampInt(x.intensity, 1, 5),
      resolved: x.resolved !== false
    };
  },

  /** Un check-in par jour : le plus récent l'emporte. */
  cleanCheckins(list) {
    if (!Array.isArray(list)) return [];
    const byDate = {};
    list.forEach((x) => {
      if (!x || !/^\d{4}-\d{2}-\d{2}$/.test(x.date)) return;
      const hr = Util.clampInt(x.hr, 25, 220);
      byDate[x.date] = {
        date: x.date,
        sleep: Util.clampInt(x.sleep, 1, 5),
        energy: Util.clampInt(x.energy, 1, 5),
        mood: Util.clampInt(x.mood, 1, 5),
        anxiety: Util.clampInt(x.anxiety, 1, 5),
        hr: hr
      };
    });
    return Object.values(byDate).sort((a, b) => a.date.localeCompare(b.date));
  },

  /** Texte JSON de sauvegarde. */
  exportJson() {
    return JSON.stringify({ app: 'STASE', appVersion: APP_VERSION, exportedAt: new Date().toISOString(), ...Store.data }, null, 2);
  },

  /** Valide un fichier importé. Renvoie { ok, data } ou { ok:false, error }. */
  parseImport(text) {
    let obj;
    try { obj = JSON.parse(text); } catch (e) { return { ok: false, error: 'Ce fichier n’est pas un JSON lisible.' }; }
    if (!obj || typeof obj !== 'object' || (!Array.isArray(obj.intakes) && !obj.settings)) {
      return { ok: false, error: 'Ce fichier ne ressemble pas à une sauvegarde STASE.' };
    }
    return { ok: true, data: Store.normalize(obj) };
  },

  /** Remplace les données ; l'état précédent est gardé pour annulation. */
  replaceAll(data) {
    try { localStorage.setItem(BACKUP_KEY, JSON.stringify(Store.data)); } catch (e) { /* rien */ }
    Store.data = data;
    Store.save();
  },

  restoreBackup() {
    try {
      const raw = localStorage.getItem(BACKUP_KEY);
      if (!raw) return false;
      Store.data = Store.normalize(JSON.parse(raw));
      Store.save();
      return true;
    } catch (e) { return false; }
  }
};

/* =========================================================================
   Calc — fonctions pures (sans DOM), testées dans ?test
   ========================================================================= */
const Calc = {
  /** Entrées dont le jour local correspond à la clé. */
  onDay(list, key) {
    return list.filter((x) => Dates.dayKey(x.ts) === key);
  },

  /** Compte snus / vape / total d'une liste de prises. */
  countByType(list) {
    const snus = list.filter((x) => x.type === 'snus').length;
    return { snus, vape: list.length - snus, total: list.length };
  },

  /** Comptes par jour, de fromKey à toKey inclus (jours sans prise = 0). */
  dailyCounts(intakes, fromKey, toKey) {
    const byDay = {};
    intakes.forEach((x) => {
      const k = Dates.dayKey(x.ts);
      byDay[k] = byDay[k] || [];
      byDay[k].push(x);
    });
    return Dates.range(fromKey, toKey).map((key) => ({ key, ...Calc.countByType(byDay[key] || []) }));
  },

  /**
   * Moyenne quotidienne sur les n jours complets précédant `todayKey`
   * (aujourd'hui exclu, car incomplet). Si l'historique est plus court,
   * on part du jour de la première prise. Renvoie null sans jour complet.
   */
  avgPerDay(intakes, todayKey, n = 7) {
    if (!intakes.length) return null;
    const first = Dates.dayKey(intakes[0].ts);
    let from = Dates.addDays(todayKey, -n);
    if (Dates.diffDays(from, first) > 0) from = first;
    const to = Dates.addDays(todayKey, -1);
    if (Dates.diffDays(from, to) < 0) return null;
    const days = Calc.dailyCounts(intakes, from, to);
    const sum = (k) => days.reduce((acc, d) => acc + d[k], 0) / days.length;
    return { total: sum('total'), snus: sum('snus'), vape: sum('vape'), days: days.length };
  }
};

/* =========================================================================
   Intakes — ajout, modification, suppression des prises
   ========================================================================= */
const Intakes = {
  /** Marge tolérée dans le futur (horloge légèrement décalée). */
  FUTURE_TOLERANCE: 5 * 60000,

  find(id) { return Store.data.intakes.find((x) => x.id === id) || null; },

  isValidTs(ts) { return Number.isFinite(ts) && ts <= Date.now() + Intakes.FUTURE_TOLERANCE; },

  sort() { Store.data.intakes.sort((a, b) => a.ts - b.ts); },

  /** Crée une prise et renvoie son id. */
  add(type, ts, trigger = null, intensity = null) {
    const entry = { id: Util.uid(), type, ts, trigger, intensity };
    Store.data.intakes.push(entry);
    Intakes.sort();
    Store.save();
    return entry.id;
  },

  /** Modifie une prise existante (type, heure, contexte). */
  edit(id, patch) {
    const entry = Intakes.find(id);
    if (!entry) return false;
    Object.assign(entry, patch);
    Intakes.sort();
    Store.save();
    return true;
  },

  remove(id) {
    const before = Store.data.intakes.length;
    Store.data.intakes = Store.data.intakes.filter((x) => x.id !== id);
    Store.save();
    return Store.data.intakes.length < before;
  }
};

/* =========================================================================
   Icônes (traits SVG)
   ========================================================================= */
const Icon = {
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',

/* =========================================================================
   UI — feuille du bas, toast, thème
   ========================================================================= */
const UI = {
  toastTimer: null,

  /** Petit message en bas ; action facultative (ex. « Annuler »). */
  toast(text, actionLabel, onAction, duration = 4000) {
    const el = document.getElementById('toast');
    const btn = document.getElementById('toast-action');
    document.getElementById('toast-text').textContent = text;
    btn.hidden = !actionLabel;
    btn.textContent = actionLabel || '';
    btn.onclick = () => { UI.hideToast(); if (onAction) onAction(); };
    el.classList.add('is-visible');
    clearTimeout(UI.toastTimer);
    UI.toastTimer = setTimeout(UI.hideToast, duration);
  },
  hideToast() { document.getElementById('toast').classList.remove('is-visible'); },

  /** Ouvre une feuille du bas avec le HTML donné. */
  openSheet(html, label) {
    const root = document.getElementById('sheet-root');
    root.innerHTML = `<div class="scrim" data-action="close-sheet"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-label="${Util.esc(label || '')}">
        <div class="sheet__grabber"></div><div class="inner">${html}</div></div>`;
    requestAnimationFrame(() => document.body.classList.add('sheet-open'));
  },
  /** Remplace le contenu de la feuille ouverte sans l'animer. */
  updateSheet(html) {
    const inner = document.querySelector('#sheet-root .inner');
    if (inner) inner.innerHTML = html;
  },
  closeSheet() {
    document.body.classList.remove('sheet-open');
    setTimeout(() => {
      if (!document.body.classList.contains('sheet-open')) document.getElementById('sheet-root').innerHTML = '';
    }, 260);
    UI.sheetState = null;
  },

  applyTheme() {
    const theme = Store.data.settings.theme;
    document.documentElement.dataset.theme = theme;
    document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'light' ? '#F3F5F9' : '#0B1220');
  }
};

/* =========================================================================
   Écrans — chaque fonction renvoie le HTML d'un écran.
   ========================================================================= */
const Screens = {

    const key = App.viewDay || today;
    const isToday = key === today;
    const list = Calc.onDay(Store.data.intakes, key);
    const c = Calc.countByType(list);
    const avg = Calc.avgPerDay(Store.data.intakes, today);
    return `<div class="screen">
      <header class="header"><span class="wordmark">STASE</span><span class="pill">Observation</span></header>

      <section class="stack" style="gap:6px">
        ${Screens.dayNav(key, isToday)}
        <div class="counter">
          <span class="big-number">${c.total}</span>
          <span class="muted">${c.total > 1 ? 'prises' : 'prise'} ${isToday ? 'aujourd’hui' : 'ce jour-là'}</span>
        </div>
        <p class="small muted">${c.snus} snus <span class="faint">·</span> ${c.vape} vape${avg ? ` <span class="faint">·</span> moyenne ${avg.days < 7 ? `${avg.days} j` : '7 j'} : ${Util.formatNum(avg.total, 1)}` : ''}</p>
      </section>

      ${isToday ? `<div class="grid-2">
        <button type="button" class="log-btn" data-action="add-intake" data-type="snus">${Icon.plus}Snus</button>

      </div>` : ''}

      <section class="stack" style="gap:0">
        <div class="row" style="padding-bottom:8px">
          <h2 style="font-size:15px">${isToday ? 'Prises du jour' : 'Prises de ce jour'}</h2>
          ${list.length ? '<span class="small faint">Touche une ligne pour modifier</span>' : ''}
        </div>

        <button type="button" class="link" data-action="new-intake" style="align-self:center">${isToday ? 'Ajouter une prise oubliée' : 'Ajouter une prise ce jour-là'}</button>
      </section>
    </div>`;
  },

  /** Navigation entre les jours (pour corriger un jour passé). */
  dayNav(key, isToday) {
    const label = (isToday ? 'Aujourd’hui · ' : '') + Dates.formatDayLong(Dates.keyToStart(key));
    return `<div class="day-nav">
      <button type="button" class="icon-btn icon-btn--ghost" data-action="day-prev" aria-label="Jour précédent">${Icon.prev}</button>
      <span class="label">${Util.esc(label)}</span>

    return `<button type="button" class="entry" data-action="open-intake" data-id="${Util.esc(x.id)}"

      <span class="entry__time num">${Dates.formatTime(x.ts)}</span>
      <span class="entry__kind"><span class="marker marker--${x.type}"></span>${x.type === 'snus' ? 'Snus' : 'Vape'}</span>
      <span class="entry__ctx ${x.trigger ? '' : 'faint'}">${label}</span>
      <span class="dots" aria-label="${x.intensity ? `Intensité ${x.intensity} sur 5` : 'Intensité non notée'}">${dots}</span>
    </button>`;
  },

  todayEmpty(isToday) {
    return `<div class="card card--empty">

          ${Screens.field('snusPerBox', 'Portions par boîte', s.snusPerBox, '', 'numeric')}

        <div class="group">
          ${Screens.field('vapeUnitPrice', `Prix d’${unit === 'flacon' ? 'un flacon' : 'une capsule'}`, s.vapeUnitPrice, '€', 'decimal')}

  field(key, label, value, unit, mode, hint) {

    return `<label class="field">
      <span class="field__label">${Util.esc(label)}${hint ? `<span class="tiny faint">${Util.esc(hint)}</span>` : ''}</span>
      <span class="field__box"><input type="text" inputmode="${mode}" data-setting="${key}" value="${Util.esc(shown)}" autocomplete="off">
      ${unit ? `<span class="field__unit">${unit}</span>` : ''}</span>
    </label>`;
  },

  /** Ligne avec interrupteur lié à un réglage booléen. */
  toggle(key, label, hint, on) {
    return `<div class="field">
      <span class="field__label"><span>${Util.esc(label)}</span>${hint ? `<span class="tiny faint">${Util.esc(hint)}</span>` : ''}</span>
      <button type="button" class="switch" role="switch" aria-checked="${!!on}" aria-label="${Util.esc(label)}" data-action="toggle-setting" data-key="${key}"></button>
    </div>`;
  },

  /** Contrôle segmenté lié à un réglage. */
  segmented(key, options, current, label, action = 'set-setting') {
    return `<div class="segmented" role="group" aria-label="${Util.esc(label)}">${options.map(([value, text]) =>
      `<button type="button" data-action="${action}" data-key="${key}" data-value="${value}" aria-pressed="${value === current}">${text}</button>`
    ).join('')}</div>`;
  }
};

/* =========================================================================
   Feuille « prise » — trois modes :
   - context : juste après « + Snus / + Vape » (la prise est déjà enregistrée)
   - edit    : modifier ou supprimer une prise existante
   - new     : ajouter une prise oubliée, avec son heure
   L'état en cours d'édition vit dans UI.sheetState jusqu'à « Enregistrer ».
   ========================================================================= */
const IntakeSheet = {
  open(state) {
    UI.sheetState = state;
    UI.openSheet(IntakeSheet.html(state), 'Prise');
  },
  refresh() { UI.updateSheet(IntakeSheet.html(UI.sheetState)); },

  /** Ouvre la feuille d'une prise existante. */
  openFor(id, mode) {
    const x = Intakes.find(id);
    if (!x) return;
    IntakeSheet.open({ mode, id, type: x.type, ts: x.ts, trigger: x.trigger, intensity: x.intensity, confirmDelete: false });
  },

  html(st) {
    if (st.confirmDelete) return IntakeSheet.confirmHtml(st);
    const title = {
      context: `Prise de ${Dates.formatTime(st.ts)} · ${st.type === 'snus' ? 'Snus' : 'Vape'}`,
      edit: 'Modifier la prise',
      new: 'Ajouter une prise'
    }[st.mode];
    return `
      <div class="stack" style="gap:6px">
        <h2 class="title" style="font-size:22px">${title}</h2>
        ${st.mode === 'context' ? '<p class="small muted">Facultatif. Ça aide à repérer tes moments.</p>' : ''}
      </div>
      ${st.mode === 'context' ? '' : IntakeSheet.whenHtml(st)}
      ${IntakeSheet.triggersHtml(st.trigger)}
      ${IntakeSheet.intensityHtml(st.intensity)}
      ${IntakeSheet.buttonsHtml(st)}`;
  },

  whenHtml(st) {
    return `${Screens.segmented('', [['snus', 'Snus'], ['vape', 'Vape']], st.type, 'Type', 'sheet-type')}
      <label class="stack">
        <span class="label">Date et heure</span>
        <span class="field__box" style="width:100%"><input type="datetime-local" data-sheet="ts"
          value="${Dates.toInputValue(st.ts)}" max="${Dates.toInputValue(Date.now())}" style="text-align:left"></span>
      </label>`;
  },

  triggersHtml(current) {
    return `<div class="stack">
      <span class="label">Déclencheur</span>
      <div class="grid-3">${TRIGGERS.map(([k, label]) =>
        `<button type="button" class="chip" data-action="sheet-trigger" data-value="${k}" aria-pressed="${current === k}">${label}</button>`).join('')}</div>
    </div>`;
  },

  intensityHtml(current) {
    return `<div class="stack">
      <span class="label">Intensité de l'envie</span>
      <div class="grid-5 scale--warm">${[1, 2, 3, 4, 5].map((n) =>
        `<button type="button" class="scale-btn" data-action="sheet-intensity" data-value="${n}" aria-pressed="${current === n}" aria-label="Intensité ${n} sur 5">${n}</button>`).join('')}</div>
      <div class="row tiny faint"><span>légère</span><span>forte</span></div>
    </div>`;
  },

  buttonsHtml(st) {
    if (st.mode === 'context') {
      return `<div class="grid-2">
          <button type="button" class="btn" data-action="close-sheet">Plus tard</button>
          <button type="button" class="btn btn--primary" data-action="sheet-save">Enregistrer</button>
        </div>
        <button type="button" class="link" data-action="sheet-undo" style="align-self:center;margin-top:-12px">Annuler cette prise</button>`;
    }
    if (st.mode === 'edit') {
      return `<div class="grid-2">
          <button type="button" class="btn" data-action="sheet-ask-delete">Supprimer</button>
          <button type="button" class="btn btn--primary" data-action="sheet-save">Enregistrer</button>
        </div>`;
    }
    return `<div class="grid-2">
        <button type="button" class="btn" data-action="close-sheet">Fermer</button>
        <button type="button" class="btn btn--primary" data-action="sheet-save">Ajouter</button>
      </div>`;
  },

  confirmHtml(st) {
    return `<h2 class="title" style="font-size:22px">Supprimer cette prise ?</h2>
      <p class="muted small">${st.type === 'snus' ? 'Snus' : 'Vape'} du ${Util.esc(Dates.formatDayShort(st.ts))} à ${Dates.formatTime(st.ts)}.</p>
      <div class="grid-2">
        <button type="button" class="btn" data-action="sheet-cancel-delete">Garder</button>
        <button type="button" class="btn btn--surface" data-action="sheet-delete">Supprimer</button>
      </div>`;
  },

  /** Enregistre l'état de la feuille dans les données. */
  save() {
    const st = UI.sheetState;
    if (!st) return;
    if (!Intakes.isValidTs(st.ts)) { UI.toast('Cette heure est dans le futur.'); return; }
    if (st.mode === 'new') {
      Intakes.add(st.type, st.ts, st.trigger, st.intensity);
      App.viewDay = Dates.dayKey(st.ts) === Dates.todayKey() ? null : Dates.dayKey(st.ts);
      UI.toast(`Prise ajoutée : ${Dates.formatDayShort(st.ts)}, ${Dates.formatTime(st.ts)}.`);
    } else {
      Intakes.edit(st.id, { type: st.type, ts: st.ts, trigger: st.trigger, intensity: st.intensity });
      if (st.mode === 'edit') UI.toast('Prise modifiée.');
    }
    UI.closeSheet();
    App.render();
  }
};

/* =========================================================================
   Actions — reliées aux éléments via data-action
   ========================================================================= */
const Actions = {
  'close-sheet'() { UI.closeSheet(); },

  /* ---- Relevé ---- */
  'add-intake'(el) {
    const type = el.dataset.type;
    const id = Intakes.add(type, Date.now());
    App.render();
    if (Store.data.settings.askContext) {
      IntakeSheet.openFor(id, 'context');
    } else {
      UI.toast(`${type === 'snus' ? 'Snus' : 'Vape'} noté à ${Dates.formatTime(Date.now())}.`, 'Annuler', () => {
        Intakes.remove(id); App.render(); UI.toast('Prise annulée.');
      }, 6000);
    }
  },
  'open-intake'(el) { IntakeSheet.openFor(el.dataset.id, 'edit'); },
  'new-intake'() {
    const today = Dates.todayKey();
    // Pour un jour passé, on propose midi ce jour-là ; sinon maintenant.
    const ts = App.viewDay && App.viewDay !== today ? Dates.keyToStart(App.viewDay) + 12 * 3600000 : Date.now();
    IntakeSheet.open({ mode: 'new', id: null, type: 'snus', ts, trigger: null, intensity: null, confirmDelete: false });
  },
  'sheet-type'(el) { UI.sheetState.type = el.dataset.value; IntakeSheet.refresh(); },
  'sheet-trigger'(el) {
    const st = UI.sheetState;
    st.trigger = st.trigger === el.dataset.value ? null : el.dataset.value;
    IntakeSheet.refresh();
  },
  'sheet-intensity'(el) {
    const st = UI.sheetState;
    const n = Number(el.dataset.value);
    st.intensity = st.intensity === n ? null : n;
    IntakeSheet.refresh();
  },
  'sheet-save'() { IntakeSheet.save(); },
  'sheet-undo'() {
    Intakes.remove(UI.sheetState.id);
    UI.closeSheet();
    App.render();
    UI.toast('Prise annulée.');
  },
  'sheet-ask-delete'() { UI.sheetState.confirmDelete = true; IntakeSheet.refresh(); },
  'sheet-cancel-delete'() { UI.sheetState.confirmDelete = false; IntakeSheet.refresh(); },
  'sheet-delete'() {
    const removed = Intakes.find(UI.sheetState.id);
    Intakes.remove(UI.sheetState.id);
    UI.closeSheet();
    App.render();
    UI.toast('Prise supprimée.', 'Annuler', () => {
      Store.data.intakes.push(removed); Intakes.sort(); Store.save(); App.render();
    }, 6000);
  },

  /* ---- Navigation entre les jours ---- */
  'day-prev'() { App.viewDay = Dates.addDays(App.viewDay || Dates.todayKey(), -1); App.render(); },
  'day-next'() {
    const next = Dates.addDays(App.viewDay || Dates.todayKey(), 1);
    App.viewDay = Dates.diffDays(next, Dates.todayKey()) <= 0 ? null : next;
    App.render();
  },
  'toggle-setting'(el) {
    const key = el.dataset.key;
    Store.update((d) => { d.settings[key] = !d.settings[key]; });
  },

  'set-setting'(el) {
    Store.update((d) => { d.settings[el.dataset.key] = el.dataset.value; });
    if (el.dataset.key === 'theme') UI.applyTheme();
  },

  export() { Backup.exportFile(); },
  import() { document.getElementById('import-input').click(); },
  'confirm-import'() { Backup.applyPending(); }
};

/* =========================================================================
   Sauvegarde — export (partage iOS ou téléchargement) et import
   ========================================================================= */
const Backup = {
  pending: null,

  async exportFile() {
    const name = `stase-${Dates.todayKey()}.json`;
    const blob = new Blob([Store.exportJson()], { type: 'application/json' });
    const file = typeof File === 'function' ? new File([blob], name, { type: 'application/json' }) : null;
    try {
      // Sur iPhone, la feuille de partage permet « Enregistrer dans Fichiers ».
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Sauvegarde STASE' });
      } else {
        Backup.download(blob, name);
      }
      Store.update((d) => { d.settings.lastExportAt = Date.now(); });
      UI.toast('Sauvegarde exportée.');
    } catch (e) {
      if (e && e.name === 'AbortError') return; // partage annulé
      Backup.download(blob, name);
    }
  },

  download(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  },

  /** Lecture du fichier choisi, puis demande de confirmation. */
  readFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      const res = Store.parseImport(String(reader.result));
      if (!res.ok) { UI.toast(res.error); return; }
      Backup.pending = res.data;
      UI.openSheet(`
        <h2 class="title" style="font-size:22px">Remplacer les données ?</h2>
        <p class="muted small">Ce fichier contient ${res.data.intakes.length} prise(s), ${res.data.cravings.length} envie(s) et ${res.data.checkins.length} check-in(s).
        Tes données actuelles (${Store.data.intakes.length} prise(s)) seront remplacées. Tu pourras annuler juste après.</p>
        <div class="grid-2">
          <button type="button" class="btn" data-action="close-sheet">Garder</button>
          <button type="button" class="btn btn--primary" data-action="confirm-import">Remplacer</button>
        </div>`, 'Importer une sauvegarde');
    };
    reader.onerror = () => UI.toast('Lecture du fichier impossible.');
    reader.readAsText(file);
  },

  applyPending() {
    if (!Backup.pending) return;
    Store.replaceAll(Backup.pending);
    Backup.pending = null;
    UI.closeSheet();
    UI.applyTheme();
    App.render();
    UI.toast('Données importées.', 'Annuler', () => {
      if (Store.restoreBackup()) { UI.applyTheme(); App.render(); UI.toast('Import annulé.'); }
    }, 8000);
  }
};

/* =========================================================================
   App — routage par #hash et rendu
   ========================================================================= */
const App = {
  routes: ['aujourdhui', 'stats', 'corps', 'checkin', 'reglages', 'envie'],
  testMode: false,
  /** Jour affiché sur « Aujourd'hui » (null = aujourd'hui). */
  viewDay: null,
  /** Dernier jour local vu : sert à détecter minuit ou un changement de fuseau. */
  lastDayKey: null,
  /** Écrans sans barre d'onglets ni bouton flottant. */
  focused: ['envie'],

  route() {
    const name = location.hash.replace(/^#\/?/, '');
    return App.routes.includes(name) ? name : 'aujourdhui';
  },

  /** Redessine si le jour local a changé (minuit, fuseau, retour dans l'app). */
  checkDayChange() {
    const key = Dates.todayKey();
    if (key === App.lastDayKey) return;
    App.lastDayKey = key;
    App.viewDay = null;
    if (!UI.sheetState) App.render();
  },

  render() {
    App.lastDayKey = Dates.todayKey();
    const name = App.route();
    const view = document.getElementById('view');
    view.innerHTML = Screens[name]();
    document.body.classList.toggle('no-chrome', App.focused.includes(name));
    document.querySelectorAll('.tab').forEach((t) => {
      if (t.dataset.tab === name) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
    });
  },

  onClick(e) {
    const el = e.target.closest('[data-action]');
    if (!el || !Actions[el.dataset.action]) return;
    e.preventDefault();
    Actions[el.dataset.action](el);
  },

  /** Saisie d'un réglage numérique : validée à la sortie du champ. */
  onChange(e) {
    const input = e.target;
    if (input.id === 'import-input') {
      if (input.files[0]) Backup.readFile(input.files[0]);
      input.value = '';
      return;
    }
    if (input.dataset.sheet === 'ts' && UI.sheetState) {
      const ts = Dates.fromInputValue(input.value);
      if (ts !== null) UI.sheetState.ts = ts;
      return;
    }
    const key = input.dataset.setting;
    if (!key) return;
    const n = Util.parseNum(input.value);
    if (n === null) {
      input.parentElement.classList.add('is-invalid');
      UI.toast('Nombre attendu, par exemple 6,90.');
      return;
    }
    Store.update((d) => { d.settings[key] = n; });
  },

  boot() {
    Store.load();
    UI.applyTheme();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    document.addEventListener('click', App.onClick);
    document.addEventListener('change', App.onChange);
    window.addEventListener('hashchange', () => { App.viewDay = null; App.render(); document.getElementById('view').scrollTop = 0; });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) App.checkDayChange(); });
    setInterval(App.checkDayChange, 30000);
    if (new URLSearchParams(location.search).has('test')) { App.testMode = true; Tests.run(); return; }
    App.render();
  }
};

/* =========================================================================
   Tests — ouvrir index.html?test
   ========================================================================= */
const Tests = {
  cases: [],
  add(name, fn) { Tests.cases.push([name, fn]); },
  eq(actual, expected, msg) {
    const a = JSON.stringify(actual), b = JSON.stringify(expected);
    if (a !== b) throw new Error(`${msg || ''} attendu ${b}, obtenu ${a}`);
  },
  near(actual, expected, msg, eps = 0.01) {
    if (Math.abs(actual - expected) > eps) throw new Error(`${msg || ''} attendu ≈${expected}, obtenu ${actual}`);
  },

  run() {
    const results = Tests.cases.map(([name, fn]) => {
      try { fn(); return { name, ok: true }; } catch (e) { return { name, ok: false, err: e.message }; }
    });
    const ko = results.filter((r) => !r.ok).length;
    document.body.classList.add('no-chrome');
    document.getElementById('view').innerHTML = `<div class="screen">
      <h1 class="title" id="test-summary">${ko ? `${ko} échec(s)` : 'Tous les tests passent'} · ${results.length} tests</h1>
      <p class="small faint">Fuseau : ${Util.esc(Intl.DateTimeFormat().resolvedOptions().timeZone)}</p>
      <div>${results.map((r) => `<div class="test-row"><span class="${r.ok ? 'test-ok' : 'test-ko'}">${r.ok ? 'OK' : 'KO'}</span>
        <span>${Util.esc(r.name)}${r.ok ? '' : `<br><span class="small faint">${Util.esc(r.err)}</span>`}</span></div>`).join('')}</div>
    </div>`;
    console.log(results);
  }
};

/* ---- Étape 1 : utilitaires, dates, stockage ---- */
Tests.add('parseNum accepte la virgule et refuse le négatif', () => {
  Tests.eq(Util.parseNum('6,90'), 6.9);
  Tests.eq(Util.parseNum(' 20 '), 20);
  Tests.eq(Util.parseNum('0'), 0);
  Tests.eq(Util.parseNum('-1'), null);
  Tests.eq(Util.parseNum('abc'), null);
  Tests.eq(Util.parseNum(''), null);
});
Tests.add('dayKey utilise le jour local', () => {
  const ts = new Date(2026, 9, 7, 23, 59).getTime();
  Tests.eq(Dates.dayKey(ts), '2026-10-07');
  Tests.eq(Dates.dayKey(ts + 2 * 60000), '2026-10-08');
});
Tests.add('addDays et diffDays traversent les changements d’heure', () => {
  Tests.eq(Dates.addDays('2026-03-28', 1), '2026-03-29');
  Tests.eq(Dates.addDays('2026-03-29', 1), '2026-03-30');
  Tests.eq(Dates.addDays('2026-10-24', 2), '2026-10-26');
  Tests.eq(Dates.diffDays('2026-03-01', '2026-04-01'), 31);
  Tests.eq(Dates.range('2026-12-30', '2027-01-02').length, 4);
});
Tests.add('splitDuration', () => {
  Tests.eq(Dates.splitDuration((3 * 86400 + 14 * 3600 + 22 * 60 + 8) * 1000), { d: 3, h: 14, m: 22, s: 8 });
  Tests.eq(Dates.splitDuration(-5), { d: 0, h: 0, m: 0, s: 0 });
});
Tests.add('normalize complète un objet partiel', () => {
  const d = Store.normalize({ settings: { snusBoxPrice: 7, phase: 'n’importe' } });
  Tests.eq(d.settings.snusBoxPrice, 7);
  Tests.eq(d.settings.phase, 'observation');
  Tests.eq(d.settings.snusPerBox, 20);
  Tests.eq(d.intakes, []);
});
Tests.add('normalize écarte les entrées invalides et trie', () => {
  const d = Store.normalize({ intakes: [
    { type: 'snus', ts: 2000, trigger: 'cafe', intensity: 9 },
    { type: 'cigarette', ts: 1000 },
    { type: 'vape', ts: 1000, trigger: 'inconnu', intensity: 3 },
    null
  ] });
  Tests.eq(d.intakes.length, 2);
  Tests.eq(d.intakes[0].type, 'vape');
  Tests.eq(d.intakes[0].trigger, null);
  Tests.eq(d.intakes[1].intensity, null);
});
Tests.add('un check-in par jour, le dernier l’emporte', () => {
  const d = Store.normalize({ checkins: [{ date: '2026-10-07', sleep: 2 }, { date: '2026-10-07', sleep: 4 }, { date: 'hier' }] });
  Tests.eq(d.checkins.length, 1);
  Tests.eq(d.checkins[0].sleep, 4);
});
Tests.add('export puis import redonne les mêmes données', () => {
  const saved = Store.data;
  Store.data = Store.normalize({ intakes: [{ id: 'a', type: 'snus', ts: 1, trigger: 'stress', intensity: 2 }], settings: { snusBoxPrice: 6.9 } });
  const res = Store.parseImport(Store.exportJson());
  const expected = Store.data;
  Store.data = saved;
  Tests.eq(res.ok, true);
  Tests.eq(res.data, expected);
});
Tests.add('import refuse un fichier étranger', () => {
  Tests.eq(Store.parseImport('pas du json').ok, false);
  Tests.eq(Store.parseImport('{"foo":1}').ok, false);
});

/* ---- Étape 2 : relevé et calculs du jour ---- */
Tests.add('dailyCounts répartit par jour local, minuit compris', () => {
  const t = (d, h, m) => new Date(2026, 9, d, h, m).getTime();
  const list = [
    { type: 'snus', ts: t(5, 23, 58) }, { type: 'vape', ts: t(6, 0, 2) },
    { type: 'vape', ts: t(6, 12, 0) }, { type: 'snus', ts: t(8, 9, 0) }
  ];
  const days = Calc.dailyCounts(list, '2026-10-05', '2026-10-08');
  Tests.eq(days.map((d) => d.total), [1, 2, 0, 1]);
  Tests.eq(days[1], { key: '2026-10-06', snus: 0, vape: 2, total: 2 });
});
Tests.add('moyenne 7 j : aujourd’hui exclu, historique court pris en compte', () => {
  const t = (d, h) => new Date(2026, 9, d, h).getTime();
  Tests.eq(Calc.avgPerDay([], '2026-10-10'), null);
  // Une seule prise aujourd'hui : pas encore de jour complet.
  Tests.eq(Calc.avgPerDay([{ type: 'snus', ts: t(10, 9) }], '2026-10-10'), null);
  // Deux jours complets (8 et 9) : 3 puis 1 prises → 2 par jour.
  const list = [8, 8, 8, 9, 10].map((d) => ({ type: 'snus', ts: t(d, 10) }));
  const avg = Calc.avgPerDay(list, '2026-10-10');
  Tests.eq(avg.days, 2);
  Tests.near(avg.total, 2);
});
Tests.add('moyenne 7 j : fenêtre glissante de 7 jours', () => {
  const t = (d) => new Date(2026, 9, d, 10).getTime();
  const list = [];
  for (let d = 1; d <= 14; d++) for (let i = 0; i < d; i++) list.push({ type: i % 2 ? 'vape' : 'snus', ts: t(d) });
  const avg = Calc.avgPerDay(list, '2026-10-15');
  Tests.eq(avg.days, 7);
  Tests.near(avg.total, (8 + 9 + 10 + 11 + 12 + 13 + 14) / 7);
});
Tests.add('ajout, modification, suppression d’une prise', () => {
  const saved = Store.data;
  Store.data = Store.defaults();
  const id = Intakes.add('snus', new Date(2026, 9, 7, 14, 32).getTime());
  Intakes.add('vape', new Date(2026, 9, 7, 9, 0).getTime());
  Tests.eq(Store.data.intakes[0].type, 'vape');
  Intakes.edit(id, { trigger: 'stress', intensity: 4, ts: new Date(2026, 9, 6, 22, 0).getTime() });
  Tests.eq(Calc.onDay(Store.data.intakes, '2026-10-06').length, 1);
  Tests.eq(Intakes.find(id).trigger, 'stress');
  Tests.eq(Intakes.remove(id), true);
  Tests.eq(Store.data.intakes.length, 1);
  Store.data = saved;
  Store.save();
});
Tests.add('une heure dans le futur est refusée', () => {
  Tests.eq(Intakes.isValidTs(Date.now() + 3600000), false);
  Tests.eq(Intakes.isValidTs(Date.now() - 60000), true);
  Tests.eq(Intakes.isValidTs(NaN), false);
});

App.boot();
