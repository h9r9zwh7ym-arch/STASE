<style>
/* =========================================================================
   1. Jetons de design (maquettes STASE) — sombre par défaut, clair en option
   ========================================================================= */
:root {
  --bg: #0B1220;
  --surface: #131C2F;
  --surface-2: #1B263D;
  --line: #26324B;
  --line-2: #3A4766;
  --text: #EAF0F8;
  --text-2: #A7B3C8;
  --text-3: #8693AD;
  --mint: #5EE6C4;
  --on-mint: #062A22;
  --mint-dim: rgba(94, 230, 196, 0.12);
  --mint-line: rgba(94, 230, 196, 0.35);
  --warm: #F2B36B;
  --on-warm: #2A1704;
  --warm-soft: rgba(242, 179, 107, 0.55);
  --data: #5B6F99;
  --data-hi: #C9D3E3;
  --scrim: rgba(4, 8, 16, 0.62);
  --sheet: #151F34;
  --bar: rgba(13, 20, 35, 0.94);
  --shadow: 0 10px 28px rgba(0, 0, 0, 0.45);

  --font-num: 'Space Grotesk', ui-rounded, -apple-system, system-ui, sans-serif;
  --font-text: 'Manrope', -apple-system, system-ui, sans-serif;

  --r-sm: 14px;
  --r-md: 18px;
  --r-lg: 24px;
  --gutter: 24px;
  --tabbar-h: 62px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
:root[data-theme="light"] {
  --bg: #F3F5F9;
  --surface: #FFFFFF;
  --surface-2: #E8ECF3;
  --line: #D6DCE7;
  --line-2: #B9C2D3;
  --text: #0D1525;
  --text-2: #46526B;
  --text-3: #5D6981;
  --mint: #0E7F69;
  --on-mint: #FFFFFF;
  --mint-dim: rgba(14, 127, 105, 0.10);
  --mint-line: rgba(14, 127, 105, 0.35);
  --warm: #A3560F;
  --on-warm: #FFFFFF;
  --warm-soft: rgba(163, 86, 15, 0.45);
  --data: #7A879F;
  --data-hi: #2B3550;
  --scrim: rgba(13, 21, 37, 0.36);
  --sheet: #FFFFFF;
  --bar: rgba(255, 255, 255, 0.94);
  --shadow: 0 10px 24px rgba(13, 21, 37, 0.12);
}

/* =========================================================================
   2. Base
   ========================================================================= */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); }
body {
  color: var(--text);
  font-family: var(--font-text);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
/* Pas de zoom au double tap ; les champs restent ≥ 16 px pour éviter le zoom au focus d'iOS. */
button, a, input, label, select { touch-action: manipulation; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* =========================================================================
   3. Coquille de l'app : vue défilante, barre d'onglets, bouton flottant
   ========================================================================= */
#view {
  position: fixed;
  inset: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: calc(var(--safe-top) + 20px) var(--gutter) calc(var(--tabbar-h) + var(--safe-bottom) + 96px);
}
body.no-chrome #view { padding-bottom: calc(var(--safe-bottom) + 32px); }
.screen { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  padding: 4px 4px var(--safe-bottom);
  background: var(--bar);
  border-top: 1px solid var(--line);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
}
.tab {
  min-height: var(--tabbar-h);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--text-3); text-decoration: none; font-size: 11px; font-weight: 600;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--mint); }
body.no-chrome .tabbar, body.no-chrome .fab { display: none; }

.fab {
  position: fixed; left: 50%; z-index: 21;
  bottom: calc(var(--tabbar-h) + var(--safe-bottom) + 18px);
  transform: translateX(-50%);
  height: 52px; padding: 0 22px; border-radius: 26px;
  display: flex; align-items: center; gap: 10px; white-space: nowrap;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--warm); box-shadow: var(--shadow);
  text-decoration: none; font-size: 15px; font-weight: 600;
}
.fab svg { width: 20px; height: 20px; color: var(--warm); }

/* =========================================================================
   4. Typographie et éléments de texte
   ========================================================================= */
.wordmark { font-family: var(--font-num); font-size: 15px; font-weight: 600; letter-spacing: 0.42em; }
.label { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); }
.title { font-family: var(--font-num); font-size: 30px; font-weight: 600; line-height: 1.15; }
.title--soft { font-weight: 500; font-size: 32px; }
.big-number { font-family: var(--font-num); font-size: 120px; font-weight: 500; line-height: 0.95; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.value { font-family: var(--font-num); font-size: 30px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.value--mint { color: var(--mint); }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

.header { display: flex; justify-content: space-between; align-items: center; min-height: 32px; }
.pill {
  font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
}
.pill--mint { color: var(--mint); background: var(--mint-dim); border-color: transparent; }

/* =========================================================================
   5. Composants
   ========================================================================= */
.card { background: var(--surface); border-radius: var(--r-lg); padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.card--outline { background: transparent; border: 1px solid var(--line); }
.card--empty { background: transparent; border: 1px dashed var(--line); padding: 24px; }
.card--featured { border: 1px solid var(--mint-line); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid-5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

.btn {
  min-height: 56px; padding: 0 20px; border-radius: var(--r-md);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 16px; font-weight: 600; text-decoration: none;
  border: 1px solid var(--line); background: transparent; color: var(--text);
}
.btn--primary { background: var(--mint); color: var(--on-mint); border-color: var(--mint); font-weight: 700; }
.btn--surface { background: var(--surface); }
.btn--dashed { border-style: dashed; border-color: var(--line-2); color: var(--text-2); }
.btn--block { width: 100%; }
.btn:disabled { background: var(--surface-2); border-color: var(--surface-2); color: var(--text-3); }
.link {
  min-height: 48px; display: inline-flex; align-items: center; justify-content: center;
  background: none; border: 0; padding: 0 4px; color: var(--text-2);
  font-size: 14px; text-decoration: underline; text-underline-offset: 3px;
}
.link--mint { color: var(--mint); text-decoration: none; font-weight: 600; font-size: 15px; }
.icon-btn {
  width: 48px; height: 48px; border-radius: 24px; border: 0;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--surface); color: var(--text-2);
}
.icon-btn svg { width: 20px; height: 20px; }

/* Puces de déclencheur : sélection neutre (inversée) */
.chip {
  min-height: 48px; border-radius: var(--r-sm); padding: 0 8px;
  background: var(--surface); color: var(--text-2); border: 1px solid var(--line);
  font-size: 14px; font-weight: 600;
}
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
/* Échelle 1–5 : neutre par défaut, ambre pour l'intensité d'envie */
.scale-btn {
  height: 52px; border-radius: var(--r-sm);
  background: var(--surface); color: var(--text-2); border: 1px solid var(--line);
  font-family: var(--font-num); font-size: 18px; font-weight: 600;
}
.scale-btn[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.scale--warm .scale-btn[aria-pressed="true"] { background: var(--warm); color: var(--on-warm); border-color: var(--warm); }

.segmented { display: grid; grid-auto-columns: minmax(0, 1fr); grid-auto-flow: column; background: var(--surface); border-radius: 16px; padding: 4px; }
.segmented button { min-height: 48px; border: 0; border-radius: 12px; background: transparent; color: var(--text-2); font-size: 15px; font-weight: 600; }
.segmented button[aria-pressed="true"] { background: var(--line); color: var(--text); }
:root[data-theme="light"] .segmented button[aria-pressed="true"] { background: var(--surface-2); }

.group { background: var(--surface); border-radius: 20px; padding: 0 16px; }
.group > * + * { border-top: 1px solid var(--line); }
.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; padding: 8px 0; }
.field__label { display: flex; flex-direction: column; gap: 2px; font-size: 15px; }
.field__box {
  flex: none; width: 128px; height: 48px; border-radius: 12px; padding: 0 12px;
  display: flex; align-items: center; gap: 6px;
  background: var(--surface-2); border: 1px solid transparent;
}
.field__box:focus-within { border-color: var(--mint); }
.field__box.is-invalid { border-color: var(--warm); }
.field__box input {
  width: 100%; min-width: 0; border: 0; outline: none; background: transparent;
  text-align: right; font-family: var(--font-num); font-size: 16px; /* 16 px : pas de zoom iOS */
}
.field__unit { font-size: 14px; color: var(--text-3); white-space: nowrap; }

.switch { flex: none; width: 52px; height: 32px; border-radius: 16px; border: 0; padding: 3px; background: var(--line); display: flex; }
.switch::after { content: ''; width: 26px; height: 26px; border-radius: 13px; background: var(--text-2); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--mint); }
.switch[aria-checked="true"]::after { background: var(--on-mint); transform: translateX(20px); }

.progress { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.progress > span { display: block; height: 100%; border-radius: 3px; background: var(--mint); }

/* Aujourd'hui : navigation jour, compteur, boutons de relevé, lignes */
.day-nav { display: flex; align-items: center; gap: 4px; margin: 0 -12px; }
.day-nav .label { flex: 1; text-align: center; }
.icon-btn--ghost { background: transparent; color: var(--text-3); }
.icon-btn:disabled { opacity: 0.3; }
.counter { display: flex; align-items: baseline; gap: 14px; }
.counter .muted { font-size: 17px; }
.log-btn {
  height: 96px; border-radius: var(--r-lg);
  background: var(--surface); border: 1px solid var(--line); color: var(--text);
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-family: var(--font-num); font-size: 22px; font-weight: 600;
  transition: transform .08s, background .15s;
}
.log-btn:active { transform: scale(0.97); background: var(--surface-2); }
.entry {
  width: 100%; min-height: 60px; padding: 0 2px; display: flex; align-items: center; gap: 14px;
  background: transparent; border: 0; border-bottom: 1px solid var(--line); text-align: left;
}
.entry__time { width: 52px; font-size: 17px; font-weight: 500; }
.entry__kind { width: 68px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
.entry__ctx { flex: 1; font-size: 14px; color: var(--text-2); }
.entry__ctx.faint { color: var(--text-3); }
.marker { width: 8px; height: 8px; background: var(--text-2); }
.marker--snus { border-radius: 2px; }
.marker--vape { border-radius: 4px; }
.dots { display: flex; gap: 4px; }
.dots span { width: 6px; height: 6px; border-radius: 3px; background: var(--line); }
.dots span.on { background: var(--warm); }
input[type="datetime-local"] { width: 100%; border: 0; outline: none; background: transparent; font-family: var(--font-num); font-size: 16px; min-height: 44px; }

/* Check-in et corrélation */
.done-mark { width: 40px; height: 40px; border-radius: 20px; background: var(--mint-dim); color: var(--mint); display: flex; align-items: center; justify-content: center; }
.corr { display: grid; grid-template-columns: minmax(0, 1fr) 84px 84px; gap: 12px 8px; align-items: center; font-size: 15px; }
.corr .num { font-size: 18px; font-weight: 600; text-align: center; }
.corr > .tiny { text-align: center; }

/* J'ai une envie : cercle de respiration */
.breath { position: relative; width: min(290px, 74vw); aspect-ratio: 1; margin-top: 8px; }
.breath svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.breath__track { fill: none; stroke: var(--surface-2); stroke-width: 5; }
.breath__ring { fill: none; stroke: var(--mint); stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.breath__disc {
  position: absolute; inset: 12%; border-radius: 50%;
  background: var(--mint-dim); border: 1px solid var(--mint-line);
  animation: breathe 10s ease-in-out infinite;
}
@keyframes breathe { 0% { transform: scale(0.55); } 40% { transform: scale(1); } 100% { transform: scale(0.55); } }
.breath__text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.breath__phase { font-family: var(--font-num); font-size: 26px; font-weight: 500; }
@media (prefers-reduced-motion: reduce) { .breath__disc { transform: scale(0.8); } }

/* Questionnaire et bénéfices */
.option {
  width: 100%; min-height: 60px; padding: 10px 16px; border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left;
  background: var(--surface); border: 1px solid var(--line); color: var(--text); font-size: 16px; font-weight: 600;
}
.option[aria-pressed="true"] { border-color: var(--mint); background: var(--mint-dim); }
.option__check { flex: none; width: 26px; height: 26px; border-radius: 13px; border: 2px solid var(--line-2); display: flex; align-items: center; justify-content: center; color: var(--on-mint); }
.option[aria-pressed="true"] .option__check { background: var(--mint); border-color: var(--mint); }
.option__check svg { width: 15px; height: 15px; }
.benefit { gap: 8px; }
details.benefit summary { list-style: none; cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
details.benefit summary::-webkit-details-marker { display: none; }
.benefit__more { color: var(--text-3); font-weight: 600; }
.benefit__more::after { content: ' ›'; }
details.benefit[open] .benefit__more { display: none; }
.trend { font-size: 14px; color: var(--text-2); border-top: 1px solid var(--line); padding-top: 10px; margin-top: 2px; }
.trend.is-good { color: var(--mint); font-weight: 600; }
.tl__tag--me { color: var(--mint) !important; }

/* Frise Corps */
.timeline { list-style: none; margin: 0; padding: 0; }
.tl { display: grid; grid-template-columns: 24px minmax(0, 1fr); column-gap: 16px; }
.tl__rail { display: flex; flex-direction: column; align-items: center; }
.tl__node {
  flex: none; width: 24px; height: 24px; border-radius: 12px; box-sizing: border-box;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); border: 2px solid var(--line-2); color: var(--on-mint);
}
.tl__node svg { width: 14px; height: 14px; stroke-width: 3; }
.tl--done .tl__node { background: var(--mint); border: 0; }
.tl--next .tl__node { border: 3px solid var(--mint); box-shadow: 0 0 0 6px var(--mint-dim); }
.tl__line { flex: 1; width: 2px; min-height: 20px; background: var(--line); }
.tl__line.is-on { background: var(--mint); }
.tl__body { padding: 1px 0 26px; display: flex; flex-direction: column; gap: 4px; }
.tl__title { font-family: var(--font-num); font-size: 17px; font-weight: 600; }
.tl__tag { font-family: var(--font-text); font-size: 12px; font-weight: 600; color: var(--text-3); margin-left: 4px; }
.tl--next .tl__tag { color: var(--mint); }
.tl__text { font-size: 14px; line-height: 1.5; color: var(--text-2); }
.tl--future .tl__title, .tl--future .tl__text { color: var(--text-3); }

/* Graphes SVG */
.chart { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--font-text); }
.c-data { fill: var(--data); }
.c-data-hi { fill: var(--data-hi); }
.c-data-muted { fill: var(--line-2); }
.c-warm { fill: var(--warm-soft); }
.c-warm-hi { fill: var(--warm); }
.c-mint { fill: var(--mint); }
.c-empty { fill: var(--line); }
.c-track { fill: var(--surface-2); }
.c-avg { stroke: var(--text-3); stroke-width: 1; stroke-dasharray: 4 4; }
.c-label { font-size: 11px; fill: var(--text-3); }
.c-label-hi { fill: var(--text); }
.c-row-label { font-size: 13px; fill: var(--text); }
.c-row-pct { font-size: 13px; fill: var(--text-2); font-family: var(--font-num) !important; }
.c-day { fill: var(--surface-2); }
.c-day--clean, .c-day--ok { fill: var(--mint); }
.c-day--today { fill: transparent; stroke: var(--mint); stroke-dasharray: 4 3; }
.c-day--used, .c-day--ko { fill: var(--line); }
.c-day-label { font-size: 12px; font-family: var(--font-num) !important; fill: var(--text-2); font-weight: 600; }
.c-day-label--clean, .c-day-label--ok { fill: var(--on-mint); }
.c-line { fill: none; stroke: var(--mint); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.c-area { fill: var(--mint-dim); }
.c-dot { fill: var(--bg); stroke: var(--mint); stroke-width: 2.5; }
.ghost-chart rect { fill: transparent; stroke: var(--line); stroke-dasharray: 4 3; }
.ghost-chart rect.c-data-hi { fill: var(--data); stroke: none; }

/* =========================================================================
   6. Feuille du bas, toast
   ========================================================================= */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); opacity: 0; transition: opacity .2s; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
  max-height: calc(100dvh - var(--safe-top) - 24px); overflow-y: auto;
  background: var(--sheet); border-top: 1px solid var(--line); border-radius: 28px 28px 0 0;
  padding: 12px var(--gutter) calc(var(--safe-bottom) + 28px);
  display: flex; flex-direction: column; gap: 22px;
  transform: translateY(100%); transition: transform .25s ease-out;
}
.sheet__grabber { align-self: center; width: 40px; height: 4px; border-radius: 2px; background: var(--line); }
.sheet-open .scrim { opacity: 1; }
.sheet-open .sheet { transform: none; }
.sheet .inner { max-width: 480px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.toast {
  position: fixed; left: 50%; z-index: 50;
  bottom: calc(var(--tabbar-h) + var(--safe-bottom) + 84px);
  transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
  width: min(calc(100% - 32px), 440px); min-height: 52px; padding: 4px 8px 4px 18px; border-radius: 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--text); color: var(--bg); font-size: 15px; font-weight: 600;
  box-shadow: var(--shadow); transition: opacity .2s, transform .2s;
}
.toast.is-visible { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { min-height: 44px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* =========================================================================
   7. Mode test (?test)
   ========================================================================= */
.test-row { display: flex; gap: 10px; font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.test-ok { color: var(--mint); }
.test-ko { color: var(--warm); }
</style>

<script>
'use strict';

/* =========================================================================
   Constantes
   ========================================================================= */
const APP_VERSION = '0.1.0';
const STORAGE_KEY = 'stase.v1';
const BACKUP_KEY = 'stase.backup';
const SCHEMA_VERSION = 1;
const DAY_MS = 86400000;

/** Déclencheurs : clé stockée → libellé affiché. */
const TRIGGERS = [
  ['ennui', 'Ennui'], ['stress', 'Stress'], ['cafe', 'Café'],
  ['repas', 'Après repas'], ['soiree', 'Soirée'], ['reveil', 'Réveil']
];
const TRIGGER_LABEL = Object.fromEntries(TRIGGERS);
const INTAKE_TYPES = ['snus', 'vape'];

/* =========================================================================
   Utilitaires
   ========================================================================= */
const Util = {
  /** Échappe un texte avant de l'insérer dans du HTML. */
  esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },
  /** Lit un nombre saisi à la française (« 6,90 »). Renvoie null si invalide ou négatif. */
  parseNum(input) {
    const clean = String(input ?? '').replace(/\s/g, '').replace(',', '.');
    if (clean === '' || !/^\d*\.?\d+$|^\d+\.?$/.test(clean)) return null;
    const n = Number(clean);
    return Number.isFinite(n) && n >= 0 ? n : null;
  },
  /** Affiche un nombre décimal à la française, sans zéros inutiles. */
  formatNum(n, maxDigits = 2) {
    return new Intl.NumberFormat('fr-FR', { maximumFractionDigits: maxDigits }).format(n);
  },
  formatMoney(n, digits = 2) {
    return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', minimumFractionDigits: digits, maximumFractionDigits: digits }).format(n);
  },
  uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  },
  clampInt(value, min, max) {
    const n = Math.round(Number(value));
    return Number.isFinite(n) && n >= min && n <= max ? n : null;
  }
};

/* =========================================================================
   Dates — tout est calculé dans le fuseau local de l'appareil.
   Les entrées sont stockées en timestamp (ms depuis 1970, universel) :
   le « jour » d'une prise est recalculé à l'affichage, donc un changement
   de fuseau ou un passage de minuit reste cohérent.
   ========================================================================= */
const Dates = {
  pad(n) { return String(n).padStart(2, '0'); },
  /** Clé de jour local « AAAA-MM-JJ » pour un timestamp. */
  dayKey(ts) {
    const d = new Date(ts);
    return `${d.getFullYear()}-${Dates.pad(d.getMonth() + 1)}-${Dates.pad(d.getDate())}`;
  },
  todayKey() { return Dates.dayKey(Date.now()); },
  /** Minuit local (timestamp) du jour donné par sa clé. */
  keyToStart(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d).getTime();
  },
  /** Ajoute n jours calendaires à une clé (robuste aux changements d'heure). */
  addDays(key, n) {
    const [y, m, d] = key.split('-').map(Number);
    return Dates.dayKey(new Date(y, m - 1, d + n).getTime());
  },
  /** Nombre de jours calendaires entre deux clés (b − a). */
  diffDays(a, b) {
    const toUtc = (k) => { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d); };
    return Math.round((toUtc(b) - toUtc(a)) / DAY_MS);
  },
  /** Liste des clés de jours de a à b inclus. */
  range(a, b) {
    const out = [];
    for (let k = a; Dates.diffDays(k, b) >= 0; k = Dates.addDays(k, 1)) out.push(k);
    return out;
  },
  formatTime(ts) {
    return new Date(ts).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  },
  formatDayLong(ts) {
    const s = new Date(ts).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    return s.charAt(0).toUpperCase() + s.slice(1);
  },
  formatDayShort(ts) {
    return new Date(ts).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
  },
  /** Découpe une durée en jours, heures, minutes, secondes. */
  splitDuration(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    return { d: Math.floor(s / 86400), h: Math.floor((s % 86400) / 3600), m: Math.floor((s % 3600) / 60), s: s % 60 };
  },
  /** Valeur pour <input type="datetime-local"> en heure locale. */
  toInputValue(ts) {
    const d = new Date(ts);
    return `${Dates.dayKey(ts)}T${Dates.pad(d.getHours())}:${Dates.pad(d.getMinutes())}`;
  },
  fromInputValue(value) {
    const ts = new Date(value).getTime();
    return Number.isFinite(ts) ? ts : null;
  }
};

/* =========================================================================
   Store — données en localStorage, versionnées, avec export/import JSON.
   iOS peut purger le stockage d'une web app peu utilisée : l'export
   régulier est la vraie sauvegarde.
   ========================================================================= */
const Store = {
  data: null,
  saveFailed: false,

  defaults() {
    return {
      version: SCHEMA_VERSION,
      settings: {
        phase: 'observation',        // 'observation' | 'arret'
        quitStart: null,             // timestamp du début de l'arrêt
        baseline: null,              // { snusPerDay, vapePerDay, days } figé au passage en arrêt
        snusBoxPrice: 0,             // € par boîte
        snusPerBox: 20,              // portions par boîte
        snusMg: 8,                   // mg de nicotine par portion
        vapeFormat: 'capsule',       // 'capsule' | 'flacon'
        vapeUnitPrice: 0,            // € par capsule ou flacon
        vapeSessionsPerUnit: 0,      // sessions de vape par capsule ou flacon
        reduction: { on: false, startDate: null, weeklyStep: 1, base: null }, // cible = base − pas × semaines
        theme: 'dark',               // 'dark' | 'light'
        askContext: true,            // ouvrir la feuille contexte après « + Snus / + Vape »
        profile: { done: false, uses: null, goals: [], concerns: [], firstUse: null }, // questionnaire de départ
        lastExportAt: null
      },
      intakes: [],   // { id, type, ts, trigger, intensity }
      cravings: [],  // { id, ts, trigger, intensity, resolved, duration }
      checkins: []   // { date, sleep, energy, mood, anxiety, hr }
    };
  },

  /** Charge les données ; en cas de JSON corrompu, le garde de côté et repart à vide. */
  load() {
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { raw = null; }
    if (!raw) { Store.data = Store.defaults(); return; }
    try {
      Store.data = Store.normalize(JSON.parse(raw));
    } catch (e) {
      try { localStorage.setItem(STORAGE_KEY + '.corrompu', raw); } catch (_) { /* rien */ }
      Store.data = Store.defaults();
    }
  },

  save() {
    if (App.testMode) return; // ?test ne touche jamais aux vraies données
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Store.data));
      Store.saveFailed = false;
    } catch (e) {
      Store.saveFailed = true;
      UI.toast('Enregistrement impossible : stockage plein ou bloqué.');
    }
  },

  /** Applique une modification, enregistre et redessine l'écran. */
  update(mutator) {
    mutator(Store.data);
    Store.save();
    App.render();
  },

  /** Remet n'importe quel objet au bon format (migration + nettoyage). */
  normalize(obj) {
    const base = Store.defaults();
    if (!obj || typeof obj !== 'object') return base;
    const s = Object.assign({}, base.settings, obj.settings || {});
    s.reduction = Object.assign({}, base.settings.reduction, (obj.settings || {}).reduction || {});
    if (!['observation', 'arret'].includes(s.phase)) s.phase = 'observation';
    if (!['dark', 'light'].includes(s.theme)) s.theme = 'dark';
    if (!['capsule', 'flacon'].includes(s.vapeFormat)) s.vapeFormat = 'capsule';
    s.askContext = s.askContext !== false;
    s.quitStart = s.quitStart !== null && Number.isFinite(Number(s.quitStart)) ? Number(s.quitStart) : null;
    if (s.phase === 'arret' && s.quitStart === null) s.phase = 'observation';
    s.baseline = Store.cleanBaseline(s.baseline);
    s.profile = Store.cleanProfile((obj.settings || {}).profile);
    const red = s.reduction;
    red.on = red.on === true;
    red.weeklyStep = [0.5, 1, 2].includes(Number(red.weeklyStep)) ? Number(red.weeklyStep) : 1;
    red.base = red.base !== null && Number.isFinite(Number(red.base)) ? Number(red.base) : null;
    red.startDate = /^\d{4}-\d{2}-\d{2}$/.test(red.startDate) ? red.startDate : null;
    if (red.on && (red.base === null || !red.startDate)) red.on = false;
    ['snusBoxPrice', 'snusPerBox', 'snusMg', 'vapeUnitPrice', 'vapeSessionsPerUnit'].forEach((k) => {
      const n = Number(s[k]);
      s[k] = Number.isFinite(n) && n >= 0 ? n : base.settings[k];
    });
    return {
      version: SCHEMA_VERSION,
      settings: s,
      intakes: Store.cleanList(obj.intakes, Store.cleanIntake),
      cravings: Store.cleanList(obj.cravings, Store.cleanCraving),
      checkins: Store.cleanCheckins(obj.checkins)
    };
  },

  cleanProfile(p) {
    const out = { done: false, uses: null, goals: [], concerns: [], firstUse: null };
    if (!p || typeof p !== 'object') return out;
    out.done = p.done === true;
    out.uses = ['snus', 'vape', 'both'].includes(p.uses) ? p.uses : null;
    out.goals = Array.isArray(p.goals) ? [...new Set(p.goals.filter((g) => GOAL_KEYS.includes(g)))] : [];
    out.concerns = Array.isArray(p.concerns) ? [...new Set(p.concerns.filter((c) => CONCERN_BY_KEY[c]))] : [];
    out.firstUse = FIRST_USE.some(([k]) => k === p.firstUse) ? p.firstUse : null;
    return out;
  },

  cleanBaseline(b) {
    if (!b || typeof b !== 'object') return null;
    const n = (v) => (v !== null && Number.isFinite(Number(v)) && Number(v) >= 0 ? Number(v) : null);
    const snus = n(b.snusPerDay), vape = n(b.vapePerDay);
    if (snus === null || vape === null) return null;
    return { snusPerDay: snus, vapePerDay: vape, days: Math.round(n(b.days) || 0) };
  },

  cleanList(list, cleaner) {
    if (!Array.isArray(list)) return [];
    return list.map(cleaner).filter(Boolean).sort((a, b) => a.ts - b.ts);
  },

  cleanIntake(x) {
    if (!x || !INTAKE_TYPES.includes(x.type) || !Number.isFinite(Number(x.ts))) return null;
    return {
      id: String(x.id || Util.uid()),
      type: x.type,
      ts: Number(x.ts),
      trigger: TRIGGER_LABEL[x.trigger] ? x.trigger : null,
      intensity: Util.clampInt(x.intensity, 1, 5)
    };
  },

  cleanCraving(x) {
    if (!x || !Number.isFinite(Number(x.ts))) return null;
    return {
      id: String(x.id || Util.uid()),
      ts: Number(x.ts),
      trigger: TRIGGER_LABEL[x.trigger] ? x.trigger : null,
      intensity: Util.clampInt(x.intensity, 1, 5),
      resolved: x.resolved !== false,
      duration: Number.isFinite(Number(x.duration)) && x.duration > 0 ? Math.round(Number(x.duration)) : null
    };
  },

  /** Un check-in par jour : le plus récent l'emporte. */
  cleanCheckins(list) {
    if (!Array.isArray(list)) return [];
    const byDate = {};
    list.forEach((x) => {
      if (!x || !/^\d{4}-\d{2}-\d{2}$/.test(x.date)) return;
      const hr = Util.clampInt(x.hr, 25, 220);
      byDate[x.date] = {
        date: x.date,
        sleep: Util.clampInt(x.sleep, 1, 5),
        energy: Util.clampInt(x.energy, 1, 5),
        mood: Util.clampInt(x.mood, 1, 5),
        anxiety: Util.clampInt(x.anxiety, 1, 5),
        hr: hr
      };
    });
    return Object.values(byDate).sort((a, b) => a.date.localeCompare(b.date));
  },

  /** Texte JSON de sauvegarde. */
  exportJson() {
    return JSON.stringify({ app: 'STASE', appVersion: APP_VERSION, exportedAt: new Date().toISOString(), ...Store.data }, null, 2);
  },

  /** Valide un fichier importé. Renvoie { ok, data } ou { ok:false, error }. */
  parseImport(text) {
    let obj;
    try { obj = JSON.parse(text); } catch (e) { return { ok: false, error: 'Ce fichier n’est pas un JSON lisible.' }; }
    if (!obj || typeof obj !== 'object' || (!Array.isArray(obj.intakes) && !obj.settings)) {
      return { ok: false, error: 'Ce fichier ne ressemble pas à une sauvegarde STASE.' };
    }
    return { ok: true, data: Store.normalize(obj) };
  },

  /** Remplace les données ; l'état précédent est gardé pour annulation. */
  replaceAll(data) {
    try { localStorage.setItem(BACKUP_KEY, JSON.stringify(Store.data)); } catch (e) { /* rien */ }
    Store.data = data;
    Store.save();
  },

  restoreBackup() {
    try {
      const raw = localStorage.getItem(BACKUP_KEY);
      if (!raw) return false;
      Store.data = Store.normalize(JSON.parse(raw));
      Store.save();
      return true;
    } catch (e) { return false; }
  }
};

/* =========================================================================
   Calc — fonctions pures (sans DOM), testées dans ?test
   ========================================================================= */
const Calc = {
  /** Entrées dont le jour local correspond à la clé. */
  onDay(list, key) {
    return list.filter((x) => Dates.dayKey(x.ts) === key);
  },

  /** Compte snus / vape / total d'une liste de prises. */
  countByType(list) {
    const snus = list.filter((x) => x.type === 'snus').length;
    return { snus, vape: list.length - snus, total: list.length };
  },

  /** Comptes par jour, de fromKey à toKey inclus (jours sans prise = 0). */
  dailyCounts(intakes, fromKey, toKey) {
    const byDay = {};
    intakes.forEach((x) => {
      const k = Dates.dayKey(x.ts);
      byDay[k] = byDay[k] || [];
      byDay[k].push(x);
    });
    return Dates.range(fromKey, toKey).map((key) => ({ key, ...Calc.countByType(byDay[key] || []) }));
  },

  /**
   * Moyenne quotidienne sur les n jours complets précédant `todayKey`
   * (aujourd'hui exclu, car incomplet). Si l'historique est plus court,
   * on part du jour de la première prise. Renvoie null sans jour complet.
   */
  avgPerDay(intakes, todayKey, n = 7) {
    if (!intakes.length) return null;
    const first = Dates.dayKey(intakes[0].ts);
    let from = Dates.addDays(todayKey, -n);
    if (Dates.diffDays(from, first) > 0) from = first;
    const to = Dates.addDays(todayKey, -1);
    if (Dates.diffDays(from, to) < 0) return null;
    const days = Calc.dailyCounts(intakes, from, to);
    const sum = (k) => days.reduce((acc, d) => acc + d[k], 0) / days.length;
    return { total: sum('total'), snus: sum('snus'), vape: sum('vape'), days: days.length };
  }
};

/* ---- Calc : check-in et corrélation ---- */
const CHECKIN_METRICS = [
  // clé, libellé, bas → haut, sens du « mieux »
  { key: 'sleep', label: 'Sommeil', lo: 'agité', hi: 'reposant', better: 'up' },
  { key: 'energy', label: 'Énergie', lo: 'à plat', hi: 'en forme', better: 'up' },
  { key: 'mood', label: 'Humeur', lo: 'basse', hi: 'bonne', better: 'up' },
  { key: 'anxiety', label: 'Anxiété', lo: 'calme', hi: 'forte', better: 'down' }
];
const CORRELATION_MIN_DAYS = 7;

Object.assign(Calc, {
  /**
   * Jour auquel rattacher un check-in : avant 4 h du matin, il compte
   * pour la veille (le check-in « du soir » fait juste après minuit).
   */
  checkinDayFor(ts) {
    const d = new Date(ts);
    return d.getHours() < 4 ? Dates.addDays(Dates.dayKey(ts), -1) : Dates.dayKey(ts);
  },

  mean(values) {
    const v = values.filter((x) => Number.isFinite(x));
    return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
  },

  /**
   * Compare les check-ins des jours les moins et les plus chargés.
   * Les jours sont triés par nombre de prises puis coupés en deux moitiés
   * (le jour du milieu est écarté si leur nombre est impair).
   * Renvoie { enough:false, days } sous CORRELATION_MIN_DAYS jours,
   * { enough:true, flat:true } si la consommation ne varie pas.
   */
  correlation(intakes, checkins, minDays = CORRELATION_MIN_DAYS) {
    if (!intakes.length) return { enough: false, days: 0 };
    const first = Dates.dayKey(intakes[0].ts);
    const today = Dates.todayKey();
    const counts = {};
    intakes.forEach((x) => { const k = Dates.dayKey(x.ts); counts[k] = (counts[k] || 0) + 1; });
    const pairs = checkins
      .filter((c) => c.date >= first && c.date <= today)
      .map((c) => ({ ...c, total: counts[c.date] || 0 }))
      .sort((a, b) => a.total - b.total || a.date.localeCompare(b.date));
    if (pairs.length < minDays) return { enough: false, days: pairs.length };
    const half = Math.floor(pairs.length / 2);
    const low = pairs.slice(0, half), high = pairs.slice(pairs.length - half);
    const lowMax = low[low.length - 1].total, highMin = high[0].total;
    if (lowMax === highMin && low[0].total === high[high.length - 1].total) return { enough: true, flat: true, days: pairs.length };
    const avg = (list, k) => Calc.mean(list.map((p) => p[k]));
    return {
      enough: true, flat: false, days: pairs.length,
      low: { days: low.length, intakes: avg(low, 'total') },
      high: { days: high.length, intakes: avg(high, 'total') },
      metrics: CHECKIN_METRICS.map((m) => {
        const l = avg(low, m.key), h = avg(high, m.key);
        return { ...m, low: l, high: h, diff: l !== null && h !== null ? h - l : null };
      })
    };
  },

  /** Phrase sobre pour un écart (seuil : un demi-point sur 5). */
  describeDiff(m) {
    if (m.diff === null) return 'pas assez de réponses';
    if (Math.abs(m.diff) < 0.5) return 'à peu près pareil';
    const higher = m.diff > 0;
    return `${higher ? 'plus haut' : 'plus bas'} les jours chargés`;
  }
});

/* ---- Calc : statistiques ---- */
Object.assign(Calc, {
  /** Nombre de prises par heure locale (0 à 23). */
  hourHistogram(list) {
    const hours = new Array(24).fill(0);
    list.forEach((x) => { hours[new Date(x.ts).getHours()] += 1; });
    return hours;
  },

  /** Les n heures les plus chargées, dans l'ordre de la journée. */
  topHours(hist, n = 2) {
    return hist.map((v, h) => ({ v, h })).filter((x) => x.v > 0)
      .sort((a, b) => b.v - a.v || a.h - b.h).slice(0, n).map((x) => x.h).sort((a, b) => a - b);
  },

  /** Part de chaque déclencheur (« Sans contexte » à la fin). */
  triggerShare(list) {
    if (!list.length) return [];
    const counts = {};
    list.forEach((x) => { const k = x.trigger || 'none'; counts[k] = (counts[k] || 0) + 1; });
    const rows = TRIGGERS.filter(([k]) => counts[k]).map(([k, label]) => ({ key: k, label, count: counts[k] }))
      .sort((a, b) => b.count - a.count);
    if (counts.none) rows.push({ key: 'none', label: 'Sans contexte', count: counts.none });
    return rows.map((r) => ({ ...r, pct: (r.count / list.length) * 100 }));
  },

  /**
   * Coût d'une prise : une portion de snus, une session de vape.
   * null quand le prix ou le contenu n'est pas renseigné (évite « 0 € » trompeur).
   */
  unitCosts(s) {
    const per = (price, qty) => (price > 0 && qty > 0 ? price / qty : null);
    return { snus: per(s.snusBoxPrice, s.snusPerBox), vape: per(s.vapeUnitPrice, s.vapeSessionsPerUnit) };
  },

  /** Dépense pour une liste de prises ; `missing` liste les types sans prix. */
  spend(list, settings) {
    const cost = Calc.unitCosts(settings);
    const c = Calc.countByType(list);
    const missing = ['snus', 'vape'].filter((t) => c[t] > 0 && cost[t] === null);
    const part = (t) => (cost[t] === null ? 0 : c[t] * cost[t]);
    return { snus: part('snus'), vape: part('vape'), total: part('snus') + part('vape'), missing };
  },

  /** Lundi de la semaine de la clé donnée. */
  weekStart(key) {
    const dow = (new Date(Dates.keyToStart(key)).getDay() + 6) % 7; // lundi = 0
    return Dates.addDays(key, -dow);
  },
  monthStart(key) { return key.slice(0, 8) + '01'; },

  /** Prises dont le jour local est entre deux clés incluses. */
  between(list, fromKey, toKey) {
    return list.filter((x) => { const k = Dates.dayKey(x.ts); return k >= fromKey && k <= toKey; });
  },

  /** Nicotine contenue dans les portions de snus (pas la quantité absorbée). */
  snusMg(snusCount, settings) { return snusCount * (settings.snusMg || 0); }
});

/* =========================================================================
   Charts — graphes SVG maison (viewBox fixe, largeur fluide)
   ========================================================================= */
const Charts = {
  W: 342,

  /**
   * Barres verticales. items : [{ v, label, hi }]
   * options : height, avg (ligne pointillée), gap, tone ('data' | 'warm')
   */
  bars(items, opts = {}) {
    const W = Charts.W, H = opts.height || 150, labelH = 20, chartH = H - labelH;
    const n = items.length;
    const gap = opts.gap ?? (n > 14 ? 3 : 12);
    const bw = (W - gap * (n - 1)) / n;
    const top = Math.max(1, opts.avg || 0, ...items.map((i) => i.v)) * 1.12;
    const y = (v) => chartH - (v / top) * chartH;
    const tone = opts.tone || 'data';
    const rects = items.map((it, i) => {
      const x = i * (bw + gap);
      const h = it.v > 0 ? Math.max(3, chartH - y(it.v)) : 2;
      const cls = it.v > 0 ? `c-${tone}${it.hi ? '-hi' : ''}` : 'c-empty';
      const r = Math.min(6, bw / 2);
      return `<rect class="${cls}" x="${x.toFixed(1)}" y="${(chartH - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${r.toFixed(1)}"/>
        ${it.label ? `<text class="c-label${it.hi ? ' c-label-hi' : ''}" x="${(x + bw / 2).toFixed(1)}" y="${H - 4}" text-anchor="middle">${Util.esc(it.label)}</text>` : ''}`;
    }).join('');
    const avg = opts.avg ? `<line class="c-avg" x1="0" x2="${W}" y1="${y(opts.avg).toFixed(1)}" y2="${y(opts.avg).toFixed(1)}"/>` : '';
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${Util.esc(opts.aria || '')}">${rects}${avg}</svg>`;
  },

  /** Barres horizontales (déclencheurs). rows : [{ label, pct, muted }] */
  hbars(rows) {
    const W = Charts.W, rowH = 34, labelW = 104, pctW = 44, trackW = W - labelW - pctW - 8;
    const max = Math.max(...rows.map((r) => r.pct), 1);
    const body = rows.map((r, i) => {
      const yy = i * rowH;
      const w = Math.max(4, (r.pct / max) * trackW);
      return `<text class="c-row-label" x="0" y="${yy + 21}">${Util.esc(r.label)}</text>
        <rect class="c-track" x="${labelW}" y="${yy + 12}" width="${trackW}" height="8" rx="4"/>
        <rect class="${r.muted ? 'c-data-muted' : 'c-data'}" x="${labelW}" y="${yy + 12}" width="${w.toFixed(1)}" height="8" rx="4"/>
        <text class="c-row-pct" x="${W}" y="${yy + 21}" text-anchor="end">${Math.round(r.pct)} %</text>`;
    }).join('');
    const aria = rows.map((r) => `${r.label} ${Math.round(r.pct)} %`).join(', ');
    return `<svg class="chart" viewBox="0 0 ${W} ${rows.length * rowH}" role="img" aria-label="${Util.esc(aria)}">${body}</svg>`;
  }
};

/* ---- Charts : jours et courbe ---- */
Object.assign(Charts, {
  /** Grille de jours (7 par ligne). items : [{ label, state: 'clean'|'used'|'today'|'ok'|'ko' }] */
  days(items, aria) {
    const W = Charts.W, cols = 7, gap = 8, cell = (W - gap * (cols - 1)) / cols;
    const rows = Math.ceil(items.length / cols);
    const body = items.map((it, i) => {
      const x = (i % cols) * (cell + gap), y = Math.floor(i / cols) * (cell + gap);
      return `<rect class="c-day c-day--${it.state}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${cell.toFixed(1)}" height="${cell.toFixed(1)}" rx="10"/>
        <text class="c-day-label c-day-label--${it.state}" x="${(x + cell / 2).toFixed(1)}" y="${(y + cell / 2 + 4).toFixed(1)}" text-anchor="middle">${Util.esc(it.label)}</text>`;
    }).join('');
    return `<svg class="chart" viewBox="0 0 ${W} ${rows * cell + (rows - 1) * gap}" role="img" aria-label="${Util.esc(aria)}">${body}</svg>`;
  },

  /** Courbe cumulée avec aire, point final mis en avant. */
  line(values, aria) {
    const W = Charts.W, H = 120, pad = 8;
    const max = Math.max(...values, 0.01);
    const n = values.length;
    const x = (i) => (n === 1 ? W / 2 : pad + (i * (W - 2 * pad)) / (n - 1));
    const y = (v) => H - pad - (v / max) * (H - 2 * pad);
    const pts = values.map((v, i) => `${x(i).toFixed(1)} ${y(v).toFixed(1)}`);
    const area = `M${x(0).toFixed(1)} ${H} L${pts.join(' L')} L${x(n - 1).toFixed(1)} ${H} Z`;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${Util.esc(aria)}">
      <path class="c-area" d="${area}"/><path class="c-line" d="M${pts.join(' L')}"/>
      <circle class="c-dot" cx="${x(n - 1).toFixed(1)}" cy="${y(values[n - 1]).toFixed(1)}" r="5"/></svg>`;
  }
});

/* =========================================================================
   Craving — minuteur de 10 minutes de « J'ai une envie »
   Le temps est recalculé depuis l'heure de début : il reste juste même si
   l'iPhone met l'app en veille.
   ========================================================================= */
const Craving = {
  DURATION: 10 * 60000,
  CIRC: 867.08, // 2π × 138 (rayon du cercle)
  current: null,

  state() {
    if (!Craving.current) {
      Craving.current = { start: Date.now(), pausedAt: null, pausedMs: 0, step: 'timer', trigger: null, intensity: null, duration: 0 };
    }
    return Craving.current;
  },

  elapsed(c, now = Date.now()) {
    const end = c.pausedAt || now;
    return Math.min(Craving.DURATION, Math.max(0, end - c.start - c.pausedMs));
  },

  /** Textes et tracé du cercle pour un temps écoulé (cycle 4 s inspire / 6 s expire). */
  view(el, c) {
    const left = Math.ceil((Craving.DURATION - el) / 1000);
    const inhale = (el / 1000) % 10 < 4;
    return {
      dash: (Craving.CIRC * (1 - el / Craving.DURATION)).toFixed(1),
      phase: c && c.pausedAt ? 'En pause' : inhale ? 'Inspire' : 'Expire',
      hint: c && c.pausedAt ? 'Reprends quand tu veux' : inhale ? '4 secondes' : '6 secondes',
      left: `${Dates.pad(Math.floor(left / 60))}:${Dates.pad(left % 60)}`
    };
  },

  togglePause() {
    const c = Craving.state(), now = Date.now();
    if (c.pausedAt) { c.pausedMs += now - c.pausedAt; c.pausedAt = null; } else { c.pausedAt = now; }
  },

  finish() {
    const c = Craving.state();
    c.duration = Craving.elapsed(c);
    c.step = 'log';
  },

  /** Enregistre l'envie ; resolved = traversée sans prise. */
  save(resolved, withContext = true) {
    const c = Craving.state();
    Store.data.cravings.push({
      id: Util.uid(), ts: c.start, resolved,
      trigger: withContext ? c.trigger : null, intensity: withContext ? c.intensity : null,
      duration: c.duration || Craving.elapsed(c)
    });
    Store.data.cravings.sort((a, b) => a.ts - b.ts);
    Store.save();
    const saved = { trigger: c.trigger, intensity: c.intensity };
    Craving.current = null;
    return saved;
  }
};

/* =========================================================================
   Demo — jeu de données fictif, reproductible (graine fixe)
   ========================================================================= */
const Demo = {
  /** Générateur pseudo-aléatoire déterministe (mulberry32). */
  rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  },

  /** Heures typiques et déclencheur associé. */
  SLOTS: [
    { h: 7, w: 3, trig: 'reveil' }, { h: 9, w: 4, trig: 'cafe' }, { h: 10, w: 2, trig: 'ennui' },
    { h: 13, w: 4, trig: 'repas' }, { h: 15, w: 2, trig: 'stress' }, { h: 16, w: 4, trig: 'stress' },
    { h: 17, w: 2, trig: 'ennui' }, { h: 20, w: 3, trig: 'repas' }, { h: 21, w: 3, trig: 'soiree' }, { h: 23, w: 1, trig: 'soiree' }
  ],

  pickSlot(rand) {
    const total = Demo.SLOTS.reduce((a, s) => a + s.w, 0);
    let r = rand() * total;
    return Demo.SLOTS.find((s) => (r -= s.w) < 0) || Demo.SLOTS[0];
  },

  /** 21 jours d'observation se terminant maintenant, avec check-ins. */
  generate(now = Date.now(), seed = 42) {
    const rand = Demo.rng(seed);
    const data = Store.defaults();
    Object.assign(data.settings, {
      snusBoxPrice: 6.9, snusPerBox: 20, snusMg: 8,
      vapeFormat: 'capsule', vapeUnitPrice: 3.5, vapeSessionsPerUnit: 40,
      profile: { done: true, uses: 'both', goals: ['argent', 'liberte', 'sante'], concerns: ['tension', 'sommeil', 'stress'], firstUse: 'lt30' },
      theme: Store.data ? Store.data.settings.theme : 'dark'
    });
    const today = Dates.dayKey(now);
    for (let back = 20; back >= 0; back--) {
      const key = Dates.addDays(today, -back);
      const start = Dates.keyToStart(key);
      const count = 6 + Math.floor(rand() * 5);
      let dayTotal = 0;
      for (let i = 0; i < count; i++) {
        const slot = Demo.pickSlot(rand);
        const ts = start + slot.h * 3600000 + Math.floor(rand() * 3600000);
        if (ts > now) continue;
        const withContext = rand() > 0.15;
        data.intakes.push({
          id: `demo-${back}-${i}`, type: rand() < 0.45 ? 'snus' : 'vape', ts,
          trigger: withContext ? slot.trig : null,
          intensity: withContext ? 1 + Math.floor(rand() * 5) : null
        });
        dayTotal += 1;
      }
      if (back >= 1 && back <= 14) data.checkins.push(Demo.checkin(key, dayTotal, rand));
    }
    return Store.normalize(data);
  },

  /**
   * Scénario « arrêt en cours » : 3 semaines d'observation, arrêt il y a
   * 6 jours, une prise il y a 3 j 14 h, envies de moins en moins nombreuses.
   */
  generateQuit(now = Date.now(), seed = 42) {
    const quitStart = now - 6 * DAY_MS;
    const data = Demo.generate(quitStart - 60000, seed);
    const rand = Demo.rng(seed + 1);
    data.settings.phase = 'arret';
    data.settings.quitStart = quitStart;
    data.settings.baseline = Calc.baseline(data.intakes, quitStart);
    const relapseTs = now - (3 * 86400 + 14 * 3600 + 22 * 60) * 1000;
    data.intakes.push({ id: 'demo-reprise', type: 'vape', ts: relapseTs, trigger: 'soiree', intensity: 4 });
    [5, 4, 4, 2, 2, 1, 1].forEach((count, day) => {
      for (let i = 0; i < count; i++) {
        const ts = quitStart + day * DAY_MS + (2 + rand() * 20) * 3600000;
        if (ts > now) continue;
        const slot = Demo.pickSlot(rand);
        data.cravings.push({ id: `demo-envie-${day}-${i}`, ts, trigger: slot.trig, intensity: Math.max(1, 4 - Math.floor(day / 2) - Math.floor(rand() * 2)), resolved: true, duration: (3 + Math.floor(rand() * 7)) * 60000 });
      }
    });
    // Check-ins depuis l'arrêt : sommeil un peu chahuté puis meilleur, cœur plus calme.
    for (let day = 0; day < 6; day++) {
      const key = Dates.dayKey(quitStart + day * DAY_MS);
      data.checkins = data.checkins.filter((c) => c.date !== key);
      data.checkins.push({ date: key, sleep: [3, 3, 4, 4, 4, 5][day], energy: [2, 3, 3, 3, 4, 4][day], mood: [3, 3, 4, 4, 4, 4][day],
        anxiety: [4, 3, 3, 2, 2, 2][day], hr: 60 + Math.floor(rand() * 4) });
    }
    data.cravings.push({ id: 'demo-envie-reprise', ts: relapseTs - 8 * 60000, trigger: 'soiree', intensity: 4, resolved: false, duration: 6 * 60000 });
    return Store.normalize(data);
  },

  /** Check-in fictif : un peu moins bon les jours chargés. */
  checkin(key, dayTotal, rand) {
    const base = dayTotal >= 9 ? 2 : 3;
    const v = (b) => Math.min(5, Math.max(1, b + Math.round(rand() * 2 - 0.5)));
    return { date: key, sleep: v(base), energy: v(base), mood: v(base + 1), anxiety: v(dayTotal >= 9 ? 4 : 2), hr: 58 + Math.floor(rand() * 12) };
  }
};

/* ---- Calc : phase arrêt et réduction progressive ---- */
Object.assign(Calc, {
  /**
   * Référence : moyenne quotidienne réelle de l'observation, sur les jours
   * complets avant le jour de l'arrêt. null sans jour complet.
   */
  baseline(intakes, quitTs) {
    if (!intakes.length) return null;
    const first = Dates.dayKey(intakes[0].ts);
    const last = Dates.addDays(Dates.dayKey(quitTs), -1);
    if (Dates.diffDays(first, last) < 0) return null;
    const days = Calc.dailyCounts(intakes.filter((x) => x.ts < quitTs), first, last);
    const sum = (k) => days.reduce((a, d) => a + d[k], 0);
    return { snusPerDay: sum('snus') / days.length, vapePerDay: sum('vape') / days.length, days: days.length };
  },

  /** Prises faites depuis le début de l'arrêt. */
  quitIntakes(intakes, quitStart) { return intakes.filter((x) => x.ts >= quitStart); },

  /** Enchaînements sans nicotine (ms) : celui en cours et le meilleur. */
  streaks(intakes, quitStart, now) {
    const points = [quitStart, ...Calc.quitIntakes(intakes, quitStart).map((x) => x.ts).filter((t) => t <= now), now];
    let best = 0;
    for (let i = 1; i < points.length; i++) best = Math.max(best, points[i] - points[i - 1]);
    return { current: now - points[points.length - 2], best, lastTs: points[points.length - 2] };
  },

  /**
   * Jours sans nicotine au total : jours locaux, du jour de l'arrêt à hier,
   * sans aucune prise. Une prise ne remet pas ce total à zéro.
   */
  cleanDays(intakes, quitStart, now) {
    const from = Dates.dayKey(quitStart), to = Dates.addDays(Dates.dayKey(now), -1);
    if (Dates.diffDays(from, to) < 0) return 0;
    const used = new Set(Calc.quitIntakes(intakes, quitStart).map((x) => Dates.dayKey(x.ts)));
    return Dates.range(from, to).filter((k) => !used.has(k)).length;
  },

  /**
   * Doses évitées et argent économisé depuis l'arrêt, par rapport à la
   * référence : (doses attendues − doses prises), jamais négatif.
   * Un prix non renseigné donne money:null pour ce type.
   */
  avoided(intakes, settings, now) {
    const base = settings.baseline, start = settings.quitStart;
    const cost = Calc.unitCosts(settings);
    const days = Math.max(0, now - start) / DAY_MS;
    const taken = Calc.countByType(Calc.quitIntakes(intakes, start).filter((x) => x.ts <= now));
    const one = (type) => {
      const expected = base ? base[type + 'PerDay'] * days : 0;
      const avoided = Math.max(0, Math.floor(expected - taken[type] + 1e-9));
      return { expected, taken: taken[type], avoided, money: cost[type] === null ? null : avoided * cost[type] };
    };
    const snus = one('snus'), vape = one('vape');
    vape.units = settings.vapeSessionsPerUnit > 0 ? vape.avoided / settings.vapeSessionsPerUnit : null;
    const missing = [['snus', snus], ['vape', vape]].filter(([, x]) => x.money === null && x.avoided > 0).map(([t]) => t);
    const money = snus.money === null && vape.money === null ? null : (snus.money || 0) + (vape.money || 0);
    return { snus, vape, money, missing, days };
  },

  /** Économies cumulées à la fin de chaque jour depuis l'arrêt (aujourd'hui : maintenant). */
  savingsSeries(intakes, settings, now) {
    const keys = Dates.range(Dates.dayKey(settings.quitStart), Dates.dayKey(now));
    return keys.map((key) => {
      const end = Math.min(now, Dates.keyToStart(Dates.addDays(key, 1)));
      const a = Calc.avoided(intakes, settings, end);
      return { key, value: a.money || 0 };
    });
  },

  /** Cible quotidienne de la réduction progressive pour un jour (null si inactive). */
  reductionTarget(red, key) {
    if (!red || !red.on || red.base === null || !red.startDate) return null;
    const diff = Dates.diffDays(red.startDate, key);
    if (diff < 0) return null;
    return Math.max(0, Math.round(red.base - red.weeklyStep * Math.floor(diff / 7)));
  },

  /** Respect de la cible sur les n derniers jours complets depuis le début de la réduction. */
  reductionDays(intakes, red, todayKey, n = 7) {
    if (!red || !red.on || !red.startDate) return [];
    let from = Dates.addDays(todayKey, -n);
    if (Dates.diffDays(from, red.startDate) > 0) from = red.startDate;
    const to = Dates.addDays(todayKey, -1);
    if (Dates.diffDays(from, to) < 0) return [];
    return Calc.dailyCounts(intakes, from, to).map((d) => {
      const target = Calc.reductionTarget(red, d.key);
      return { key: d.key, total: d.total, target, ok: d.total <= target };
    });
  },

  /** Étape de l'arrêt selon l'enchaînement en cours (choisit les messages). */
  stage(currentMs) {
    const h = currentMs / 3600000;
    if (h < 24) return 'start';
    if (h < 72) return 'peak';
    if (h < 24 * 30) return 'weeks';
    return 'long';
  }
});

/** Prochain jalon et progression (0–1) pour un enchaînement donné. */
Calc.nextMilestone = function (currentMs, list = MILESTONES) {
  const h = currentMs / 3600000;
  const idx = list.findIndex((m) => m.h > h);
  if (idx === -1) return null;
  const prevH = idx === 0 ? 0 : list[idx - 1].h;
  return { ...list[idx], index: idx, progress: Math.min(1, Math.max(0, (h - prevH) / (list[idx].h - prevH))), remainingMs: list[idx].h * 3600000 - currentMs };
};

/**
 * Jalons pertinents : celui des gencives n'apparaît que pour qui prenait du snus
 * (d'après la référence, sinon d'après l'historique). Sans aucune info, on le garde.
 */
Calc.visibleMilestones = function (settings, intakes) {
  const b = settings.baseline;
  const uses = settings.profile && settings.profile.uses;
  let usesSnus;
  if (b) usesSnus = b.snusPerDay > 0;
  else if (intakes.length) usesSnus = intakes.some((x) => x.type === 'snus');
  else usesSnus = uses ? uses !== 'vape' : true;
  return MILESTONES.filter((m) => m.tag !== 'snus' || usesSnus);
};

/** État de chaque jalon : passé, prochain, à venir. */
Calc.milestoneStates = function (currentMs, list) {
  const h = currentMs / 3600000;
  let nextFound = false;
  return list.map((m) => {
    if (m.h <= h) return { ...m, state: 'done' };
    if (!nextFound) { nextFound = true; return { ...m, state: 'next' }; }
    return { ...m, state: 'future' };
  });
};

  /** Points de santé proposés selon ce que la personne prend. */
  concernsFor(uses) {
    return CONCERNS.filter((c) => !c.only || !uses || uses === 'both' || uses === c.only);
  },

  /** Repère concerné par le profil ? */
  isForMe(milestone, concerns) {
    return (milestone.for || []).some((k) => concerns.includes(k));
  },

  /**
   * Évolution d'une mesure du check-in avant / depuis l'arrêt.
   * Renvoie { before, after, n } (null si moins de 3 soirs de chaque côté),
   * ou { current, n } en observation.
   */
  metricTrend(checkins, key, quitStart) {
    const vals = (list) => list.map((c) => c[key]).filter((v) => Number.isFinite(v));
    if (!quitStart) {
      const v = vals(checkins.slice(-14));
      return v.length >= 3 ? { current: Calc.mean(v), n: v.length } : null;
    }
    const q = Dates.dayKey(quitStart);
    const before = vals(checkins.filter((c) => c.date < q).slice(-14));
    const after = vals(checkins.filter((c) => c.date >= q).slice(-14));
    if (before.length < 3 || after.length < 3) return null;
    return { before: Calc.mean(before), after: Calc.mean(after), n: after.length };
  },

  /** Coût annuel au rythme de la référence ou des 30 derniers jours (null sans prix). */
  yearlyCost(settings, intakes) {
    const cost = Calc.unitCosts(settings);
    if (cost.snus === null && cost.vape === null) return null;
    const rate = settings.baseline || (() => {
      const a = Calc.avgPerDay(intakes, Dates.todayKey(), 30);
      return a ? { snusPerDay: a.snus, vapePerDay: a.vape } : null;
    })();
    if (!rate) return null;
    return (rate.snusPerDay * (cost.snus || 0) + rate.vapePerDay * (cost.vape || 0)) * 365;
  },

  /** Prises par jour de référence (ou moyenne récente), pour « Ne plus dépendre ». */
  dailyRate(settings, intakes) {
    if (settings.baseline) return settings.baseline.snusPerDay + settings.baseline.vapePerDay;
    const a = Calc.avgPerDay(intakes, Dates.todayKey(), 30);
    return a ? a.total : null;
  }
});

/* =========================================================================
   Intakes — ajout, modification, suppression des prises
   ========================================================================= */
const Intakes = {
  /** Marge tolérée dans le futur (horloge légèrement décalée). */
  FUTURE_TOLERANCE: 5 * 60000,

  find(id) { return Store.data.intakes.find((x) => x.id === id) || null; },

  isValidTs(ts) { return Number.isFinite(ts) && ts <= Date.now() + Intakes.FUTURE_TOLERANCE; },

  sort() { Store.data.intakes.sort((a, b) => a.ts - b.ts); },

  /** Crée une prise et renvoie son id. */
  add(type, ts, trigger = null, intensity = null) {
    const entry = { id: Util.uid(), type, ts, trigger, intensity };
    Store.data.intakes.push(entry);
    Intakes.sort();
    Store.save();
    return entry.id;
  },

  /** Modifie une prise existante (type, heure, contexte). */
  edit(id, patch) {
    const entry = Intakes.find(id);
    if (!entry) return false;
    Object.assign(entry, patch);
    Intakes.sort();
    Store.save();
    return true;
  },

  remove(id) {
    const before = Store.data.intakes.length;
    Store.data.intakes = Store.data.intakes.filter((x) => x.id !== id);
    Store.save();
    return Store.data.intakes.length < before;
  }
};

  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  plus: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  check: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  prev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>'
};

/* =========================================================================
   UI — feuille du bas, toast, thème
   ========================================================================= */
const UI = {
  toastTimer: null,

  /** Petit message en bas ; action facultative (ex. « Annuler »). */
  toast(text, actionLabel, onAction, duration = 4000) {
    const el = document.getElementById('toast');
    const btn = document.getElementById('toast-action');
    document.getElementById('toast-text').textContent = text;
    btn.hidden = !actionLabel;
    btn.textContent = actionLabel || '';
    btn.onclick = () => { UI.hideToast(); if (onAction) onAction(); };
    el.classList.add('is-visible');
    clearTimeout(UI.toastTimer);
    UI.toastTimer = setTimeout(UI.hideToast, duration);
  },
  hideToast() { document.getElementById('toast').classList.remove('is-visible'); },

  /** Ouvre une feuille du bas avec le HTML donné. */
  openSheet(html, label) {
    const root = document.getElementById('sheet-root');
    root.innerHTML = `<div class="scrim" data-action="close-sheet"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-label="${Util.esc(label || '')}">
        <div class="sheet__grabber"></div><div class="inner">${html}</div></div>`;
    requestAnimationFrame(() => document.body.classList.add('sheet-open'));
  },
  /** Remplace le contenu de la feuille ouverte sans l'animer. */
  updateSheet(html) {
    const inner = document.querySelector('#sheet-root .inner');
    if (inner) inner.innerHTML = html;
  },
  closeSheet() {
    document.body.classList.remove('sheet-open');
    setTimeout(() => {
      if (!document.body.classList.contains('sheet-open')) document.getElementById('sheet-root').innerHTML = '';
    }, 260);
    UI.sheetState = null;
  },

  applyTheme() {
    const theme = Store.data.settings.theme;
    document.documentElement.dataset.theme = theme;
    document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'light' ? '#F3F5F9' : '#0B1220');
  }
};

/* =========================================================================
   Écrans — chaque fonction renvoie le HTML d'un écran.
   ========================================================================= */
const Screens = {
  aujourdhui() {
    return Store.data.settings.phase === 'arret' ? Screens.todayQuit() : Screens.todayObservation();
  },

  /** Aujourd'hui — phase observation : compteur, relevé en un tap, liste du jour. */
  todayObservation() {
    const today = Dates.todayKey();
    const key = App.viewDay || today;
    const isToday = key === today;
    const list = Calc.onDay(Store.data.intakes, key);
    const c = Calc.countByType(list);
    const avg = Calc.avgPerDay(Store.data.intakes, today);
    return `<div class="screen">
      <header class="header"><span class="wordmark">STASE</span><span class="pill">Observation</span></header>

      <section class="stack" style="gap:6px">
        ${Screens.dayNav(key, isToday)}
        <div class="counter">
          <span class="big-number">${c.total}</span>
          <span class="muted">${c.total > 1 ? 'prises' : 'prise'} ${isToday ? 'aujourd’hui' : 'ce jour-là'}</span>
        </div>
        <p class="small muted">${c.snus} snus <span class="faint">·</span> ${c.vape} vape${avg ? ` <span class="faint">·</span> moyenne ${avg.days < 7 ? `${avg.days} j` : '7 j'} : ${Util.formatNum(avg.total, 1)}` : ''}</p>
        ${Screens.targetLine(key, c.total, isToday)}
      </section>

      ${isToday ? `<div class="grid-2">
        <button type="button" class="log-btn" data-action="add-intake" data-type="snus">${Icon.plus}Snus</button>
        <button type="button" class="log-btn" data-action="add-intake" data-type="vape">${Icon.plus}Vape</button>
      </div>` : ''}

      <section class="stack" style="gap:0">
        <div class="row" style="padding-bottom:8px">
          <h2 style="font-size:15px">${isToday ? 'Prises du jour' : 'Prises de ce jour'}</h2>
          ${list.length ? '<span class="small faint">Touche une ligne pour modifier</span>' : ''}
        </div>
        ${list.length ? list.slice().reverse().map(Screens.intakeRow).join('') : Screens.todayEmpty(isToday)}
        <button type="button" class="link" data-action="new-intake" style="align-self:center">${isToday ? 'Ajouter une prise oubliée' : 'Ajouter une prise ce jour-là'}</button>
      </section>
      ${isToday ? Screens.whyCard() : ''}
    </div>`;
  },

  /** Aujourd'hui (observation) : un bénéfice du profil, différent chaque jour. */
  whyCard() {
    const pr = Store.data.settings.profile;
    if (!pr.done) {
      return `<a class="card card--outline" href="#/bienvenue" data-action="quiz-start" style="text-decoration:none;color:inherit;gap:6px">
        <span class="label">Pour toi</span><span class="small muted">Quatre questions pour voir ce que l'arrêt peut t'apporter.</span></a>`;
    }
    const items = pr.concerns.map((k) => ({ title: CONCERN_BY_KEY[k].title, text: CONCERN_BY_KEY[k].text }))
      .concat(pr.goals.includes('argent') ? [{ title: 'Ton argent', text: (() => { const y = Calc.yearlyCost(Store.data.settings, Store.data.intakes); return y !== null ? `Au rythme actuel, environ ${Util.formatMoney(y, 0)} par an.` : ''; })() }] : [])
      .filter((x) => x.text);
    if (!items.length) return '';
    const it = items[Messages.hash(Dates.todayKey()) % items.length];
    const first = it.text.split(/(?<=\.)\s/)[0];
    return `<a class="card card--outline" href="#/corps" style="text-decoration:none;color:inherit;gap:6px">
      <span class="label">Pourquoi arrêter · ${Util.esc(it.title)}</span>
      <span style="font-size:15px;line-height:1.5">${Util.esc(first)}</span>
      <span class="small" style="color:var(--mint)">Tous tes bénéfices</span></a>`;
  },

  /** Ligne « cible du jour » de la réduction progressive. */
  targetLine(key, total, isToday) {
    const target = Calc.reductionTarget(Store.data.settings.reduction, key);
    if (target === null) return '';
    let status;
    if (total < target) status = isToday ? `encore ${target - total} avant la cible` : 'cible respectée';
    else if (total === target) status = isToday ? 'cible atteinte' : 'cible respectée';
    else status = 'au-dessus de la cible, ce n’est qu’un repère';
    const ok = total <= target;
    return `<p class="small"><span class="pill ${ok ? 'pill--mint' : ''}" style="padding:4px 10px">Cible ${target}</span>
      <span class="${ok ? 'muted' : 'faint'}" style="margin-left:6px">${status}</span></p>`;
  },

  /** Aujourd'hui — phase arrêt : temps écoulé en direct, économies, doses évitées. */
  todayQuit() {
    const st = Store.data.settings, now = Date.now();
    const streak = Calc.streaks(Store.data.intakes, st.quitStart, now);
    const av = Calc.avoided(Store.data.intakes, st, now);
    const dayN = Dates.diffDays(Dates.dayKey(st.quitStart), Dates.todayKey()) + 1;
    const next = Calc.nextMilestone(streak.current, Calc.visibleMilestones(st, Store.data.intakes));
    const traversed = Store.data.cravings.filter((c) => c.resolved && c.ts >= st.quitStart).length;
    const money = av.money === null ? '—' : Util.formatMoney(av.money);
    const units = av.vape.units !== null && av.vape.avoided > 0 ? ` · ≈ ${Util.formatNum(av.vape.units, 1)} ${st.vapeFormat === 'flacon' ? 'flacon' : 'capsule'}${av.vape.units >= 2 ? 's' : ''}` : '';
    return `<div class="screen">
      <header class="header"><span class="wordmark">STASE</span><span class="pill pill--mint">Arrêt · jour ${dayN}</span></header>

      <section class="stack" style="gap:6px">
        <span class="label">Sans nicotine depuis</span>
        <span class="big-number" style="font-size:72px;line-height:1" data-live="since-big">${Screens.sinceBig(streak.current)}</span>
        <span class="num muted" style="font-size:22px" data-live="since-small">${Screens.sinceSmall(streak.current)}</span>
      </section>

      ${next ? `<a class="stack" href="#/corps" style="gap:10px;text-decoration:none;color:inherit">
        <div class="row small"><span class="muted">Prochain repère : ${next.title}</span><span class="num" style="color:var(--mint);font-weight:600">${Math.floor(next.progress * 100)} %</span></div>
        <div class="progress"><span style="width:${(next.progress * 100).toFixed(1)}%"></span></div>
      </a>` : ''}

      <div class="grid-2">
        <div class="card" style="padding:18px;gap:6px"><span class="small muted">Économisé</span><span class="value value--mint">${money}</span>
          ${av.missing.length ? '<a class="tiny faint" href="#/reglages">prix à renseigner</a>' : ''}</div>
        <div class="card" style="padding:18px;gap:6px"><span class="small muted">Meilleur enchaînement</span><span class="value">${Screens.durationShort(streak.best)}</span></div>
        <div class="card" style="padding:18px;gap:6px"><span class="small muted">Snus évités</span><span class="value">${av.snus.avoided}</span><span class="tiny faint">portion${av.snus.avoided > 1 ? 's' : ''}</span></div>
        <div class="card" style="padding:18px;gap:6px"><span class="small muted">Vape évitée</span><span class="value">${av.vape.avoided}</span><span class="tiny faint">session${av.vape.avoided > 1 ? 's' : ''}${units}</span></div>
      </div>
      ${st.baseline ? '' : '<p class="small muted">Pas de référence : indique ta consommation habituelle dans <a class="link--mint" href="#/reglages">Réglages</a> pour calculer économies et doses évitées.</p>'}

      <section class="card card--outline" style="gap:8px">
        <span class="label">Message du jour</span>
        <p style="font-size:16px;line-height:1.5">${Util.esc(Messages.forDay(Dates.todayKey(), Calc.stage(streak.current), st.profile.concerns))}</p>
        ${traversed ? `<span class="small faint">${traversed} envie${traversed > 1 ? 's' : ''} traversée${traversed > 1 ? 's' : ''} depuis le début.</span>` : ''}
      </section>

      <a class="link" href="#/reprendre" style="align-self:center">Noter une prise</a>
    </div>`;
  },

  sinceBig(ms) { const d = Dates.splitDuration(ms); return d.d ? `${d.d} j ${d.h} h` : `${d.h} h`; },
  sinceSmall(ms) { const d = Dates.splitDuration(ms); return `${Dates.pad(d.m)} min ${Dates.pad(d.s)} s`; },
  durationShort(ms) {
    const d = Dates.splitDuration(ms);
    if (d.d) return `${d.d} j${d.h ? ` ${d.h} h` : ''}`;
    if (d.h) return `${d.h} h`;
    return `${d.m} min`;
  },

  /** Après une prise en phase arrêt : rien n'est effacé, on note et on repart. */
  reprendre() {
    const st = Store.data.settings;
    if (st.phase !== 'arret') return Screens.todayObservation();
    const now = Date.now();
    const clean = Calc.cleanDays(Store.data.intakes, st.quitStart, now);
    const best = Calc.streaks(Store.data.intakes, st.quitStart, now).best;
    const d = App.relapseDraft || (App.relapseDraft = { type: 'snus', trigger: null });
    return `<div class="screen">
      <header class="header"><span class="wordmark">STASE</span>
        <a class="icon-btn" href="#/aujourdhui" aria-label="Fermer sans rien noter">${Icon.close}</a></header>
      <section class="stack" style="gap:14px;padding-top:8px">
        <h1 class="title title--soft">Une prise n'efface pas le chemin parcouru.</h1>
        <p class="muted">La plupart des gens arrêtent après plusieurs essais. Ce que tu as appris reste acquis. On note, et on repart.</p>
      </section>
      <div class="grid-2">
        <div class="card" style="padding:18px;gap:6px"><span class="small muted">Jours sans nicotine, au total</span><span class="value value--mint" style="font-size:40px">${clean}</span></div>
        <div class="card" style="padding:18px;gap:6px"><span class="small muted">Meilleur enchaînement</span><span class="value" style="font-size:40px">${Screens.durationShort(best)}</span></div>
      </div>
      <section class="stack">
        <span class="label">Ce que tu as pris</span>
        ${Screens.segmented('', [['snus', 'Snus'], ['vape', 'Vape']], d.type, 'Type', 'relapse-type')}
      </section>
      <section class="stack">
        <span class="label">Le contexte, si tu veux</span>
        <div class="grid-3">${TRIGGERS.map(([k, label]) =>
          `<button type="button" class="chip" data-action="relapse-trigger" data-value="${k}" aria-pressed="${d.trigger === k}">${label}</button>`).join('')}</div>
      </section>
      <div class="stack" style="gap:8px">
        <button type="button" class="btn btn--primary btn--block" data-action="relapse-save">Reprendre</button>
        <button type="button" class="link" data-action="relapse-observation" style="align-self:center">Noter et repasser en observation pour l'instant</button>
      </div>
    </div>`;
  },

  /** « J'ai une envie » : minuteur de 10 min + respiration, puis mini-relevé. */
  envie() {
    const c = Craving.state();
    return c.step === 'log' ? Screens.envieLog(c) : Screens.envieTimer(c);
  },

  envieTimer(c) {
    const el = Craving.elapsed(c);
    const v = Craving.view(el, c);
    return `<div class="screen" style="align-items:center;min-height:calc(100dvh - var(--safe-top) - var(--safe-bottom) - 60px)">
      <header class="header" style="align-self:stretch"><span class="label" style="color:var(--warm)">Envie en cours</span>
        <button type="button" class="icon-btn" data-action="craving-close" aria-label="Fermer">${Icon.close}</button></header>
      <section class="stack" style="align-self:stretch;gap:8px">
        <h1 class="title title--soft">Ça va passer.</h1>
        <p class="muted small">Suis le cercle. Une envie dure rarement plus de dix minutes.</p>
      </section>
      <div class="breath" aria-hidden="true">
        <svg viewBox="0 0 290 290"><circle cx="145" cy="145" r="138" class="breath__track"/>
          <circle cx="145" cy="145" r="138" class="breath__ring" stroke-dasharray="${Craving.CIRC}" stroke-dashoffset="${v.dash}" data-live="craving-ring"/></svg>
        <div class="breath__disc" style="animation-delay:-${(el / 1000) % 10}s;animation-play-state:${c.pausedAt ? 'paused' : 'running'}"></div>
        <div class="breath__text"><span class="breath__phase" data-live="craving-phase">${v.phase}</span><span class="small muted" data-live="craving-hint">${v.hint}</span></div>
      </div>
      <div class="stack" style="align-items:center;gap:2px">
        <span class="num" style="font-size:48px;font-weight:500" data-live="craving-left">${v.left}</span>
        <span class="small faint">restantes</span>
      </div>
      <div class="grid-2" style="align-self:stretch;margin-top:auto">
        <button type="button" class="btn" data-action="craving-pause">${c.pausedAt ? 'Reprendre' : 'Pause'}</button>
        <button type="button" class="btn btn--primary" data-action="craving-done">C'est passé</button>
      </div>
    </div>`;
  },

  envieLog(c) {
    const dur = Dates.splitDuration(c.duration);
    const st = Store.data.settings;
    const since = st.phase === 'arret' ? st.quitStart : 0;
    const nth = Store.data.cravings.filter((x) => x.resolved && x.ts >= since).length + 1;
    return `<div class="screen">
      <section class="stack" style="gap:12px">
        <span class="done-mark" style="width:48px;height:48px;border-radius:24px">${Icon.check}</span>
        <h1 class="title title--soft">Elle est passée.</h1>
        <p class="muted">${dur.m} min ${Dates.pad(dur.s)} s. Ce sera ta ${nth}<sup>${nth === 1 ? 're' : 'e'}</sup> envie traversée${st.phase === 'arret' ? ' depuis l’arrêt' : ''}.</p>
      </section>
      ${IntakeSheet.triggersHtml(c.trigger).replace(/sheet-trigger/g, 'craving-trigger')}
      ${IntakeSheet.intensityHtml(c.intensity).replace(/sheet-intensity/g, 'craving-intensity').replace('Intensité de l\'envie', 'Intensité au plus fort')}
      <section class="card card--outline"><p style="font-size:16px;line-height:1.5">Chaque envie traversée sans céder affaiblit un peu l'automatisme. Celle-ci compte.</p></section>
      <div class="stack" style="gap:6px">
        <button type="button" class="btn btn--primary btn--block" data-action="craving-save">Enregistrer</button>
        <div class="row" style="justify-content:center;gap:16px">
          <button type="button" class="link" data-action="craving-skip">Passer</button>
          <button type="button" class="link" data-action="craving-gave-in">J'ai fini par prendre</button>
        </div>
      </div>
    </div>`;
  },

  /** Navigation entre les jours (pour corriger un jour passé). */
  dayNav(key, isToday) {
    const label = (isToday ? 'Aujourd’hui · ' : '') + Dates.formatDayLong(Dates.keyToStart(key));
    return `<div class="day-nav">
      <button type="button" class="icon-btn icon-btn--ghost" data-action="day-prev" aria-label="Jour précédent">${Icon.prev}</button>
      <span class="label">${Util.esc(label)}</span>
      <button type="button" class="icon-btn icon-btn--ghost" data-action="day-next" aria-label="Jour suivant" ${isToday ? 'disabled' : ''}>${Icon.next}</button>
    </div>`;
  },

  intakeRow(x) {
    const label = x.trigger ? TRIGGER_LABEL[x.trigger] : 'Sans contexte';
    const dots = [1, 2, 3, 4, 5].map((i) => `<span class="${x.intensity && i <= x.intensity ? 'on' : ''}"></span>`).join('');
    return `<button type="button" class="entry" data-action="open-intake" data-id="${Util.esc(x.id)}"
        aria-label="Modifier la prise de ${Dates.formatTime(x.ts)}">
