/* =========================================================================
   Sauvegarde — export (partage iOS ou téléchargement) et import
   ========================================================================= */
const Backup = {
  pending: null,

  async exportFile() {
    const name = `stase-${Dates.todayKey()}.json`;
    const blob = new Blob([Store.exportJson()], { type: 'application/json' });
    const file = typeof File === 'function' ? new File([blob], name, { type: 'application/json' }) : null;
    try {
      // Sur iPhone, la feuille de partage permet « Enregistrer dans Fichiers ».
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Sauvegarde STASE' });
      } else {
        Backup.download(blob, name);
      }
      Store.update((d) => { d.settings.lastExportAt = Date.now(); });
      UI.toast('Sauvegarde exportée.');
    } catch (e) {
      if (e && e.name === 'AbortError') return; // partage annulé
      Backup.download(blob, name);
    }
  },

  download(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  },

  /** Lecture du fichier choisi, puis demande de confirmation. */
  readFile(file) {
    if (file.size > 5 * 1024 * 1024) { UI.toast('Fichier trop lourd pour une sauvegarde STASE (5 Mo maximum).'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const res = Store.parseImport(String(reader.result));
      if (!res.ok) { UI.toast(res.error); return; }
      Backup.pending = res.data;
      UI.openSheet(`
        <h2 class="title" style="font-size:22px">Remplacer les données ?</h2>
        <p class="muted small">Ce fichier contient ${res.data.intakes.length} prise(s), et ${res.data.cravings.length} envie(s).
        Tes données actuelles (${Store.data.intakes.length} prise(s)) seront remplacées. Tu pourras annuler juste après.</p>
        <div class="grid-2">
          <button type="button" class="btn" data-action="close-sheet">Garder</button>
          <button type="button" class="btn btn--primary" data-action="confirm-import">Remplacer</button>
        </div>`, 'Importer une sauvegarde');
    };
    reader.onerror = () => UI.toast('Lecture du fichier impossible.');
    reader.readAsText(file);
  },

  applyPending(message = 'Données importées.') {
    if (!Backup.pending) return;
    Store.replaceAll(Backup.pending);
    Backup.pending = null;
    
    App.viewDay = null;
    UI.closeSheet();
    UI.applyTheme();
    App.render();
    UI.toast(message, 'Annuler', () => {
      if (Store.restoreBackup()) {  UI.applyTheme(); App.render(); UI.toast('Import annulé.'); }
    }, 8000);
  }
};

/* =========================================================================
   Update — recherche de mise à jour (repris de ZESTE et ASCEN)
   Le service worker (sw.js, à côté d'index.html) ouvre l'app depuis une copie
   locale et télécharge la nouvelle version en arrière-plan. Quand elle a changé,
   il prévient la page : on propose de recharger. Vérifié à l'ouverture et au
   retour au premier plan (au plus toutes les 30 minutes). Pas de service worker
   en fichier local ni sur claude.ai (aperçus, tests).
   ========================================================================= */
const Update = {
  shown: false,
  lastCheck: 0,
  INTERVAL: 30 * 60000,

  supported() {
    return 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')
      && !/claude\.ai|claudeusercontent/.test(location.hostname);
  },

  init() {
    if (!Update.supported()) return;
    try {
      navigator.serviceWorker.register('sw.js').catch(() => {});
      navigator.serviceWorker.addEventListener('message', (e) => { if (e.data && e.data.type === 'stase-updated') Update.ready(); });
      Update.check();
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && Date.now() - Update.lastCheck >= Update.INTERVAL) Update.check();
      });
    } catch (e) { /* jamais bloquant */ }
  },

  /** Demande au service worker de revérifier la page principale (sans effet hors réseau). */
  check() {
    if (!navigator.onLine) return;
    Update.lastCheck = Date.now();
    navigator.serviceWorker.ready.then((r) => {
      if (r.active) r.active.postMessage({ type: 'stase-check' });
      r.update().catch(() => {});
    }).catch(() => {});
  },

  /** Bouton « Rechercher une mise à jour » (Réglages). */
  manual() {
    if (!Update.supported()) { UI.toast('La mise à jour automatique fonctionne depuis l’adresse en ligne de l’app.'); return; }
    if (!navigator.onLine) { UI.toast('Pas de réseau : réessaie plus tard.'); return; }
    Update.shown = false;
    Update.check();
    UI.toast('Recherche d’une mise à jour…');
    setTimeout(() => { if (!Update.shown) UI.toast(`STASE est à jour (${APP_VERSION}).`); }, 5000);
  },

  /** Nouvelle version prête : on attend un moment calme (pas de feuille, pas d'envie en cours). */
  ready() {
    if (Update.shown) return;
    Update.shown = true;
    const go = () => {
      const busy = document.body.classList.contains('sheet-open') || App.route() === 'envie' || App.route() === 'bienvenue';
      if (busy) { setTimeout(go, 1500); return; }
      UI.toast('Nouvelle version de STASE prête', 'Recharger', () => {
        try { sessionStorage.setItem('stase.reload', '1'); } catch (e) { /* rien */ }
        location.reload();
      }, 9000);
    };
    setTimeout(go, 800);
  }
};

/* =========================================================================
   Cell — la cellule d'Aujourd'hui, animée par ressorts (vitesse toujours continue)
   ========================================================================= */
const Cell = {
  sim: { size: null, sizeV: 0, s: 0, sv: 0, b: { snus: 0, vape: 0 }, bv: { snus: 0, vape: 0 }, drops: [], pending: 0, numT: 1 },
  els: null,
  raf: null,
  last: 0,
  CY: 122,

  /** Diamètre selon le nombre de prises du jour : elle « porte » la journée. */
  size(n) { return Math.min(220, 150 + n * 7); },

  /** Une goutte naît dans le bouton touché (appelé avant le rendu, le bouton est encore là). */
  spawn(type, btn) {
    const wrap = document.querySelector('.cellwrap');
    if (!wrap || !btn || Anim.reduced()) return;
    const w = wrap.getBoundingClientRect(), r = btn.getBoundingClientRect();
    const m = Cell.sim;
    m.bv[type] = (m.bv[type] || 0) - 2.4; // l'appui écrase le bouton, qui rebondit tout seul
    m.drops.push({ type, x: r.left + r.width / 2 - w.left, y: r.top - w.top + 38, vx: 0, vy: -60, r: 0, age: 0, merged: false, el: null });
    m.pending++;
  },

  /** Après chaque rendu : retrouve les éléments et reprend l'animation en cours. */
  sync() {
    const wrap = document.querySelector('.cellwrap');
    const m = Cell.sim;
    if (!wrap) { Cell.els = null; m.drops = []; m.pending = 0; return; }
    const total = Number(wrap.dataset.total) || 0;
    m.pending = Math.min(m.pending, total);
    Cell.els = {
      wrap, total,
      layer: wrap.querySelector('.goo-layer'),
      cell: wrap.querySelector('.cell'),
      text: wrap.querySelector('.cell__text'),
      num: wrap.querySelector('.cell__num'),
      label: wrap.querySelector('.cell__label'),
      gooBtns: Object.fromEntries([...wrap.querySelectorAll('.goo-layer .goo-btn')].map((e) => [e.dataset.gtype, e])),
      skins: Object.fromEntries([...wrap.querySelectorAll('.btn-skins .goo-btn')].map((e) => [e.dataset.stype, e])),
      btns: Object.fromEntries([...wrap.querySelectorAll('.cell-btns .log-btn')].map((e) => [e.dataset.type, e]))
    };
    if (m.size === null) m.size = Cell.size(total - m.pending);
    m.drops.forEach((d) => {
      d.el = document.createElement('span');
      d.el.className = 'cell-drop';
      Cell.els.layer.appendChild(d.el);
    });
    Cell.showCount();
    Cell.apply();
    if (Cell.busy()) Cell.start();
  },

  /** Le chiffre affiché suit les gouttes absorbées, pas le toucher. */
  showCount() {
    const e = Cell.els;
    if (!e) return;
    const n = e.total - Cell.sim.pending;
    e.num.textContent = n;
    e.label.textContent = `${n > 1 ? 'prises' : 'prise'} aujourd’hui`;
  },

  busy() {
    const m = Cell.sim;
    const target = Cell.els ? Cell.size(Cell.els.total - m.pending) : m.size;
    return m.drops.length > 0 || Math.abs(m.s) > 0.002 || Math.abs(m.sv) > 0.01 || m.numT < 1
      || Math.abs(target - m.size) > 0.3 || Math.abs(m.sizeV) > 0.3
      || ['snus', 'vape'].some((t) => Math.abs(m.b[t]) > 0.001 || Math.abs(m.bv[t]) > 0.01);
  },

  start() {
    if (Cell.raf) return;
    Cell.last = performance.now();
    const loop = (now) => {
      const dt = Math.min(0.033, (now - Cell.last) / 1000);
      Cell.last = now;
      if (!Cell.els || !Cell.els.wrap.isConnected) { Cell.raf = null; return; }
      Cell.step(dt / 2); Cell.step(dt / 2);
      Cell.apply();
      if (Cell.busy()) Cell.raf = requestAnimationFrame(loop);
      else Cell.raf = null;
    };
    Cell.raf = requestAnimationFrame(loop);
  },

  step(dt) {
    const m = Cell.sim, e = Cell.els;
    const cx = e.wrap.clientWidth / 2, cy = Cell.CY, R = m.size / 2;
    const target = Cell.size(e.total - m.pending);
    m.sizeV += (90 * (target - m.size) - 11 * m.sizeV) * dt; m.size += m.sizeV * dt;
    m.sv += (-150 * m.s - 5.5 * m.sv) * dt; m.s += m.sv * dt;
    ['snus', 'vape'].forEach((t) => { m.bv[t] += (-280 * m.b[t] - 15 * m.bv[t]) * dt; m.b[t] += m.bv[t] * dt; });
    if (m.numT < 1) m.numT = Math.min(1, m.numT + dt / 0.55);
    m.drops.forEach((d) => {
      d.age += dt;
      d.vy += (14 * (cy - d.y) - 4.2 * d.vy) * dt; d.y += d.vy * dt;
      d.vx += (14 * (cx - d.x) - 5 * d.vx) * dt; d.x += d.vx * dt;
      const grow = Math.min(1, d.age / 0.18);
      const dist = Math.hypot(d.x - cx, d.y - cy);
      const inside = Math.max(0, Math.min(1, (dist - R * 0.2) / (R * 0.75)));
      d.r = 24 * (1 - Math.pow(1 - grow, 3)) * (dist < R ? inside : 1);
      if (!d.merged && dist < R * 0.72) {
        d.merged = true;
        m.sv += Math.min(1.6, Math.hypot(d.vx, d.vy) / 260); // l'impact dépend de la vitesse
        m.pending = Math.max(0, m.pending - 1);
        m.numT = 0;
        Cell.showCount();
      }
    });
    m.drops = m.drops.filter((d) => {
      const keep = d.age < 2 && !(d.merged && d.r < 0.5);
      if (!keep && d.el) d.el.remove();
      if (!keep && !d.merged) { m.pending = Math.max(0, m.pending - 1); Cell.showCount(); }
      return keep;
    });
  },

  apply() {
    const m = Cell.sim, e = Cell.els;
    if (!e) return;
    const cy = Cell.CY, R = m.size / 2;
    // la cellule se tend vers la goutte la plus proche, juste avant le contact
    let lean = 0;
    m.drops.forEach((d) => { if (!d.merged) lean = Math.max(lean, 1 - Math.max(0, (d.y - cy) - R) / 90); });
    lean = Math.max(0, Math.min(1, lean)); lean *= lean;
    const sx = 1 + m.s * 0.11 - lean * 0.03, sy = 1 - m.s * 0.11 + lean * 0.07;
    e.cell.style.setProperty('--size', `${m.size.toFixed(2)}px`);
    e.cell.style.transform = `translateY(${(lean * 6).toFixed(2)}px) scale(${sx.toFixed(4)}, ${sy.toFixed(4)})`;
    const k = m.size / Cell.size(Math.max(0, e.total - m.pending));
    e.text.style.transform = `translateY(-50%) scale(${(((sx + sy) / 2) * Math.min(1.02, k)).toFixed(4)})`;
    ['snus', 'vape'].forEach((t) => {
      const tr = `scale(${(1 - m.b[t] * 0.5).toFixed(4)}, ${(1 + m.b[t]).toFixed(4)})`;
      if (e.gooBtns[t]) {
        e.gooBtns[t].style.transform = tr;
        // seul le bouton qui donne la goutte entre dans la fusion (sinon les deux boutons se colleraient)
        e.gooBtns[t].classList.toggle('is-active', m.drops.some((d) => d.type === t && d.age < 0.9));
      }
      if (e.skins[t]) e.skins[t].style.transform = tr;
      if (e.btns[t]) e.btns[t].style.transform = tr;
    });
    const ease = 1 - Math.pow(1 - m.numT, 3);
    e.num.style.opacity = m.numT < 1 ? (0.15 + 0.85 * ease).toFixed(3) : '';
    e.num.style.filter = m.numT < 1 ? `blur(${((1 - ease) * 7).toFixed(2)}px)` : '';
    e.num.style.transform = m.numT < 1 ? `scale(${((0.9 + 0.1 * ease) * (1 + Math.sin(m.numT * Math.PI) * 0.06)).toFixed(4)})` : '';
    m.drops.forEach((d) => {
      if (!d.el) return;
      const r = Math.max(0.1, d.r), st = Math.min(0.45, Math.abs(d.vy) / 1100);
      d.el.style.width = d.el.style.height = `${(2 * r).toFixed(2)}px`;
      d.el.style.transform = `translate(${(d.x - r).toFixed(2)}px, ${(d.y - r).toFixed(2)}px) scale(${(1 - st * 0.45).toFixed(3)}, ${(1 + st).toFixed(3)})`;
    });
    // le filtre de fusion ne sert que pendant une goutte (économie de batterie au repos)
    e.layer.classList.toggle('is-gooey', m.drops.length > 0);
  }
};

/* =========================================================================
   App — routage par #hash et rendu
   ========================================================================= */
const App = {
  routes: ['aujourdhui', 'stats', 'corps', 'reglages', 'envie', 'reprendre', 'bienvenue', 'historique', 'aide'],
  /** Historique : nombre de jours affichés, écran de retour. */
  historyDays: 30,
  historyBack: null,
  testMode: false,
  /** Dernier écran dessiné (anime seulement l'arrivée sur un nouvel écran). */
  renderedRoute: null,
  bumpCounter: false,
  celebrate: false,
  /** Dernière action lancée (anti double-tap). */
  lastFire: null,
  /** Actions qu'on enchaîne volontairement vite (pas de garde). */
  RAPID: ['ml-step', 'ci-pick', 'sheet-trigger', 'sheet-intensity', 'craving-trigger', 'craving-intensity', 'quiz-pick', 'relapse-trigger', 'cal-prev', 'cal-next', 'day-prev', 'day-next'],
  lastPick: null,
  /** Mois affiché dans le calendrier (null = mois en cours). */
  calMonth: null,
  /** Période des stats : 7 ou 30 jours. */
  statsRange: 7,
  /** Jour affiché sur « Aujourd'hui » (null = aujourd'hui). */
  viewDay: null,
  /** Dernier jour local vu : sert à détecter minuit ou un changement de fuseau. */
  lastDayKey: null,
  /** Écrans sans barre d'onglets ni bouton flottant. */
  focused: ['envie', 'reprendre', 'bienvenue'],
  /** Questionnaire en cours, et écran où revenir à la fin. */
  quiz: null,
  quizReturn: null,
  /** Action à lancer après le prochain changement d'écran. */
  afterRoute: null,
  /** Brouillon de l'écran « Reprendre ». */
  relapseDraft: null,

  route() {
    const name = location.hash.replace(/^#\/?/, '');
    return App.routes.includes(name) ? name : 'aujourdhui';
  },

  /**
   * Mise à jour chaque seconde des valeurs « en direct » sans redessiner
   * l'écran (évite de casser l'animation de respiration ou un champ en cours).
   */
  tick() {
    const name = App.route();
    const set = (key, text) => { const el = document.querySelector(`[data-live="${key}"]`); if (el && el.textContent !== text) el.textContent = text; };
    if (name === 'aujourdhui' && Store.data.settings.phase === 'arret') {
      const cur = Calc.streaks(Store.data.intakes, Store.data.settings.quitStart, Date.now()).current;
      set('since-big', Screens.sinceBig(cur));
      set('since-small', Screens.sinceSmall(cur));
      // Un repère vient d'être franchi, app ouverte : on redessine pour le célébrer.
      const last = Calc.lastPassed(cur, Calc.visibleMilestones(Store.data.settings, Store.data.intakes));
      const seen = Store.data.settings.seenMilestoneH;
      if (last && seen !== null && last.h > seen && !UI.sheetState) App.render();
    }
    if (name === 'envie' && Craving.current && Craving.current.step === 'timer') {
      const c = Craving.current, el = Craving.elapsed(c), v = Craving.view(el, c);
      if (el >= Craving.DURATION) { Craving.finish(); App.celebrate = true; App.render(); return; }
      set('craving-phase', v.phase); set('craving-hint', v.hint); set('craving-left', v.left);
      // Les raisons ne sont recalculées que quand la carte change (toutes les 10 s).
      const card = document.querySelector('.reason');
      const idx = card ? Math.floor(el / 10000) % Number(card.dataset.count || 1) : 0;
      if (card && card.dataset.idx !== String(idx)) {
        const list = Calc.reasons(Store.data);
        const r = list[idx % list.length];
        Anim.swap(card);
        card.dataset.idx = String(idx);
        set('reason-title', r.title); set('reason-text', r.text);
        card.querySelectorAll('.reason__dots i').forEach((d, i) => d.classList.toggle('on', i === idx));
      }
      const ring = document.querySelector('[data-live="craving-ring"]');
      if (ring) ring.setAttribute('stroke-dashoffset', v.dash);
    }
  },

  /** Mémorise le dernier repère atteint (célébré une seule fois, recalé après une prise). */
  syncMilestone(currentMs) {
    const st = Store.data.settings;
    if (st.phase !== 'arret' || App.testMode) return;
    const last = Calc.lastPassed(currentMs, Calc.visibleMilestones(st, Store.data.intakes));
    const lastH = last ? last.h : 0;
    if (lastH === st.seenMilestoneH) return;
    if (st.seenMilestoneH !== null && lastH > st.seenMilestoneH) { App.celebrate = true; st.milestoneShownAt = Date.now(); }
    else st.milestoneShownAt = null;
    st.seenMilestoneH = lastH;
    Store.save();
  },

  /** Après un changement d'écran, VoiceOver part du titre de l'écran. */
  focusHeading() {
    const h = document.querySelector('#view h1, #view .wordmark');
    if (!h) return;
    h.setAttribute('tabindex', '-1');
    h.focus({ preventScroll: true });
  },

  /** Redessine si le jour local a changé (minuit, fuseau, retour dans l'app). */
  checkDayChange() {
    const key = Dates.todayKey();
    if (key === App.lastDayKey) return;
    App.lastDayKey = key;
    App.viewDay = null;
    if (!UI.sheetState) App.render();
  },

  render() {
    const view = document.getElementById('view');
    // Valide d'abord un champ en cours de saisie : son « change » (au blur)
    // déclencherait sinon un rendu imbriqué pendant le remplacement du HTML.
    const active = document.activeElement;
    if (active && view.contains(active)) active.blur();
    App.lastDayKey = Dates.todayKey();
    const name = App.route();
    try {
      view.innerHTML = Screens[name]();
    } catch (e) {
      // Un écran qui plante ne doit jamais bloquer l'accès aux données.
      console.error(e);
      view.innerHTML = Screens.failure(e);
    }
    if (name !== App.renderedRoute) { if (App.renderedRoute) { Anim.enter(view); Anim.tabPop(name); } }
    App.renderedRoute = name;
    Cell.sync();
    if (App.bumpCounter) {
      App.bumpCounter = false;
      const counter = view.querySelector('.big-number');
      Anim.bump(counter);
      Anim.floatText(counter, '+1');
      const first = view.querySelector('.entry');
      if (first && !Anim.reduced()) first.classList.add('entry--new');
    }
    if (name === 'aujourdhui' && Store.data.settings.phase === 'arret') {
      App.syncMilestone(Calc.streaks(Store.data.intakes, Store.data.settings.quitStart, Date.now()).current);
    }
    if (App.celebrate) { App.celebrate = false; Anim.burst(view.querySelector('.milestone-new .done-mark') || view.querySelector('.done-mark')); }
    document.body.classList.toggle('no-chrome', App.focused.includes(name));
    // Le bouton « J'ai une envie » ne vit que sur l'accueil.
    document.body.classList.toggle('no-fab', name !== 'aujourdhui');
    document.querySelectorAll('.tab').forEach((t) => {
      if (t.dataset.tab === name) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
    });
  },

  /**
   * Change d'écran sans ajouter d'entrée à l'historique : sur iPhone, le geste
   * « retour » depuis le bord faisait glisser toute l'app, barre d'onglets comprise.
   */
  go(hash) {
    if (location.hash === hash) { App.onRoute(); return; }
    if (App.standalone()) location.replace(hash); else location.hash = hash;
  },

  /** App ouverte depuis l'écran d'accueil (pas de bouton Retour : on n'empile pas l'historique). */
  standalone() {
    return navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  },

  /** Arrivée sur un écran : nettoyage, rendu, défilement en haut, focus. */
  onRoute() {
    App.viewDay = null;
    if (App.route() !== 'envie' && Craving.current && Craving.current.step === 'log') Craving.clear();
    if (App.route() !== 'reprendre') App.relapseDraft = null;
    if (App.route() !== 'bienvenue') App.quiz = null;
    if (App.route() === 'historique') { App.historyDays = 30; App.historyBack = App.previousRoute === 'historique' ? App.historyBack : App.previousRoute; }
    App.previousRoute = App.route();
    UI.closeSheet();
    App.render();
    document.getElementById('view').scrollTop = 0;
    App.focusHeading();
    if (App.afterRoute) { const fn = App.afterRoute; App.afterRoute = null; fn(); }
  },

  /** Exécute une action (anti double-tap : même action sur le même élément en moins de 0,35 s ignorée). */
  fire(el, action) {
    const sig = `${action}|${el.dataset.value || ''}|${el.dataset.key || ''}|${el.dataset.type || ''}`;
    const now = Date.now();
    if (!App.RAPID.includes(action) && App.lastFire && App.lastFire.sig === sig && now - App.lastFire.at < 350) return;
    App.lastFire = { sig, at: now };
    App.lastPick = { action, value: el.dataset.value, key: el.dataset.key };
    legacyVibrate(10);
    Actions[action](el);
    Anim.pickPop();
  },

  /** Bouton haptique : le doigt touche le switch invisible, l'action part sur « change ». */
  onHaptic(e) {
    const input = e.target;
    if (!input.classList || !input.classList.contains('hap')) return false;
    const el = input.closest('[data-hap]');
    if (el && Actions[el.dataset.hap]) App.fire(el, el.dataset.hap);
    return true;
  },

  onClick(e) {
    const link = e.target.closest('a[href^="#/"]');
    const plain = !e.metaKey && !e.ctrlKey && !e.shiftKey && !e.altKey && e.button === 0;
    if (link && !link.dataset.action) { if (plain) { e.preventDefault(); App.go(link.getAttribute('href')); } return; }
    const el = e.target.closest('[data-action]');
    if (!el || !Actions[el.dataset.action]) return;
    e.preventDefault();
    App.fire(el, el.dataset.action);
  },

  /** Saisie d'un réglage numérique : validée à la sortie du champ. */
  onChange(e) {
    if (App.onHaptic(e)) return;
    const input = e.target;
    if (input.id === 'import-input') {
      if (input.files[0]) Backup.readFile(input.files[0]);
      input.value = '';
      return;
    }
    if (input.dataset.ml) { Vape.setMl(input.dataset.ml, Vape.parse(input.value)); return; }
    if (input.dataset.quiz === 'why' && App.quiz) { App.quiz.a.why = input.value.trim().slice(0, 140); return; }
    if (input.dataset.goal === 'name') { Store.update((d) => { d.settings.goalName = input.value.trim().slice(0, 40); }); return; }
    if (input.dataset.profile === 'why') { Store.update((d) => { d.settings.profile.why = input.value.trim().slice(0, 140); }); return; }
    if (input.dataset.sheet === 'ts' && UI.sheetState) {
      const ts = Dates.fromInputValue(input.value);
      if (ts !== null) UI.sheetState.ts = ts;
      return;
    }
    const key = input.dataset.setting;
    if (!key) return;
    const n = Util.parseNum(input.value);
    const limit = FIELD_LIMITS[key];
    if (n === null || (limit && n > limit.max)) {
      input.parentElement.classList.add('is-invalid');
      UI.toast(n === null ? 'Nombre attendu, par exemple 6,90.' : `Ça semble beaucoup pour ${limit.label} (max ${limit.max}). Vérifie la virgule.`);
      return;
    }
    Store.update((d) => { d.settings[key] = n; });
  },

  boot() {
    Store.load();
    UI.applyTheme();
    if (navigator.storage && navigator.storage.persist) {
      setTimeout(() => navigator.storage.persist().then((ok) => { App.persisted = ok; }).catch(() => {}), 1500);
    }
    document.addEventListener('click', App.onClick);
    // Rien ne se fait glisser hors des zones qui défilent (barre d'onglets, fond de feuille…).
    // Le zoom à deux doigts reste toujours possible (accessibilité).
    document.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && !e.target.closest('#view, .sheet')) e.preventDefault();
    }, { passive: false });
    document.addEventListener('change', App.onChange);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.body.classList.contains('sheet-open')) UI.closeSheet();
      // Clavier : Entrée ou Espace sur un bouton haptique lance l'action directement.
      const hb = (e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('label[data-hap]');
      if (hb && Actions[hb.dataset.hap]) { e.preventDefault(); App.fire(hb, hb.dataset.hap); }
    });
    window.addEventListener('hashchange', App.onRoute);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { App.hiddenAt = Date.now(); return; }
      // Revenu après plus de 2 minutes : retour direct sur Aujourd'hui, prêt à noter.
      const away = App.hiddenAt && Date.now() - App.hiddenAt > 2 * 60000;
      App.hiddenAt = null;
      if (away && !UI.sheetState && !['aujourdhui', 'envie', 'bienvenue'].includes(App.route())) { App.viewDay = null; App.go('#/aujourdhui'); }
      App.checkDayChange();
    });
    setInterval(App.checkDayChange, 30000);
    setInterval(App.tick, 1000);
    if (new URLSearchParams(location.search).has('test')) {
      // Les tests vivent dans tests.js : jamais chargés au lancement normal.
      App.testMode = true;
      const sc = document.createElement('script');
      sc.src = 'tests.js';
      sc.onload = () => Tests.run();
      document.head.appendChild(sc);
      return;
    }
    // Autre onglet ou autre fenêtre : on recharge les données modifiées ailleurs.
    window.addEventListener('storage', (e) => {
      if (e.key !== STORAGE_KEY) return;
      Store.load(); UI.applyTheme();
      if (!UI.sheetState) App.render();
    });
    window.addEventListener('error', () => UI.toast('Un petit souci est survenu. Tes données sont intactes.'));
    // Après un « Recharger » de mise à jour, on reste sur l'écran en cours ; sinon l'app s'ouvre
    // toujours sur Aujourd'hui (iOS rouvre sinon la dernière adresse, par exemple les Réglages).
    let reloaded = false;
    try { reloaded = sessionStorage.getItem('stase.reload') === '1'; sessionStorage.removeItem('stase.reload'); } catch (e) { /* rien */ }
    const s = Store.data.settings;
    let start = reloaded && location.hash ? location.hash : '#/aujourdhui';
    // Premier lancement : questionnaire de départ (une seule fois, passable).
    if (!reloaded && !s.profile.done && !Store.data.intakes.length) start = '#/bienvenue';
    // Une envie en cours avant un rechargement d'iOS : on y revient.
    if (Craving.restore() && start === '#/aujourdhui') start = '#/envie';
    if (location.hash !== start) history.replaceState(null, '', start);
    // Premier affichage d'abord ; la recherche de mise à jour attend un instant.
    setTimeout(Update.init, 800);
    App.render();
  }
};

App.boot();
</script>
